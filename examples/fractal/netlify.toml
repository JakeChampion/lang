# Set the site's base directory to examples/fractal.
[build]
  command = "./build.sh"
  publish = "public"
  # The compiler, stdlib, and showcase live outside this base directory.
  ignore = "exit 1"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# Every request goes to the server. It sees the original path.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/fern-server"
  status = 200
