# The settings of `fern -apk` for the Plex client.
[package]
name = "plex"
lib = "app.fern"

[android]
package = "dev.fern.plex"
label = "Fern for Plex"
min_sdk = 30
cleartext = true
tv = true
pip = true
banner = "banner.png"
permissions = ["RECORD_AUDIO", "INTERNET", "ACCESS_NETWORK_STATE", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PLAYBACK", "POST_NOTIFICATIONS", "WAKE_LOCK", "com.android.providers.tv.permission.WRITE_EPG_DATA"]
# Media3 ExoPlayer, from tools/media3/fetch.
dex = ["../../../build/media3/dex/classes.dex"]
