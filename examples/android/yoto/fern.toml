icon = "icon.png"
min_sdk = 26
permissions = ["INTERNET", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PLAYBACK", "WAKE_LOCK", "NFC", "RECORD_AUDIO", "READ_MEDIA_AUDIO", "READ_EXTERNAL_STORAGE"]
