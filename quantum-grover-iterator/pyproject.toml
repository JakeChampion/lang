[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grover-phase-estimation"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "qsharp>=1.0",
    "qsharp-core>=1.0",
    "qsharp-compiler>=1.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.scripts]
test-phase-estimation = "test_phase_estimation:main"
