# Netlify deploy config for the Fern docs site.
#
# Without this file Netlify found no build to run and published the
# repository root as static files, so every docs URL 404'd (the raw
# README.md was served, but no index.html existed anywhere).
#
# The canonical build recipe lives in .github/workflows/pages.yml, for
# GitHub Pages; scripts/netlify-build mirrors its four steps so the two
# hosts publish the same bundle from the same inputs.
#
# This deploy gates the site build only. scripts/netlify-build does not call
# scripts/netlify-smoke-test, so a green deploy provides no unit, conformance,
# or self-host test result. The smoke script remains available for explicit
# runs; see docs/TEST-GATES.md for its coverage and reporting rules.

[build]
  command = "scripts/netlify-build"
  publish = "site/dist"

[build.environment]
  # Astro 6 requires Node >=22.12; the pin matches what pages.yml is tested on.
  # Netlify provisions Go through gimme BEFORE the build command runs, so it
  # cannot read mise.toml the way every other host does — the version is
  # restated here as a concrete release (gimme wants one) and TestNetlifyGoPin
  # (internal/sourcelint) keeps its major.minor equal to mise.toml's `go`.
  #
  # This host also runs its OWN mise against mise.toml during `Install
  # dependencies`, a stage that precedes the build command — so nothing in
  # scripts/netlify-build can influence it. That is why mise.toml carries no
  # top-level min_version: its mise is older than the release the repo pins,
  # and a floor it cannot meet failed the deploy in 2.7 s before any build ran
  # (#8423).
  NODE_VERSION = "22"
  GO_VERSION = "1.26.7"
  # FERN_SMOKE and the other smoke options apply only to an explicit invocation
  # of scripts/netlify-smoke-test. Setting them here or in the Netlify UI does
  # not activate that script; scripts/netlify-build does not call it.

# site/astro.config.mjs sets `base: "/lang"`, because GitHub Pages serves
# this project from the repo's subpath (jakechampion.github.io/lang/), and
# that prefix is baked into every internal link and asset URL. Astro does
# NOT nest the build output to match — `base` only affects the URLs it
# writes, so site/dist/ holds the site at its own root. GitHub Pages lines
# the two up by serving dist/ at /lang/; a Netlify deploy serves dist/ at
# the domain root, so the /lang-prefixed links have to be mapped back down.
#
# These are 200 rewrites, not 3xx redirects: the response comes from the
# real file in one request with no visible bounce, and there's no chance of
# a loop, since a rewritten path no longer matches the rule. Static files
# take precedence over non-forced rules, so nothing that already resolves
# is intercepted.
#
# Unmatched paths still fall through to Starlight's own 404 page, which
# Astro writes to dist/404.html where Netlify picks it up automatically.
[[redirects]]
  from = "/lang/*"
  to = "/:splat"
  status = 200

# `/lang/*` does not match the bare prefix, so spell those cases out. Netlify
# usually treats the two as the same path, but matching both is free.
[[redirects]]
  from = "/lang"
  to = "/"
  status = 200

[[redirects]]
  from = "/lang/"
  to = "/"
  status = 200
