# Netlify deploy config for the Fern docs site.
#
# Without this file Netlify found no build to run and published the
# repository root as static files, so every docs URL 404'd (the raw
# README.md was served, but no index.html existed anywhere).
#
# scripts/netlify-build is the build recipe.
#
# This deploy gates the site build only. scripts/netlify-build does not call
# scripts/netlify-smoke-test, so a green deploy provides no unit, conformance,
# or self-host test result. The smoke script remains available for explicit
# runs; see docs/TEST-GATES.md for its coverage and reporting rules.

[build]
  command = "scripts/netlify-build"
  publish = "site/dist"

[build.environment]
  # Astro 6 requires Node >=22.12; the pin matches what docs-build.yml tests on.
  # Netlify provisions Go through gimme BEFORE the build command runs, so it
  # cannot read mise.toml the way every other host does — the version is
  # restated here as a concrete release (gimme wants one) and TestNetlifyGoPin
  # (internal/testing/sourcelint) keeps its major.minor equal to mise.toml's `go`.
  #
  # This host also runs its OWN mise against mise.toml during `Install
  # dependencies`, a stage that precedes the build command — so nothing in
  # scripts/netlify-build can influence it. That is why mise.toml carries no
  # top-level min_version: its mise is older than the release the repo pins,
  # and a floor it cannot meet failed the deploy in 2.7 s before any build ran
  # (#8423).
  NODE_VERSION = "22"
  GO_VERSION = "1.27.3"
  # FERN_SMOKE and the other smoke options apply only to an explicit invocation
  # of scripts/netlify-smoke-test. Setting them here or in the Netlify UI does
  # not activate that script; scripts/netlify-build does not call it.

# The site once had a /lang prefix on every URL. Links from that time go to
# the same page at the root, with a permanent redirect. Static files take
# precedence over non-forced rules, so nothing that resolves is intercepted.
[[redirects]]
  from = "/lang/*"
  to = "/:splat"
  status = 301

# `/lang/*` does not match the bare prefix, so spell that case out.
[[redirects]]
  from = "/lang"
  to = "/"
  status = 301
