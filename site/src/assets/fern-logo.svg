<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Fern" fill="none">
  <!-- A single fern frond: a curved rachis with paired pinnae (leaflets)
       tapering to a coiled crozier tip. Drawn with currentColor so it
       inherits the surrounding text colour and works on light + dark. -->
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- main stem / rachis, curving up-right to the tip -->
    <path d="M6 29 C 9 22, 13 14, 18 9 C 21 6, 24 6, 25 8" />
    <!-- left-side pinnae (leaflets), largest at the base -->
    <path d="M7.6 25 C 4.5 24, 3 21.5, 3.2 18.8" />
    <path d="M9.6 21 C 7 20, 5.7 17.8, 6 15.4" />
    <path d="M11.8 17 C 9.6 16.2, 8.6 14.3, 9 12.2" />
    <path d="M14 13.5 C 12.2 12.9, 11.5 11.3, 12 9.6" />
    <!-- right-side pinnae -->
    <path d="M9.4 23 C 12.5 22, 14 19.5, 13.8 16.8" />
    <path d="M11.4 19 C 14 18, 15.3 15.8, 15 13.4" />
    <path d="M13.6 15 C 15.8 14.2, 16.8 12.3, 16.4 10.2" />
    <!-- coiled crozier tip (fiddlehead) -->
    <path d="M25 8 C 26.8 9.5, 26.4 12.2, 24.2 12.2 C 22.6 12.2, 22.6 10.2, 24 10" />
  </g>
</svg>
