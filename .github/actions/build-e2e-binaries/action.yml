name: Build the e2e test binaries
description: >
  Build the `go test -c` binaries the self-host lane's jobs run through
  `go tool test2json`, into e2eselfhost.test (always) and e2e.test (on
  request) in the working directory, plus cmd/ci-test-workers, the runner
  that executes a selection in isolated worker processes, into
  $RUNNER_TEMP/ci-test-workers.

  Every job compiles its own binaries rather than downloading ones a build
  job published. Compiling once is cheaper in CPU and much more expensive in
  wall clock: a `needs:` edge means the dependent jobs are not even created,
  let alone queued, until the prerequisite finishes, and under the
  account-wide concurrent-job ceiling that prerequisite waits behind every
  other job the run created. Measured on run 33535490171, one such edge
  pushed the dependent jobs from a ~9-minute admission to a 32-minute one.
  The shared Go build cache (.github/actions/setup-fern) keeps each local
  compile to ~20 s.

inputs:
  e2e:
    description: >
      Also compile internal/e2e into e2e.test. The shard jobs need it for the
      ~30 residual TestSelfHost tests that still live in that package; nothing
      else does, and it is a separate ~20 s of compile, so it is opt-in.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: compile test binaries (go test -c)
      shell: bash
      run: |
        set -euo pipefail
        go test -c -o e2eselfhost.test ./internal/e2eselfhost/
        if [ "${{ inputs.e2e }}" = "true" ]; then
          go test -c -o e2e.test ./internal/e2e/
        fi
        go build -o "$RUNNER_TEMP/ci-test-workers" ./cmd/ci-test-workers
