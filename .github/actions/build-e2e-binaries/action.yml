name: Build the e2e test binaries
description: >
  Build the `go test -c` binaries the self-host lane's jobs run through
  `go tool test2json`, into e2eselfhost.test (always) and e2e.test (on
  request) in the working directory.

  This used to be a `build` JOB that compiled once and published the binaries
  as an artifact every other job downloaded. Compiling once is cheaper in CPU
  and much more expensive in wall clock: `build` did 0.9 minutes of work after
  9.4 minutes in the queue, and everything else in the lane sat behind it,
  because a `needs:` edge means the dependent jobs are not even created — let
  alone queued — until it finishes. Measured on run 33535490171, that one edge
  pushed `warm` from a ~9-minute admission to a 32-minute one, and the shards
  behind `warm` inherited all of it.

  Independent jobs still compile locally without waiting for a build job.
  The x86 shards already wait for warm, so they can reuse the load family's
  bundle without adding a dependency hop. The optional cache is checked
  against the checkout, toolchain, image and file checksums; a miss builds
  locally. Tests still execute in every shard.

inputs:
  e2e:
    description: >
      Also compile internal/e2e into e2e.test. The shard jobs need it for the
      ~30 residual TestSelfHost tests that still live in that package; nothing
      else does, and it is a separate ~20 s of compile, so it is opt-in.
    required: false
    default: "false"
  cache-dir:
    description: Optional downloaded bundle to verify before compiling locally.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: compile test binaries (go test -c)
      shell: bash
      env:
        TEST_BINARY_CACHE: ${{ inputs.cache-dir }}
      run: |
        set -euo pipefail
        if [ -n "$TEST_BINARY_CACHE" ]; then
          if bash scripts/ci-test-binary-cache restore "$TEST_BINARY_CACHE"; then
            exit 0
          fi
          echo "test-binary cache unavailable or incompatible; compiling locally"
        fi
        go test -c -o e2eselfhost.test ./internal/e2eselfhost/
        if [ "${{ inputs.e2e }}" = "true" ]; then
          go test -c -o e2e.test ./internal/e2e/
        fi
