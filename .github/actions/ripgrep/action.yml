name: ripgrep
description: >
  Install ripgrep 14.1.0 from the Ubuntu 24.04 archive.
  TestSelfHostExampleRgAgainstRipgrep compares the port in examples/rg with
  this binary. The step fails when apt does not give 14.1.0, because the test
  pins that release.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/disable-chrome-apt
    - name: Install ripgrep
      shell: bash
      # timeout runs under sudo, so the signal stops apt, not the sudo wrapper.
      run: |
        set -euo pipefail
        for try in 1 2 3; do
          if sudo timeout 120 apt-get update -qq && sudo timeout 120 apt-get install -y -qq --no-install-recommends ripgrep; then
            break
          fi
          echo "apt attempt $try failed" >&2
          sleep $((try * 10))
        done
        rg --version | head -1
        rg --version | head -1 | grep -qx 'ripgrep 14.1.0' || {
          echo "examples/rg pins ripgrep 14.1.0; apt gave $(rg --version | head -1)" >&2
          exit 1
        }
