name: GNU diffutils oracle
description: >
  The pinned GNU diffutils that the corpus compares the diffutils/ ports with
  (docs/COREUTILS.md). The action builds it from source and caches it per
  host. Then it sets FERN_GNU_DIFFUTILS to its bin directory.

  The pin is 3.10, the release that ubuntu-24.04 ships. A build from source
  keeps macOS on the same release, because macOS has the BSD cmp and diff.
inputs:
  host:
    description: The runner, which keys the cache.
    required: true
  version:
    description: The GNU diffutils release to build.
    required: false
    default: "3.10"
runs:
  using: composite
  steps:
    - name: Cache the GNU diffutils oracle
      id: gnu-diffutils
      uses: actions/cache@v6
      with:
        path: ~/gnu-diffutils
        key: gnu-diffutils-${{ inputs.version }}-${{ inputs.host }}
    - name: Build the GNU diffutils oracle
      if: steps.gnu-diffutils.outputs.cache-hit != 'true'
      shell: bash
      env:
        VER: ${{ inputs.version }}
      run: |
        set -euo pipefail
        work="$(mktemp -d)"
        cd "$work"
        curl -fsSLO "https://ftp.gnu.org/gnu/diffutils/diffutils-$VER.tar.xz"
        tar xf "diffutils-$VER.tar.xz"
        cd "diffutils-$VER"
        ./configure --quiet --disable-nls --prefix="$HOME/gnu-diffutils"
        make -j"$(getconf _NPROCESSORS_ONLN)"
        make install
        rm -rf "$HOME/gnu-diffutils/share"
        cd /
        rm -rf "$work"
    # A cache that restored an empty directory must stop here, with one
    # message that names the cause. The list comes from diffutils/*.fern.
    - name: Assert the oracle is GNU diffutils, and point the corpus at it
      shell: bash
      env:
        VER: ${{ inputs.version }}
      run: |
        set -euo pipefail
        bindir="$HOME/gnu-diffutils/bin"
        missing=""
        for f in diffutils/*.fern; do
          util="$(basename "$f" .fern)"
          line="$("$bindir/$util" --version 2>/dev/null | head -1 || true)"
          case "$line" in
            *"(GNU diffutils) $VER") ;;
            *) missing="$missing $util" ;;
          esac
        done
        if [ -n "$missing" ]; then
          echo "::error::no GNU diffutils $VER oracle in $bindir for:$missing"
          exit 1
        fi
        echo "FERN_GNU_DIFFUTILS=$bindir" >> "$GITHUB_ENV"
