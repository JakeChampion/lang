name: Reap stale runs
description: >
  Cancel the queued runs nobody is waiting on: a pull request's runs after it
  closed, and runs at a SHA a later push superseded. One API listing and a
  cancel per victim, about 20 seconds, idempotent: a cancel another sweep
  already made returns 409, which is handled. It never touches a run that is
  not a `pull_request` run, a run at the current head of an open pull request
  (checked per SHA, since branches are reused by successive pull requests), or
  the run ci.yml's lane selector adopts as main's evidence.

  Used by main-housekeeping.yml on every push to main and by
  cancel-on-merge.yml on every closed pull request, the moments runs go stale,
  and by reap-stale-runs.yml as the quiet-hours floor. The caller needs
  `actions: write` and `pull-requests: read`.
runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      with:
        script: |
          const { owner, repo } = context.repo;

          // branch -> Set of live head SHAs, taken once BEFORE the runs are
          // listed and merged with a second snapshot taken AFTER. A run is
          // spared if its SHA is live in either. The first snapshot alone
          // loses a push that lands mid-job: its fresh run is already listed
          // while the PR still reads at its old head, so the live run looks
          // superseded and gets reaped — and with ci.yml queueing pull
          // requests two at a time, a reaped live run is a whole CI round
          // lost. The
          // snapshot after the listing sees every head a listed run can
          // have been created for. cancel-on-merge.yml documents the same
          // trap from the other side.
          const open = new Map();
          const snapshot = async () => {
            for (const pr of await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            })) {
              const ref = pr.head?.ref;
              if (!ref) continue;
              if (!open.has(ref)) open.set(ref, new Set());
              open.get(ref).add(pr.head.sha);
            }
          };
          await snapshot();
          core.info(`${open.size} branch(es) with an open pull request`);

          const self = String(context.runId);
          const candidates = new Map();
          for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
            for (const run of await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, status, event: "pull_request", per_page: 100 },
            )) {
              if (String(run.id) === self) continue;
              candidates.set(run.id, run);
            }
          }
          core.info(`${candidates.size} pull_request run(s) not yet finished`);
          await snapshot();

          // A CI run at the merged head of a pull request whose merge pushed
          // that exact tree, with its suite under way, is the run the main
          // validation is waiting for (ci.yml's lane selector adopts it
          // instead of re-running its lanes). Spared for 45 minutes after
          // the merge, which outlasts that wait; cancel-on-merge.yml spares
          // the same run on the close event.
          const treeOf = async (sha) =>
            (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data.tree.sha;
          const adoptedByMain = async (run) => {
            if (run.path !== ".github/workflows/ci.yml") return "";
            const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: run.head_sha,
            })).data.filter((p) => p.merged_at && p.base.ref === "main" && p.merge_commit_sha && p.head.sha === run.head_sha);
            for (const p of prs) {
              const age = Math.round((Date.now() - Date.parse(p.merged_at)) / 60000);
              if (age > 45) continue;
              if ((await treeOf(p.merge_commit_sha)) !== (await treeOf(run.head_sha))) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: "latest", per_page: 100,
              });
              if (jobs.some((j) => j.name.startsWith("Full suite / "))) {
                return `#${p.number} merged this exact tree ${age} min ago and the main validation adopts the run`;
              }
            }
            return "";
          };
          const doomed = [];
          for (const run of candidates.values()) {
            const live = open.get(run.head_branch);
            let why = "";
            if (!live) {
              why = "its pull request is closed";
            } else if (!live.has(run.head_sha)) {
              why = "superseded by a later push";
            }
            if (!why) continue;
            let adopted = "";
            try {
              adopted = await adoptedByMain(run);
            } catch (e) {
              core.warning(`could not tell whether run ${run.id} is main's evidence: ${e.message}`);
            }
            if (adopted) {
              core.info(`keeping ${run.name} @ ${run.head_sha.slice(0, 8)}: ${adopted}`);
              continue;
            }
            doomed.push([run, why]);
          }
          // Pullfrog reviews waiting on a pull request that has since closed.
          // They are dispatched on main and named for the PR, so the
          // pull_request listing above never sees them. A review that starts
          // after its PR closed is read by nobody.
          try {
            const state = new Map();
            for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
              for (const run of await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: "pullfrog.yml", status, per_page: 100,
              })) {
                const m = /#(\d+)/.exec(run.display_title || "");
                if (!m) continue;
                if (!state.has(m[1])) {
                  const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(m[1]) });
                  state.set(m[1], pr.state);
                }
                if (state.get(m[1]) === "closed") doomed.push([run, `pull request #${m[1]} is closed`]);
              }
            }
          } catch (e) {
            core.warning(`could not sweep the Pullfrog reviews: ${e.message}`);
          }

          let cancelled = 0;
          let denied = false;
          const reaped = [];
          for (const [run, why] of doomed) {
            try {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              cancelled++;
              reaped.push(`${run.name} on \`${run.head_branch}\` @ ${run.head_sha.slice(0, 8)} — ${why}`);
            } catch (e) {
              // 409: reached a terminal state between the listing and the
              // cancel. Routine, and the commonest outcome on a busy queue.
              if (e.status === 409) continue;
              if (e.status === 403) denied = true;
              core.warning(`could not cancel ${run.id}: ${e.message}`);
            }
          }

          core.notice(
            `reaped ${cancelled} of ${doomed.length} doomed run(s) among ${candidates.size} unfinished pull_request run(s) and the Pullfrog queue`,
          );
          const summary = core.summary.addHeading("Reap stale runs", 3);
          if (reaped.length) {
            summary.addRaw(`Cancelled ${cancelled} run(s) nobody was waiting on:\n`).addList(reaped);
          } else {
            summary.addRaw(
              `Nothing to reap: all ${candidates.size} unfinished run(s) belong to the ` +
              `current head of an open pull request.\n`,
            );
          }
          await summary.write();

          if (denied) {
            core.setFailed("the token may not cancel runs — nothing was reaped");
          }
