name: Install the aarch64 cross toolchain
description: >
  Installs gcc-aarch64-linux-gnu and a qemu-aarch64 user-mode emulator
  (or, with cross-gcc false, the emulator alone), the way every
  arm64-touching lane needs them.

  It exists because this apt step is the single largest source of false
  red in this repository. Two distinct failures were observed on
  consecutive PRs, neither of which ran a test:

    * `apt-get update` exits 100 because packages.microsoft.com returns
      403 Forbidden on its azure-cli / prod repos ("repository is no
      longer signed"). Those repos are pre-seeded on the GitHub runner
      image and are irrelevant to a cross toolchain, but one 403 fails
      the whole update and takes the job with it.

    * the download from azure.archive.ubuntu.com crawls — 21 MB of
      gcc-13-aarch64-linux-gnu still unfinished after nine minutes — and
      the job is cancelled at its wall having installed nothing.

  The retry loop below was the first answer to the second failure, and
  it is not enough: a stall is a slow-but-progressing download, not an
  error, so each attempt is abandoned mid-transfer and the NEXT one
  restarts the same package from zero (#6038 — attempt 3 re-fetching the
  same 21 MB, with the job cancelled before it finished). Retrying turns
  one slow download into three inside a fixed budget.

  So the .debs are CACHED. On a hit nothing is downloaded at all: the
  packages are installed straight from the cache with dpkg, which is the
  only fix that removes the mirror from the critical path rather than
  hoping it behaves. The retry loop stays as the miss path, and the
  cache is populated from that same fetch. Each retry asks the next
  mirror of the runner's list, so one slow mirror does not take all
  the attempts.

inputs:
  qemu-package:
    description: >
      Which qemu package to install. `qemu-user-static`
      provides qemu-aarch64-static (and binfmt registration);
      `qemu-user` provides qemu-aarch64. `qemu-system` installs
      qemu-system-arm and qemu-system-x86, whose qemu-system-aarch64 and
      qemu-system-x86_64 boot a kernel image. Lanes differ, so it is an
      input rather than a guess.
    required: false
    default: qemu-user-static
  cross-gcc:
    description: >
      Install gcc-aarch64-linux-gnu alongside qemu. A lane that only
      EXECUTES arm64 output (rather than assembling it) sets this false
      and gets the emulator on its own — the point being that it still
      goes through this action's timeout / retry / cache rather than a
      bare `apt-get install`, which is the shape that hangs a job to its
      wall with nothing installed. Installing the compiler where it is
      not wanted is not free either: Arm64Tooling keys off its presence,
      so it would silently un-skip a different set of tests.
    required: false
    default: "true"
  cross-libc:
    description: >
      Also install libc6-dev-arm64-cross, the aarch64 glibc headers and
      libraries. A lane that links a C program against glibc for arm64, as
      the dlopen loaders of the shared-object tests do, sets this true.
    required: false
    default: "false"
  host-gl:
    description: >
      Also install Mesa's EGL and OpenGL ES 2 (libegl1, libgles2 and
      libegl-mesa0). The std/android/gl tests draw with them on the host,
      with no display server.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/disable-chrome-apt

    # The runner image's identity, read at RUNTIME. `${{ env.ImageOS }}`
    # interpolated straight into the cache key below resolves to the empty
    # string inside a composite action — measured, the saved key came back as
    # `apt-cross-v1-Linux-X64--gcctrue-…` — which would have pinned the cache
    # forever and silently dropped the refresh this is here to provide. A
    # shell step reading the environment does resolve it.
    - name: Identify the runner image (cache key input)
      id: image
      shell: bash
      run: |
        set -uo pipefail
        id="${ImageOS:-}${ImageVersion:+-$ImageVersion}"
        if [ -z "$id" ]; then
          id="$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
        fi
        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "runner image: $id"

    # Keyed on the package set plus the runner image. The image rolls every
    # couple of weeks, which is the refresh signal — a cross toolchain pinned
    # forever would drift from the image's libc. After a roll, the restore
    # key gives the same package set from an older image. That is not a hit:
    # apt then fetches only the packages whose version changed.
    - name: Restore cached cross-toolchain .debs
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/apt-cross-cache
        key: apt-cross-v2-${{ runner.os }}-${{ runner.arch }}-gcc${{ inputs.cross-gcc }}-libc${{ inputs.cross-libc }}-gl${{ inputs.host-gl }}-${{ inputs.qemu-package }}-${{ steps.image.outputs.id }}
        restore-keys: |
          apt-cross-v2-${{ runner.os }}-${{ runner.arch }}-gcc${{ inputs.cross-gcc }}-libc${{ inputs.cross-libc }}-gl${{ inputs.host-gl }}-${{ inputs.qemu-package }}-

    - name: aarch64 cross toolchain + ${{ inputs.qemu-package }}
      shell: bash
      env:
        CACHE_DIR: ${{ runner.temp }}/apt-cross-cache
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        MIRROR_LIST: /etc/apt/apt-mirrors.txt
        WANT_GCC: ${{ inputs.cross-gcc }}
        WANT_LIBC: ${{ inputs.cross-libc }}
        WANT_GL: ${{ inputs.host-gl }}
        QEMU_PKG: ${{ inputs.qemu-package }}
      run: |
        set -uo pipefail

        # Limit package setup to ten minutes within the twenty-minute job.
        deadline=$((SECONDS + 600))
        privileged_run() {
          local limit="$1" remaining=$((deadline - SECONDS))
          shift
          if [ "$remaining" -le 0 ]; then
            return 124
          fi
          if [ "$limit" -gt "$remaining" ]; then
            limit="$remaining"
          fi
          # Run timeout as root so it can terminate apt and its children.
          sudo timeout --kill-after=10 "$limit" "$@"
        }

        PACKAGES="$QEMU_PKG"
        if [ "$QEMU_PKG" = "qemu-system" ]; then
          PACKAGES="qemu-system-arm qemu-system-x86"
        fi
        if [ "$WANT_GCC" = "true" ]; then
          PACKAGES="gcc-aarch64-linux-gnu $PACKAGES"
        fi
        if [ "$WANT_LIBC" = "true" ]; then
          PACKAGES="libc6-dev-arm64-cross $PACKAGES"
        fi
        if [ "$WANT_GL" = "true" ]; then
          PACKAGES="libegl1 libgles2 libegl-mesa0 $PACKAGES"
        fi

        toolchain_present() {
          if [ "$WANT_GCC" = "true" ]; then
            command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 || return 1
            command -v aarch64-linux-gnu-as >/dev/null 2>&1 || return 1
          fi
          if [ "$WANT_LIBC" = "true" ]; then
            aarch64-linux-gnu-gcc -x c -fsyntax-only -include dlfcn.h - </dev/null >/dev/null 2>&1 || return 1
          fi
          if [ "$WANT_GL" = "true" ]; then
            for lib in libEGL.so.1 libGLESv2.so.2 libEGL_mesa.so.0; do
              ldconfig -p | grep -q "$lib" || return 1
            done
          fi
          # The unit lane looks up qemu-aarch64, while other lanes request
          # the static executable. An installed sibling is not a cache hit
          # for the requested tool and must not suppress its installation.
          case "$QEMU_PKG" in
            qemu-user) command -v qemu-aarch64 >/dev/null 2>&1 ;;
            qemu-user-static) command -v qemu-aarch64-static >/dev/null 2>&1 ;;
            qemu-system) command -v qemu-system-aarch64 >/dev/null 2>&1 && command -v qemu-system-x86_64 >/dev/null 2>&1 ;;
            *) return 1 ;;
          esac
        }

        # apt drops privileges to `_apt` to fetch. Without a partial/ it can
        # reach, it warns and falls back to downloading unsandboxed as root —
        # noise on every run, and not the path to leave it on. /var/cache/apt's
        # own ownership is what is being mirrored here.
        sudo mkdir -p "$CACHE_DIR/partial"
        sudo chown _apt:root "$CACHE_DIR/partial" 2>/dev/null || true

        # Cache hit: install straight from the .debs, no network at all.
        # dpkg configures a whole set in dependency order when handed all
        # of it at once, so no `apt-get -f install` (which would reach for
        # the mirror) is needed. A partial or stale set just falls through
        # to the fetch below, which reuses whatever .debs are still valid
        # and repairs any half-configured state on its way through.
        # Only an exact hit goes to dpkg. The .debs of an older image are
        # input to apt, which installs the current versions.
        dpkg_ok=1
        if [ "$CACHE_HIT" != "true" ]; then
          dpkg_ok=0
        elif ls "$CACHE_DIR"/*.deb >/dev/null 2>&1; then
          echo "::group::dpkg install from $(ls "$CACHE_DIR"/*.deb | wc -l) cached .debs"
          privileged_run 120 dpkg -i "$CACHE_DIR"/*.deb || dpkg_ok=0
          echo "::endgroup::"
        fi

        # A failed dpkg takes the apt path even when the binaries look
        # present: unpacked-but-unconfigured passes `command -v` while
        # leaving a broken dpkg state behind for the job's next apt user.
        if [ "$dpkg_ok" != "1" ] || ! toolchain_present; then
          # Third-party repos pre-seeded on the runner image. None of them
          # carries a cross toolchain, and packages.microsoft.com has been
          # observed 403-ing, which fails `apt-get update` outright. Their
          # absence cannot affect what we install.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/*msprod* 2>/dev/null || true

          # All attempts share the deadline, including the cached install.
          # Keep downloaded packages for the next attempt and cache save.
          attempt=1
          max=4
          while [ "$attempt" -le "$max" ]; do
            echo "::group::apt attempt $attempt/$max"
            if privileged_run 300 apt-get update -qq &&
               privileged_run 240 apt-get install -y --no-install-recommends \
                 -o "Dir::Cache::archives=$CACHE_DIR" \
                 -o APT::Keep-Downloaded-Packages=true \
                 $PACKAGES; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            remaining=$((deadline - SECONDS))
            if [ "$attempt" -eq "$max" ] || [ "$remaining" -le 0 ]; then
              echo "::error::cross-toolchain setup failed after ${attempt} attempts or reached its 600-second limit. No tests ran. Check the Ubuntu mirror and apt repositories."
              exit 1
            fi
            # A slow mirror is no error to apt, so a retry on the same mirror
            # crawls again. The next attempt asks the next mirror of the list.
            # The .debs that the last attempt fetched stay in the cache dir.
            if [ -f "${MIRROR_LIST:-}" ]; then
              rotated="$(mktemp)"
              awk 'NF { line[++n] = $0 }
                   END { for (k = 1; k <= n; k++) {
                     s = line[k % n + 1]
                     gsub(/[ \t]*priority:[0-9]+/, "", s)
                     print s "\tpriority:" k } }' "$MIRROR_LIST" > "$rotated" &&
                sudo cp "$rotated" "$MIRROR_LIST" &&
                echo "the next attempt asks $(head -n 1 "$MIRROR_LIST" | cut -f1)"
              rm -f "$rotated"
            fi
            delay=$((attempt * 15))
            if [ "$delay" -gt "$remaining" ]; then
              delay="$remaining"
            fi
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        fi

        # Keep only the .debs of the versions now installed. After a restore
        # from an older image, the set also holds the versions apt replaced.
        for deb in "$CACHE_DIR"/*.deb; do
          [ -e "$deb" ] || continue
          pkg="$(dpkg-deb -f "$deb" Package):$(dpkg-deb -f "$deb" Architecture)"
          if [ "$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null)" != "$(dpkg-deb -f "$deb" Version)" ]; then
            sudo rm -f "$deb"
          fi
        done

        # Hand the cache dir back to the runner user so the save step
        # can read it, and drop apt's partial-download scratch so a
        # half-fetched .deb is never archived.
        sudo rm -rf "$CACHE_DIR/partial" "$CACHE_DIR/lock"
        sudo chown -R "$(id -u):$(id -g)" "$CACHE_DIR"

        # Verify rather than assume: a partial install that leaves the
        # binaries absent would otherwise surface much later as a pile
        # of confusing test skips or failures.
        if ! toolchain_present; then
          echo "::error::the requested cross compiler, libc headers or emulator is missing after installation ($PACKAGES)"
          exit 1
        fi
        if [ "$WANT_GCC" = "true" ]; then
          aarch64-linux-gnu-gcc --version | head -1
        fi
        case "$QEMU_PKG" in
          qemu-user-static) qemu-aarch64-static --version | head -1 ;;
          qemu-system) qemu-system-aarch64 --version | head -1 && qemu-system-x86_64 --version | head -1 ;;
          *) qemu-aarch64 --version | head -1 ;;
        esac

    # Saved as soon as the install works, so a job that fails a test later
    # still fills the cache for the next job on this image.
    - name: Save the cross-toolchain .debs
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/apt-cross-cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
