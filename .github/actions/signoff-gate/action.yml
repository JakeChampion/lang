name: Sign-off gate
description: >
  Local-CI escape hatch (Basecamp gh-signoff style). Checks whether the PR
  head commit carries a `gh signoff <step>` commit status (context
  `signoff/<step>`, state success). When it does, outputs `skip=true` so the
  caller can skip the heavy lane in CI — the author has already run that suite
  locally and signed off on this exact commit.

  Trust + safety properties this relies on:
    * A sign-off is a commit status, which only collaborators with push access
      to the base repo can create. A fork contributor cannot post one onto the
      base repo's commit, so fork PRs can never skip — CI always runs for them.
    * Statuses are pinned to a SHA. Push a new commit and the old sign-off does
      not carry over, so amended/extra code always gets fresh CI unless it is
      re-signed.
    * The check FAILS OPEN: any API hiccup yields skip=false (lane runs). A
      sign-off can only ever remove work, never silently hide a regression.

inputs:
  step:
    description: >
      Sign-off step name. Matches `gh signoff <step>` locally, i.e. the commit
      status context `signoff/<step>` (e.g. step `units` -> `signoff/units`).
    required: true
  sha:
    description: >
      Commit SHA to inspect. Pass the PR HEAD sha, not the merge sha: on a
      pull_request event github.sha is the ephemeral refs/pull/N/merge commit,
      but `gh signoff` posts the status onto the author's head commit.
    required: true

outputs:
  skip:
    description: "'true' when a matching success sign-off status is present, else 'false'."
    value: ${{ steps.check.outputs.skip }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
        STEP: ${{ inputs.step }}
      run: |
        set -uo pipefail
        ctx="signoff/${STEP}"
        # Most-recent-first array of statuses on this commit; take the latest
        # one whose context matches and read its state. `[...][0].state`
        # collapses to null (then "" via // empty) when there is no match, so a
        # commit with no sign-off simply reads as not-signed. `|| true` plus the
        # default keep any transient API failure from wedging the lane: on error
        # `state` is empty, so we fall through to skip=false and run normally.
        state="$(gh api "repos/${REPO}/commits/${SHA}/statuses" \
                   --jq "[.[] | select(.context == \"${ctx}\")][0].state // empty" \
                 2>/dev/null || true)"
        if [ "${state}" = "success" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Local sign-off::${ctx} is signed off on ${SHA:0:12} — skipping this lane (ran locally)."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No ${ctx} sign-off on ${SHA:0:12} (state='${state:-none}') — running this lane normally."
        fi
