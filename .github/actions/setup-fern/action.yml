name: Setup Fern toolchain
description: >
  Shared setup for the Fern CI workflows. Sets up Go (no module
  cache — the repo has no external deps), caches the Go build
  cache so per-job `go test` / `go build` reuse compiled stdlib +
  per-package object files across runs, and, on demand, the
  wasmtime + wasm-tools + adapter triple and gotestsum. Each
  optional dependency is cached on a (host arch, version) key so
  the second-and-onward run skips the network fetch.

inputs:
  wasmtime:
    description: >
      Install wasmtime + wasm-tools + the WASI preview1 adapter and
      wire FERN_WASI_ADAPTER. Set to 'true' for any workflow that
      runs the wasm e2e suite.
    required: false
    default: "false"
  gotestsum:
    description: >
      Install gotestsum and put it on PATH. Set to 'true' for
      workflows that want the compact `pkgname-and-test-fails`
      formatter.
    required: false
    default: "false"

# Pinned versions — bump together with the corresponding entry in
# any workflow that overrides them. Kept here so a single edit
# updates every consumer.
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"
        # No go.sum (no external deps) → setup-go's default cache
        # attempt complains. Disable it here; we run our own cache
        # step below that covers the Go build cache directly.
        cache: false

    # Cache the Go build cache (`~/.cache/go-build` on Linux). Each
    # `go test` invocation compiles the package + its test binary;
    # without a cache that's repeated work every job. Keyed on host
    # arch + Go version + go.mod hash (Go-version + module-set
    # invalidation), with a restore-key on (arch, Go version) so a
    # source-only edit still lands a warm cache — Go invalidates
    # individual entries by per-file fingerprint on cache hit.
    #
    # No module cache step: the repo has no external module deps,
    # `~/go/pkg/mod` stays empty.
    - name: Cache Go build cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ runner.arch }}-go1.24-${{ hashFiles('go.mod') }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ runner.arch }}-go1.24-

    # The self-host driver binaries link a ~680 MB freestanding `.s`. The GNU
    # bfd linker (gcc's default) is minutes-slow and memory-heavy on inputs that
    # size — the source of intermittent self-host shard link TIMEOUTS (a cold
    # driver link hanging past the job deadline). The e2e link path
    # (driverLinkArgs / `-fuse-ld=lld`) uses ld.lld when present — seconds, low
    # RSS — so make sure it is installed. Idempotent: `ubuntu-latest` already
    # ships lld, so this is a no-op short-circuit on the hosted runners; it only
    # fetches on an image that lacks it. If install fails, the Go side falls back
    # to bfd (slow but correct), so this step never blocks a run.
    - name: Ensure lld (fast linker for the self-host driver links)
      shell: bash
      run: |
        if command -v ld.lld >/dev/null 2>&1; then
          echo "ld.lld already present: $(ld.lld --version | head -1)"
          exit 0
        fi
        sudo apt-get update -qq && sudo apt-get install -y -qq lld || {
          echo "lld install failed; driver links fall back to bfd" >&2
          exit 0
        }
        command -v ld.lld >/dev/null 2>&1 && ld.lld --version | head -1 || true

    - name: Detect host wasm-tools arch
      if: inputs.wasmtime == 'true'
      id: wasm-arch
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64)  echo "arch=x86_64-linux"  >> "$GITHUB_OUTPUT" ;;
          aarch64) echo "arch=aarch64-linux" >> "$GITHUB_OUTPUT" ;;
          *) echo "unsupported host arch: $(uname -m)" >&2; exit 1 ;;
        esac

    - name: Cache wasmtime + wasm-tools + adapter
      if: inputs.wasmtime == 'true'
      id: cache-wasm
      uses: actions/cache@v4
      with:
        path: |
          ~/.wasmtime
          ~/wasm-tools-1.253.0-${{ steps.wasm-arch.outputs.arch }}
          ~/wasi-adapter
        key: wasm-${{ runner.arch }}-1.253.0-v46.0.1

    - name: Install wasmtime + wasm-tools + adapter (cache miss)
      if: inputs.wasmtime == 'true' && steps.cache-wasm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # wasmtime — pinned to v46.0.1 (matching the cache key + the WASI
        # adapter below). `wasmtime.dev/install.sh` with no version installs
        # *latest*, which drifts from the pinned toolchain and recently 504'd
        # fetching a new release — failing every wasm job on a cache miss.
        # Download the pinned archive directly, like wasm-tools below.
        # v46 is the current release; the whole wasm suite passes under it,
        # including the WASI Preview-3 async/stream/future surface. The
        # component-model-async ABI changed vs the previous v37 pin (async
        # functype tag 0x40->0x43; component instances are now non-reentrant,
        # so the async-import composer emits a sibling-nested structure) — the
        # composer was ported to match. See docs/WASI-PREVIEW3-ASYNC-PLAN.md.
        mkdir -p "$HOME/.wasmtime/bin"
        curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasmtime-v46.0.1-${{ steps.wasm-arch.outputs.arch }}.tar.xz" \
          | tar -xJ -C "$HOME"
        install -m 0755 "$HOME/wasmtime-v46.0.1-${{ steps.wasm-arch.outputs.arch }}/wasmtime" "$HOME/.wasmtime/bin/wasmtime"
        curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.253.0/wasm-tools-1.253.0-${{ steps.wasm-arch.outputs.arch }}.tar.gz" \
          | tar -xz -C "$HOME"
        mkdir -p "$HOME/wasi-adapter"
        curl -sSfL -o "$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" \
          "https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasi_snapshot_preview1.command.wasm"

    - name: Wire wasmtime PATH + adapter env
      if: inputs.wasmtime == 'true'
      shell: bash
      run: |
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
        echo "$HOME/wasm-tools-1.253.0-${{ steps.wasm-arch.outputs.arch }}" >> "$GITHUB_PATH"
        echo "FERN_WASI_ADAPTER=$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" >> "$GITHUB_ENV"

    - name: Cache gotestsum binary
      if: inputs.gotestsum == 'true'
      id: cache-gotestsum
      uses: actions/cache@v4
      with:
        path: ~/go/bin/gotestsum
        key: gotestsum-${{ runner.os }}-${{ runner.arch }}-v1.13.0

    - name: Install gotestsum (cache miss)
      if: inputs.gotestsum == 'true' && steps.cache-gotestsum.outputs.cache-hit != 'true'
      shell: bash
      run: go install gotest.tools/gotestsum@v1.13.0

    - name: Wire gotestsum PATH
      if: inputs.gotestsum == 'true'
      shell: bash
      run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
