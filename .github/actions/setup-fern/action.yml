name: Setup Fern toolchain
description: >
  Shared setup for the Fern CI workflows. Sets up Go (no module
  cache — the repo has no external deps), caches the Go build
  cache so per-job `go test` / `go build` reuse compiled stdlib +
  per-package object files across runs, and, on demand, the
  wasmtime + wasm-tools + adapter triple and gotestsum. Each
  optional dependency is cached on a (host arch, version) key so
  the second-and-onward run skips the network fetch.

inputs:
  wasmtime:
    description: >
      Install wasmtime + wasm-tools + the WASI preview1 adapter and
      wire FERN_WASI_ADAPTER. Set to 'true' for any workflow that
      runs the wasm e2e suite.
    required: false
    default: "false"
  gotestsum:
    description: >
      Install gotestsum and put it on PATH. Set to 'true' for
      workflows that want the compact `pkgname-and-test-fails`
      formatter.
    required: false
    default: "false"

# Pinned versions — bump together with the corresponding entry in
# any workflow that overrides them. Kept here so a single edit
# updates every consumer.
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.24"
        # No go.sum (no external deps) → setup-go's default cache
        # attempt complains. Disable it here; we run our own cache
        # step below that covers the Go build cache directly.
        cache: false

    # Cache the Go build cache (`~/.cache/go-build` on Linux). Each
    # `go test` invocation compiles the package + its test binary;
    # without a cache that's repeated work every job. Keyed on host
    # arch + Go version + go.mod hash (Go-version + module-set
    # invalidation), with a restore-key on (arch, Go version) so a
    # source-only edit still lands a warm cache — Go invalidates
    # individual entries by per-file fingerprint on cache hit.
    #
    # No module cache step: the repo has no external module deps,
    # `~/go/pkg/mod` stays empty.
    - name: Cache Go build cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ runner.arch }}-go1.24-${{ hashFiles('go.mod') }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ runner.arch }}-go1.24-

    # The self-host driver binaries link a ~371 MB freestanding `.s`. The GNU
    # bfd linker (gcc's default) is minutes-slow and memory-heavy on inputs that
    # size — the source of intermittent self-host shard link TIMEOUTS (a cold
    # driver link hanging past the job deadline). The e2e link path
    # (driverLinkArgs / `-fuse-ld=lld`) uses ld.lld when present — seconds, low
    # RSS — so make sure it is installed. Idempotent: `ubuntu-latest` already
    # ships lld, so this is a no-op short-circuit on the hosted runners; it only
    # fetches on an image that lacks it. If install fails, the Go side falls back
    # to bfd (slow but correct), so this step never blocks a run.
    - name: Ensure lld (fast linker for the self-host driver links)
      shell: bash
      run: |
        if command -v ld.lld >/dev/null 2>&1; then
          echo "ld.lld already present: $(ld.lld --version | head -1)"
          exit 0
        fi
        # A FAILED install is tolerable — the fallback below links with bfd. A
        # HUNG one was not: apt stalling on a mirror holds the step until the
        # JOB's timeout-minutes kills it, which reports every real step as
        # `skipped` and the job as `cancelled` rather than as a test failure.
        # `timeout` turns the hang back into the failure this fallback already
        # handles. It runs under sudo, not over it, so the signal reaches apt
        # rather than the sudo wrapper.
        sudo timeout 120 apt-get update -qq && sudo timeout 120 apt-get install -y -qq lld || {
          echo "lld install failed or timed out; driver links fall back to bfd" >&2
          exit 0
        }
        command -v ld.lld >/dev/null 2>&1 && ld.lld --version | head -1 || true

    - name: Detect host wasm-tools arch
      if: inputs.wasmtime == 'true'
      id: wasm-arch
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64)  echo "arch=x86_64-linux"  >> "$GITHUB_OUTPUT" ;;
          aarch64) echo "arch=aarch64-linux" >> "$GITHUB_OUTPUT" ;;
          *) echo "unsupported host arch: $(uname -m)" >&2; exit 1 ;;
        esac

    - name: Cache wasmtime + wasm-tools + adapter
      if: inputs.wasmtime == 'true'
      id: cache-wasm
      uses: actions/cache@v6
      with:
        path: |
          ~/.wasmtime
          ~/wasm-tools-1.253.0-${{ steps.wasm-arch.outputs.arch }}
          ~/wasi-adapter
        key: wasm-${{ runner.arch }}-1.253.0-v46.0.1

    - name: Install wasmtime + wasm-tools + adapter (cache miss)
      if: inputs.wasmtime == 'true' && steps.cache-wasm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # wasmtime — pinned to v46.0.1 (matching the cache key + the WASI
        # adapter below). `wasmtime.dev/install.sh` with no version installs
        # *latest*, which drifts from the pinned toolchain and recently 504'd
        # fetching a new release — failing every wasm job on a cache miss.
        # Download the pinned archive directly, like wasm-tools below.
        # v46 is the current release; the whole wasm suite passes under it,
        # including the WASI Preview-3 async/stream/future surface. The
        # component-model-async ABI changed vs the previous v37 pin (async
        # functype tag 0x40->0x43; component instances are now non-reentrant,
        # so the async-import composer emits a sibling-nested structure) — the
        # composer was ported to match. See docs/WASI-PREVIEW3-ASYNC-PLAN.md.
        #
        # Every download RETRIES and lands in a FILE before it is unpacked.
        # Neither is cosmetic. A bare `curl … | tar` cannot retry — curl has
        # already written part of the stream into tar by the time the transfer
        # dies — and a 5xx body reaches tar as an archive, so the release
        # blipping reports `xz: File format not recognized` and a tar exit
        # status, naming the wrong step entirely. Both halves of that were
        # observed on one run: a 503 on x86-64 and a died-connection on
        # aarch64, each failing a job that never ran a test.
        dl() {
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 -o "$2" "$1"
        }
        mkdir -p "$HOME/.wasmtime/bin" "$HOME/wasi-adapter"
        dl "https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasmtime-v46.0.1-${{ steps.wasm-arch.outputs.arch }}.tar.xz" \
          "$HOME/wasmtime.tar.xz"
        tar -xJf "$HOME/wasmtime.tar.xz" -C "$HOME"
        install -m 0755 "$HOME/wasmtime-v46.0.1-${{ steps.wasm-arch.outputs.arch }}/wasmtime" "$HOME/.wasmtime/bin/wasmtime"
        dl "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.253.0/wasm-tools-1.253.0-${{ steps.wasm-arch.outputs.arch }}.tar.gz" \
          "$HOME/wasm-tools.tar.gz"
        tar -xzf "$HOME/wasm-tools.tar.gz" -C "$HOME"
        dl "https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasi_snapshot_preview1.command.wasm" \
          "$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm"

    - name: Wire wasmtime PATH + adapter env
      if: inputs.wasmtime == 'true'
      shell: bash
      run: |
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
        echo "$HOME/wasm-tools-1.253.0-${{ steps.wasm-arch.outputs.arch }}" >> "$GITHUB_PATH"
        echo "FERN_WASI_ADAPTER=$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" >> "$GITHUB_ENV"

    # PREFLIGHT: a missing wasm tool must fail the JOB, not the tests.
    #
    # Every wasm e2e test opens with `exec.LookPath("wasmtime")` / `("wasm-tools")`
    # and t.Skip()s when it is absent, and a skipped test reports `ok`. So if an
    # install step ever half-succeeds — a moved release URL, a partially-restored
    # cache, an arch the download matrix does not cover — the entire wasm surface
    # goes green while running NOTHING, and the failure is invisible in the one
    # place anyone looks. That is not hypothetical: 36 extern/export component
    # tests were silently skipping for a long stretch of #3457 (see
    # docs/SELFHOST-AST-RETIREMENT.md, "Interpret-the-driver"), and a bridge built
    # against the wrong box layout looked green the whole time.
    #
    # Asserting here converts that class from "silently covered nothing" into a
    # loud setup failure, at the only point that can tell the difference between
    # "this runner is not supposed to have wasmtime" (wasmtime input false, this
    # step does not run) and "wasmtime was requested and is missing".
    - name: Assert the wasm toolchain is actually usable
      if: inputs.wasmtime == 'true'
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        for tool in wasmtime wasm-tools; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "::error::$tool was requested (wasmtime: true) but is not on PATH — every wasm e2e test would t.Skip() and the lane would report a false green"
            fail=1
          fi
        done
        if [ -n "${FERN_WASI_ADAPTER:-}" ] && [ ! -f "$FERN_WASI_ADAPTER" ]; then
          echo "::error::FERN_WASI_ADAPTER points at $FERN_WASI_ADAPTER, which does not exist — the component tests would skip"
          fail=1
        fi
        if [ -z "${FERN_WASI_ADAPTER:-}" ]; then
          echo "::error::FERN_WASI_ADAPTER is unset — the component tests would skip"
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1
        # The pinned versions matter too: v46 changed the component-model-async
        # ABI, and an older wasmtime fails the preview-3 tests with an opaque
        # `invalid leading byte (0x43)`. Report them so a version drift is
        # visible in the log rather than surfacing as a mystery test failure.
        wasmtime --version
        wasm-tools --version

    - name: Cache gotestsum binary
      if: inputs.gotestsum == 'true'
      id: cache-gotestsum
      uses: actions/cache@v6
      with:
        path: ~/go/bin/gotestsum
        key: gotestsum-${{ runner.os }}-${{ runner.arch }}-v1.13.0

    - name: Install gotestsum (cache miss)
      if: inputs.gotestsum == 'true' && steps.cache-gotestsum.outputs.cache-hit != 'true'
      shell: bash
      run: go install gotest.tools/gotestsum@v1.13.0

    - name: Wire gotestsum PATH
      if: inputs.gotestsum == 'true'
      shell: bash
      run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
