name: Setup Fern toolchain
description: >
  Shared setup for the Fern CI workflows. Installs the toolchain
  mise.toml pins (Go, gotestsum, actionlint and, on demand, wasmtime +
  wasm-tools + the WASI preview1 adapter) through jdx/mise-action, which
  caches the installs on the lockfile hash, and restores the Go build
  cache so per-job `go test` / `go build` reuse compiled stdlib +
  per-package object files across runs.

inputs:
  wasmtime:
    description: >
      Install wasmtime + wasm-tools + the WASI preview1 adapter and
      wire FERN_WASI_ADAPTER. Set to 'true' for any workflow that
      runs the wasm e2e suite.
    required: false
    default: "false"
  build-cache-key:
    description: >
      Suffix for the Go build cache's exact-match key. Leave empty
      (the default) to restore-only: the empty suffix matches no
      saved entry, so the restore falls through to the prefix
      restore-key and lands the newest cache main published. Only
      the job that SAVES the cache passes a value here, and it
      passes the same one to actions/cache/save.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Every version comes from mise.toml + mise.lock; nothing is pinned here.
    # The mise release itself is mise.toml's [env] FERN_MISE_VERSION, and
    # internal/sourcelint fails when the two disagree.
    #
    # Two profiles, one per install set, because they must NOT share a cache: a
    # lane that never runs wasm installs only the Go-side tools (the wasm e2e
    # tests t.Skip() without wasmtime, so a shard measured without it —
    # .github/selfhost-test-weights.txt — keeps its weight), while a wasm lane
    # installs everything mise.toml lists. Distinct `cache_key_prefix` values
    # keep the base profile's wasm-less cache from being restored on a wasm lane.
    #
    # They are separate `if`-guarded steps rather than one step with a computed
    # `install_args`, because a GitHub Actions `A && '' || B` ternary cannot
    # yield the empty string ('' is falsy, so it falls through to B) — the wasm
    # branch would silently install the base set and every wasm tool would go
    # missing. Omitting `install_args` entirely is how mise-action is told to
    # install all of mise.toml.
    - name: Install the pinned toolchain (mise.toml, wasm)
      if: inputs.wasmtime == 'true'
      uses: jdx/mise-action@v4
      with:
        version: 2026.9.1
        github_token: ${{ github.token }}
        cache_key_prefix: mise-wasm
    - name: Install the pinned toolchain (mise.toml, base)
      if: inputs.wasmtime != 'true'
      uses: jdx/mise-action@v4
      with:
        version: 2026.9.1
        github_token: ${{ github.token }}
        cache_key_prefix: mise-base
        install_args: go gotestsum actionlint

    # RESTORE the Go build cache (`~/.cache/go-build` on Linux). Each
    # `go test` / `go build` invocation compiles the package plus its
    # test binary; without a cache that is repeated work every job.
    #
    # RESTORE-ONLY, by design. This step used to be a full
    # `actions/cache` keyed on `hashFiles('go.mod')` — and go.mod is
    # three lines that change only on a Go version bump, so the
    # primary key was constant. `actions/cache` skips its save step on
    # an exact-key hit, so every job in every workflow ended with
    #
    #     Cache hit occurred on the primary key
    #     gobuild-Linux-X64-go1.26-7188d594…, not saving cache.
    #
    # and the cache stayed a fossil of the tree as it stood when
    # `go 1.26` landed. It still covered the Go standard library, so
    # nothing was catastrophically slow, but every package the repo
    # had changed since was recompiled cold in every job, forever, and
    # the cache could never grow into the current tree.
    #
    # The naive fix — keying on `github.run_id` — is worse: ~85 jobs
    # per push would each write a multi-gigabyte entry and evict the
    # 10 GB repository cache budget out from under everything else.
    # So PR jobs restore and never write, and ONE job on main writes
    # once a day (see the save step in test-units.yml). The empty
    # default `build-cache-key` matches no saved entry, so the restore
    # falls through to the prefix restore-key and lands whichever
    # dated cache main published most recently. Go then invalidates
    # individual entries by per-file fingerprint, so a day-old cache
    # is still correct — only the packages that changed recompile.
    #
    # The key carries the lockfile hash: a Go bump changes mise.lock,
    # and a build cache from another Go release is dead weight.
    #
    # No module cache step: the repo has no external module deps,
    # `~/go/pkg/mod` stays empty.
    - name: Restore Go build cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ inputs.build-cache-key }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-

    # The self-host driver binaries link a ~371 MB freestanding `.s`. The GNU
    # bfd linker (gcc's default) is minutes-slow and memory-heavy on inputs that
    # size — the source of intermittent self-host shard link TIMEOUTS (a cold
    # driver link hanging past the job deadline). The e2e link path
    # (driverLinkArgs / `-fuse-ld=lld`) uses ld.lld when present — seconds, low
    # RSS — so make sure gcc can find it under that exact name.
    #
    # `ubuntu-latest` ships the VERSIONED linker (`ld.lld-18`) but not the `lld`
    # package that provides the unversioned `ld.lld` gcc's `-fuse-ld=lld` looks
    # for, so the apt branch below used to run in every job: measured 10.4 s on
    # run 33888241907, across the ~39 jobs that use this action. Symlinking the
    # versioned binary into PATH costs milliseconds and needs no network, and
    # the install stays as the fallback for an image carrying neither.
    - name: Ensure lld (fast linker for the self-host driver links)
      shell: bash
      run: |
        if command -v ld.lld >/dev/null 2>&1; then
          echo "ld.lld already on PATH: $(ld.lld --version | head -1)"
          exit 0
        fi
        # Newest by version sort, so a runner image carrying several LLVM
        # toolchains picks the one its own `lld` package would have.
        versioned=$(ls -1 /usr/bin/ld.lld-* 2>/dev/null | sort -V | tail -1 || true)
        if [ -n "$versioned" ]; then
          mkdir -p "$HOME/.local/bin"
          ln -sf "$versioned" "$HOME/.local/bin/ld.lld"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "linked $versioned as ld.lld: $("$versioned" --version | head -1)"
          exit 0
        fi
        echo "no ld.lld-* on this image; falling back to apt" >&2
        # A FAILED install is tolerable — the fallback below links with bfd. A
        # HUNG one was not: apt stalling on a mirror holds the step until the
        # JOB's timeout-minutes kills it, which reports every real step as
        # `skipped` and the job as `cancelled` rather than as a test failure.
        # `timeout` turns the hang back into the failure this fallback already
        # handles. It runs under sudo, not over it, so the signal reaches apt
        # rather than the sudo wrapper.
        sudo timeout 120 apt-get update -qq && sudo timeout 120 apt-get install -y -qq lld || {
          echo "lld install failed or timed out; driver links fall back to bfd" >&2
          exit 0
        }
        command -v ld.lld >/dev/null 2>&1 && ld.lld --version | head -1 || true

    # The adapter is a data file, so unlike the binaries it does not arrive on
    # PATH; the wasm e2e tests find it through this variable.
    - name: Wire the WASI adapter
      if: inputs.wasmtime == 'true'
      shell: bash
      run: echo "FERN_WASI_ADAPTER=$(mise where http:wasi-adapter)/wasi_snapshot_preview1.command.wasm" >> "$GITHUB_ENV"

    # PREFLIGHT: a missing wasm tool must fail the JOB, not the tests.
    #
    # Every wasm e2e test opens with `exec.LookPath("wasmtime")` / `("wasm-tools")`
    # and t.Skip()s when it is absent, and a skipped test reports `ok`. So if an
    # install step ever half-succeeds — a moved release URL, a partially-restored
    # cache, an arch the download matrix does not cover — the entire wasm surface
    # goes green while running NOTHING, and the failure is invisible in the one
    # place anyone looks. That is not hypothetical: 36 extern/export component
    # tests were silently skipping for a long stretch of #3457 (see
    # docs/SELFHOST-AST-RETIREMENT.md, "Interpret-the-driver"), and a bridge built
    # against the wrong box layout looked green the whole time.
    #
    # Asserting here converts that class from "silently covered nothing" into a
    # loud setup failure, at the only point that can tell the difference between
    # "this runner is not supposed to have wasmtime" (wasmtime input false, this
    # step does not run) and "wasmtime was requested and is missing".
    - name: Assert the wasm toolchain is actually usable
      if: inputs.wasmtime == 'true'
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        for tool in wasmtime wasm-tools; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "::error::$tool was requested (wasmtime: true) but is not on PATH — every wasm e2e test would t.Skip() and the lane would report a false green"
            fail=1
          fi
        done
        if [ -n "${FERN_WASI_ADAPTER:-}" ] && [ ! -f "$FERN_WASI_ADAPTER" ]; then
          echo "::error::FERN_WASI_ADAPTER points at $FERN_WASI_ADAPTER, which does not exist — the component tests would skip"
          fail=1
        fi
        if [ -z "${FERN_WASI_ADAPTER:-}" ]; then
          echo "::error::FERN_WASI_ADAPTER is unset — the component tests would skip"
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1
        # The pinned versions matter too: v46 changed the component-model-async
        # ABI, and an older wasmtime fails the preview-3 tests with an opaque
        # `invalid leading byte (0x43)`. Report them so a version drift is
        # visible in the log rather than surfacing as a mystery test failure.
        wasmtime --version
        wasm-tools --version
