name: Drop the self-host sources
description: >
  Delete compiler and internal/e2eselfhost from the checkout. Used
  right after checkout by every job of the lanes that ci.yml's lane table does
  not run on a change touching only those two trees, and by any other job
  whose tests must not read them. A test in such a job that starts to read
  them then fails on every run, instead of the lane going on skipping the very
  changes that could break it.

runs:
  using: composite
  steps:
    - name: delete compiler and internal/e2eselfhost
      shell: bash
      run: rm -rf compiler internal/e2eselfhost
