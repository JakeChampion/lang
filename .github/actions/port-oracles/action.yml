name: port-oracles
description: >
  Install the reference programs for the port differential tests.
  Ubuntu 24.04 supplies ripgrep 14.1.0 and cmark 0.30.2.
  Source archives supply pigz 2.8 with zlib 1.3.
  The age 1.3.2 release archive supplies age, age-keygen, age-inspect, and four plugins.
  The step checks each version and the SHA-256 of each archive.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/disable-chrome-apt
    - name: Install ripgrep and cmark
      shell: bash
      # timeout runs under sudo, so the signal stops apt, not the sudo wrapper.
      run: |
        set -euo pipefail
        for try in 1 2 3; do
          if sudo timeout 120 apt-get update -qq && sudo timeout 120 apt-get install -y -qq --no-install-recommends ripgrep cmark; then
            break
          fi
          echo "apt attempt $try failed" >&2
          sleep $((try * 10))
        done
        check() {
          local want="$1" got
          got="$("${@:2}" | head -1)"
          echo "$got"
          case "$got" in
            "$want"*) ;;
            *) echo "the ports pin $want; apt gave $got" >&2; exit 1 ;;
          esac
        }
        check 'ripgrep 14.1.0' rg --version
        check 'cmark 0.30.2 ' cmark --version
    - name: Build pigz 2.8 with zlib 1.3
      shell: bash
      run: |
        set -euo pipefail
        work="$(mktemp -d "$RUNNER_TEMP/pigz-oracle.XXXXXX")"
        curl -fsSL --retry 3 -o "$work/pigz.tar.gz" https://zlib.net/pigz/pigz-2.8.tar.gz
        curl -fsSL --retry 3 -o "$work/zlib.tar.gz" https://zlib.net/fossils/zlib-1.3.tar.gz
        echo "eb872b4f0e1f0ebe59c9f7bd8c506c4204893ba6a8492de31df416f0d5170fd0  $work/pigz.tar.gz" | sha256sum -c -
        echo "ff0ba4c292013dbc27530b3a81e1f9a813cd39de01ca5e0f8bf355702efa593e  $work/zlib.tar.gz" | sha256sum -c -
        tar -xzf "$work/pigz.tar.gz" -C "$work"
        tar -xzf "$work/zlib.tar.gz" -C "$work"
        (cd "$work/zlib-1.3" && ./configure --static && make -j2)
        make -C "$work/pigz-2.8" -j2 CFLAGS="-O3 -I$work/zlib-1.3" LDFLAGS="-L$work/zlib-1.3"
        oracle="$work/pigz-2.8/pigz"
        got="$("$oracle" -vV 2>&1)"
        echo "$got"
        if [ "$got" != $'pigz 2.8\nzlib 1.3' ]; then
          echo "the pigz port requires pigz 2.8 with zlib 1.3" >&2
          exit 1
        fi
        echo "FERN_PIGZ_ORACLE=$oracle" >> "$GITHUB_ENV"
    - name: Install age 1.3.2
      shell: bash
      env:
        VER: v1.3.2
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64; sum=cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 ;;
          aarch64) arch=arm64; sum=6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4 ;;
          *) echo "no age release for $(uname -m)" >&2; exit 1 ;;
        esac
        work="$(mktemp -d)"
        tarball="age-$VER-linux-$arch.tar.gz"
        for try in 1 2 3; do
          if curl -fsSL -o "$work/$tarball" "https://github.com/FiloSottile/age/releases/download/$VER/$tarball"; then
            break
          fi
          echo "download attempt $try failed" >&2
          sleep $((try * 10))
        done
        echo "$sum  $work/$tarball" | sha256sum -c -
        tar -xzf "$work/$tarball" -C "$work"
        tools="age age-keygen age-inspect age-plugin-batchpass age-plugin-pq age-plugin-tag age-plugin-tagpq"
        for tool in $tools; do
          sudo install -m 0755 "$work/age/$tool" /usr/local/bin/
        done
        rm -rf "$work"
        for tool in $tools; do
          got="$("$tool" --version)"
          echo "$tool $got"
          if [ "$got" != "$VER" ]; then
            echo "the age port pins $VER; $(command -v "$tool") gives $got" >&2
            exit 1
          fi
        done
