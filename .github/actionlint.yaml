# actionlint's schema has no `concurrency.queue` yet (GitHub added the key in
# May 2026; actionlint 1.7.12 still rejects it). ci-suite.yml needs `queue: max` for
# the PR queue and pullfrog.yml for its review queue, so that one message is
# ignored for those two files. Delete this once the pinned actionlint accepts
# the key.
paths:
  .github/workflows/ci-suite.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section'
  .github/workflows/pullfrog.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section'
