# lychee config for the docs-site link checker. Run from CI by
# .github/workflows/docs-build.yml against site/dist/ after the
# Astro build finishes.
#
# Scope:
#   - Crawl site/dist/**/*.html.
#   - Check internal links against the produced files.
#   - External links pass through with strict accept codes
#     (200/301/308) so we surface real 404s.

# Don't fail on private / loopback URLs (the iframe src points at
# /playground/ which lychee can't dereference against the live
# server).
exclude_all_private = true

# Build artefacts are noise — Astro fingerprinted assets under
# _astro/ and pagefind's search index don't need link-checking.
exclude_path = ["**/_astro/**", "**/_pagefind/**"]

# Anchor fragments (#heading) skip target verification — Starlight
# generates ids from heading text and getting those exactly right
# per-page is brittle and produces flake.
include_fragments = false

# Accept the standard "this is reachable" codes; any other 4xx /
# 5xx fails the build.
accept = [200, 301, 308]

# Cache discovered links so reruns within a day skip the network.
cache = true
max_cache_age = "1d"

# Keep external concurrency low — we hit github.com and esm.sh
# repeatedly across all the doc pages and don't want to look
# abusive.
max_concurrency = 4
