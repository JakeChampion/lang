name: Coreutils bench

# Runs scripts/coreutils-bench over the whole catalogue once a week and opens
# a pull request that adds the table as docs/coreutils-log/YYYY-MM-DD-bench.md.
# The docs site's coreutils page shows the newest such file, so the merge of
# that pull request updates the page.
#
# One job on one runner times all three implementations, which is the
# condition the script sets for comparable numbers: compare columns inside
# one run only. A shared runner is noisier than a quiet machine. The ratios
# move more from week to week than the times of a hand run do.
#
# GNU is the 9.12 tree the parity corpus uses (.github/actions/gnu-coreutils).
# uutils is the Ubuntu 24.04 rust-coreutils package, whose multicall binary
# the script finds at /usr/bin/coreutils. hyperfine is the Ubuntu package too.

on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coreutils-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/gnu-coreutils
        with:
          host: x86_64
          version: "9.12"

      - name: Install hyperfine and uutils
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q hyperfine rust-coreutils
          hyperfine --version
          /usr/bin/coreutils --version 2>&1 | head -1 || true

      - name: Run the bench
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          scripts/coreutils-bench -o "${{ runner.temp }}/table.md"
          # A missing column would put a partial table on the page.
          header="$(head -1 "${{ runner.temp }}/table.md")"
          case "$header" in
            *"(GNU coreutils) 9.12"*", uutils "*) ;;
            *) echo "::error::the bench did not measure GNU 9.12 and uutils: $header"; exit 1 ;;
          esac
          {
            echo "# coreutils bench, whole catalogue, $day, Linux x86-64"
            echo
            echo "Generated by .github/workflows/coreutils-bench.yml on a GitHub-hosted ubuntu-24.04 runner."
            echo "A ratio within about 10% of 1 is not a measured difference."
            echo
            cat "${{ runner.temp }}/table.md"
          } > "docs/coreutils-log/$day-bench.md"
          {
            echo "The weekly run of \`scripts/coreutils-bench\` over every utility (.github/workflows/coreutils-bench.yml)."
            echo "Merging it updates the coreutils page on the docs site."
            echo
            echo "$header"
          } > "${{ runner.temp }}/body.md"

      - name: Open or update the pull request
        uses: ./.github/actions/open-refresh-pr
        with:
          branch: refresh/coreutils-bench
          title: Add the weekly coreutils bench log
          commit-body: |-
            Generated by scripts/coreutils-bench in the coreutils-bench workflow,
            for every utility, against GNU coreutils 9.12 and uutils.
          body-file: ${{ runner.temp }}/body.md
          auto-rebase-token: ${{ secrets.AUTO_REBASE_TOKEN }}
          default-token: ${{ secrets.GITHUB_TOKEN }}
