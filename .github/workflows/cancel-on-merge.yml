name: Cancel superseded runs

# When a PR is closed (merged or abandoned) its branch will get no
# further pushes, so nothing else ever supersedes whatever was still
# queued or running for that PR: ci.yml's per-pull-request group cancels
# a run only when a newer push to the PR arrives, which will not come.
# That orphaned run would otherwise wait its turn in the
# queue — and then take it, holding one of the two slots to test a branch
# nobody cares about anymore.
#
# This reaps them: on PR close, cancel every run for the PR's head
# branch that has not reached a terminal state — EXCEPT the ones a
# still-open PR is relying on, and except the one run the main
# validation adopts (below). The PR's queued Pullfrog reviews go too. A branch here routinely outlives the PR
# that first used it (successive PRs get opened from the same
# `claude/…` branch), and every PR's runs are filed under that one
# branch name, so a blind branch-scoped cancel reaps the live PR's CI
# along with the dead one's. Runs whose head SHA is the head of an
# open PR are kept.
# `pull_request` (not `_target`) is safe here because the only
# permissions needed are `actions: write` + `pull-requests: read` on
# our own repo and we never check out / run untrusted code.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Head branch whose runs should be cancelled
        required: true

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cancel-on-merge-${{ github.event.pull_request.head.ref || github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const branch =
              context.payload.pull_request?.head?.ref ||
              context.payload.inputs?.branch;
            if (!branch) {
              core.setFailed("no head branch to cancel runs for");
              return;
            }
            const { owner, repo } = context.repo;
            const self = process.env.GITHUB_RUN_ID;

            // Collect the runs BEFORE the open PRs, so every candidate predates
            // the PR snapshot. The other order loses a force-push that lands
            // mid-job: the new runs are already listed while the PR still reads
            // at its old head, and the live PR's fresh CI looks orphaned.
            // A run created after this listing is simply not a candidate.
            const candidates = new Map();
            for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, branch, status, per_page: 100 },
              );
              for (const run of runs) {
                if (String(run.id) === String(self)) continue; // don't cancel ourselves
                candidates.set(run.id, run);
              }
            }

            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            });
            const keep = new Map();
            for (const pr of openPRs) {
              if (pr.head?.ref === branch) keep.set(pr.head.sha, pr.number);
            }
            for (const [sha, number] of keep) {
              core.info(`keeping runs at ${sha.slice(0, 8)} — PR #${number} is still open on ${branch}`);
            }

            // A MERGED pull request's CI run at the merged head is the main
            // validation's evidence when the merge pushed that head's exact
            // tree (the ruleset keeps branches level, so it usually did) and
            // the run's suite is already under way: ci.yml's lane selector
            // waits for that run on the main push and skips every lane it
            // passes, so cancelling it would hand main the whole suite from
            // zero. A run whose suite is still queued is cancelled as before;
            // main alone is faster than the queue.
            const pr = context.payload.pull_request;
            const spared = new Set();
            if (pr?.merged && pr.merge_commit_sha) {
              try {
                const treeOf = async (sha) =>
                  (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data.tree.sha;
                if ((await treeOf(pr.merge_commit_sha)) === (await treeOf(pr.head.sha))) {
                  for (const run of candidates.values()) {
                    if (run.head_sha !== pr.head.sha || run.event !== "pull_request" ||
                        run.path !== ".github/workflows/ci.yml") continue;
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner, repo, run_id: run.id, filter: "latest", per_page: 100,
                    });
                    if (jobs.some((j) => j.name.startsWith("Full suite / "))) {
                      spared.add(run.id);
                      core.info(`keeping CI run ${run.id}: #${pr.number} merged this exact tree with its suite ` +
                        `under way, so the main validation adopts it`);
                    }
                  }
                }
              } catch (e) {
                core.warning(`could not tell whether #${pr.number}'s run is main's evidence: ${e.message}`);
              }
            }

            // The PR's Pullfrog reviews still waiting their turn. They are
            // dispatched on main, so the branch listing above never sees them;
            // they are found by the PR number in the run name. A review that
            // starts after the PR closed is read by nobody — 43 of 60 sampled
            // reviews started after their PR had merged (docs/CI-PERFORMANCE.md).
            if (pr) {
              const names = new RegExp(`#${pr.number}(?!\\d)`);
              try {
                for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
                  for (const run of await github.paginate(github.rest.actions.listWorkflowRuns, {
                    owner, repo, workflow_id: "pullfrog.yml", status, per_page: 100,
                  })) {
                    if (names.test(run.display_title || "")) candidates.set(run.id, run);
                  }
                }
              } catch (e) {
                core.warning(`could not list the Pullfrog reviews of #${pr.number}: ${e.message}`);
              }
            }

            let cancelled = 0;
            let kept = 0;
            let denied = false;
            for (const run of candidates.values()) {
              if (keep.has(run.head_sha) || spared.has(run.id)) {
                kept++;
                continue;
              }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: run.id,
                });
                cancelled++;
                core.info(`cancelled ${run.name} #${run.run_number} (${run.id}) [${run.status}]`);
              } catch (e) {
                if (e.status === 409) {
                  core.info(`${run.id} reached a terminal state on its own`);
                  continue;
                }
                if (e.status === 403) denied = true;
                core.warning(`could not cancel ${run.id}: ${e.message}`);
              }
            }
            core.notice(`cancelled ${cancelled} run(s) for ${branch}, kept ${kept} (a still-open PR's, or the main validation's evidence)`);
            if (denied) {
              core.setFailed(
                "the token may not cancel runs — a fork pull request gets a read-only " +
                "GITHUB_TOKEN, so nothing was reaped",
              );
            }
