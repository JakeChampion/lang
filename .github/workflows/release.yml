name: Build & release

# Builds the `fern` compiler for every supported host platform, uploads each
# archive as a workflow artifact (so the binaries are downloadable from the
# Actions run page), and publishes a rolling `nightly` GitHub release pointing
# at the latest commit so users can fetch prebuilt builds from a stable URL.
#
# `fern` is the self-hosted compiler, compiler/fern_main.fern, with the stdlib
# and the diagnostic explanations embedded: `make bin/fern` builds it from the
# pinned stage0 (docs/BOOTSTRAP.md) on each host, with no Go toolchain.
#
# Host coverage matches `README.md`. An asset is named `<os>-<arch>`, the
# spelling a download page uses; the matrix below pairs each with the
# `-target` it builds the compiler for:
#   - linux-x86_64 : x86-64-linux, ubuntu-24.04
#   - linux-arm64  : arm64-linux,  ubuntu-24.04-arm  (matches CI's arm64 lane)
#   - darwin-arm64 : arm64-darwin, macos-15          (matches macos.yml's pin)
#
# The `apk` job builds the Android example apps (examples/android) for the
# same release, signed with the release keys.
#
# Windows is intentionally absent — the README doesn't claim it as
# a host platform, and the language's compilation targets
# (arm64-linux ELF, arm64-darwin Mach-O, wasm32-wasi component) are
# produced regardless of the host the compiler runs on.

on:
  # `nightly` is a *rolling daily* build — it does not need to rebuild on
  # every merge to main. The autonomous merge loop lands many PRs a day, and
  # a full 3-platform build + release per merge was the bulk of main's CI
  # load (and a big chunk of the run queue). Build once a day instead: the
  # rolling `nightly` tracks whatever main is at 06:00 UTC. `workflow_dispatch`
  # still builds on demand (artifacts only — see the release job's `if`).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `fern`, and the coreutils catalogue as ONE binary built by it.
  # `fern-coreutils` picks its utility from the basename of argv[0], so its
  # archive ships the symlinks beside it and untarring it is the whole
  # install. There is no wasm archive: dispatch reads argv[0], and a wasm
  # module has no name of its own to read.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     name: linux-x86_64, target: x86-64-linux }
          - { runner: ubuntu-24.04-arm, name: linux-arm64,  target: arm64-linux }
          - { runner: macos-15,         name: darwin-arm64, target: arm64-darwin }
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build fern
        run: make bin/fern

      - name: Build the coreutils multicall binary
        run: |
          set -euo pipefail
          mkdir -p dist/fern dist/coreutils
          cp bin/fern dist/fern/fern
          ./bin/fern -O -target "${{ matrix.target }}" \
            -o dist/coreutils/fern-coreutils coreutils/multicall/fern-coreutils.fern

      # Signed before the smoke test, so the test runs what is published.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-sign
        with:
          binaries: dist/fern/fern dist/coreutils/fern-coreutils
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      # Publishing a binary nobody ran is worse than publishing nothing, so
      # `fern` compiles and runs a program, and `fern-coreutils` answers for
      # itself and then runs a utility through a symlink — the invocation its
      # archive is built around.
      - name: Smoke-test both binaries and lay out the symlinks
        run: |
          set -euo pipefail
          printf 'function main(): i32 {\n  print("hello");\n  return 0;\n}\n' > hello.fern
          [ "$(dist/fern/fern -run -target "${{ matrix.target }}" hello.fern)" = "hello" ]
          # find, not ls: `coreutils/[.fern` is exactly the non-alphanumeric
          # name ls handles badly, and it is the reason this binary needed
          # the mangle-prefix sanitiser (#9684) to build at all.
          expected="$(find coreutils -maxdepth 1 -name '*.fern' | wc -l | tr -d ' ')"
          cd dist/coreutils
          n="$(./fern-coreutils --list | wc -l | tr -d ' ')"
          if [ "$n" != "$expected" ]; then
            echo "::error::--list names $n utilities, coreutils/ holds $expected"
            exit 1
          fi
          for util in $(./fern-coreutils --list); do
            ln -s fern-coreutils "$util"
          done
          [ "$(./echo hello)" = "hello" ]
          [ "$(./seq 1 3 | tr '\n' ' ')" = "1 2 3 " ]
          [ "$(printf 'a\nb\n' | ./wc -l | tr -d ' ')" = "2" ]
          ./true
          if ./false; then echo "::error::false(1) succeeded"; exit 1; fi

      # The release intends the safe profile on the matrix target. Each
      # shipped binary's build manifest says what it was built as, so a
      # binary built for another target or with a profile flag on cannot be
      # published (docs/security/RELEASE-CHECKLIST.md).
      - name: Check both manifests against the intended profile
        run: |
          set -euo pipefail
          for bin in dist/fern/fern dist/coreutils/fern-coreutils; do
            manifest="$(dist/fern/fern -manifest "$bin")"
            for line in "target: ${{ matrix.target }}" "harden: no" "pie: no" "sanitize: no" "size: no" "shared: no"; do
              if ! grep -qx -- "$line" <<<"$manifest"; then
                echo "::error::$bin manifest lacks '$line':"
                echo "$manifest"
                exit 1
              fi
            done
          done

      # The security smoke matrix compiles the bounds and compile-fail cases
      # with the compiler that is about to ship, on both native Linux targets,
      # and inspects each image's segments. It needs the arm64 emulator and
      # runs on the x86-64 build alone, where the matrix is defined.
      - name: qemu-aarch64 (the security smoke matrix executes arm64 output)
        if: matrix.target == 'x86-64-linux'
        uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
          cross-gcc: "false"

      - name: Security smoke matrix on the shipped compiler
        if: matrix.target == 'x86-64-linux'
        run: python3 scripts/security-smoke --compiler dist/fern/fern --report build/security-smoke.json

      - name: Upload the security smoke report
        if: matrix.target == 'x86-64-linux'
        uses: actions/upload-artifact@v7
        with:
          name: security-smoke-report
          path: build/security-smoke.json

      - name: Package archives
        run: |
          set -euo pipefail
          for name in "fern-${{ matrix.name }}:fern" "fern-coreutils-${{ matrix.name }}:coreutils"; do
            archive="${name%%:*}"
            tar -czf "$archive.tar.gz" -C "dist/${name##*:}" .
            shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fern-${{ matrix.name }}
          path: |
            fern-*${{ matrix.name }}.tar.gz
            fern-*${{ matrix.name }}.tar.gz.sha256
          overwrite: true

  # The Android example apps. Android installs an update only over an app
  # signed with the same certificate, so every nightly signs with the keys
  # in the repository secrets, and the job fails when one is missing:
  #   - ANDROID_APK_KEY: the P-256 key in PEM form for `fern -apk`. `fern -apk`
  #     writes a new one to the -apk-key file when that file does not exist.
  #   - ANDROID_KEYSTORE: a keystore with one key, base64-encoded, for the
  #     stopwatch's build.sh, and ANDROID_KEYSTORE_PASSWORD, its password.
  # The certificate of `fern -apk` comes from the key alone, so one key gives
  # the same APK, byte for byte, from the same source. A failure of this job
  # does not stop the release of the compiler: the release then has no APKs,
  # and its notes say so.
  apk:
    name: build-android-apks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build fern
        run: make bin/fern

      - name: Write the signing keys
        env:
          APK_KEY: ${{ secrets.ANDROID_APK_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ANDROID_APK_KEY:APK_KEY ANDROID_KEYSTORE:KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD:KEYSTORE_PASS; do
            var="${secret##*:}"
            if [ -z "${!var}" ]; then
              echo "::error::the repository secret ${secret%%:*} is not set; the APKs cannot be signed with the release keys"
              exit 1
            fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APK_KEY" > "$RUNNER_TEMP/keys/apk.key.pem"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/stopwatch.keystore"

      # The walkie-talkie shows its room buttons when WALKIE_SERVER names the
      # host of its room server. The name must be a plain DNS name.
      - name: Write the room server of the walkie-talkie
        env:
          WALKIE_SERVER: ${{ vars.WALKIE_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "$WALKIE_SERVER" ]; then
            echo "WALKIE_SERVER is not set: the walkie-talkie has no internet mode"
            exit 0
          fi
          if ! printf '%s' "$WALKIE_SERVER" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'; then
            echo "::error::WALKIE_SERVER is not a DNS name"
            exit 1
          fi
          printf 'pub const SERVER_HOST: string = "%s";\n' "$WALKIE_SERVER" > examples/android/walkie/server_host.fern

      - name: Build and sign the APKs
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/keys/apk.key.pem"
          KEYSTORE="$RUNNER_TEMP/keys/stopwatch.keystore" examples/android/stopwatch/build.sh
          mkdir -p dist/apk
          cp build/android-stopwatch/fern-stopwatch.apk dist/apk/
          ./bin/fern -apk dist/apk/fern-native.apk -apk-key "$key" -apk-package dev.fern.native -apk-label "Fern Native" examples/android/native/app.fern
          ./bin/fern -apk dist/apk/fern-walkie.apk -apk-key "$key" -apk-package dev.fern.walkie -apk-label "Fern Walkie" -apk-min-sdk 28 -apk-permission RECORD_AUDIO,INTERNET,ACCESS_WIFI_STATE,ACCESS_NETWORK_STATE,FOREGROUND_SERVICE,FOREGROUND_SERVICE_MICROPHONE,POST_NOTIFICATIONS,CHANGE_WIFI_STATE,NEARBY_WIFI_DEVICES,ACCESS_FINE_LOCATION examples/android/walkie/app.fern

      # apksigner is the check Android itself applies at install. The
      # certificate digests in the log let a user compare the signer of an
      # installed app with this release.
      - name: Verify the signatures and write the sidecars
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/apksigner"
          cd dist/apk
          for apk in *.apk; do
            "$apksigner" verify --print-certs "$apk"
            shasum -a 256 "$apk" > "$apk.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fern-android-apks
          path: |
            dist/apk/*.apk
            dist/apk/*.apk.sha256
          if-no-files-found: error
          overwrite: true

  release:
    # Only publish on the scheduled daily run; workflow_dispatch runs still
    # build + upload artifacts (handy for verifying changes to this workflow
    # without spamming the releases page). On `schedule`, github.sha is main's
    # HEAD, so the rolling `nightly` lands on the latest commit as intended.
    if: github.event_name == 'schedule' && !cancelled() && needs.build.result == 'success'
    needs: [build, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # the release and its assets
      id-token: write      # the packslip is signed with the workflow's identity
      attestations: write  # and each archive gets build provenance
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we're about to publish
        run: ls -la artifacts

      - name: Delete previous nightly release + tag
        # `softprops/action-gh-release` updates an existing release in
        # place but won't move the underlying tag, so a rolling
        # `nightly` tag would stay pinned to the first build's SHA.
        # Delete the previous release + tag first so the new one
        # lands cleanly on `github.sha`. `|| true` keeps the first
        # ever run (no existing release) green.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly build (${{ github.sha }})"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Prebuilt `fern` binaries from `main` at commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            This release is **rolling** — it's overwritten on every
            push to `main`, so the assets here always reflect the
            current tip of `main`. For a pinned build, grab the
            archives from the corresponding [Actions run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            instead.

            ## Downloads

            | Platform           | Archive                          |
            |--------------------|----------------------------------|
            | Linux x86_64       | `fern-linux-x86_64.tar.gz`       |
            | Linux arm64        | `fern-linux-arm64.tar.gz`        |
            | macOS Apple Silicon| `fern-darwin-arm64.tar.gz`       |

            ## The coreutils catalogue

            Every utility in `coreutils/` in one binary, built by the
            `fern` in this release, which picks which one to be from the
            name it is invoked as. Untar it and the symlinks are already
            there:

            ```
            tar xzf fern-coreutils-linux-x86_64.tar.gz
            ./yes | head -2
            ```

            ## Android apps

            ${{ needs.apk.result != 'success' && '**This build has no APKs, because the APK job failed. The log of the run gives the reason.**' || '' }}

            The example apps, built by the `fern` in this release, for
            arm64 phones and x86-64 emulators. Each nightly is signed
            with the same key, so it installs over the one before it.

            | App                        | APK                  |
            |----------------------------|----------------------|
            | Walkie-talkie on the LAN   | `fern-walkie.apk`    |
            | Stopwatch (Java views)     | `fern-stopwatch.apk` |
            | Stopwatch (NativeActivity) | `fern-native.apk`    |

            Each `fern` archive ships a single self-contained binary:
            the self-hosted compiler with its standard library
            embedded.
            The macOS binaries are signed with a Developer ID and
            notarized by Apple, so Gatekeeper runs them without a
            prompt.
            SHA-256 sums live alongside each archive
            (`*.tar.gz.sha256`, `*.apk.sha256`).
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.apk
            artifacts/*.apk.sha256

      - name: Publish the signed packslip
        # One signed file beside the archives (packslip.dev): each archive's
        # digest, platform and executable path, signed keylessly with this
        # workflow's OIDC identity, so an installer such as mise selects and
        # verifies the right `fern` archive without a layout rule for this
        # repository. The .sha256 sidecars stay for checking by hand. The
        # coreutils archives are not listed: they are a second tool, with its
        # own executables, and a second packslip is the way to describe them.
        uses: jdx/packslip@v1
        with:
          artifacts: artifacts/fern-linux-*.tar.gz artifacts/fern-darwin-*.tar.gz
          bin: fern
          tag: nightly
          version: 0.0.0-nightly.${{ github.run_number }}
          commit: ${{ github.sha }}
