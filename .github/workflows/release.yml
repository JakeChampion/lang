name: Build & release

# Builds the `fern` compiler for every supported host platform on
# every push to `main`, uploads each archive as a workflow artifact
# (so the binaries are downloadable from the Actions run page), and
# publishes a rolling `nightly` GitHub release pointing at the
# latest commit so users can fetch prebuilt builds from a stable
# URL.
#
# The compiler is pure Go (no cgo, no external module deps; the
# prelude + WIT files are `//go:embed`-ed into the binary), so each
# matrix entry is a one-shot `go build ./cmd/fern` with the right
# GOOS/GOARCH. No cross-toolchain needed.
#
# Host coverage matches `README.md`:
#   - linux-amd64  : ubuntu-latest
#   - linux-arm64  : ubuntu-24.04-arm  (matches CI's arm64 lane)
#   - darwin-arm64 : macos-15          (matches macos.yml's pin)
#
# Windows is intentionally absent — the README doesn't claim it as
# a host platform, and the language's compilation targets
# (arm64-linux ELF, arm64-darwin Mach-O, wasm component) are
# produced regardless of the host the compiler runs on.

on:
  # `nightly` is a *rolling daily* build — it does not need to rebuild on
  # every merge to main. The autonomous merge loop lands many PRs a day, and
  # a full 3-platform build + release per merge was the bulk of main's CI
  # load (and a big chunk of the run queue). Build once a day instead: the
  # rolling `nightly` tracks whatever main is at 06:00 UTC. `workflow_dispatch`
  # still builds on demand (artifacts only — see the release job's `if`).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,  goarch: amd64, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64, name: linux-arm64 }
          - { runner: macos-15,         goos: darwin, goarch: arm64, name: darwin-arm64 }
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          # No go.sum (no external deps) → setup-go's default cache
          # attempt complains. Mirror the existing CI workflows.
          cache: false

      - name: Build fern
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/fern ./cmd/fern

      - name: Package archive
        run: |
          cd dist
          tar -czf "../fern-${{ matrix.name }}.tar.gz" fern
          cd ..
          shasum -a 256 "fern-${{ matrix.name }}.tar.gz" > "fern-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fern-${{ matrix.name }}
          path: |
            fern-${{ matrix.name }}.tar.gz
            fern-${{ matrix.name }}.tar.gz.sha256

  release:
    # Only publish on the scheduled daily run; workflow_dispatch runs still
    # build + upload artifacts (handy for verifying changes to this workflow
    # without spamming the releases page). On `schedule`, github.sha is main's
    # HEAD, so the rolling `nightly` lands on the latest commit as intended.
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we're about to publish
        run: ls -la artifacts

      - name: Delete previous nightly release + tag
        # `softprops/action-gh-release` updates an existing release in
        # place but won't move the underlying tag, so a rolling
        # `nightly` tag would stay pinned to the first build's SHA.
        # Delete the previous release + tag first so the new one
        # lands cleanly on `github.sha`. `|| true` keeps the first
        # ever run (no existing release) green.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly build (${{ github.sha }})"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Prebuilt `fern` binaries from `main` at commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            This release is **rolling** — it's overwritten on every
            push to `main`, so the assets here always reflect the
            current tip of `main`. For a pinned build, grab the
            archives from the corresponding [Actions run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            instead.

            ## Downloads

            | Platform           | Archive                          |
            |--------------------|----------------------------------|
            | Linux x86_64       | `fern-linux-x86_64.tar.gz`       |
            | Linux arm64        | `fern-linux-arm64.tar.gz`        |
            | macOS Apple Silicon| `fern-darwin-arm64.tar.gz`       |

            Each archive ships a single self-contained `fern`
            binary; the prelude and WASI WIT files are embedded.
            SHA-256 sums live alongside each archive
            (`*.tar.gz.sha256`).
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
