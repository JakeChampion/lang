name: Build & release

# Builds the `fern` compiler for every supported host platform on
# every push to `main`, uploads each archive as a workflow artifact
# (so the binaries are downloadable from the Actions run page), and
# publishes a rolling `nightly` GitHub release pointing at the
# latest commit so users can fetch prebuilt builds from a stable
# URL.
#
# The compiler is pure Go (no cgo, no external module deps; the
# prelude + WIT files are `//go:embed`-ed into the binary), so each
# matrix entry is a one-shot `go build ./cmd/fern` with the right
# GOOS/GOARCH. No cross-toolchain needed.
#
# Host coverage matches `README.md`:
#   - linux-amd64  : ubuntu-latest
#   - linux-arm64  : ubuntu-24.04-arm  (matches CI's arm64 lane)
#   - darwin-arm64 : macos-15          (matches macos.yml's pin)
#
# Windows is intentionally absent — the README doesn't claim it as
# a host platform, and the language's compilation targets
# (arm64-linux ELF, arm64-darwin Mach-O, wasm component) are
# produced regardless of the host the compiler runs on.

on:
  # `nightly` is a *rolling daily* build — it does not need to rebuild on
  # every merge to main. The autonomous merge loop lands many PRs a day, and
  # a full 3-platform build + release per merge was the bulk of main's CI
  # load (and a big chunk of the run queue). Build once a day instead: the
  # rolling `nightly` tracks whatever main is at 06:00 UTC. `workflow_dispatch`
  # still builds on demand (artifacts only — see the release job's `if`).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,  goarch: amd64, name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64, name: linux-arm64 }
          - { runner: macos-15,         goos: darwin, goarch: arm64, name: darwin-arm64 }
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (pinned in mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          install_args: go

      - name: Build fern
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/fern ./cmd/fern

      - name: Sign and notarize (macOS)
        if: matrix.goos == 'darwin'
        uses: ./.github/actions/macos-sign
        with:
          binaries: dist/fern
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Package archive
        run: |
          cd dist
          tar -czf "../fern-${{ matrix.name }}.tar.gz" fern
          cd ..
          shasum -a 256 "fern-${{ matrix.name }}.tar.gz" > "fern-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fern-${{ matrix.name }}
          path: |
            fern-${{ matrix.name }}.tar.gz
            fern-${{ matrix.name }}.tar.gz.sha256

  # The coreutils catalogue as ONE binary per host, built twice: once by the
  # native compiler and once by the self-hosted one. Both are published while
  # the self-host is on its way to becoming the default, so a regression in
  # either is visible in the artifact rather than only in CI.
  #
  # `fern-coreutils` picks its utility from the basename of argv[0], so the
  # archive ships the symlinks beside it and untarring it is the whole
  # install. There is no wasm archive: dispatch reads argv[0], and a wasm
  # module has no name of its own to read.
  coreutils:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,  goarch: amd64, name: linux-x86_64,  target: x86-64-linux }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64, name: linux-arm64,   target: arm64-linux }
          - { runner: macos-15,         goos: darwin, goarch: arm64, name: darwin-arm64,  target: arm64-darwin }
    name: coreutils-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (pinned in mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          install_args: go

      - name: Build the native compiler
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bin/fern ./cmd/fern

      # The self-host compiler is itself a Fern program compiled for this
      # host's target, so it runs here like the utilities it goes on to build.
      - name: Build the self-host compiler
        run: ./bin/fern -target "${{ matrix.target }}" -o bin/fern-selfhost examples/self_host/fern.fern

      - name: Build the multicall binary with both compilers
        run: |
          set -euo pipefail
          mkdir -p dist/native dist/selfhost
          ./bin/fern -O -target "${{ matrix.target }}" \
            -o dist/native/fern-coreutils coreutils/multicall/fern-coreutils.fern
          ./bin/fern-selfhost -O -target "${{ matrix.target }}" \
            -o dist/selfhost/fern-coreutils coreutils/multicall/fern-coreutils.fern internal/stdlib

      # Signed before the smoke test, so the test runs what is published.
      - name: Sign and notarize (macOS)
        if: matrix.goos == 'darwin'
        uses: ./.github/actions/macos-sign
        with:
          binaries: dist/native/fern-coreutils dist/selfhost/fern-coreutils
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      # Publishing a binary nobody ran is worse than publishing nothing, so
      # each one answers for itself and then runs a utility through a symlink
      # — the invocation the archive is built around.
      - name: Smoke-test both binaries and lay out the symlinks
        run: |
          set -euo pipefail
          # find, not ls: `coreutils/[.fern` is exactly the non-alphanumeric
          # name ls handles badly, and it is the reason this binary needed
          # the mangle-prefix sanitiser (#9684) to build at all.
          expected="$(find coreutils -maxdepth 1 -name '*.fern' | wc -l | tr -d ' ')"
          for leg in native selfhost; do
            cd "dist/$leg"
            n="$(./fern-coreutils --list | wc -l | tr -d ' ')"
            if [ "$n" != "$expected" ]; then
              echo "::error::$leg: --list names $n utilities, coreutils/ holds $expected"
              exit 1
            fi
            for util in $(./fern-coreutils --list); do
              ln -s fern-coreutils "$util"
            done
            [ "$(./echo hello)" = "hello" ]
            [ "$(./seq 1 3 | tr '\n' ' ')" = "1 2 3 " ]
            [ "$(printf 'a\nb\n' | ./wc -l | tr -d ' ')" = "2" ]
            ./true
            if ./false; then echo "::error::$leg: false(1) succeeded"; exit 1; fi
            cd ../..
          done

      - name: Package archives
        run: |
          set -euo pipefail
          for leg in native selfhost; do
            name="fern-coreutils-$leg-${{ matrix.name }}"
            tar -czf "$name.tar.gz" -C "dist/$leg" .
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: fern-coreutils-${{ matrix.name }}
          path: |
            fern-coreutils-*-${{ matrix.name }}.tar.gz
            fern-coreutils-*-${{ matrix.name }}.tar.gz.sha256

  release:
    # Only publish on the scheduled daily run; workflow_dispatch runs still
    # build + upload artifacts (handy for verifying changes to this workflow
    # without spamming the releases page). On `schedule`, github.sha is main's
    # HEAD, so the rolling `nightly` lands on the latest commit as intended.
    if: github.event_name == 'schedule'
    needs: [build, coreutils]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we're about to publish
        run: ls -la artifacts

      - name: Delete previous nightly release + tag
        # `softprops/action-gh-release` updates an existing release in
        # place but won't move the underlying tag, so a rolling
        # `nightly` tag would stay pinned to the first build's SHA.
        # Delete the previous release + tag first so the new one
        # lands cleanly on `github.sha`. `|| true` keeps the first
        # ever run (no existing release) green.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly build (${{ github.sha }})"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Prebuilt `fern` binaries from `main` at commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            This release is **rolling** — it's overwritten on every
            push to `main`, so the assets here always reflect the
            current tip of `main`. For a pinned build, grab the
            archives from the corresponding [Actions run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            instead.

            ## Downloads

            | Platform           | Archive                          |
            |--------------------|----------------------------------|
            | Linux x86_64       | `fern-linux-x86_64.tar.gz`       |
            | Linux arm64        | `fern-linux-arm64.tar.gz`        |
            | macOS Apple Silicon| `fern-darwin-arm64.tar.gz`       |

            ## The coreutils catalogue

            Every utility in `coreutils/` in one binary, which picks
            which one to be from the name it is invoked as. Untar it
            and the symlinks are already there:

            ```
            tar xzf fern-coreutils-native-linux-x86_64.tar.gz
            ./yes | head -2
            ```

            Two builds of the same sources are published per platform
            while the self-hosted compiler is on its way to becoming
            the default: `fern-coreutils-native-*` is built by the Go
            compiler in this release, `fern-coreutils-selfhost-*` by
            the self-hosted one it produces.

            Each archive ships a single self-contained `fern`
            binary; the prelude and WASI WIT files are embedded.
            The macOS binaries are signed with a Developer ID and
            notarized by Apple, so Gatekeeper runs them without a
            prompt.
            SHA-256 sums live alongside each archive
            (`*.tar.gz.sha256`).
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
