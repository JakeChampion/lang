name: Preflight

# Optional fast checks for manual diagnosis. Pull requests use the full
# ci-suite.yml suite, which already includes these tests.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The x86-64 legs of the suite lanes, called with `hosts: x86_64`. The lane
  # workflows are the single definition of each job; the suite calls the same
  # files with both hosts.
  test-units:
    name: Test units
    uses: ./.github/workflows/test-units.yml
    with:
      hosts: x86_64
    secrets: inherit

  test-e2e-x86_64:
    name: Test e2e x86_64
    uses: ./.github/workflows/test-e2e-x86_64.yml
    secrets: inherit

  test-e2e-wasm:
    name: Test e2e wasm
    uses: ./.github/workflows/test-e2e-wasm.yml
    secrets: inherit

  test-e2e-differential:
    name: Test e2e differential
    uses: ./.github/workflows/test-e2e-differential.yml
    secrets: inherit

  test-coreutils:
    name: Test coreutils
    uses: ./.github/workflows/test-coreutils.yml
    with:
      hosts: x86_64
    secrets: inherit
