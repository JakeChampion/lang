name: Test e2e wasm

# `TestWASM*` (wasm_e2e_test.go — 323 tests) plus `TestWasm*`
# (wasm_preview2_test.go — the WASI preview2 component path).
# This is the heaviest single e2e bucket on the legacy combined
# workflow — each test shells out to wasmtime so subprocess
# overhead dominates.
#
# x86_64 only. The .wat the compiler emits does not depend on the host, and
# an aarch64 job ran the same tests under the aarch64 wasmtime build for five
# runner-minutes a run. The compiler built for aarch64 is tested by the
# self-host lane's aarch64 shards and by bootstrap.yml's verify-arm64-linux.
#
# The test binary is compiled in the test job itself. It used to come from a
# separate `build` job (#4577, when runner preemption was killing long jobs
# mid-compile), but a `needs:` edge defers the test jobs' creation until the
# build job has been queued, run and uploaded, and under the account-wide
# concurrent-job ceiling that wait ran 5-10 minutes for ~30 s of compile.
# Preemption has not been observed since the shards were shortened.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: test-e2e-wasm-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - uses: ./.github/actions/selfhost-driver-cache
      # Compiled here rather than in a build job the test jobs wait on: a
      # `needs:` edge defers the test jobs' creation until the build job has
      # been queued, run and uploaded, and under the account-wide concurrent-
      # job ceiling that queue wait ran 5-10 minutes for ~30 s of compile.
      - name: compile test binary (go test -c)
        run: |
          go test -c -o e2e.test ./internal/testing/e2e/
          go build -o "$RUNNER_TEMP/ci-test-workers" ./cmd/ci-test-workers
      # Two isolated worker processes (cmd/ci-test-workers), as the other e2e
      # lanes run: the tests cannot t.Parallel (several flip compiler-wide
      # globals), and one serial process left the runner's other cores idle
      # while each test waited on its wasmtime subprocess.
      - name: go test (wasm e2e, prebuilt, two workers)
        env:
          FERN_REQUIRE_WASMTIME: "1"
        run: |
          set -euo pipefail
          chmod +x e2e.test
          BIN="$PWD/e2e.test"
          cd internal/testing/e2e
          "$RUNNER_TEMP/ci-test-workers" -binary "$BIN" -output "$RUNNER_TEMP/wasm-test-results" \
            -format standard-verbose -workers 2 -timeout 18m -run '^Test(WASM|Wasm)'
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$RUNNER_TEMP"/wasm-test-results/worker-*.jsonl
