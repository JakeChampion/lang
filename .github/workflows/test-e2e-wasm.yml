name: Test e2e wasm

# `TestWASM*` (wasm_e2e_test.go — 323 tests) plus `TestWasm*`
# (wasm_preview2_test.go — the WASI preview2 component path).
# This is the heaviest single e2e bucket on the legacy combined
# workflow — each test shells out to wasmtime so subprocess
# overhead dominates.
#
# Matrix per host arch because wasmtime + wasm-tools ship distinct
# binaries per arch; running both lanes guarantees the same .wat
# emission validates byte-for-byte under both wasmtime ABIs.
#
# COMPILE-ONCE / RUNNER PREEMPTION (#4577). The lane was repeatedly killed
# by runner-pool preemption ("The runner has received a shutdown signal" /
# exit 143), always landing ~2.5-3 min into the run — i.e. during the
# `internal/e2e` PACKAGE COMPILE, before a single test reported. This is the
# same infrastructure preemption `test-e2e-selfhost.yml` documents at length
# (RUNNER PREEMPTION): short jobs survive, long jobs get reclaimed. A retry
# can't help — a runner reclaim kills the whole job, not a trappable step
# exit code. The lever that works is the selfhost workflow's own playbook
# (option 1): compile the test binary ONCE in a short `build` job (short jobs
# are never reclaimed) and run the wasm slice from the prebuilt binary in the
# `test` job. That removes the ~2.5-min compile — precisely the observed kill
# window — from the long job. Unlike the selfhost x86 shards this lane is NOT
# `continue-on-error`: there is no strict twin re-running the identical set
# (the aarch64 wasm job runs the same tests but with its own toolchain), so
# the redness stays load-bearing.

on:
  pull_request:
    # DOC-ONLY CHANGES DO NOT NEED THE COMPILER SUITE. This project opens a PR
    # for every push including doc fixes and comment corrections, and each one
    # was launching ~85 jobs into a queue that is the binding constraint on
    # every other PR in flight.
    #
    # Deliberately narrow. `*.md` does not cross a `/` in a GitHub path filter,
    # so it is root-level prose only (README, CLAUDE.md) and the literate
    # sources under examples/literate/*.fern.md — which ARE compiled — still
    # trigger everything. docs/ holds no .fern.md and no test fixture; the two
    # e2e tests that name a docs/ path only cite it in a comment or a failure
    # message.
    #
    # lint.yml deliberately has NO filter, so a doc-only PR still runs one real
    # gate rather than reporting no checks at all.
    #
    # The identical block on every lane is pinned by
    # TestPRWorkflowsShareOneDocOnlyFilter (internal/sourcelint).
    paths-ignore:
      - "docs/**"
      - "*.md"
  # Also on main: a rebase-merge replays commits onto a main their PR's CI never
  # saw, so a coupling between two individually-green PRs exists only in the
  # merge. Filter mirrors the pull_request one; pinned by TestGateLanesRunOnMain.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
#
# main is the one ref that never cancels: its run finishes and reports
# even when the next merge lands mid-run. It gets ONE group, not one per
# SHA. A SHA-keyed group supersedes nothing, so a burst of back-to-back
# rebase-merges held an uncancellable run each — six of them stacked ~90
# runs into the queue every open PR was waiting behind (#8124). With one
# group GitHub keeps at most one main run executing and one pending,
# cancelling the older pending, so a burst coalesces to its newest
# commit. The cost is attribution: a red main names a span of merges
# rather than one. check-sources.yml keeps the per-merge attribution —
# one ~1-minute job can afford a slot per merge; this lane cannot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compile the internal/e2e test binary ONCE per arch (short job — never
  # reclaimed by the runner pool). No wasmtime needed here: this only builds.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: build-e2e-wasm-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: compile test binary (go test -c)
        run: go test -c -o e2e.test ./internal/e2e/
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-wasm-test-${{ matrix.host }}
          path: e2e.test
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: test-e2e-wasm-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # for the ../../examples + ../../internal/stdlib data files the tests read
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - uses: actions/download-artifact@v8
        with:
          name: e2e-wasm-test-${{ matrix.host }}
      # Run the wasm slice from the PREBUILT binary — the compile that used to
      # be the preemption window now lives in the short `build` job above.
      # `^Test(WASM|Wasm)` matches both wasm_e2e_test.go (TestWASM* — uppercase)
      # and wasm_preview2_test.go (TestWasmPreview2* — mixed case). gotestsum's
      # `--raw-command` runs the prebuilt binary through `go tool test2json`; the
      # `standard-verbose` format still streams RUN/PASS/FAIL live so a preempted
      # run shows the in-flight test, while adding gotestsum's end-of-run summary.
      - name: go test (wasm e2e, prebuilt)
        run: |
          set -euo pipefail
          chmod +x e2e.test
          BIN="$PWD/e2e.test"
          cd internal/e2e
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2e "$BIN" -test.run '^Test(WASM|Wasm)' -test.v -test.timeout 18m
