name: Test e2e wasm

# `TestWASM*` (wasm_e2e_test.go — 323 tests) plus `TestWasm*`
# (wasm_preview2_test.go — the WASI preview2 component path).
# This is the heaviest single e2e bucket on the legacy combined
# workflow — each test shells out to wasmtime so subprocess
# overhead dominates.
#
# Matrix per host arch because wasmtime + wasm-tools ship distinct
# binaries per arch; running both lanes guarantees the same .wat
# emission validates byte-for-byte under both wasmtime ABIs.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-CI sign-off gate. `gh signoff e2e-wasm` on this commit skips the lane
  # below (see docs/CI-SIGNOFF.md). The wasm suite runs locally under wasmtime,
  # so this lane is a good sign-off candidate. Fork PRs can't sign off; gate
  # fails open on any error.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: e2e-wasm
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: test-e2e-wasm-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
          gotestsum: "true"
      - name: go test (wasm e2e)
        # `^Test(WASM|Wasm)` matches both wasm_e2e_test.go
        # (TestWASM* — uppercase) and wasm_preview2_test.go
        # (TestWasmPreview2* — mixed case).
        run: gotestsum --format pkgname-and-test-fails -- -run '^Test(WASM|Wasm)' ./internal/e2e/
