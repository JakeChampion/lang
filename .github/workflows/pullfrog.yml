# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

# Added to the generated file on purpose: at most two reviews run at once.
# Each holds a standard runner for 15-35 minutes, from the same 40-job
# account pool the CI suite needs, and four at once took a PR suite from
# 40 slots to 25. Two queues split on run-number parity, since a group
# admits one run at a time; `queue: max` keeps every review waiting in
# order rather than dropping all but the newest.
concurrency:
  group: >-
    pullfrog-${{ (endsWith(format('{0}', github.run_number), '0')
                  || endsWith(format('{0}', github.run_number), '2')
                  || endsWith(format('{0}', github.run_number), '4')
                  || endsWith(format('{0}', github.run_number), '6')
                  || endsWith(format('{0}', github.run_number), '8'))
                 && 'even' || 'odd' }}
  cancel-in-progress: false
  queue: max

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      # The gate step below reads the PR and this workflow's other runs.
      actions: read
      pull-requests: read
    steps:
      # Added to the generated file on purpose: a review nobody will read
      # ends here, in seconds, instead of holding a runner for 20-50 minutes.
      # The queue above admits reviews in order, so by the time one starts its
      # PR is often merged (43 of 60 sampled reviews started after the merge)
      # or has been pushed to again, with the newer review already queued.
      # The run name the Pullfrog app dispatches with names the PR ("Review
      # #10950 [g84rw]", "Review new commits on #10936 [0fn2g]"); a run whose
      # name has no PR number is left alone. A newer run supersedes only one
      # of the same kind, so a whole-PR review is never dropped for an
      # incremental one.
      - name: Skip a review nobody will read
        id: gate
        uses: actions/github-script@v9
        env:
          RUN_NAME: ${{ inputs.name }}
        with:
          script: |
            const name = process.env.RUN_NAME || "";
            const m = /#(\d+)/.exec(name);
            if (!m) {
              core.info(`no pull request named in ${JSON.stringify(name)}: reviewing`);
              return;
            }
            const number = Number(m[1]);
            const { owner, repo } = context.repo;
            const skip = async (why) => {
              core.setOutput("skip", "true");
              core.notice(`review skipped: ${why}`);
              await core.summary.addHeading("Review skipped", 3).addRaw(`${why}.\n`).write();
            };
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state === "closed") {
              return skip(`#${number} is ${pr.merged_at ? "merged" : "closed"}, so nobody is waiting on this review`);
            }
            const kind = name.replace(/\s*\[[^\]]*\]\s*$/, "").replace(/#\d+/, "#N");
            const { data: me } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
              for (const run of await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: "pullfrog.yml", status, per_page: 100,
              })) {
                const title = run.display_title || "";
                if (run.id === context.runId || Date.parse(run.created_at) <= Date.parse(me.created_at)) continue;
                if (title.replace(/\s*\[[^\]]*\]\s*$/, "").replace(/#\d+/, "#N") !== kind) continue;
                if (!new RegExp(`#${number}(?!\\d)`).test(title)) continue;
                return skip(`a newer review of #${number} (run ${run.id}, ${status}) covers this one`);
              }
            }
            core.info(`#${number} is open and this is its newest ${JSON.stringify(kind)} run: reviewing`);
      - name: Checkout code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run agent
        if: steps.gate.outputs.skip != 'true'
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          # add at least one provider API key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          
          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>
          
          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: >-
          #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>

          # for Azure OpenAI (https://docs.pullfrog.com/azure)
          # AZURE_RESOURCE_NAME is the <name> in https://<name>.openai.azure.com
          # AZURE_DEPLOYMENT is your deployment's name, not the model it serves
          # AZURE_RESOURCE_NAME: my-resource
          # AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          # AZURE_DEPLOYMENT: <deployment-name>
          # both limits are required — set them to the real limits of that model
          # AZURE_CONTEXT: "400000"
          # AZURE_MAX_OUTPUT: "128000"

          # for any OpenAI-compatible endpoint — LiteLLM, Cloudflare AI Gateway,
          # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
          # OPENAI_COMPATIBLE_BASE_URL: https://litellm.example.com/v1
          # OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          # OPENAI_COMPATIBLE_MODEL: <model-id>
          # both limits are required — set them to the real limits of that model
          # OPENAI_COMPATIBLE_CONTEXT: "128000"
          # OPENAI_COMPATIBLE_MAX_OUTPUT: "16384"
