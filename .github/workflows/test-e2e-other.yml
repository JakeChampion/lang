name: Test e2e other

# Catch-all for internal/testing/e2e tests not claimed by a more specific
# test-e2e-* workflow. Implemented as `go test -skip <other
# prefixes>` rather than an enumerated `-run`, so any future test
# whose name doesn't match the dedicated prefixes is picked up
# automatically rather than silently skipped from CI.
#
# Excluded (covered elsewhere):
#   ^TestArm64        → test-e2e-arm64.yml
#   ^TestX86_64       → test-e2e-x86_64.yml
#   ^TestWASM|Wasm    → test-e2e-wasm.yml
#   ^TestSelfHost     → test-e2e-selfhost.yml
#   ^TestDifferential → test-e2e-differential.yml
#
# What this lane actually exercises today:
#   - test_runner_test.go     (TestRunner*)
#   - interp_script_test.go   (TestInterpScript*)
#   - check_test.go           (TestCheck*)
#   - cross_module_variant_test.go (TestCrossModule*; the arch
#     siblings SKIP on the foreign runner via toolchain detection,
#     so the matrix-per-arch fan-out gives us native coverage of
#     both.)
#   - float_semantics_test.go (TestFloat*)
#   (TestDifferential* lives in its own workflow —
#    test-e2e-differential.yml — because the 2048-seed sweep is
#    the single heaviest test in the suite.)
#   - the misc checker-style tests that happen to live inside
#     wasm_e2e_test.go but neither parse-only nor wasm-runtime
#     dependent (TestF32F64MixRejected, TestI64ImplicitWidening
#     Accepted, TestMixedSignednessRejected, TestPolymorphicLiteral
#     I32Overflow, TestSubI32LiteralOverflow, TestU32SignedMix
#     Rejected, TestUnionUnknownMemberErrors).
#   - the wasm-component interop tests without a dedicated prefix
#     (TestExternVariant*, TestCmdLang*, TestComponent*, …). These
#     need wasmtime + wasm-tools + the WASI adapter (setup-fern's
#     wasmtime input below) — without the toolchain they SKIP
#     silently, and this lane's green tells you nothing about them
#     (see #4942 for the miscompile that shipped that way).
#
# Matrix per arch because the interp + checker paths are
# arch-independent but TestRunner pulls in the stdlib (which has
# arch-tagged unit tests transitively).

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

# The lanes that have a workflow of their own. Everything else in
# internal/testing/e2e belongs to this one. Written once: the shard step uses it both
# to build the list it partitions and, by construction, to decide what runs.
env:
  CATCH_ALL_SKIP: '^Test(Arm64|X86_64|WASM|Wasm|SelfHost|Differential)'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The aarch64 leg was one shard of 9.9-12.2 minutes in two workers,
          # the longest job outside the self-host lane (docs/ci-log/2026-09-15-performance.md).
          # Four x86_64 shards keep the catch-all within its unchanged 25m
          # worker budget. With three, run 39034198170's shard2 reached
          # 25m while its other worker finished at 16m22s; the tests still
          # active at the alarm had run for only 0-4s.
          - { runner: ubuntu-24.04,     host: x86_64,  nshard: 4, shard: 0 }
          - { runner: ubuntu-24.04,     host: x86_64,  nshard: 4, shard: 1 }
          - { runner: ubuntu-24.04,     host: x86_64,  nshard: 4, shard: 2 }
          - { runner: ubuntu-24.04,     host: x86_64,  nshard: 4, shard: 3 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 2, shard: 0 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 2, shard: 1 }
    name: test-e2e-other-${{ matrix.host }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          # The catch-all lane owns every test without a dedicated
          # prefix — including the wasm-component interop tests
          # (TestExternVariant*, TestCmdLang*, TestComponent*, …)
          # that need wasmtime + wasm-tools + the WASI adapter at
          # runtime. Without the toolchain those tests SKIP silently,
          # which is how the #4942 cross-width binding-slot miscompile
          # (invalid wasm rejected at `wasm-tools compose`) shipped
          # unseen: this lane was green while the only tests that
          # could catch it never ran anywhere in CI.
          wasmtime: "true"
      - uses: ./.github/actions/selfhost-driver-cache
      - name: build the e2e test binary
        run: |
          go test -c -o "$RUNNER_TEMP/e2e-other.test" ./internal/testing/e2e/
          go build -o "$RUNNER_TEMP/ci-test-workers" ./cmd/ci-test-workers
      - name: go test (e2e — non-backend-specific, shard ${{ matrix.shard }}/${{ matrix.nshard }}, two workers)
        # SHARDED, RATHER THAN GIVEN A THIRD TIMEOUT. The ceiling here was
        # raised twice — the lane inherited Go's 10m default, then 18m, and
        # each time a ~1% compiler change or a slow runner draw hit the wall
        # — so the third time it was sharded. The lane is a catch-all with no
        # owner and keeps accreting (7,631 to 7,851 tests in a matter of
        # hours), so the headroom has to come from splitting, not from the
        # number.
        #
        # TWO WORKERS PER SHARD. The selection runs as two isolated processes
        # through cmd/ci-test-workers (docs/CI-NATIVE-TEST-WORKERS.md: 1.6x on
        # this package's arm64 selection), each with half the runner's CPUs.
        # Process isolation is what the package needs — tests here mutate
        # compiler globals, so `t.Parallel` is not an option — and one serial
        # test process leaves most of a four-core runner idle. Each
        # architecture keeps two workers per shard; the matrix above
        # controls how many disjoint selections share that work.
        #
        # The partition is scripts/shard-tests, the same greedy LPT the
        # self-host lane uses — it reads names on stdin and is not specific to
        # that suite. The weights are .github/other-test-weights.txt: most
        # tests here are sub-second and weigh 1, but the TestRunner*ExamplePasses
        # suites run a stdlib test file under the Go interpreter and the crypto
        # and TLS ones take minutes each; by count they bunched into one shard,
        # which reached the 25m budget while another finished in 7m.
        #
        # SELECTION IS STILL BY NEGATION. `go test -list` enumerates the whole
        # package and CATCH_ALL_SKIP removes the lanes that have a workflow of
        # their own, so a new uncategorised test is still gated here
        # automatically — it lands in the list, and therefore in some shard,
        # without anyone adding it anywhere. That property is why this lane
        # selects by exclusion rather than an allowlist, and sharding must not
        # cost it.
        run: |
          set -euo pipefail
          W="$PWD/.github/other-test-weights.txt"
          mapfile -t MINE < <(
            go test -list '.' ./internal/testing/e2e/ |
              grep -E '^Test' |
              grep -vE "$CATCH_ALL_SKIP" |
              sort |
              scripts/shard-tests "${{ matrix.shard }}" "${{ matrix.nshard }}" "$W"
          )
          if [ ${#MINE[@]} -eq 0 ]; then
            echo "no tests for shard ${{ matrix.shard }}/${{ matrix.nshard }} — the list or the filter is wrong" >&2
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ matrix.nshard }}: ${#MINE[@]} tests"
          PAT="^($(IFS='|'; echo "${MINE[*]}"))\$"
          # The tests read ../../examples and ../../internal/stdlib, so the
          # binary runs from the package directory.
          cd internal/testing/e2e
          "$RUNNER_TEMP/ci-test-workers" \
            -binary "$RUNNER_TEMP/e2e-other.test" \
            -output "$RUNNER_TEMP/other-test-results" \
            -weights "$W" -workers 2 -timeout 25m -run "$PAT"
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$RUNNER_TEMP"/other-test-results/worker-*.jsonl
