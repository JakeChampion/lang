name: Test e2e other

# Catch-all for internal/e2e tests not claimed by a more specific
# test-e2e-* workflow. Implemented as `go test -skip <other
# prefixes>` rather than an enumerated `-run`, so any future test
# whose name doesn't match the dedicated prefixes is picked up
# automatically rather than silently skipped from CI.
#
# Excluded (covered elsewhere):
#   ^TestArm64        → test-e2e-arm64.yml
#   ^TestX86_64       → test-e2e-x86_64.yml
#   ^TestWASM|Wasm    → test-e2e-wasm.yml
#   ^TestSelfHost     → test-e2e-selfhost.yml
#   ^TestDifferential → test-e2e-differential.yml
#
# What this lane actually exercises today:
#   - test_runner_test.go     (TestRunner*)
#   - interp_script_test.go   (TestInterpScript*)
#   - check_test.go           (TestCheck*)
#   - cross_module_variant_test.go (TestCrossModule*; the arch
#     siblings SKIP on the foreign runner via toolchain detection,
#     so the matrix-per-arch fan-out gives us native coverage of
#     both.)
#   - float_semantics_test.go (TestFloat*)
#   (TestDifferential* lives in its own workflow —
#    test-e2e-differential.yml — because the 2048-seed sweep is
#    the single heaviest test in the suite.)
#   - the misc checker-style tests that happen to live inside
#     wasm_e2e_test.go but neither parse-only nor wasm-runtime
#     dependent (TestF32F64MixRejected, TestI64ImplicitWidening
#     Accepted, TestMixedSignednessRejected, TestPolymorphicLiteral
#     I32Overflow, TestSubI32LiteralOverflow, TestU32SignedMix
#     Rejected, TestUnionUnknownMemberErrors).
#   - the wasm-component interop tests without a dedicated prefix
#     (TestExternVariant*, TestCmdLang*, TestComponent*, …). These
#     need wasmtime + wasm-tools + the WASI adapter (setup-fern's
#     wasmtime input below) — without the toolchain they SKIP
#     silently, and this lane's green tells you nothing about them
#     (see #4942 for the miscompile that shipped that way).
#
# Matrix per arch because the interp + checker paths are
# arch-independent but TestRunner pulls in the stdlib (which has
# arch-tagged unit tests transitively).

on:
  pull_request:
    # DOC-ONLY CHANGES DO NOT NEED THE COMPILER SUITE. This project opens a PR
    # for every push including doc fixes and comment corrections, and each one
    # was launching ~85 jobs into a queue that is the binding constraint on
    # every other PR in flight.
    #
    # Deliberately narrow. `*.md` does not cross a `/` in a GitHub path filter,
    # so it is root-level prose only (README, CLAUDE.md) and the literate
    # sources under examples/literate/*.fern.md — which ARE compiled — still
    # trigger everything. docs/ holds no .fern.md and no test fixture; the two
    # e2e tests that name a docs/ path only cite it in a comment or a failure
    # message.
    #
    # lint.yml deliberately has NO filter, so a doc-only PR still runs one real
    # gate rather than reporting no checks at all.
    #
    # The identical block on every lane is pinned by
    # TestPRWorkflowsShareOneDocOnlyFilter (internal/sourcelint).
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # Also on main: a rebase-merge replays commits onto a main their PR's CI never
  # saw, so a coupling between two individually-green PRs exists only in the
  # merge. Filter mirrors the pull_request one; pinned by TestGateLanesRunOnMain.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# The lanes that have a workflow of their own. Everything else in
# internal/e2e belongs to this one. Written once: the shard step uses it both
# to build the list it partitions and, by construction, to decide what runs.
env:
  CATCH_ALL_SKIP: '^Test(Arm64|X86_64|WASM|Wasm|SelfHost|Differential)'

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
#
# main is the one ref that never cancels: its run finishes and reports
# even when the next merge lands mid-run. It gets ONE group, not one per
# SHA. A SHA-keyed group supersedes nothing, so a burst of back-to-back
# rebase-merges held an uncancellable run each — six of them stacked ~90
# runs into the queue every open PR was waiting behind (#8124). With one
# group GitHub keeps at most one main run executing and one pending,
# cancelling the older pending, so a burst coalesces to its newest
# commit. The cost is attribution: a red main names a span of merges
# rather than one. check-sources.yml keeps the per-merge attribution —
# one ~1-minute job can afford a slot per merge; this lane cannot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64,  nshard: 2, shard: 0 }
          - { runner: ubuntu-latest,    host: x86_64,  nshard: 2, shard: 1 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 1, shard: 0 }
    name: test-e2e-other-${{ matrix.host }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          # The catch-all lane owns every test without a dedicated
          # prefix — including the wasm-component interop tests
          # (TestExternVariant*, TestCmdLang*, TestComponent*, …)
          # that need wasmtime + wasm-tools + the WASI adapter at
          # runtime. Without the toolchain those tests SKIP silently,
          # which is how the #4942 cross-width binding-slot miscompile
          # (invalid wasm rejected at `wasm-tools compose`) shipped
          # unseen: this lane was green while the only tests that
          # could catch it never ran anywhere in CI.
          wasmtime: "true"
      - name: go test (e2e — non-backend-specific, shard ${{ matrix.shard }}/${{ matrix.nshard }})
        # `-skip` (Go 1.20+) is the negation lever the `-run`
        # alternation lacks. Anything not matching the listed
        # prefixes runs here, so adding a new uncategorised test
        # is automatically gated on this lane.
        # SHARDED, RATHER THAN GIVEN A THIRD TIMEOUT. The ceiling here was
        # raised twice for the same reason. It started with no explicit
        # `-timeout` at all, so it inherited Go's 10m default — a number
        # nobody chose — and at 7,347 tests it ran ~9m40s against it, so the
        # first change to add ~1% anywhere in the compiler hit the wall and
        # reported as four failed tests with conclusion "unknown" rather than
        # as a timeout. 18m matched the arm64 e2e lane. THE SAME THING
        # HAPPENED AGAIN at 18m: the lane reached 7,851 tests and 15m55s
        # locally, a compiler change worth -98,265 IR ops added 7.6s (+0.8%),
        # and CI timed out at 18m00.0s — a slow runner draw had already taken
        # it to 16m58s while green, so the headroom was ~1 minute against a
        # 1.5x spread. Hence 25m, and the note left here that whoever met it a
        # third time should shard rather than raise.
        #
        # This is that. The x86 leg was ~21 minutes against 25m — about a
        # minute of headroom again on a slow draw — and the lane is a
        # catch-all with no owner, so it will keep accreting: it grew 7,631 to
        # 7,851 tests in a matter of hours. Two x86 shards put each at ~11
        # min, which is headroom that a year of accretion cannot eat.
        #
        # ONE SHARD ON aarch64, because sharding is for the ceiling, not for
        # speed: that leg runs the same set in ~10 min and is nowhere near
        # 25m. Splitting it would spend a runner slot to fix a problem it does
        # not have.
        #
        # The partition is scripts/selfhost-shard-tests, the same greedy LPT
        # the self-host lane uses — it reads names on stdin and is not
        # specific to that suite. No weights file is passed, so every test
        # weighs 1 and the partition is a balanced split by count, which is
        # right for ~1,564 mostly-sub-second tests with no dominating outlier.
        # A weights file can be added later without touching this.
        #
        # SELECTION IS STILL BY NEGATION. `go test -list` enumerates the whole
        # package and CATCH_ALL_SKIP removes the lanes that have a workflow of
        # their own, so a new uncategorised test is still gated here
        # automatically — it lands in the list, and therefore in some shard,
        # without anyone adding it anywhere. That property is why this lane
        # uses `-skip` rather than an `-run` allowlist, and sharding must not
        # cost it.
        run: |
          set -euo pipefail
          mapfile -t MINE < <(
            go test -list '.' ./internal/e2e/ |
              grep -E '^Test' |
              grep -vE "$CATCH_ALL_SKIP" |
              sort |
              scripts/selfhost-shard-tests "${{ matrix.shard }}" "${{ matrix.nshard }}"
          )
          if [ ${#MINE[@]} -eq 0 ]; then
            echo "no tests for shard ${{ matrix.shard }}/${{ matrix.nshard }} — the list or the filter is wrong" >&2
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ matrix.nshard }}: ${#MINE[@]} tests"
          PAT="^($(IFS='|'; echo "${MINE[*]}"))\$"
          gotestsum --format pkgname-and-test-fails -- -timeout 25m \
            -run "$PAT" \
            ./internal/e2e/
