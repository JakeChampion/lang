name: Examples

# Compile every `examples/*.fern` for the arm64-Linux target. The
# legacy combined CI workflow ran this as a tail step on its
# 10-minute test job; pulled out here so it gates independently
# (and so a codegen regression on the example surface fails its
# own check rather than being buried under "go test").
#
#   x86_64 lane (ubuntu-latest)    — driver emits arm64 .s only;
#                                    no link / run (no cross-gcc
#                                    installed to keep the lane
#                                    fast).
#   aarch64 lane (ubuntu-24.04-arm) — driver emits arm64 .s, gcc
#                                    statically links it, the
#                                    binary is actually executed.

on:
  # Same-repo PRs reach this lane through the CI queue (ci-queue.yml), which
  # dispatches it once the PR is at the front. The `pull_request` trigger is
  # kept for FORK PRs only — a fork's branch can't be dispatched onto a
  # base-repo ref — and the gate job below skips everything else. See
  # docs/CI-QUEUE.md.
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-CI sign-off gate. `gh signoff examples` on this commit skips the lane
  # below (see docs/CI-SIGNOFF.md). Fork PRs can't sign off; gate fails open on
  # any error.
  gate:
    # Queue admission: on `pull_request` this lane runs for fork PRs only.
    # Same-repo PRs are dispatched by ci-queue.yml when they reach the front
    # of the queue; skipping the gate skips every job that needs it.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: examples
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  compile:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: examples-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - name: Compile every example (arm64 target)
        run: |
          go build -o bin/fern ./cmd/fern
          mkdir -p build
          for f in examples/*.fern; do
            name=$(basename "$f" .fern)
            ./bin/fern -target arm64 "$f" > "build/$name.s"
            if [ "${{ matrix.host }}" = "aarch64" ]; then
              gcc -static -nostdlib "build/$name.s" -o "build/$name"
              echo "::group::run $name"
              ./build/$name || echo "(exited $?)"
              echo "::endgroup::"
            fi
          done
