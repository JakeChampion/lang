name: Examples

# Compile every `examples/*.fern` for the arm64-Linux target. The
# legacy combined CI workflow ran this as a tail step on its
# 10-minute test job; pulled out here so it gates independently
# (and so a codegen regression on the example surface fails its
# own check rather than being buried under "go test").
#
# ONE LANE, on ubuntu-24.04-arm: the driver emits arm64 .s, gcc
# statically links it, and the binary is actually executed.
#
# There used to be an x86_64 lane beside it that emitted the same arm64
# .s and stopped there — no link, no run, because no cross-gcc was
# installed to keep it fast. That made it a strict subset of this one:
# same compiler, same `-target arm64-linux`, same output, minus the two
# steps that can catch anything the emit alone cannot. It cost a runner
# slot per push to re-check a byte sequence this lane already produces
# and then proves executable. Codegen output that varied by HOST arch
# would be a bug in itself, and the differential lanes are what gate
# that.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds the PR-wide lock (one pull
# request's suite at a time), decides from the changed files whether this lane
# runs — the lane's path filter lives in its lane table — and cancels the rest
# of the run when a lane goes red. `workflow_dispatch` stays so the lane can
# be run on its own, outside that lock.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  compile:
    name: examples-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Compile every example (arm64 target)
        run: |
          go build -o bin/fern ./cmd/fern
          mkdir -p build
          for f in examples/*.fern; do
            name=$(basename "$f" .fern)
            ./bin/fern -target arm64-linux "$f" > "build/$name.s"
            gcc -static -nostdlib "build/$name.s" -o "build/$name"
            echo "::group::run $name"
            rc=0; scripts/ci-run-example "$name" "./build/$name" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::example $name failed (exit $rc)"; exit 1; fi
          done
