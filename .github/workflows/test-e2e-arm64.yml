name: Test e2e arm64

# `TestArm64*` — the arm64-Linux ELF backend's end-to-end suite.
# Runs binaries via the native arm64 runner (no qemu involved).
# Only scheduled on `ubuntu-24.04-arm`; on an x86 host every test
# in this prefix would SKIP because `aarch64-linux-gnu-gcc` +
# `qemu-aarch64` aren't installed, so the x86 lane would just be a
# 30-second no-op.
#
# The legacy combined CI workflow ran this alongside x86 + wasm +
# self-host on a single 10-minute box. Splitting it out lets the
# arm64 lane finish in ~90 seconds and surface as its own status
# check.
#
# The `cross-host` job below covers the OTHER half of the arm64 story:
# the fifteen cross-compiler-on-host tests (x86 host binary emitting arm64
# asm, the emitted binaries running under qemu-aarch64) that need BOTH a
# native x86 host AND the aarch64 cross toolchain — a combination no
# other lane provides, so before this job they ran NOWHERE: the x86
# self-host shards skip them (no cross tools installed) and the aarch64
# runners skip them (the stage-1 driver must exec natively on x86).
# That blind spot let the arm64 stage-2 self-compile regress past its
# arena limit unnoticed (fixed alongside this lane: MAP_NORESERVE +
# the 16 GiB arm64 arena).

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-e2e-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - name: go test (arm64 e2e)
        # `^TestArm64` covers internal/e2e/arm64_test.go +
        # cross_module_variant_test.go's Arm64 subset + arm64_ssa_test.go
        # (the experimental `-target arm64-ssa` round-trip). Anchored at
        # the top so it doesn't pick up `TestX86_64`-named tests that
        # happen to mention arm64 in subtest names.
        #
        # The arm64-ssa round-trip ran NOWHERE until it learned to exec
        # its binaries natively: it required qemu-aarch64, which this
        # native lane has no reason to install, and no other lane matches
        # the prefix. It silently asserted unmet behaviour for as long as
        # it existed — missing float bit-reinterprets (#5725) and i64[]
        # element corruption (#5729) both slipped past it.
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestArm64' ./internal/e2e/

  # The fifteen cross-compiler-on-host tests — see the header comment. The
  # heavyweight is the native-mmc equivalence gate (the Go arm64 backend's
  # full driver emit + in-process assemble, run under qemu against the x86
  # cross driver); everything else is a light IR-path element test.
  #
  # This comment used to open by naming an arm64 stage-2 fixed point (mmc2
  # recompiling the whole compiler under qemu, "~10-20 min emulated") as the
  # reason for a 55-minute budget. That test (added in #1671) was driven by
  # `asm_arm64_load_run.fern` and went with the AST emitters in #5972; the
  # regex, the weights file and this budget were never updated, so `-run`
  # silently selected nothing for it and the lane spent its life sized 15x
  # its real cost (#6310). Nothing replaced it — the arm64 stage-2 fixpoint
  # is UNCOVERED today, where the x86 side has the per-module gen0==gen1
  # fixpoints as successors. Writing an IR-path replacement is its own
  # piece of work; sizing a lane for a test it does not run is not the way
  # to hold the space open. Measured on runs 31111127744 / 31114366935: the
  # job takes 3m55s / 3m32s end to end, the test step 3m16s / 3m07s.
  cross-host:
    name: test-e2e-arm64-cross-host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - name: install aarch64 cross toolchain + qemu
        uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
      # The x86-driver-emits-arm64 + qemu-aarch64 tests (the native-mmc
      # heavyweight and the lighter IR-path element tests like TupleFnIRArm64
      # / CloArrayFieldCallIRArm64) skip on both the x86 selfhost shards (no
      # aarch64 cross toolchain) and the aarch64 shards (no native-x86
      # driver), so this lane is their only home. Extend the regex when a new
      # such cross-host test lands — `make testnames` fails if a name here
      # matches nothing, which is what stopped two dead entries from riding
      # along unnoticed.
      - name: go test (cross-host arm64)
        run: >-
          gotestsum --format pkgname-and-test-fails -- -timeout 18m
          -run '^(TestSelfHostArm64NativeMmcMatchesCrossHost|TestSelfHostStdTestE2EArm64|TestSelfHostDeriveStdlibIRArm64|TestSelfHostArm64EnvpSaveIR|TestSelfHostArm64UnsignedDivAST|TestSelfHostTupleFnIRArm64|TestSelfHostCloArrayFieldCallIRArm64|TestSelfHostCloArrayFieldBindIRArm64|TestSelfHostTupleFnStructFieldArm64|TestSelfHostReturnClosureElemIRArm64|TestSelfHostReturnClosureContainerIRArm64|TestSelfHostReturnMatchPayloadIRArm64|TestSelfHostReturnLambdaDispatchIRArm64|TestSelfHostReturnClosureNestedIRArm64|TestSelfHostTryOptionPayloadIRArm64)$'
          ./internal/e2eselfhost/
