name: Test e2e arm64

# `TestArm64*` — the arm64-Linux ELF backend's end-to-end suite.
# Runs binaries via the native arm64 runner (no qemu involved).
# Only scheduled on `ubuntu-24.04-arm`; on an x86 host every test
# in this prefix would SKIP because `aarch64-linux-gnu-gcc` +
# `qemu-aarch64` aren't installed, so the x86 lane would just be a
# 30-second no-op.
#
# The legacy combined CI workflow ran this alongside x86 + wasm +
# self-host on a single 10-minute box. Splitting it out lets the
# arm64 lane finish in ~90 seconds and surface as its own status
# check.
#
# The `cross-host` job below covers the OTHER half of the arm64 story:
# the seven cross-compiler-on-host tests (x86 host binary emitting arm64
# asm, the emitted binaries running under qemu-aarch64) that need BOTH a
# native x86 host AND the aarch64 cross toolchain — a combination no
# other lane provides, so before this job they ran NOWHERE: the x86
# self-host shards skip them (no cross tools installed) and the aarch64
# runners skip them (the stage-1 driver must exec natively on x86).
# That blind spot let the arm64 stage-2 self-compile regress past its
# arena limit unnoticed (fixed alongside this lane: MAP_NORESERVE +
# the 16 GiB arm64 arena).

on:
  # Same-repo PRs reach this lane through the CI queue (ci-queue.yml), which
  # dispatches it once the PR is at the front. The `pull_request` trigger is
  # kept for FORK PRs only — a fork's branch can't be dispatched onto a
  # base-repo ref — and the gate job below skips everything else. See
  # docs/CI-QUEUE.md.
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-CI sign-off gate. `gh signoff e2e-arm64` on this commit skips the
  # lane below (see docs/CI-SIGNOFF.md). NOTE: the arm64 suite is the one CI
  # lane the project guidance says NOT to gate on locally (qemu/native arm64 is
  # slow to run on a dev box), so signing this off is discouraged unless you
  # genuinely ran it on arm64 hardware. Fork PRs can't sign off; gate fails open.
  gate:
    # Queue admission: on `pull_request` this lane runs for fork PRs only.
    # Same-repo PRs are dispatched by ci-queue.yml when they reach the front
    # of the queue; skipping the gate skips every job that needs it.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: e2e-arm64
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: test-e2e-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - name: go test (arm64 e2e)
        # `^TestArm64` covers internal/e2e/arm64_test.go +
        # cross_module_variant_test.go's Arm64 subset + arm64_ssa_test.go
        # (the experimental `-target arm64-ssa` round-trip). Anchored at
        # the top so it doesn't pick up `TestX86_64`-named tests that
        # happen to mention arm64 in subtest names.
        #
        # The arm64-ssa round-trip ran NOWHERE until it learned to exec
        # its binaries natively: it required qemu-aarch64, which this
        # native lane has no reason to install, and no other lane matches
        # the prefix. It silently asserted unmet behaviour for as long as
        # it existed — missing float bit-reinterprets (#5725) and i64[]
        # element corruption (#5729) both slipped past it.
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestArm64' ./internal/e2e/

  # The seven cross-compiler-on-host tests — see the header comment. The
  # heavyweights are the arm64 stage-2 fixed point (mmc2, an aarch64
  # binary built from the self-host compiler's own arm64 output,
  # recompiles the whole compiler under qemu — ~10-20 min emulated) and
  # the native-mmc equivalence gate (the Go arm64 backend's full driver
  # emit + in-process assemble, run under qemu against the x86 cross
  # driver), so this lane gets a generous timeout rather than sharding.
  # It shares the e2e-arm64 signoff gate; per docs/CI-SIGNOFF.md that
  # signoff is discouraged unless the arm64 suites genuinely ran.
  cross-host:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: test-e2e-arm64-cross-host
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - name: install aarch64 cross toolchain + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu qemu-user
      # The x86-driver-emits-arm64 + qemu-aarch64 tests (both the stage-2 /
      # native-mmc heavyweights and the lighter IR-path element tests like
      # TupleFnIRArm64 / CloArrayFieldCallIRArm64) skip on both the x86
      # selfhost shards (no aarch64 cross toolchain) and the aarch64 shards
      # (no native-x86 driver), so this lane is their only home. Extend the
      # regex when a new such cross-host test lands.
      - name: go test (cross-host arm64)
        run: >-
          gotestsum --format pkgname-and-test-fails -- -timeout 50m
          -run '^(TestSelfHostStage2FixedPointArm64|TestSelfHostArm64NativeMmcMatchesCrossHost|TestSelfHostStdTestE2EArm64|TestSelfHostDeriveStdlibIRArm64|TestSelfHostArm64StrForeachAST|TestSelfHostArm64EnvpSaveIR|TestSelfHostArm64UnsignedDivAST|TestSelfHostTupleFnIRArm64|TestSelfHostCloArrayFieldCallIRArm64|TestSelfHostCloArrayFieldBindIRArm64|TestSelfHostTupleFnStructFieldArm64|TestSelfHostReturnClosureElemIRArm64|TestSelfHostReturnClosureContainerIRArm64|TestSelfHostReturnMatchPayloadIRArm64|TestSelfHostReturnLambdaDispatchIRArm64|TestSelfHostReturnClosureNestedIRArm64|TestSelfHostTryOptionPayloadIRArm64)$'
          ./internal/e2eselfhost/
