name: Test e2e arm64

# `TestArm64*` — the arm64-Linux ELF backend's end-to-end suite.
# Runs binaries via the native arm64 runner (no qemu involved).
# Only scheduled on `ubuntu-24.04-arm`; on an x86 host every test
# in this prefix would SKIP because `aarch64-linux-gnu-gcc` +
# `qemu-aarch64` aren't installed, so the x86 lane would just be a
# 30-second no-op.
#
# Two isolated test processes share the existing runner's CPU budget.
# Process isolation is required because some tests mutate compiler globals.
# Measurement and coverage checks: docs/CI-NATIVE-TEST-WORKERS.md.
#
# The `cross-host` job below covers what needs BOTH a native x86 host AND the
# aarch64 cross toolchain on one machine.
#
# It used to also run the fifteen cross-compiler-on-host self-host tests, from
# a time when the x86 self-host shards installed no cross tools. They do now
# ("aarch64 cross toolchain (x86 shards — arm64 cross-emit tests)"), so the
# shards partition those names and run them, and this lane was running them a
# second time for ~272 s per push (#8184). The shards are their only home now,
# and FERN_REQUIRE_ARM64_TOOLING=1 there turns a failed toolchain install into
# a failure rather than the fifteen silent skips that let the arm64 stage-2
# self-compile regress past its arena limit unnoticed.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

env:
  # gotestsum reads this as --jsonfile: the event stream the
  # failure-annotation step names the failed tests from.
  GOTESTSUM_JSONFILE: /tmp/gotestsum.jsonl

jobs:
  # THREE SHARDS, then a leaf named `test-e2e-arm64`. The leaf carries the
  # name because `Full suite / Test e2e arm64 / test-e2e-arm64` is a required
  # status check in the main ruleset, and the one the repository merges on:
  # one job of ~690 tests took 8-9 minutes in two worker processes, so the
  # merge gate was that job. Three shards of equal count (scripts/shard-tests,
  # no weights file: a name with no entry weighs 1) are each ~3 minutes, and
  # the leaf is seconds, so the gate is the slowest shard plus the leaf's
  # queue wait. The leaf fails unless every shard succeeded, a vanished
  # runner included.
  shards:
    name: test-e2e-arm64-shard${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nshard: 3, shard: 0 }
          - { nshard: 3, shard: 1 }
          - { nshard: 3, shard: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/selfhost-driver-cache
      - name: build native test runners
        run: |
          go test -c -o "$RUNNER_TEMP/e2e-arm64.test" ./internal/e2e/
          go build -o "$RUNNER_TEMP/ci-test-workers" ./cmd/ci-test-workers
      - name: go test (arm64 e2e, shard ${{ matrix.shard }}/${{ matrix.nshard }}, two workers)
        id: tests
        env:
          FERN_REQUIRE_ARM64_SSA_DIFF: "1"
        run: |
          set -euo pipefail
          mapfile -t MINE < <(
            go test -list '^TestArm64' ./internal/e2e/ |
              grep -E '^Test' |
              sort |
              scripts/shard-tests "${{ matrix.shard }}" "${{ matrix.nshard }}" /dev/null
          )
          if [ ${#MINE[@]} -eq 0 ]; then
            echo "no tests for shard ${{ matrix.shard }}/${{ matrix.nshard }} — the list or the filter is wrong" >&2
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ matrix.nshard }}: ${#MINE[@]} tests"
          PAT="^($(IFS='|'; echo "${MINE[*]}"))\$"
          cd internal/e2e
          "$RUNNER_TEMP/ci-test-workers" \
            -binary "$RUNNER_TEMP/e2e-arm64.test" \
            -output "$RUNNER_TEMP/arm64-test-results" \
            -workers 2 -timeout 10m -run "$PAT"
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$RUNNER_TEMP"/arm64-test-results/worker-*.jsonl
      - name: retain native test outcomes
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: native-arm64-test-outcomes-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm64-test-results
          retention-days: 7
          if-no-files-found: error

  test:
    name: test-e2e-arm64
    needs: shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard succeeded
        env:
          RESULT: ${{ needs.shards.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::the arm64 e2e shards concluded '$RESULT'; see the shard jobs"
            exit 1
          fi
          echo "all shards succeeded"

  cross-host:
    name: test-e2e-arm64-cross-host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/selfhost-driver-cache
      - name: install aarch64 cross toolchain + qemu
        uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
      # internal/e2e tests that compare the two REGISTER backends against each
      # other, so they need both toolchains on one host — the same reason this
      # job exists. TestF64TranscendentalBackendsAgree had never compared
      # anything: the catch-all `test-e2e-other` lane owns its name, and each of
      # that lane's two arches is missing one of the two toolchains (#6849).
      #
      # FERN_REQUIRE_CROSS_BACKENDS makes a missing toolchain FAIL here rather
      # than skip, so this job quietly losing a cross-compiler cannot put the
      # comparison back to running nowhere.
      # standard-verbose and -count=1 are load-bearing, not taste. The default
      # format prints one `✓ internal/e2e` line whether the test compared two
      # backends or skipped in 64 ms, and a cached PASS would replay without
      # running the binary at all — so the lane could not report the very thing
      # it exists to establish.
      - name: go test (cross-host backend agreement)
        env:
          FERN_REQUIRE_CROSS_BACKENDS: "1"
        run: >-
          gotestsum --format standard-verbose -- -timeout 10m -count=1
          -run '^TestF64TranscendentalBackendsAgree$'
          ./internal/e2e/
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$GOTESTSUM_JSONFILE"
