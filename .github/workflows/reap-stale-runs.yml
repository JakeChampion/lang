name: Reap stale runs
# The quiet-hours floor for the stale-run sweep (.github/actions/reap-stale-runs).
# The sweep runs on repository events, which fire reliably and at the moments
# runs go stale: main-housekeeping.yml runs it on every push to main and
# cancel-on-merge.yml on every closed pull request. GitHub's scheduler is
# best-effort and sheds scheduled runs under load, so a cron alone never
# carried it: on the day it landed the cron did not fire for 69 minutes. The
# cron stays for the hours when nothing merges and a pull request closed days
# ago still has runs queued.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

# No concurrency group: `cancel-in-progress: false` protects a run holding a
# runner, and GitHub replaces a pending run with the newest in its group, so on
# a deep queue a grouped sweep is cancelled before it starts.

jobs:
  reap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/reap-stale-runs
