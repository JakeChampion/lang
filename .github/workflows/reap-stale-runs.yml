name: Reap stale runs

# A scheduled sweep for queued runs nobody is waiting on: a pull request's runs
# after it closed, and runs at a SHA a later push superseded.
#
# cancel-on-merge.yml already reaps the first class the moment a PR closes, and
# every lane's own `concurrency` group reaps the second the moment a push lands.
# This exists because BOTH mechanisms need a runner to act, and the queue they
# drain is what they are queued behind. On 2026-09-05 five consecutive
# cancel-on-merge runs sat pending or queued at once, one of them for twenty
# minutes before it was itself cancelled — while 77 runs for already-merged pull
# requests held slots ahead of every open PR. A hand sweep cleared 111 runs, 42%
# of everything queued.
#
# So this is a backstop, not a replacement: the event-driven reapers still act in
# seconds whenever the pool is free, and this catches what they could not reach.
# It is cheap and idempotent — one API listing and a cancel per victim — so a run
# that finds nothing costs one slot for well under a minute.
#
# What it will NOT touch, because each is someone's live signal:
#   - anything but a `pull_request` run. A push, a release, a dispatch or a
#     scheduled run exists for a reason that has nothing to do with a PR, and a
#     main run in particular has no successor to inherit its result.
#   - a run at the current head of an OPEN pull request, draft ones included.
#     Branches get reused by successive PRs here, so this is checked per SHA and
#     never per branch.
#   - a run that has already reached a terminal state (409 from the API), which
#     is routine rather than a failure.

# TRIGGERED BY REPOSITORY ACTIVITY, NOT BY THE CLOCK. This shipped on a
# `*/20` cron alone and the cron never fired: 69 minutes and three slots after
# it merged, the only run it had ever had was a manual dispatch. GitHub's
# scheduler is explicitly best-effort and sheds scheduled runs under load —
# which is the same load this sweep exists to relieve, so the one condition
# that makes it necessary is the condition that stops it starting.
#
# A merge into main and a closed pull request are precisely the two moments
# runs go stale, they fire reliably because they are repository events rather
# than a scheduler's promise, and here they come every few minutes. The
# concurrency group bounds the cost: one sweep runs, one waits, and a burst of
# merges collapses into that pair rather than a job apiece.
#
# The cron stays as a floor for the quiet hours, when nothing merges for a
# while and a PR closed days ago still has runs queued. It is the fallback now,
# not the mechanism.
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

# NO CONCURRENCY GROUP, deliberately — and this is the third time today that
# the same mechanism has bitten. `cancel-in-progress: false` protects the run
# holding a RUNNER; a run still waiting for one counts as pending, and GitHub
# keeps only the newest pending run per group. On a queue this deep nothing
# reaches a runner before the next merge arrives, so a group does not bound the
# cost — it guarantees the sweep never finishes. Runs 3 through 8 were each
# cancelled within seconds of the next trigger, having done nothing.
#
# The sweep is ~20 seconds of API calls, so it can afford a slot per merge the
# way check-sources.yml can: "one ~1-minute job can afford a slot per merge".
# Two sweeps overlapping is harmless — they list the open pull requests before
# the runs, and a cancel the other already made returns 409, which is handled.

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            // The open pull requests FIRST, so every run judged against them was
            // listed afterwards. In the other order a PR opened mid-job has runs
            // that match no open head and get reaped — the same ordering trap
            // cancel-on-merge.yml documents.
            const open = new Map(); // branch -> Set of live head SHAs
            for (const pr of await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            })) {
              const ref = pr.head?.ref;
              if (!ref) continue;
              if (!open.has(ref)) open.set(ref, new Set());
              open.get(ref).add(pr.head.sha);
            }
            core.info(`${open.size} branch(es) with an open pull request`);

            const self = String(context.runId);
            const candidates = new Map();
            for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
              for (const run of await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status, event: "pull_request", per_page: 100 },
              )) {
                if (String(run.id) === self) continue;
                candidates.set(run.id, run);
              }
            }
            core.info(`${candidates.size} pull_request run(s) not yet finished`);

            const doomed = [];
            for (const run of candidates.values()) {
              const live = open.get(run.head_branch);
              if (!live) {
                doomed.push([run, "its pull request is closed"]);
              } else if (!live.has(run.head_sha)) {
                doomed.push([run, "superseded by a later push"]);
              }
            }

            let cancelled = 0;
            let denied = false;
            const reaped = [];
            for (const [run, why] of doomed) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled++;
                reaped.push(`${run.name} on \`${run.head_branch}\` @ ${run.head_sha.slice(0, 8)} — ${why}`);
              } catch (e) {
                // 409: reached a terminal state between the listing and the
                // cancel. Routine, and the commonest outcome on a busy queue.
                if (e.status === 409) continue;
                if (e.status === 403) denied = true;
                core.warning(`could not cancel ${run.id}: ${e.message}`);
              }
            }

            core.notice(
              `reaped ${cancelled} of ${candidates.size} unfinished pull_request run(s)`,
            );
            const summary = core.summary.addHeading("Reap stale runs", 3);
            if (reaped.length) {
              summary.addRaw(`Cancelled ${cancelled} run(s) nobody was waiting on:\n`).addList(reaped);
            } else {
              summary.addRaw(
                `Nothing to reap: all ${candidates.size} unfinished run(s) belong to the ` +
                `current head of an open pull request.\n`,
              );
            }
            await summary.write();

            if (denied) {
              core.setFailed("the token may not cancel runs — nothing was reaped");
            }
