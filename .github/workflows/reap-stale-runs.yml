name: Reap stale runs

# The sweep for queued runs nobody is waiting on: a pull request's runs after
# it closed, and runs at a SHA a later push superseded.
#
# Both classes have an event-driven reaper that acts first. cancel-on-merge.yml
# reaps the first the moment a PR closes. The second is cancelled server-side
# by ci.yml's per-pull-request concurrency group the moment the newer push
# lands, with no runner involved; the suite's own `queue: max` groups cannot
# do that (GitHub allows nothing but `cancel-in-progress: false` beside
# `queue: max`), which is why that group sits on ci.yml and not on
# ci-suite.yml. Every mechanism HERE needs a runner to act, and the
# queue it drains is what it is queued behind. On 2026-09-05 five consecutive
# cancel-on-merge runs sat pending or queued at once, one of them for twenty
# minutes before it was itself cancelled — while 77 runs for already-merged pull
# requests held slots ahead of every open PR. A hand sweep cleared 111 runs, 42%
# of everything queued.
#
# So this is a backstop, not a replacement: the event-driven reapers still act in
# seconds whenever the pool is free, and this catches what they could not reach.
# It is cheap and idempotent — one API listing and a cancel per victim — so a run
# that finds nothing costs one slot for well under a minute.
#
# What it will NOT touch, because each is someone's live signal:
#   - anything but a `pull_request` run. A push, a release, a dispatch or a
#     scheduled run exists for a reason that has nothing to do with a PR, and a
#     main run in particular has no successor to inherit its result.
#   - a run at the current head of an OPEN pull request, draft ones included.
#     Branches get reused by successive PRs here, so this is checked per SHA and
#     never per branch.
#   - a run that has already reached a terminal state (409 from the API), which
#     is routine rather than a failure.

# TRIGGERED BY REPOSITORY ACTIVITY, NOT BY THE CLOCK. This shipped on a
# `*/20` cron alone and the cron never fired: 69 minutes and three slots after
# it merged, the only run it had ever had was a manual dispatch. GitHub's
# scheduler is explicitly best-effort and sheds scheduled runs under load —
# which is the same load this sweep exists to relieve, so the one condition
# that makes it necessary is the condition that stops it starting.
#
# A merge into main and a closed pull request are precisely the moments runs
# go stale, they fire reliably because they are repository events rather than
# a scheduler's promise, and here they come every few minutes.
#
# The cron stays as a floor for the quiet hours, when nothing merges for a
# while and a PR closed days ago still has runs queued. It is the fallback now,
# not the mechanism.
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

# NO CONCURRENCY GROUP, deliberately — and this is the third time today that
# the same mechanism has bitten. `cancel-in-progress: false` protects the run
# holding a RUNNER; a run still waiting for one counts as pending, and GitHub
# keeps only the newest pending run per group. On a queue this deep nothing
# reaches a runner before the next merge arrives, so a group does not bound the
# cost — it guarantees the sweep never finishes. Runs 3 through 8 were each
# cancelled within seconds of the next trigger, having done nothing.
#
# The sweep is ~20 seconds of API calls, so it can afford a slot per merge the
# way check-sources.yml can: "one ~1-minute job can afford a slot per merge".
# Two sweeps overlapping is harmless — they list the open pull requests before
# the runs, and a cancel the other already made returns 409, which is handled.

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            // branch -> Set of live head SHAs, taken once BEFORE the runs are
            // listed and merged with a second snapshot taken AFTER. A run is
            // spared if its SHA is live in either. The first snapshot alone
            // loses a push that lands mid-job: its fresh run is already listed
            // while the PR still reads at its old head, so the live run looks
            // superseded and gets reaped — and with ci.yml queueing pull
            // requests two at a time, a reaped live run is a whole CI round
            // lost. The
            // snapshot after the listing sees every head a listed run can
            // have been created for. cancel-on-merge.yml documents the same
            // trap from the other side.
            const open = new Map();
            const snapshot = async () => {
              for (const pr of await github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100,
              })) {
                const ref = pr.head?.ref;
                if (!ref) continue;
                if (!open.has(ref)) open.set(ref, new Set());
                open.get(ref).add(pr.head.sha);
              }
            };
            await snapshot();
            core.info(`${open.size} branch(es) with an open pull request`);

            const self = String(context.runId);
            const candidates = new Map();
            for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
              for (const run of await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status, event: "pull_request", per_page: 100 },
              )) {
                if (String(run.id) === self) continue;
                candidates.set(run.id, run);
              }
            }
            core.info(`${candidates.size} pull_request run(s) not yet finished`);
            await snapshot();

            // A CI run at the merged head of a pull request whose merge pushed
            // that exact tree, with its suite under way, is the run the main
            // validation is waiting for (ci.yml's lane selector adopts it
            // instead of re-running its lanes). Spared for 45 minutes after
            // the merge, which outlasts that wait; cancel-on-merge.yml spares
            // the same run on the close event.
            const treeOf = async (sha) =>
              (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data.tree.sha;
            const adoptedByMain = async (run) => {
              if (run.path !== ".github/workflows/ci.yml") return "";
              const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              })).data.filter((p) => p.merged_at && p.base.ref === "main" && p.merge_commit_sha && p.head.sha === run.head_sha);
              for (const p of prs) {
                const age = Math.round((Date.now() - Date.parse(p.merged_at)) / 60000);
                if (age > 45) continue;
                if ((await treeOf(p.merge_commit_sha)) !== (await treeOf(run.head_sha))) continue;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, filter: "latest", per_page: 100,
                });
                if (jobs.some((j) => j.name.startsWith("Full suite / "))) {
                  return `#${p.number} merged this exact tree ${age} min ago and the main validation adopts the run`;
                }
              }
              return "";
            };
            const doomed = [];
            for (const run of candidates.values()) {
              const live = open.get(run.head_branch);
              let why = "";
              if (!live) {
                why = "its pull request is closed";
              } else if (!live.has(run.head_sha)) {
                why = "superseded by a later push";
              }
              if (!why) continue;
              let adopted = "";
              try {
                adopted = await adoptedByMain(run);
              } catch (e) {
                core.warning(`could not tell whether run ${run.id} is main's evidence: ${e.message}`);
              }
              if (adopted) {
                core.info(`keeping ${run.name} @ ${run.head_sha.slice(0, 8)}: ${adopted}`);
                continue;
              }
              doomed.push([run, why]);
            }
            // Pullfrog reviews waiting on a pull request that has since closed.
            // They are dispatched on main and named for the PR, so the
            // pull_request listing above never sees them. A review that starts
            // after its PR closed is read by nobody.
            try {
              const state = new Map();
              for (const status of ["requested", "waiting", "pending", "queued", "in_progress"]) {
                for (const run of await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: "pullfrog.yml", status, per_page: 100,
                })) {
                  const m = /#(\d+)/.exec(run.display_title || "");
                  if (!m) continue;
                  if (!state.has(m[1])) {
                    const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(m[1]) });
                    state.set(m[1], pr.state);
                  }
                  if (state.get(m[1]) === "closed") doomed.push([run, `pull request #${m[1]} is closed`]);
                }
              }
            } catch (e) {
              core.warning(`could not sweep the Pullfrog reviews: ${e.message}`);
            }

            let cancelled = 0;
            let denied = false;
            const reaped = [];
            for (const [run, why] of doomed) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled++;
                reaped.push(`${run.name} on \`${run.head_branch}\` @ ${run.head_sha.slice(0, 8)} — ${why}`);
              } catch (e) {
                // 409: reached a terminal state between the listing and the
                // cancel. Routine, and the commonest outcome on a busy queue.
                if (e.status === 409) continue;
                if (e.status === 403) denied = true;
                core.warning(`could not cancel ${run.id}: ${e.message}`);
              }
            }

            core.notice(
              `reaped ${cancelled} of ${doomed.length} doomed run(s) among ${candidates.size} unfinished pull_request run(s) and the Pullfrog queue`,
            );
            const summary = core.summary.addHeading("Reap stale runs", 3);
            if (reaped.length) {
              summary.addRaw(`Cancelled ${cancelled} run(s) nobody was waiting on:\n`).addList(reaped);
            } else {
              summary.addRaw(
                `Nothing to reap: all ${candidates.size} unfinished run(s) belong to the ` +
                `current head of an open pull request.\n`,
              );
            }
            await summary.write();

            if (denied) {
              core.setFailed("the token may not cancel runs — nothing was reaped");
            }
