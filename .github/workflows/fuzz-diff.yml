name: Fuzz

# Pairs the fernsmith generator with the diff oracle. Each emitted
# program is run through the interp + every backend available on
# the runner; we assert byte-for-byte output agreement. Caught a
# checker bug in #601 and the monomorph walker gaps that landed in
# #614 / #618.
#
# Needs wasmtime because the diff oracle considers the wasm
# backend as one of the comparison targets. 60-second budget per
# arch.

# BOTH FUZZ TARGETS, ONE LANE. This was two workflows; the parse round-trip had
# its own, for 60 seconds of fuzzing behind a checkout, a toolchain install and a
# wait for a runner. lint.yml measured that shape at 165 job-minutes of queue for
# ~5 minutes of work (run 31819147972), and the rule it drew — fewer, fuller jobs
# beat more, emptier ones whenever the pool is the constraint — applies here
# unchanged.
#
# The two targets keep their arch split, which is the reason they were separate
# and is now expressed as a step condition rather than a workflow:
#
#   FuzzGenerate_ExecutionAgrees runs the compiled binaries NATIVELY, so the host
#   is part of what is under test — both legs, as before.
#
#   FuzzGenerate_ParseRoundTrips generates a program and runs it through modload
#   + parser + checker (fernsmith's GenBytes then checkGenerated). No backend, no
#   codegen, nothing that reads the host. A second leg would re-run an
#   arch-independent property for a second runner slot, so it stays x86 only.
#
# Depth for both comes from nightly-fuzz.yml, which runs these same targets on a
# much longer budget against a persisted corpus. This lane is a smoke test: the
# 60-second budget is short enough to fit per-PR latency and long enough to get
# past the first few thousand inputs. The parse target caught bugs in #588 and
# #614 that the seed-based sweeps in `go test` did not surface.

on:
  pull_request:
    # DOC-ONLY CHANGES DO NOT NEED THE COMPILER SUITE. This project opens a PR
    # for every push including doc fixes and comment corrections, and each one
    # was launching ~85 jobs into a queue that is the binding constraint on
    # every other PR in flight.
    #
    # Deliberately narrow. `*.md` does not cross a `/` in a GitHub path filter,
    # so it is root-level prose only (README, CLAUDE.md) and the literate
    # sources under examples/literate/*.fern.md — which ARE compiled — still
    # trigger everything. docs/ holds no .fern.md and no test fixture; the two
    # e2e tests that name a docs/ path only cite it in a comment or a failure
    # message.
    #
    # lint.yml deliberately has NO filter, so a doc-only PR still runs one real
    # gate rather than reporting no checks at all.
    #
    # The identical block on every lane is pinned by
    # TestPRWorkflowsShareOneDocOnlyFilter (internal/sourcelint).
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # Also on main: a rebase-merge replays commits onto a main their PR's CI never
  # saw, so a coupling between two individually-green PRs exists only in the
  # merge. Filter mirrors the pull_request one; pinned by TestGateLanesRunOnMain.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
#
# main is the one ref that never cancels: its run finishes and reports
# even when the next merge lands mid-run. It gets ONE group, not one per
# SHA. A SHA-keyed group supersedes nothing, so a burst of back-to-back
# rebase-merges held an uncancellable run each — six of them stacked ~90
# runs into the queue every open PR was waiting behind (#8124). With one
# group GitHub keeps at most one main run executing and one pending,
# cancelling the older pending, so a burst coalesces to its newest
# commit. The cost is attribution: a red main names a span of merges
# rather than one. check-sources.yml keeps the per-merge attribution —
# one ~1-minute job can afford a slot per merge; this lane cannot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: fuzz-diff-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - name: fuzz differential execution (both arches)
        if: ${{ !cancelled() }}
        run: gotestsum --format testname -- -fuzz=FuzzGenerate_ExecutionAgrees -fuzztime=60s -run=^$ ./internal/e2e

      - name: fuzz parse round-trip (arch-independent, x86 only)
        if: ${{ !cancelled() && matrix.host == 'x86_64' }}
        run: gotestsum --format testname -- -fuzz=FuzzGenerate_ParseRoundTrips -fuzztime=60s -run=^$ ./internal/fernsmith
