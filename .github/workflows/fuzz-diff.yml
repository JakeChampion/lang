name: Fuzz differential execution

# Pairs the fernsmith generator with the diff oracle. Each emitted
# program is run through the interp + every backend available on
# the runner; we assert byte-for-byte output agreement. Caught a
# checker bug in #601 and the monomorph walker gaps that landed in
# #614 / #618.
#
# Needs wasmtime because the diff oracle considers the wasm
# backend as one of the comparison targets. 60-second budget per
# arch.

on:
  # Same-repo PRs reach this lane through the CI queue (ci-queue.yml), which
  # dispatches it once the PR is at the front. The `pull_request` trigger is
  # kept for FORK PRs only — a fork's branch can't be dispatched onto a
  # base-repo ref — and the gate job below skips everything else. See
  # docs/CI-QUEUE.md.
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-CI sign-off gate. `gh signoff fuzz-diff` on this commit skips the
  # lane below (see docs/CI-SIGNOFF.md). Fork PRs can't sign off; gate fails
  # open on any error.
  gate:
    # Queue admission: on `pull_request` this lane runs for fork PRs only.
    # Same-repo PRs are dispatched by ci-queue.yml when they reach the front
    # of the queue; skipping the gate skips every job that needs it.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: fuzz-diff
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  fuzz:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: fuzz-diff-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
          gotestsum: "true"
      - run: gotestsum --format testname -- -fuzz=FuzzGenerate_ExecutionAgrees -fuzztime=60s -run=^$ ./internal/e2e
