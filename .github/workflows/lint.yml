name: Lint

# Every cheap whole-repo gate, in ONE job.
#
# These were eight separate jobs. Each did well under a minute of work, and
# together they did ~5 minutes — but they spent 165 job-minutes in the queue to
# do it (measured on run 31819147972: `deadcode` was queued at +0.1 min and
# started at +24.2 to run for 48 s). A GitHub-hosted runner pool is shared
# across every SHA in flight, so eight slots held for a minute each are eight
# slots the self-host lane could not have, and that lane's 54-second `build`
# job gates 48 downstream jobs. Fewer, fuller jobs beat more, emptier ones
# whenever the pool is the constraint.
#
# Each step carries `if: ${{ !cancelled() }}` so a failure in one still reports
# the rest: collapsing the jobs must not cost the "which gates are red" signal
# that eight separate check runs gave for free.
#
# The gates, in order:
#
#   build      — `go build ./...` so a compile-only failure surfaces here,
#                not buried under a test failure.
#   vet        — `go vet ./...` against the whole module.
#   gofmt      — `make gofmt-check`. Nothing gated Go formatting before, so 21
#                files across internal/ and cmd/ had drifted.
#   fmt-check  — `make fmt-check` (== `fern -fmt -d` on every examples/*.fern).
#                Fern sources only.
#   deadcode   — `make deadcode`: fails on any unreachable function not in
#                tools/deadcode-allowlist.txt. A whole-program SSA reachability
#                analysis, so it is the slowest of these by some way.
#   actionlint — `make actionlint`: lints .github/workflows/*.yml and the
#                composite actions, plus shellcheck over `run:` blocks. These
#                files gated everything else in the repo while nothing gated
#                them, so a bad `runs-on` or an expression naming a context the
#                trigger does not provide only showed up as a red run.
#   testnames  — `make testnames`: every `Test…` name in .github/ must be a test
#                function or a prefix of one. `go test -run` exits 0 for a name
#                that matches nothing, so the arm64 cross-host lane ran 15 of
#                the 17 tests it listed — including the one its 55-minute budget
#                was sized for — and reported green the whole time (#6310).
#   freeze     — `make freeze`: reports the live state of the native-convergence
#                freeze preconditions, derived from the tree. Fails only when
#                ground is LOST (an AST emitter returns, a backend loses
#                IR-or-error routing, the checker-codes filter comes back).
#
# x86 only: these are arch-agnostic, so a second arch would double minutes for
# no extra signal.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern

      - name: go build ./...
        if: ${{ !cancelled() }}
        run: go build ./...

      - name: go vet ./...
        if: ${{ !cancelled() }}
        run: go vet ./...

      - name: gofmt
        if: ${{ !cancelled() }}
        run: make gofmt-check

      - name: fern -fmt
        if: ${{ !cancelled() }}
        run: make fmt-check

      - name: deadcode
        if: ${{ !cancelled() }}
        run: make deadcode

      - name: actionlint
        if: ${{ !cancelled() }}
        run: make actionlint

      - name: testnames
        if: ${{ !cancelled() }}
        run: make testnames

      - name: freeze preconditions
        if: ${{ !cancelled() }}
        run: make freeze
