name: Lint

# Independent fast jobs that catch the most common breakages before
# any heavy test workflow even finishes setup:
#
#   vet        — `go vet ./...` against the whole module.
#   build      — `go build ./...` so a compile-only failure
#                surfaces here, not buried under a test failure.
#   fmt-check  — `make fmt-check` (== `fern -fmt -d` on every
#                examples/*.fern). Fern sources only.
#   gofmt      — `make gofmt-check`: the Go-side counterpart. Nothing
#                gated Go formatting before, so 21 files across
#                internal/ and cmd/ had drifted (trailing-comment and
#                map-literal alignment goes stale when a longer entry
#                lands beside an existing one).
#   deadcode   — `make deadcode`: fails on any unreachable function
#                not in tools/deadcode-allowlist.txt.
#   actionlint — `make actionlint`: lints .github/workflows/*.yml and the
#                composite actions. These files gated everything else in
#                the repo while nothing gated them, so a bad `runs-on`, an
#                expression naming a context the trigger doesn't provide,
#                or a `permissions:` block missing a scope the job calls
#                only showed up as a red run — or as a job doing the wrong
#                thing quietly. Also runs shellcheck over `run:` blocks
#                (preinstalled on the ubuntu runners).
#   freeze     — `make freeze`: reports the live state of the native-
#                convergence freeze preconditions, derived from the tree.
#                Fails only when ground is LOST (an AST emitter returns, a
#                backend loses IR-or-error routing, the checker-codes filter
#                comes back). It runs here rather than nowhere because the
#                preconditions previously lived only as prose on #4451, and
#                an audit found every stale claim pointing the same way —
#                more pessimistic than the code. Prose does not re-check
#                itself; this does, on every push.
#
# vet/build/fmt are cheap (sub-30s on warm cache); deadcode runs a
# whole-program SSA reachability analysis so it's a touch slower but
# still well under the heavy test workflows. All run on x86 only —
# covering both arches would double minutes for ~0 extra signal since
# they're arch-agnostic.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: go vet ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: go build ./...

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: make fmt-check

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: make gofmt-check

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: make deadcode

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: make actionlint

  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - run: make freeze
