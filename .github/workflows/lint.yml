name: Lint

# Cheap repository checks always run. The dependency plan selects source,
# compiler, and generator checks. Manual runs use the complete set.
on:
  workflow_call:
    inputs:
      selection:
        description: Dependency plan for expensive lint checks
        required: false
        type: string
        default: '{"full":true}'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          compiler-cache: ${{ fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.fern || fromJSON(inputs.selection).lint.compiler || fromJSON(inputs.selection).lint.cache }}

      - name: Install uv for generated-source checks
        if: ${{ fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.generators }}
        uses: astral-sh/setup-uv@v7

      - name: Check repository rules and CI
        if: ${{ !cancelled() }}
        run: |
          make ci-selftest
          make -j"$(nproc)" -k actionlint testnames gofmt-check
      - name: Check Go sources
        if: ${{ !cancelled() && (fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.go) }}
        run: make -j"$(nproc)" -k vet deadcode
      - name: Check Fern format
        if: ${{ !cancelled() && (fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.fern) }}
        env:
          FERN_CI_SELECTION: ${{ inputs.selection || '{"full":true}' }}
        run: node scripts/ci-format.mjs
      - name: Check compiler sources
        if: ${{ !cancelled() && (fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.compiler) }}
        run: make check-sources
      - name: Check generated sources
        if: ${{ !cancelled() && (fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.generators) }}
        run: make -j"$(nproc)" -k digest-check log-table-check huffman-table-check net-bench-rows-check deflate-bench-rows-check perf-history-check walkie-emulator-check native-emulator-check runtime-bundle-check
      # TestEveryExampleChecks checks each program file alone, but only in the
      # full suite. This checks the files that the change touches.
      - name: fern -check changed programs
        if: ${{ !cancelled() && (github.event.pull_request.base.sha || github.event.before) }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-changed-programs "$BASE"
      - name: fern test cache
        if: ${{ !cancelled() && (fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.cache) }}
        run: make fern-test-cache

      - name: freeze preconditions
        if: ${{ !cancelled() && (fromJSON(inputs.selection || '{"full":true}').full || fromJSON(inputs.selection).lint.compiler) }}
        run: make freeze
