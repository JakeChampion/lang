name: Test e2e self-host

# `TestSelfHost*` — the self-hosting pipeline suite under
# internal/e2e/self_host_*.go. Covers the bootstrap chain
# (lexer → parser → checker → constfold → printer → disasm → asm →
# VM → cross-validation → self-compile). Each test runs the
# current `lang` binary against the in-tree self-host sources and
# diffs the output against the reference.
#
# Matrix per arch because individual tests are split per backend
# (TestSelfHostAsmX86_64, TestSelfHostAsmArm64, etc.) — running on
# both runners means each backend-specific test exercises its
# native toolchain rather than skipping for lack of qemu /
# cross-gcc.
#
# SHARDED by test name. There are ~350 TestSelfHost* functions and
# many build a full self-host driver (compiling the ~35k-line
# self-host compiler through the production backend, then linking),
# so the unsharded job was the CI long pole (~9.5 min on x86, where
# the arm64-backed tests additionally run under qemu). Each shard
# claims `index % N == shard` over the sorted `go test -list` output,
# so the set splits ~evenly and new tests are picked up
# automatically. Crossed with the per-arch matrix this gives 2×N
# parallel jobs, each ~1 min, vs the previous single ~9.5 min job.
# `go test -list` builds the test binary once; the gotestsum run
# reuses that cached build.

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: ubuntu-latest,    name: x86_64  }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
        # Eight shards keeps the slowest shard (~1 min) well under the
        # other e2e workflows. Bump N (here and in NSHARD below) if the
        # suite grows enough to push a shard past ~90s.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: test-e2e-selfhost-${{ matrix.host.name }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - name: go test (self-host shard ${{ matrix.shard }}/8)
        env:
          SHARD: "${{ matrix.shard }}"
          NSHARD: "8"
        run: |
          set -euo pipefail
          # Sorted list of every TestSelfHost* function, partitioned
          # round-robin by list index so each shard runs a disjoint
          # ~1/N slice. Sorting makes the partition deterministic.
          mapfile -t ALL < <(go test ./internal/e2e/ -list '^TestSelfHost' | grep '^TestSelfHost' | sort)
          SEL=()
          for i in "${!ALL[@]}"; do
            if [ $(( i % NSHARD )) -eq "$SHARD" ]; then SEL+=("${ALL[$i]}"); fi
          done
          if [ ${#SEL[@]} -eq 0 ]; then
            echo "no TestSelfHost tests for shard $SHARD/$NSHARD"; exit 0
          fi
          # Anchored alternation: ^(A|B|C)$ matches each top-level test
          # exactly (and runs all of its subtests).
          PAT="^($(IFS='|'; echo "${SEL[*]}"))\$"
          echo "shard $SHARD/$NSHARD: ${#SEL[@]} tests"
          gotestsum --format pkgname-and-test-fails -- -run "$PAT" ./internal/e2e/
