name: Test e2e self-host

# `TestSelfHost*` — the self-hosting pipeline suite, the Go package
# `internal/e2eselfhost` (shared harness in internal/e2eharness). Each test
# runs the current `fern` binary against the in-tree self-host sources and
# diffs the output against the reference.
#
# RESIDUAL TESTS: ~30 TestSelfHost* functions still live in internal/e2e —
# files that pair a TestSelfHost* leg with its TestNative* oracle sibling
# sharing one fixture table. The shard jobs compile BOTH test binaries and
# partition the UNION of both lists, running each test against the binary it
# lives in, so the residuals keep exactly their old coverage.
#
# EVERY JOB IS INDEPENDENT: no job waits on another except the leaf `verify`.
# A `needs:` edge means the dependent jobs are not created, let alone queued,
# until the prerequisite finishes, and under the account-wide concurrent-job
# ceiling that prerequisite waits in the queue behind every other job the run
# created. The lane used to warm the self-host drivers in three `warm` jobs the
# shards depended on; measured on runs 35708985176 and 35708878302, those jobs
# sat 8-14 minutes in the queue to do 45 seconds of work, so the shards were not
# even created until minute 17 of a 35-minute run. A driver now builds in ~9 s
# (fern.fern, the whole compiler, in ~19 s), so every job builds what it needs
# on its own runner: the closure-keyed disk cache (hashSelfHostSources) still
# builds each driver at most once per job, and the two worker processes of a
# shard share it through the atomic publish.
#
# TWO WORKERS PER SHARD. Each x86 shard runs its selection as two isolated
# processes through cmd/ci-test-workers (docs/CI-X86-WORKERS.md), each with
# half the runner's CPUs, assigned by the same duration-weighted LPT partition
# that cut the shards. Process isolation is what the package needs — several
# tests mutate compiler globals, so `t.Parallel` is not an option — and the
# runner has four cores a single serial test process leaves mostly idle. Each
# worker streams its RUN/PASS/FAIL lines (`-format standard-verbose`), so the
# log of a runner that vanished mid-run still names the test in flight.
# FERN_BUILD_MEM_BUDGET_MB halves each process's driver-build RAM budget so two
# cold driver emits, one per worker, still fit the 16 GB runner.
#
# SHARDED by weighted LPT partition (scripts/shard-tests): the sorted
# `-test.list '^Test'` union of both prebuilt binaries is split into NSHARD
# buckets by a greedy longest-processing-time-first assignment, weighted by
# .github/selfhost-test-weights.txt (default weight 1; stale weights only skew
# balance, never coverage — the partition is over the live test list). The
# suite has a few multi-minute tests (whole-compiler self-builds / fixpoints)
# among hundreds of sub-second ones; LPT pins each heavy test to its own
# near-empty bucket, so max-shard wall-clock ≈ the single slowest test. New
# tests are picked up automatically at weight 1; `verify` audits the weights
# against the measured durations every run, and docs/CI-WEIGHT-REFRESH.md is
# the refresh procedure.
#
# The aarch64 runner skips the x86 self-host driver builds (and vice-versa),
# so the x86 lane is the long pole and the aarch64 lane runs ONE shard: its
# per-shard cost is dominated by job setup, so near-empty shards would only
# take runner slots from the x86 fan-out.
#
# The `verify` job reads every shard's outcome artifact off-machine, so a
# shard whose runner vanished (no outcome at all) is a failure with a
# diagnosis rather than a silently missing result, and it audits the weights.
# Read it as the enforcement point for shard coverage.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

# ISOLATED WHOLE-COMPILER DRIVER TESTS — the `^TestSelfHost*` tests that build
# examples/self_host/fern.fern, the ENTIRE self-hosted compiler. They run in
# the `cli` job, which builds fern.fern once for all of them; the shards
# exclude them. ALL OF THEM t.Skip on aarch64
# (they need a native x86 run), so this is x86-only and excluding them from the
# aarch64 shards loses no coverage. A single string is the source of truth for
# BOTH the `cli` job's -run filter and the `test` shards' -test.list exclusion,
# so the two cannot drift.
env:
  ISOLATED_DRIVER_TESTS: "TestSelfHostCLIX86_64|TestSelfHostArm64NativeViaGoBackend|TestSelfHostArm64LinuxBuilds|TestSelfHostArm64DarwinBuilds|TestSelfHostPubVisibilityX86_64|TestSelfHostConstGrammarX86_64|TestSelfHostConstRefCheckX86_64|TestSelfHostConstAggregateArm64PIE|TestSelfHostWasmHostedCompilerMatchesNativeOnNestedArith|TestSelfHostWholeCompilerArm64SingleProcessEmit"
  # OWN_JOB_TESTS: heavy whole-compiler proofs that RUN in CI but in a job of
  # their own, so their minutes do not lengthen whichever shard the LPT
  # partition happens to drop them into. Excluded from shard selection by the
  # same regex as the two lists above, and each has a matching job below.
  OWN_JOB_TESTS: "TestSelfHostPerModuleEmitAllFixpointX86_64|TestSelfHostStage2FixpointArm64|TestSelfHostCLIStage2X86_64|TestSelfHostWasmWholeCompilerShardedLink|TestSelfHostModloadPerModuleWholeCompilerArm64|TestSelfHostSemanticWholeCompilerX86_64"
  # QUARANTINED: tests excluded from shard selection (they still run locally)
  # while their root cause is fixed. EXACT names only, each with its issue in
  # the comment, and re-run the list when that issue closes: a quarantine with
  # no owner outlives its cause (#4801 parked 23 names; 22 of them sat out of
  # CI healthy until #5473). EMPTY means nothing is quarantined.
  QUARANTINED_TESTS: ""

permissions:
  contents: read

jobs:
  # WHOLE-COMPILER (fern.fern) BUILD + ITS ISOLATED TESTS. Builds the single
  # largest driver once, then runs the ISOLATED_DRIVER_TESTS that consume it in
  # two isolated worker processes, both reading the just-built driver from the
  # local on-disk cache. Two workers because two of these tests are ~3.5 minutes
  # each (the whole-compiler arm64 emit and the wasm-hosted differential) and
  # ran back to back.
  #
  # The test step is STRICT: a flag that swallows failures cannot tell a flake
  # from a defect, and TestSelfHostArm64DarwinBuilds once failed for an unknown
  # number of runs with no visible signal (#6164). A genuinely flaky test
  # belongs in QUARANTINED_TESTS, by name and with its issue, where it is
  # visible.
  cli:
    name: cli-driver-tests-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true" # the CLI tests' `-target wasm32-wasi` sub-legs run wasmtime
      # TestSelfHostArm64LinuxBuilds EXECUTES its arm64 output under
      # qemu-aarch64; without the emulator it t.Skipped every run, which is why
      # #6047 survived having a `print` test case. cross-gcc stays OFF —
      # Arm64Tooling keys off the cross compiler's presence, and installing it
      # would silently un-skip a different set of tests in this job.
      - name: qemu-aarch64 (the arm64 driver tests execute their output)
        uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
          cross-gcc: "false"
      - uses: ./.github/actions/build-e2e-binaries
      - name: build fern.fern (whole self-hosted compiler)
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_WARM_DRIVER: "fern.fern"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostWarmStockDriver$' -test.v -test.timeout 13m
      - name: run isolated fern.fern driver tests (two workers, local cache)
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_BUILD_MEM_BUDGET_MB: "6500"
        run: |
          set -euo pipefail
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          WEIGHTS="$PWD/.github/selfhost-test-weights.txt"
          echo "isolated driver tests: $ISOLATED_DRIVER_TESTS"
          cd internal/e2eselfhost
          "$RUNNER_TEMP/ci-test-workers" -binary "$BIN" -output "$RUNNER_TEMP/cli-results" -format standard-verbose \
            -weights "$WEIGHTS" -workers 2 -timeout 18m -run "^($ISOLATED_DRIVER_TESTS)\$"
      # These tests' weights steer the split above and no shard measures them,
      # so their durations ride up to `verify`'s weight audit like a shard's.
      - name: record the isolated tests' durations
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p shard-outcome
          JSON=()
          for j in "$RUNNER_TEMP"/cli-results/worker-*.jsonl; do
            if [ -f "$j" ]; then JSON+=("$j"); fi
          done
          if [ ${#JSON[@]} -gt 0 ]; then
            scripts/ci-test-weights extract "${JSON[@]}" > shard-outcome/cli.timings
            echo "recorded durations for $(wc -l < shard-outcome/cli.timings) tests"
          else
            echo "no worker timing events: no durations to record"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: shard-outcome-cli
          path: shard-outcome/
          retention-days: 1
          if-no-files-found: ignore

  # THE DRIVER SIZE GATE (#6826, #7519). Links every driver named in
  # .github/selfhost-driver-sizes.txt — the list is read from the baseline, so
  # a baselined driver cannot go unmeasured — records each linked size, and
  # compares the whole set against the baseline ONCE:
  #   * FERN_SIZE_REPORT_COMPLETE=1 makes a baselined driver that reached no
  #     report a MISSING finding instead of a row nobody notices is absent;
  #   * FERN_CI_SIZE_GATE_STRICT=1 makes findings FAIL the job.
  # Strict is affordable because nothing depends on this job. The emit and the
  # link are in-process pure Go, so a given commit yields the same byte count on
  # any runner: a difference here is a real change in the compiler's output.
  driver-sizes:
    name: driver-sizes-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/build-e2e-binaries
      - name: link every baselined driver and record its size
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_DRIVER_SIZE_REPORT: "${{ runner.temp }}/driver-sizes.txt"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          FERN_WARM_DRIVER="$(awk '!/^[ \t]*(#|$)/ { print $1 }' .github/selfhost-driver-sizes.txt | paste -sd, -)"
          export FERN_WARM_DRIVER
          echo "drivers: $FERN_WARM_DRIVER"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostWarmStockDriver$' -test.v -test.timeout 13m
          cat "$FERN_DRIVER_SIZE_REPORT"
      - name: check every baselined driver against the baseline
        env:
          FERN_SIZE_REPORT_COMPLETE: "1"
          FERN_CI_SIZE_GATE_STRICT: "1"
        run: scripts/ci-check-driver-sizes .github/selfhost-driver-sizes.txt "${{ runner.temp }}/driver-sizes.txt"

  # WHOLE-COMPILER FIXPOINTS. OWN_JOB_TESTS-class proofs that each run the
  # built compiler over the whole compiler source; they share one job because
  # each is a few minutes and they share the fern.fern build.
  selfhost-fixpoints:
    name: selfhost-fixpoints-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: aarch64 cross-gcc + qemu (the stage-2 leg is linked and RUN)
        uses: ./.github/actions/apt-cross-toolchain
      - uses: ./.github/actions/build-e2e-binaries
      - name: two-generation const_func eligibility check
        if: ${{ !cancelled() }}
        env:
          RUN_CONST_FUNC_GEN2: "1"
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostConstFuncGen2$' -test.v -test.timeout 28m
      # FERN_STAGE2_SELF is deliberately NOT set: that case is gen2 recompiling
      # the whole compiler under qemu, and it is left to a human with time
      # rather than paid on every push.
      - name: arm64 stage-2 fixpoint (gen1 == gen2, byte-identical)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostStage2FixpointArm64$' -test.v -test.timeout 22m
      # The CLI rebuilding itself, and the result compiling real input
      # (#7954). The fixpoints compare bytes; this runs what stage 1 built.
      - name: x86-64 stage-2 CLI compiles lexer.fern and a program
        if: ${{ !cancelled() }}
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostCLIStage2X86_64$' -test.v -test.timeout 20m
      - name: whole-compiler emit-all fixpoint at batch=8 (gen0 == gen1)
        if: ${{ !cancelled() }}
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostPerModuleEmitAllFixpointX86_64$' -test.v -test.timeout 23m

  wasm-wholecompiler-link:
    name: wasm-wholecompiler-link-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true" # the test t.Skips without BOTH wasm-tools and wasmtime
      - uses: ./.github/actions/build-e2e-binaries
      - name: whole-compiler wasm link (15 modules, function-windowed, then run)
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostWasmWholeCompilerShardedLink$' -test.v -test.timeout 28m

  arm64-permodule-wholecompiler:
    name: arm64-permodule-wholecompiler-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: aarch64 cross-gcc + qemu
        uses: ./.github/actions/apt-cross-toolchain
      - uses: ./.github/actions/build-e2e-binaries
      - name: arm64 per-module whole-compiler build + run
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostModloadPerModuleWholeCompilerArm64$' -test.v -test.timeout 33m

  # The longest single test in the suite: gen1 (fern.fern compiled by the
  # native-built driver through the semantic lowering) must compile the tree
  # like the driver does and reproduce itself. Its phases run concurrently
  # inside the test (see its header), so the job is bound by the two heaviest
  # emits rather than their sum.
  semantic-wholecompiler:
    name: semantic-wholecompiler-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/build-e2e-binaries
      - name: semantic self-build and per-module diff
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostSemanticWholeCompilerX86_64$' -test.v -test.timeout 43m

  # THE FIXTURE CORPUS THROUGH THE SELF-HOST COMPILER, one leg per target.
  fixtures-selfhost:
    name: fixtures-selfhost-${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: wasm, test: TestFernFixturesSelfHostWasm, wasmtime: "true", job-minutes: 45, go-timeout: 43m }
          - { leg: x86-64, test: TestFernFixturesSelfHostX86_64, wasmtime: "false", job-minutes: 45, go-timeout: 43m }
          - { leg: arm64, test: TestFernFixturesSelfHostArm64, wasmtime: "false", qemu: "true", job-minutes: 45, go-timeout: 43m }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: ${{ matrix.wasmtime }}
      - name: aarch64 cross toolchain + qemu (arm64 leg)
        if: matrix.qemu == 'true'
        uses: ./.github/actions/apt-cross-toolchain
      - name: run the fixture corpus through the self-host compiler
        env:
          FERN_SELFHOST_FIXTURES: "1"
        run: go test ./internal/e2e/ -run '^${{ matrix.test }}$' -v -timeout ${{ matrix.go-timeout }}

  # THE FERNSMITH CORPUS THROUGH THE SELF-HOST COMPILER, one job per target,
  # each running the AST-lowering leg and then the semantic-lowering leg of the
  # same corpus. Per-seed subtests are parallel, so one job already uses every
  # core; a second job per target would only buy another job's setup.
  #
  # The wasm legs t.Skip without wasmtime, and they are run WITHOUT it on
  # purpose for now: with it present, five seeds trap in the self-host wasm
  # module where the interpreter runs clean (integer divide by zero on seeds
  # 139, 195, 402 and 483, an out-of-bounds access on 139's semantic leg), so
  # the lane cannot go green until the emitter is fixed (#9995). Installing
  # wasmtime here is the last step of that fix, not of this file.
  diff-selfhost:
    name: diff-selfhost-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64, qemu: "false" }
          - { target: arm64, qemu: "true" }
          - { target: wasm, qemu: "false" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: aarch64 cross toolchain + qemu (arm64 target)
        if: matrix.qemu == 'true'
        uses: ./.github/actions/apt-cross-toolchain
      - name: x86_64 — AST lowering, then the semantic lowering
        if: matrix.target == 'x86_64'
        env:
          FERN_SELFHOST_DIFF: "1"
        run: |
          set -euo pipefail
          go test ./internal/e2e/ -run '^TestDifferential_SelfHostX86_64$' -v -timeout 43m
          go test ./internal/e2e/ -run '^TestDifferential_SelfHostSemanticX86_64$' -v -timeout 43m
          go test ./internal/e2e/ -run '^TestSelfHostDeepNestingMatchesNativeAndDoesNotCrash$' -v -timeout 10m
      - name: arm64 — AST lowering, then the semantic lowering
        if: matrix.target == 'arm64'
        env:
          FERN_SELFHOST_DIFF: "1"
        run: |
          set -euo pipefail
          go test ./internal/e2e/ -run '^TestDifferential_SelfHostArm64$' -v -timeout 43m
          go test ./internal/e2e/ -run '^TestDifferential_SelfHostSemanticArm64$' -v -timeout 43m
      - name: wasm — AST lowering, then the semantic lowering
        if: matrix.target == 'wasm'
        env:
          FERN_SELFHOST_DIFF: "1"
        run: |
          set -euo pipefail
          go test ./internal/e2e/ -run '^TestDifferential_SelfHostWasm$' -v -timeout 43m
          go test ./internal/e2e/ -run '^TestDifferential_SelfHostSemanticWasm$' -v -timeout 43m

  # THE SHARDS. Each builds both test binaries and the drivers its tests need,
  # then runs its LPT slice of the union list in two isolated worker processes.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 0 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 1 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 2 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 3 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 4 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 5 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 6 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 7 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 8 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 9 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 10 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 12, shard: 11 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 1, shard: 0 }
    name: test-e2e-selfhost-${{ matrix.host }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # for the ../../examples + ../../internal/stdlib data files the tests read
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - name: aarch64 cross toolchain (x86 shards — arm64 cross-emit tests)
        if: matrix.host == 'x86_64'
        uses: ./.github/actions/apt-cross-toolchain
      - uses: ./.github/actions/build-e2e-binaries
        with:
          e2e: "true"
      - name: run self-host shard ${{ matrix.shard }}/${{ matrix.nshard }} (prebuilt binaries, two workers)
        id: run
        env:
          SHARD: "${{ matrix.shard }}"
          NSHARD: "${{ matrix.nshard }}"
          FERN_REQUIRE_ARM64_TOOLING: "${{ matrix.host == 'x86_64' && '1' || '' }}"
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_BUILD_MEM_BUDGET_MB: "6500"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test e2e.test
          SH_BIN="$PWD/e2eselfhost.test"
          E2E_BIN="$PWD/e2e.test"
          WEIGHTS="$PWD/.github/selfhost-test-weights.txt"
          WORKERS="$RUNNER_TEMP/ci-test-workers"
          # The whole e2eselfhost binary — every test in that package is a
          # self-host test, so a narrower prefix would drop the ones named
          # outside it (#8471) — plus the residual TestSelfHost legs in
          # internal/e2e, minus the names that run in a job of their own.
          mapfile -t SH_ALL < <("$SH_BIN" -test.list '^Test' | grep '^Test' | grep -vE "^(${ISOLATED_DRIVER_TESTS}|${QUARANTINED_TESTS}|${OWN_JOB_TESTS})\$" | sort)
          mapfile -t RES_ALL < <("$E2E_BIN" -test.list '^TestSelfHost' | grep '^TestSelfHost' | grep -vE "^(${ISOLATED_DRIVER_TESTS}|${QUARANTINED_TESTS}|${OWN_JOB_TESTS})\$" | sort)
          mapfile -t MINE < <(printf '%s\n' "${SH_ALL[@]}" "${RES_ALL[@]}" | sort | scripts/shard-tests "$SHARD" "$NSHARD" "$WEIGHTS")
          SEL_SH=()
          SEL_RES=()
          for t in "${MINE[@]}"; do
            if printf '%s\n' "${RES_ALL[@]}" | grep -qx "$t"; then SEL_RES+=("$t"); else SEL_SH+=("$t"); fi
          done
          if [ ${#SEL_SH[@]} -eq 0 ] && [ ${#SEL_RES[@]} -eq 0 ]; then
            echo "no tests for shard $SHARD/$NSHARD"; exit 0
          fi
          echo "shard $SHARD/$NSHARD: ${#SEL_SH[@]} selfhost-pkg + ${#SEL_RES[@]} residual tests"
          # A worker count the selection can fill: the residual slice is a
          # handful of sub-second tests and may be a single name.
          workers() { if [ "$1" -ge 2 ]; then echo 2; else echo 1; fi; }
          if [ ${#SEL_SH[@]} -gt 0 ]; then
            PAT="^($(IFS='|'; echo "${SEL_SH[*]}"))\$"
            ( cd internal/e2eselfhost && "$WORKERS" -binary "$SH_BIN" -output "$RUNNER_TEMP/shard-selfhost" -format standard-verbose \
                -weights "$WEIGHTS" -workers "$(workers ${#SEL_SH[@]})" -timeout 28m -run "$PAT" )
          fi
          if [ ${#SEL_RES[@]} -gt 0 ]; then
            PAT="^($(IFS='|'; echo "${SEL_RES[*]}"))\$"
            ( cd internal/e2e && "$WORKERS" -binary "$E2E_BIN" -output "$RUNNER_TEMP/shard-residual" -format standard-verbose \
                -weights "$WEIGHTS" -workers "$(workers ${#SEL_RES[@]})" -timeout 28m -run "$PAT" )
          fi
      # The outcome marker plus the per-test durations `verify` audits the
      # weights against. `!cancelled()` so a failed run step still records
      # `failure` rather than leaving the marker absent.
      - name: record shard outcome
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p shard-outcome
          echo '${{ steps.run.outcome }}' > "shard-outcome/${{ matrix.host }}-${{ matrix.shard }}"
          JSON=()
          for j in "$RUNNER_TEMP"/shard-selfhost/worker-*.jsonl "$RUNNER_TEMP"/shard-residual/worker-*.jsonl; do
            if [ -f "$j" ]; then JSON+=("$j"); fi
          done
          if [ ${#JSON[@]} -gt 0 ]; then
            TIMINGS="shard-outcome/${{ matrix.host }}-${{ matrix.shard }}.timings"
            scripts/ci-test-weights extract "${JSON[@]}" > "$TIMINGS"
            echo "recorded durations for $(wc -l < "$TIMINGS") tests"
          else
            echo "no worker timing events: no durations to record"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: shard-outcome-${{ matrix.host }}-${{ matrix.shard }}
          path: shard-outcome/
          retention-days: 1

  # Every shard must have REPORTED success: a shard whose runner vanished
  # leaves no marker, which is a failure with a diagnosis here rather than a
  # silently missing result. The weight audit rides along, advisory.
  verify:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FERN_CI_TOLERATE_VANISHED_SHARDS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shard-outcome-*
          path: shard-outcomes
          merge-multiple: true
      - name: verify every shard reported success
        id: verify
        run: scripts/ci-verify-shard-outcomes shard-outcomes x86_64=12 aarch64=1
      - name: why did a shard leave no outcome
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-classify-vanished-shards "${{ github.run_id }}" 30
      - name: audit shard weights against measured durations
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FERN_CI_WEIGHT_GATE_STRICT: "0"
        run: scripts/ci-test-weights check shard-outcomes .github/selfhost-test-weights.txt
