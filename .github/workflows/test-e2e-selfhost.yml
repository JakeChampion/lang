name: Test e2e self-host

# `TestSelfHost*` — the self-hosting pipeline suite, now its own Go
# package `internal/e2eselfhost` (#4398 part 3: the e2e package split;
# shared harness in internal/e2eharness). Covers the bootstrap chain
# (lexer → parser → checker → constfold → printer → disasm → asm →
# VM → cross-validation → self-compile). Each test runs the
# current `lang` binary against the in-tree self-host sources and
# diffs the output against the reference.
#
# RESIDUAL TESTS: ~30 TestSelfHost* functions still live in
# internal/e2e — files that pair a TestSelfHost* leg with its
# TestNative* oracle sibling sharing one fixture table (splitting them
# would sever the fixtures). The build job compiles BOTH test binaries
# and the shard script partitions the UNION of both lists,
# running each test against the binary/package it lives in — so the
# residuals keep exactly their old coverage.
#
# COMPILE ONCE, RUN MANY. A `build` job (per arch) compiles the e2e
# test binary a single time with `go test -c` and uploads it as an
# artifact; the sharded `test` jobs download that binary and run their
# slice of it. Previously every one of the (2 arch × N) shards
# recompiled the ~32 MB e2e test binary itself (`go test ./...` rebuilds
# the package per job, ~2.5 min each), so the build cost was paid 2N
# times. Now it is paid twice. This both saves CI minutes and trims each
# shard's wall-clock by ~2.5 min — which matters because of the runner
# behaviour documented under RUNNER PREEMPTION below.
#
# DRIVER WARM ARTIFACTS (x86). The dominant per-shard cost is not the Go test
# binary but the self-host DRIVERS: each `*_run.fern` driver statically imports
# the multi-thousand-line front-end, and the Go x86-64 backend takes ~50-70s to
# emit one. A shard that touches several distinct drivers pays that many times
# (and the linked binaries pile multiple GB into the link cache) — long enough
# to be caught by the preemption below. Two changes cut it:
#   * the self-host build cache is keyed on a driver's IMPORT CLOSURE, not its
#     project-dir contents (hashSelfHostSources), so a given driver hashes to ONE
#     key across every test regardless of which other drivers a test drops in the
#     same dir — it builds at most once per shard, and its key is reproducible.
#   * separate, parallel `warm` jobs each compile ONE driver up front (short jobs
#     are never reclaimed) and upload it as a workflow ARTIFACT; the test shards
#     DOWNLOAD those, serving the driver from disk (~1s) instead of recompiling.
#     This is the bootstrap a per-shard cache could never give: a shard reclaimed
#     mid-run never reaches its own post-save, so cold shards never seeded one
#     another — a warm job that always finishes does. Warmed: every file-based
#     x86 driver the suite builds — asm_run / asm_pathprobe_run (the bulk of
#     `*IRX86_64` tests), asm_ir_run / asm_load_run / asm_modload_run /
#     checker_modload_run / ssa (incl. ssa_lift_scan_run, whose per-shard cold
#     build used to make TestSelfHostSSALiftCoverageScan a ~74s test), the wasm
#     stdin drivers wasm_run / wasm_ir_run / wasm_runio_run (built by hundreds
#     of call-sites; TestSelfHostWasmArityGate alone cold-built two of them for
#     ~126s per shard before this), and asm_ir_elig_run (the lean
#     front-end+asm_ir probe the six IR-eligibility tests share, in place of a
#     whole-compiler driver whose 256 MB binary did not disk-cache).
#     Un-warmed drivers still compile per shard, now at most once each.
#     IMPORTANT: artifacts are used instead of actions/cache here because the
#     repo's 10 GB shared cache budget is routinely filled by other PRs/branches.
#     When test shards spend hours in the GitHub Actions queue before running,
#     warm cache entries get evicted, cold driver builds (~80s each) push shard
#     wall-clock into the runner-preemption window. Workflow artifacts are
#     per-run and not subject to the shared cache eviction, so they remain
#     available however long shards wait in queue.
#   * the warm artifact stores ONLY the linked driver BINARY — NOT the ~680 MB
#     emitted `.s`. Binary-only keeps each warmed driver ~4x smaller (~190 MB),
#     so downloads fit on-runner disk and the emit (~47 s) is skipped.
#
# Matrix per arch because individual tests are split per backend
# (TestSelfHostAsmX86_64, TestSelfHostAsmArm64, etc.) — running on
# both runners means each backend-specific test exercises its native
# toolchain rather than skipping for lack of qemu / cross-gcc. The
# aarch64 runner skips the x86 self-host driver builds (and vice-versa),
# so the x86 lane is the long pole; the aarch64 shards finish in well
# under a minute — which is why the aarch64 lane runs 8 shards to the
# x86 lane's 20 (its per-shard cost is dominated by job setup, so 20
# near-empty shards were just 12 wasted runner slots delaying the x86
# fan-out under the account-wide concurrent-job cap).
#
# SHARDED by weighted LPT partition (scripts/selfhost-shard-tests): the
# sorted `-test.list '^TestSelfHost'` union of both prebuilt binaries is
# split into NSHARD buckets by a greedy longest-processing-time-first
# assignment, weighted by .github/selfhost-test-weights.txt (default
# weight 1; stale weights only skew balance, never coverage — the
# partition is over the live test list). The suite has a few 1-4 MINUTE
# tests (whole-compiler self-builds / fixpoints) among hundreds of
# sub-second ones; the old `index % NSHARD` round-robin regularly stacked
# two of them in one shard (observed: a 326s shard while others ran 50s).
# LPT pins each heavy test to its own near-empty bucket, so max-shard
# wall-clock ≈ the single slowest test — the floor for any partition.
# New tests are picked up automatically at weight 1.
#
# RUNNER PREEMPTION — why short shards matter.
# The x86 self-host shards were intermittently coming back `failure` with
# "The runner has received a shutdown signal" / exit 143, mid-run, with no
# test failures — the runner was reclaimed out from under the job. Two
# hypotheses were tested and BOTH refuted by experiment:
#   * "idle-output watchdog" — added a 30s stdout heartbeat; a shard
#     emitting a heartbeat line every 30s was STILL killed (at ~6.4 min),
#     so it is not a no-output timeout.
#   * "fixed job/runner lifetime" — kills landed at variable times
#     (~6.4 min one run, ~11 min another), so it is not a fixed cap.
# The one robust correlation: short jobs survive (the ~30s aarch64 shards
# are never reclaimed) and long jobs get caught. So this is infrastructure
# preemption of the runner pool, and the lever is to make the x86 jobs
# *shorter*: compile-once (drops the ~2.5 min per-shard rebuild), the DRIVER
# WARM CACHE above (drops a shard's ~50-130s-per-driver build+link to a ~1s
# disk restore), and the LPT sharding above (caps a shard at ~the single
# slowest test instead of an unlucky stack of them).
#
# The remaining tail was the set of tests that RUN the self-host compiler on
# whole programs (bootstrap / fixpoint / per-module / CLI / derive-stdlib).
# They were once believed to have inherent multi-second runtime and were split
# out into isolated one-test jobs (the old HEAVY-TEST SPLIT, driven by a
# selfhost-heavy-tests.txt list). That belief was wrong for most: a 2-pass
# measurement put nearly all of them at <0.1 s once their driver is cached —
# their entire cost was the ~47 s driver BUILD, which the DRIVER WARM CACHE
# above serves in ~1 s. The handful with GENUINE minutes-long runtimes
# (they run the built compiler over the whole compiler source) are what the
# weights file exists for. The x86 test job stays `continue-on-error` so a rare
# runner reclaim (a cancellation, not a trappable exit code) can't fail the run;
# the aarch64 lane is always green because the x86-only self-host tests t.Skip
# there for lack of cross-gcc / qemu-x86_64. Those two facts TOGETHER once meant
# no lane enforced a `*X86_64` test; the `verify` job now does, off-machine, from
# per-shard outcome artifacts (#5912 item 1). Read `verify` as the enforcement
# point — neither `test` half is coverage on its own.
#
# STREAMING OUTPUT. Every test-running step here goes through gotestsum via
# `--raw-command`, which runs the PREBUILT binary through `go tool test2json`
# (no recompile) and formats the stream. The `standard-verbose` format is used
# — NOT `pkgname-and-test-fails` (which prints nothing until the package ends)
# — so each test's RUN/PASS/FAIL still streams as it happens: live progress,
# and — when a shard IS preempted — exactly which test was in flight at the
# moment of the kill, now with gotestsum's end-of-run summary on top.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ISOLATED WHOLE-COMPILER DRIVER TESTS — the `^TestSelfHost*` tests that build
# examples/self_host/fern.fern, the ENTIRE self-hosted compiler and the single
# largest driver (~245 MB linked). A cold fern.fern build is ~236 s; when the
# `cli` warm cache is evicted/dropped on a shard (GitHub's 10 GB repo-cache
# budget vs. the ~2 GB of decompressed driver binaries an x86 shard restores)
# the shard re-emits fern.fern COLD mid-run — which is exactly when the long x86
# shards crossed into the runner-preemption window (observed: shard kills landing
# during TestSelfHostCLIX86_64 ~6 min in). These tests are pulled OUT of the
# LPT `test` shards (below) and run INSIDE the `cli` job, right after
# it builds fern.fern — reading that just-built driver from the LOCAL on-disk cache
# (in-process, one `go test` invocation), so fern.fern is cold-built exactly ONCE
# per run and never via an evictable cross-job GitHub cache. (An earlier cut ran
# them in a standalone `driver-tests` job that RESTORED the cli cache; under the
# 10 GB repo-cache budget that restore was evicted, forcing a SECOND cold rebuild
# that itself got preempted — hence the fold.) A single string is the source of
# truth for BOTH the `cli` job's `-test.run` filter and the `test` shards'
# `-test.list` exclusion, so the two can't drift. ALL FOUR t.Skip on aarch64 (they
# need a native x86 run), so this is x86-only and excluding them from the aarch64
# shards loses no coverage. Adding a NEW test that builds fern.fern? Add its
# name here too, or it will cold-build inside a preemptable shard again.
env:
  ISOLATED_DRIVER_TESTS: "TestSelfHostCLIX86_64|TestSelfHostArm64NativeViaGoBackend|TestSelfHostArm64LinuxBuilds|TestSelfHostArm64DarwinBuilds"
  # OWN_JOB_TESTS: heavy whole-compiler proofs that RUN in CI but in a job of
  # their own, so their minutes do not lengthen whichever shard the LPT
  # partition happens to drop them into. Excluded from shard selection by the
  # same regex as the two lists above, and each has a matching job below.
  # (Distinct from ISOLATED_DRIVER_TESTS, which is about *where fern.fern gets
  # cold-built*, not about run length.)
  OWN_JOB_TESTS: "TestSelfHostPerModuleEmitAllFixpointX86_64"
  # QUARANTINED: tests excluded from shard selection (they still run locally)
  # while their root cause is fixed. EXACT names only. EMPTY means nothing is
  # quarantined — the #4801 quarantine is fully retired.
  #
  # History, so a future quarantine is sized against a real precedent: #4801
  # parked 23 names when the watbin / wit / component family started crashing
  # with SIGABRT after wasmtime was restored to the shards. The crash class was
  # fixed by #4833 / #4836 / #4847 / #5261 / #5264 / #5285, but the list was
  # never revisited, so 22 healthy tests sat out of CI until #5473 re-ran them
  # and un-quarantined them. TestSelfHostWasmRun followed once its remaining
  # subtests were fixed: #5478 (the wasm IR emitter's missing WASI helper
  # emission, plus i64/f64 const width inference), #5480 (int argument at an f64
  # param), #5482 (method-returned closures dispatched as bare fn pointers), and
  # #5479 (two expectations that still pinned the legacy AST backend's
  # by-value capture, superseded by #2896/#5301's by-reference semantics).
  #
  # The lesson worth keeping: a quarantine with no owner outlives its cause.
  # If you add a name here, put the issue in the comment AND re-run the list
  # when that issue closes.
  QUARANTINED_TESTS: ""

jobs:
  # Local-CI sign-off gate. `gh signoff e2e-selfhost` on this commit skips the
  # whole pipeline below (see docs/CI-SIGNOFF.md): `build` is gated directly and
  # `warm` / `cli` / `test` cascade-skip through their `needs: build` dependency.
  # Fork PRs can't sign off; gate fails open on any error.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: e2e-selfhost
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Compile the e2e test binary ONCE per arch; the sharded test jobs reuse it.
  build:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: ubuntu-latest,    name: x86_64  }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
    name: build-selfhost-${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      # Two binaries: the selfhost package plus the remainder package (for
      # the ~30 residual TestSelfHost tests in mixed fixture files — see
      # RESIDUAL TESTS above).
      - name: compile test binaries (go test -c)
        run: |
          go test -c -o e2eselfhost.test ./internal/e2eselfhost/
          go test -c -o e2e.test ./internal/e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-test-${{ matrix.host.name }}
          path: |
            e2eselfhost.test
            e2e.test
          retention-days: 1
          if-no-files-found: error

  # WARM THE DRIVER CACHE (x86). The per-shard cost is dominated by self-host
  # DRIVERS, each a ~50-70s Go x86-64 emit of the ~35k-line front-end PLUS a gcc
  # link that, for the bigger drivers, runs another ~minute. With the closure-
  # keyed cache (hashSelfHostSources keys on a driver's import closure, not its
  # dir contents) a given stock driver hashes to ONE key across every test, so it
  # can be compiled+linked once here and restored by the shards. ONE driver (or a
  # couple of small related ones) per warm job: warming several big drivers in a
  # single job ran the job's disk low and the (silent) per-driver .bin disk-cache
  # write was dropped, so the shards re-linked them (~min each) — the residual
  # preemption after the first cut. A dedicated runner per driver has ample disk
  # to persist both the .s and the .bin. Keyed by (driver, SHA): SHA so warm +
  # shards share one intra-run hand-off (a source change is a new SHA → fresh
  # warm, no staleness); per-driver so each restores into its own dir. The
  # aarch64 lane skips the x86 driver tests, so warming is x86-only
  # (x86_64Tooling t.Skip()s elsewhere).
  #
  # NOTE the fern.fern (whole-compiler) build is NOT here — it lives in the
  # standalone `cli` job below, because nothing downloads its artifact and the
  # `test` shards must NOT wait on its ~4-minute build: `needs: warm` gates the
  # shards on the SLOWEST warm job, and folding fern.fern in here used to hold
  # every shard back ~2.5 min for an artifact none of them consumed.
  warm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: elig,      drivers: "asm_ir_elig_run.fern" }
          - { key: asm,       drivers: "asm_run.fern" }
          - { key: pathprobe, drivers: "asm_pathprobe_run.fern" }
          - { key: asmir,     drivers: "asm_ir_run.fern" }
          - { key: asmload,   drivers: "asm_load_run.fern" }
          - { key: modload,   drivers: "asm_modload_run.fern" }
          - { key: checker,   drivers: "checker_modload_run.fern" }
          - { key: ssa,       drivers: "ssa_run.fern,ssa_emit_run.fern,ssa_lift_scan_run.fern" }
          # One warm job PER wasm driver: warming all three in one job made
          # that job the slowest in the matrix (~234s measured) and `needs:
          # warm` gates every shard on the slowest warm job — exactly the
          # coupling the standalone `cli` job exists to avoid. (The ssa trio
          # above stays fused because those drivers are small enough that the
          # fused job still finishes under the ~110s matrix barrier.)
          - { key: wasmrun,   drivers: "wasm_run.fern" }
          - { key: wasmir,    drivers: "wasm_ir_run.fern" }
          - { key: wasmio,    drivers: "wasm_runio_run.fern" }
          - { key: irx86,     drivers: "irlower_run.fern" }
    name: warm-selfhost-x86_64-${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-x86_64
      - name: warm ${{ matrix.key }} drivers (${{ matrix.drivers }})
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_WARM_DRIVER: "${{ matrix.drivers }}"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostWarmStockDriver$' -test.v -test.timeout 13m
          du -sh "$FERN_SELFHOST_BUILD_CACHE" || true
      # Publish each warmed driver for the `test` shards to download.
      - uses: actions/upload-artifact@v4
        with:
          name: warm-x86_64-${{ matrix.key }}
          path: ${{ runner.temp }}/selfhost-unicache
          retention-days: 1
          if-no-files-found: warn

  # WHOLE-COMPILER (fern.fern) BUILD + ITS ISOLATED TESTS. Builds the single
  # largest driver once, then runs the four ISOLATED_DRIVER_TESTS that consume
  # it, in-process, reading the just-built driver from the LOCAL on-disk cache
  # (see the ISOLATED WHOLE-COMPILER DRIVER TESTS note above the env block).
  # Deliberately NOT part of the `warm` matrix: the `test` shards `needs: warm`,
  # and this ~4-min job would gate all 28 of them on an artifact nobody
  # downloads (no upload here — nothing consumes fern.fern outside this job).
  # continue-on-error at the test step so a flaky test (e.g. a qemu-aarch64
  # float blip) is non-fatal; the build step itself stays strict.
  cli:
    needs: build
    name: cli-driver-tests-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true" # the CLI tests' `-target wasm` sub-legs run wasmtime
          gotestsum: "true"
      # TestSelfHostArm64LinuxBuilds and TestSelfHostArm64DarwinBuilds are in
      # this job's -test.run list, and the Linux one EXECUTES its arm64 output —
      # under qemu-aarch64, which was never installed here, so it t.Skipped every
      # run. That skip is why #6047 (every printed string right-length /
      # wrong-bytes on `-target arm64`) survived having a `print` test case.
      # Installing qemu makes the test actually run; the encoding differential
      # (TestSelfHostArm64AsmEncodingMatchesNative) is the deterministic gate
      # that needs no emulator.
      - name: qemu-aarch64 (the arm64 driver tests execute their output)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          qemu-aarch64 --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-x86_64
      - name: warm fern.fern (whole self-hosted compiler)
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_WARM_DRIVER: "fern.fern"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostWarmStockDriver$' -test.v -test.timeout 13m
          du -sh "$FERN_SELFHOST_BUILD_CACHE" || true
      - name: run isolated fern.fern driver tests (in-process, local cache)
        continue-on-error: true
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          echo "isolated driver tests: $ISOLATED_DRIVER_TESTS"
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run "^($ISOLATED_DRIVER_TESTS)\$" -test.v -test.timeout 13m

  gen2:
    needs: build
    name: const-func-gen2-x86_64
    runs-on: ubuntu-latest
    # The test builds an mmc1/mmc2 pair (a ~220 MB stage-1 binary and a heavy
    # emit) — its own docs quote ~4 min, so 30 gives the runner room.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-x86_64
      # TestSelfHostConstFuncGen2 is the ONLY guard for a self-referential
      # miscompile: the IR path compiling the code that decides IR eligibility.
      # It needs two generations to show up, so it is invisible to every
      # single-generation test. It used to be env-gated and set by nothing, which
      # meant the hazard was unguarded in CI at exactly the moment the
      # ~512-function budget was removed and generation 2 became IR-BUILT by
      # default (#3457). The variable is set here so the guard runs with the
      # change that needs it. Native x86-64 only (the test skips under a qemu
      # runner — it passes argv paths), which ubuntu-latest is.
      - name: two-generation const_func eligibility check
        env:
          RUN_CONST_FUNC_GEN2: "1"
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostConstFuncGen2$' -test.v -test.timeout 28m

  # The PER-MODULE fixpoint: 33 separate per-module emits, gen0 (Go-built) vs
  # gen1 (self-host-BUILT), asserting byte identity across every unit. It is the
  # only guard that exercises the per-module windowing end to end.
  #
  # It was env-gated and run by NOTHING, because it takes ~1050 s — past the
  # 13-minute timeout on the sharded `test` job. That timeout does not bind a
  # dedicated job, so gating it cost the coverage for no reason: a change to the
  # RC lowering could reach main with only the batch-4 emit-all sibling behind
  # it. #6018 is what that looks like — it passed the fixpoint locally, all 335
  # fixtures and the native suite, and still segfaulted the driver.
  #
  # Memory is the real constraint, not time: gen1's emit peaks ~7.6 GB against
  # the arena, so its emit runs SERIALLY inside the test (concurrent large-module
  # emits thrash the host). If this job starts failing with exit 137 from a Fern
  # binary rather than the runner, that is arena exhaustion as the compiler
  # sources grow — see the note on __fern_alloc in CLAUDE.md, not an infra flake.
  permodule-fixpoint:
    needs: build
    name: permodule-fixpoint-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-x86_64
      - name: per-module whole-compiler fixpoint (gen0 == gen1)
        env:
          RUN_PERMODULE_FIXPOINT: "1"
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostPerModuleFixpointX86_64$' -test.v -test.timeout 43m

  # WHOLE-COMPILER EMIT-ALL FIXPOINT at batch=8 — the config that IS the
  # pre-`-assume-eligible` OOM shape, so it is the one worth guarding.
  #
  # It was env-gated on RUN_EMITALL_FIXPOINT, which nothing set, on the grounds
  # that its gen1 emit "peaks 7909 MB against the 8 GiB arena (~99% of the
  # ceiling)". The arena has been 16 GiB for some time, making that ~45%, so the
  # test had been retired by an argument that stopped being true. Re-measured
  # 2026-08-03: gen0 42.0 s / 4.96 GB, gen1 108.8 s / 7.27 GB, 297.6 s total.
  # Its own job because ~5 min is enough to matter inside an LPT shard and
  # nothing about it needs to share one.
  emitall-fixpoint:
    needs: build
    name: emitall-fixpoint-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-x86_64
      - name: whole-compiler emit-all fixpoint at batch=8 (gen0 == gen1)
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2eselfhost.test
          BIN="$PWD/e2eselfhost.test"
          cd internal/e2eselfhost
          gotestsum --format standard-verbose --raw-command -- \
            go tool test2json -t -p e2eselfhost "$BIN" -test.run '^TestSelfHostPerModuleEmitAllFixpointX86_64$' -test.v -test.timeout 23m

  # The fixture corpus, run through the SELF-HOST compiler, once per target it
  # emits. Nothing else does: all four of TestFernFixtures' backends are the
  # NATIVE compiler, so 335 fixture directories have been exercising the compiler
  # that is meant to be FROZEN while the one meant to become the product was
  # covered only by inlined string literals in Go tests. The wasm leg's first run
  # found twelve real divergences on fixtures that had been green for months
  # (internal/e2e/testdata/selfhost-wasm-known-divergences.txt); the x86-64 and
  # arm64 legs exist because one-target coverage left the other two asserting
  # nothing, and each has its own known-divergences file beside that one.
  #
  # Its own lane rather than part of the fixture run: each leg builds fern.fern
  # (a heavy self-host driver, ~4.3 GB reserved by the harness limiter) where the
  # native fixture run is 15 seconds. Paid once per leg, then ~1.3s per fixture.
  #
  # One job PER TARGET rather than both legs in one job. The driver build is then
  # paid twice instead of once, which is the deliberate trade: the legs run
  # concurrently, so wall-clock is one build plus the slower corpus rather than
  # one build plus both — and a red leg does not hide behind one that ran first.
  #
  # Both legs need a NATIVE x86_64 host: the driver is always emitted as x86-64
  # asm (e2eharness.emitDriverAsm calls x86_64.Emit) and takes host paths as
  # argv, so it cannot run under a qemu prefix.
  fixtures-selfhost:
    needs: build
    name: fixtures-selfhost-${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-minutes }}
    strategy:
      fail-fast: false
      # Per-leg time budget, measured rather than guessed: wasm and x86-64 each
      # finish the corpus in ~11 minutes. The arm64 leg is NOT here — see the
      # "missing third leg" section in internal/e2e/fixture_selfhost_test.go: it
      # needs ~69 min (in-process assemble + link per fixture, ~13s each) and is
      # blocked on #6044 / #6045 / #6047 regardless.
      matrix:
        include:
          - { leg: wasm, test: TestFernFixturesSelfHostWasm, wasmtime: "true", job-minutes: 45, go-timeout: 43m }
          - { leg: x86-64, test: TestFernFixturesSelfHostX86_64, wasmtime: "false", job-minutes: 45, go-timeout: 43m }
          # The arm64 leg is the only one where the self-host compiler emits,
          # assembles AND links the binary itself, so it is also the gate on
          # arm64_native.fern. Measured 2026-08-04: ~5 minutes for the corpus
          # once the driver is built (there are no hangs left), so the 45-minute
          # budget the other two legs use is ample.
          - { leg: arm64, test: TestFernFixturesSelfHostArm64, wasmtime: "false", qemu: "true", job-minutes: 45, go-timeout: 43m }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: ${{ matrix.wasmtime }}
      - name: aarch64 cross toolchain + qemu (arm64 leg)
        if: matrix.qemu == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu qemu-user-static
          qemu-aarch64-static --version | head -1
      - name: run the fixture corpus through the self-host compiler
        env:
          FERN_SELFHOST_FIXTURES: "1"
        run: go test ./internal/e2e/ -run '^${{ matrix.test }}$' -v -timeout ${{ matrix.go-timeout }}

  test:
    needs: [build, warm]
    strategy:
      fail-fast: false
      # Explicit include list instead of a host × shard cross-product: the
      # aarch64 lane runs 8 shards to x86's 20 (see the matrix-per-arch note
      # in the header). `nshard` rides along so the partition script agrees
      # with the number of jobs actually scheduled.
      matrix:
        include:
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 0 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 1 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 2 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 3 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 4 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 5 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 6 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 7 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 8 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 9 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 10 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 11 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 12 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 13 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 14 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 15 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 16 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 17 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 18 }
          - { runner: ubuntu-latest, host: x86_64, nshard: 20, shard: 19 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 0 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 1 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 2 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 3 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 4 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 5 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 6 }
          - { runner: ubuntu-24.04-arm, host: aarch64, nshard: 8, shard: 7 }
    name: test-e2e-selfhost-${{ matrix.host }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # TOLERATE PREEMPTION ON X86 ONLY. The long x86 shards are intermittently
    # reclaimed mid-run by the runner pool (see RUNNER PREEMPTION above) — exit
    # 143 / "runner received a shutdown signal", with no test failure. The fix
    # tree above (compile-once, warm driver cache, LPT sharding) cut the
    # per-shard wall-clock hard, but a stochastic runner reclaim can still land
    # on any job. Rather than chase that residual risk forever — the Go e2e
    # harness is transitional; the project is moving to the self-hosted test
    # runner — we let the x86 shards be non-fatal.
    #
    # `continue-on-error` here keeps a RECLAIM from failing the lane, but on its
    # own it cannot tell a reclaim from an assertion failure, so it absorbed
    # both. That was the #5912-item-1 enforcement gap: every `TestSelfHost*X86_64`
    # test was enforced by NEITHER lane — `t.Skip`ped on aarch64 (X86_64Tooling,
    # internal/e2eharness/x86_64.go:43-46, needs `qemu-x86_64` on a non-amd64
    # host and nothing here installs it) and tolerated on x86, the lane where
    # they actually run. #5901 shipped through that hole: a `dedupe_weak_defs`
    # regression emitted four `util` functions into non-executable `.rodata`,
    # segfaulting the self-host-compiled interpreter on any integer literal —
    # 100 of 104 subtests of TestSelfHostInterpDriverX86_64 — with every lane
    # green.
    #
    # The gap is now closed by the `verify` job below, NOT by this flag: each
    # shard records its outcome as an artifact, and `verify` (a separate job, on
    # a separate machine) asserts every expected shard reported `success`. That
    # separation is the whole point — a reclaimed runner is gone, so no step on
    # it runs, not even `if: always()`; only an off-machine check can tell
    # "tests failed" from "host vanished". So this flag no longer hides a real
    # failure: it only stops a reclaimed shard from failing the lane twice.
    continue-on-error: ${{ matrix.host == 'x86_64' }}
    steps:
      - uses: actions/checkout@v4 # for the ../../examples + ../../internal/stdlib data files the tests read
      # Go + build cache (tests shell out to `go build` for the native oracle),
      # lld, AND the wasmtime/wasm-tools/adapter triple: the shards ran WITHOUT
      # wasmtime for a long stretch, which silently t.Skip()ped every
      # TestSelfHost*Wasm* / component test in BOTH arch lanes (the wasm
      # workflow only runs ^Test(WASM|Wasm), so nothing else caught them).
      # Wiring wasmtime here closes that coverage gap; the wasm DRIVERS the
      # x86 tests build were already served by the warm artifacts above, so
      # the marginal cost is the tests' own runtime, not driver builds.
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
          gotestsum: "true"
      # aarch64 cross toolchain, x86 shards only. The TestSelfHost*Arm64 family
      # runs the self-host DRIVER on the host (it is always emitted as x86-64 asm
      # — e2eharness.emitDriverAsm calls x86_64.Emit) and cross-emits the arm64
      # program, so it needs a native x86 host PLUS an aarch64 assembler/linker
      # and qemu to run the result. Without these, Arm64Tooling reports
      # `gcc="" qemu=""` and every one of those tests t.Skips — measured on
      # x86_64-shard8: 11 skipped that way in a single shard, including
      # TestSelfHostPerModuleConcatArm64, whose entire purpose is to LINK the
      # arm64 per-module concat (a dangling cross-unit symbol is invisible to
      # emit-only checks — see #5937/#5940). Those skips read as green.
      # The aarch64 lane cannot substitute: its runner is native arm64, so the
      # x86-64 driver binary will not exec there at all.
      - name: aarch64 cross toolchain (x86 shards — arm64 cross-emit tests)
        if: matrix.host == 'x86_64'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu qemu-user-static
          aarch64-linux-gnu-gcc --version | head -1
          qemu-aarch64-static --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-${{ matrix.host }}
      # DOWNLOAD every driver artifact the `warm` jobs published (x86 only) in a
      # single step: `pattern` places each artifact in its own subdirectory of
      # `path` (content-addressed, byte-identical to a fresh compile), so a
      # shard whose tests use a warmed driver serves it from disk (~1s) instead
      # of the ~70s front-end emit. Adding a warm job now requires NO change
      # here — the pattern picks it up and the run step scans whatever arrived.
      # Drivers are per-run workflow artifacts (not actions/cache): artifacts
      # are not subject to the 10 GB shared cache budget, so they survive
      # however long shards queue before running — the eviction that was
      # causing cold-build preemptions. Drivers not warmed still compile
      # per-shard (closure-cached, so at most once each). continue-on-error so
      # a missing artifact (shouldn't happen — warm is a prerequisite) falls
      # back to cold build rather than failing the shard before any test runs.
      - uses: actions/download-artifact@v4
        if: matrix.host == 'x86_64'
        continue-on-error: true
        with:
          pattern: warm-x86_64-*
          path: ${{ runner.temp }}/warm
      # NOTE: fern.fern is intentionally absent — its tests run inside the
      # `cli` job (see ISOLATED_DRIVER_TESTS), so no shard builds it.
      - name: run self-host shard ${{ matrix.shard }}/${{ matrix.nshard }} (prebuilt binary, streaming)
        id: run
        env:
          SHARD: "${{ matrix.shard }}"
          NSHARD: "${{ matrix.nshard }}"
        run: |
          set -euo pipefail
          chmod +x e2eselfhost.test e2e.test
          SH_BIN="$PWD/e2eselfhost.test"
          E2E_BIN="$PWD/e2e.test"
          # Point FERN_SELFHOST_BUILD_CACHE at a writable local dir (first —
          # the write target for any un-warmed driver built here) followed by
          # every downloaded warm-artifact dir (read-only sources; the harness
          # scans the whole ':'-list on lookup).
          CACHE="$RUNNER_TEMP/uc-local"
          mkdir -p "$CACHE"
          for d in "$RUNNER_TEMP"/warm/*/; do
            # -d guards the unexpanded literal when no artifacts were
            # downloaded (aarch64); the `if` form keeps a false test from
            # tripping `set -e`.
            if [ -d "$d" ]; then CACHE="$CACHE:${d%/}"; fi
          done
          export FERN_SELFHOST_BUILD_CACHE="$CACHE"
          echo "FERN_SELFHOST_BUILD_CACHE=$FERN_SELFHOST_BUILD_CACHE"
          # Sorted UNION of every TestSelfHost* function across BOTH packages
          # (internal/e2eselfhost + the ~30 residuals still in internal/e2e —
          # see RESIDUAL TESTS above), partitioned by the weighted LPT script
          # (see SHARDED above) so heavy tests spread instead of stacking.
          # Read from the prebuilt binaries (no recompile). The isolated
          # fern.fern driver tests (ISOLATED_DRIVER_TESTS) are filtered out
          # here — they run inside the `cli` job, not the shards.
          mapfile -t SH_ALL < <("$SH_BIN" -test.list '^TestSelfHost' | grep '^TestSelfHost' | grep -vE "^(${ISOLATED_DRIVER_TESTS}|${QUARANTINED_TESTS}|${OWN_JOB_TESTS})\$" | sort)
          mapfile -t RES_ALL < <("$E2E_BIN" -test.list '^TestSelfHost' | grep '^TestSelfHost' | grep -vE "^(${ISOLATED_DRIVER_TESTS}|${QUARANTINED_TESTS}|${OWN_JOB_TESTS})\$" | sort)
          mapfile -t MINE < <(printf '%s\n' "${SH_ALL[@]}" "${RES_ALL[@]}" | sort | scripts/selfhost-shard-tests "$SHARD" "$NSHARD" .github/selfhost-test-weights.txt)
          SEL_SH=()
          SEL_RES=()
          for t in "${MINE[@]}"; do
            # membership: residual tests run against the e2e binary, the rest
            # against the selfhost binary (names are disjoint across packages).
            if printf '%s\n' "${RES_ALL[@]}" | grep -qx "$t"; then SEL_RES+=("$t"); else SEL_SH+=("$t"); fi
          done
          if [ ${#SEL_SH[@]} -eq 0 ] && [ ${#SEL_RES[@]} -eq 0 ]; then
            echo "no TestSelfHost tests for shard $SHARD/$NSHARD"; exit 0
          fi
          echo "shard $SHARD/$NSHARD: ${#SEL_SH[@]} selfhost-pkg + ${#SEL_RES[@]} residual tests"
          # Run from each package dir so the tests' ../../ relative paths
          # (examples/self_host, internal/stdlib) resolve. gotestsum's
          # `--raw-command` runs the prebuilt binary through `go tool test2json`
          # (no recompile); the `standard-verbose` format streams each test's
          # RUN/PASS/FAIL live. -test.timeout 18m sits under the 20-min job
          # budget so a genuine hang fails cleanly; a preemption reclaim is
          # distinct and out of our control (see RUNNER PREEMPTION above).
          if [ ${#SEL_SH[@]} -gt 0 ]; then
            PAT="^($(IFS='|'; echo "${SEL_SH[*]}"))\$"
            ( cd internal/e2eselfhost && gotestsum --format standard-verbose --raw-command -- \
                go tool test2json -t -p e2eselfhost "$SH_BIN" -test.run "$PAT" -test.v -test.timeout 18m )
          fi
          if [ ${#SEL_RES[@]} -gt 0 ]; then
            PAT="^($(IFS='|'; echo "${SEL_RES[*]}"))\$"
            ( cd internal/e2e && gotestsum --format standard-verbose --raw-command -- \
                go tool test2json -t -p e2e "$E2E_BIN" -test.run "$PAT" -test.v -test.timeout 18m )
          fi
      # RECORD THE SHARD'S VERDICT for the off-machine `verify` job. These steps
      # run on FAILURE too, so a shard that ran its tests always leaves a
      # marker; a shard whose RUNNER was reclaimed never gets here and leaves
      # none. That absence is the signal `verify` turns into an error — it is
      # the only way to distinguish a reclaim from a test failure, since a dead
      # runner executes no further steps whatever their condition.
      #
      # `!cancelled()` rather than `always()`: this repo cancels runs routinely
      # (cancel-in-progress on the workflow, plus cancel-on-merge.yml), and
      # under `always()` a cancelled shard would record the literal outcome
      # `cancelled`, which `verify` would then report as a real test failure.
      # `verify` carries the matching guard, so on cancellation neither side
      # runs and no spurious verdict is produced.
      - name: record shard outcome
        if: ${{ !cancelled() }}
        run: |
          mkdir -p shard-outcome
          echo '${{ steps.run.outcome }}' > "shard-outcome/${{ matrix.host }}-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shard-outcome-${{ matrix.host }}-${{ matrix.shard }}
          path: shard-outcome/
          retention-days: 1

  # ENFORCE THE SHARD RESULTS (#5912 item 1). Runs on a machine of its own so a
  # reclaimed shard cannot suppress its own verdict, and on failure too so it
  # still reports when `test` comes back red. The strict check lives here rather
  # than in the shards because the x86 shards carry `continue-on-error` (see the
  # note on that flag): without this job, a real `TestSelfHost*X86_64` failure
  # turns NO lane red.
  #
  # Missing-marker policy: fatal by default. Flip
  # FERN_CI_TOLERATE_VANISHED_SHARDS to "1" below to downgrade a vanished shard
  # (runner reclaim / OOM-kill / job timeout) to a reported-but-nonfatal note;
  # a shard that actually RAN and failed stays fatal either way.
  verify:
    needs: [gate, test]
    # `needs.test.result != 'skipped'` keeps this quiet when `test` never ran at
    # all (a `build` failure cascades through `needs`): that is already red at
    # its source, and reporting all 28 shards "vanished" on top of it would bury
    # the real error. `!cancelled()` matches the recording steps' guard — see
    # the note there for why `always()` would manufacture false failures here.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FERN_CI_TOLERATE_VANISHED_SHARDS: "0"
    steps:
      - uses: actions/checkout@v4
      # continue-on-error: download-artifact@v4 hard-fails when its pattern
      # matches nothing (every shard reclaimed, say). Let it pass so the
      # verifier below reports the real, legible "VANISHED" list instead of an
      # opaque "unable to find any artifacts".
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-outcome-*
          path: shard-outcomes
          merge-multiple: true
      # Shard counts are kept in step with the matrix by
      # TestSelfHostWorkflowShardCountsMatchVerifyExpectations (internal/sourcelint):
      # adding a shard here without updating the matrix (or vice versa) fails
      # that unit test rather than silently narrowing what gets enforced.
      - name: verify every shard reported success
        run: scripts/ci-verify-shard-outcomes shard-outcomes x86_64=20 aarch64=8
