name: Test e2e self-host

# `TestSelfHost*` — the self-hosting pipeline suite under
# internal/e2e/self_host_*.go. Covers the bootstrap chain
# (lexer → parser → checker → constfold → printer → disasm → asm →
# VM → cross-validation → self-compile). Each test runs the
# current `lang` binary against the in-tree self-host sources and
# diffs the output against the reference.
#
# COMPILE ONCE, RUN MANY. A `build` job (per arch) compiles the e2e
# test binary a single time with `go test -c` and uploads it as an
# artifact; the sharded `test` jobs download that binary and run their
# slice of it. Previously every one of the (2 arch × N) shards
# recompiled the ~32 MB e2e test binary itself (`go test ./...` rebuilds
# the package per job, ~2.5 min each), so the build cost was paid 2N
# times. Now it is paid twice. This both saves CI minutes and trims each
# shard's wall-clock by ~2.5 min — which matters because of the runner
# behaviour documented under RUNNER PREEMPTION below.
#
# DRIVER WARM CACHE (x86). The dominant per-shard cost is not the Go test binary
# but the self-host DRIVERS: each `*_run.fern` driver statically imports the
# multi-thousand-line front-end, and the Go x86-64 backend takes ~50-70s to emit
# one. A shard that touches several distinct drivers pays that many times (and
# the linked binaries pile multiple GB into the link cache) — long enough to be
# caught by the preemption below. Two changes cut it:
#   * the self-host build cache is keyed on a driver's IMPORT CLOSURE, not its
#     project-dir contents (hashSelfHostSources), so a given driver hashes to ONE
#     key across every test regardless of which other drivers a test drops in the
#     same dir — it builds at most once per shard, and its key is reproducible.
#   * separate, parallel `warm` jobs each compile ONE driver up front (short jobs
#     are never reclaimed) and save it under a per-(driver, SHA) cache key; the
#     test shards RESTORE those, serving the driver from disk (~1s) instead of
#     recompiling. This is the bootstrap a per-shard cache could never give: a
#     shard reclaimed mid-run never reaches its own post-save, so cold shards
#     never seeded one another — a warm job that always finishes does. Warmed:
#     the unified driver selfhost_x86_run.fern (imports the whole front-end +
#     backends, dispatches a backend on argv[1]; shared by the probe tests) plus
#     asm_run / asm_pathprobe_run (the two the bulk of `*IRX86_64` tests build).
#     Un-warmed drivers still compile per shard, now at most once each.
#
# Matrix per arch because individual tests are split per backend
# (TestSelfHostAsmX86_64, TestSelfHostAsmArm64, etc.) — running on
# both runners means each backend-specific test exercises its native
# toolchain rather than skipping for lack of qemu / cross-gcc. The
# aarch64 runner skips the x86 self-host driver builds (and vice-versa),
# so the x86 lane is the long pole; the aarch64 shards finish in well
# under a minute.
#
# SHARDED by test name: each shard claims `index % N == shard` over the
# sorted `-test.list '^TestSelfHost'` output of the prebuilt binary, so
# the set splits ~evenly and new tests are picked up automatically.
# N = 6 (the `test` job is 2 arch × 6 = 12 jobs, plus 2 build jobs).
#
# RUNNER PREEMPTION — why streaming + compile-once, but NOT more shards.
# The x86 self-host shards were intermittently coming back `failure` with
# "The runner has received a shutdown signal" / exit 143, mid-run, with no
# test failures — the runner was reclaimed out from under the job. Two
# hypotheses were tested and BOTH refuted by experiment:
#   * "idle-output watchdog" — added a 30s stdout heartbeat; a shard
#     emitting a heartbeat line every 30s was STILL killed (at ~6.4 min),
#     so it is not a no-output timeout.
#   * "fixed job/runner lifetime" — kills landed at variable times
#     (~6.4 min one run, ~11 min another), so it is not a fixed cap.
# The one robust correlation: short jobs survive (the ~30s aarch64 shards
# are never reclaimed) and long jobs get caught. So this is infrastructure
# preemption of the runner pool, and the only lever we have is to make the
# x86 jobs *shorter* (lower the probability of being caught) — hence
# compile-once (drops the ~2.5 min per-shard rebuild), the UNIFIED-DRIVER WARM
# CACHE above (drops a converted shard's ~50-70s-per-driver compiles to a ~1s
# disk restore), and 6 shards. It CANNOT be made deterministically green from
# CI config alone, and that is
# acceptable: this lane is not a required check, and a shard that survives
# to completion passes. Bumping the shard count was tried (6 → 12) and did
# NOT help — 12-shard jobs were still reclaimed — so do not re-raise N
# expecting it to fix preemption; only raise it if real per-shard work
# (not the shared build) grows past the job budget.
#
# STREAMING OUTPUT. The shards run the binary with `-test.v`, which streams
# each test's RUN/PASS/FAIL as it happens, rather than gotestsum's
# `pkgname-and-test-fails` (which prints nothing until the package ends).
# This gives live progress and — when a shard IS preempted — shows exactly
# which test was in flight at the moment of the kill.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile the e2e test binary ONCE per arch; the sharded test jobs reuse it.
  build:
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: ubuntu-latest,    name: x86_64  }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
    name: build-selfhost-${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - name: compile e2e test binary (go test -c)
        run: go test -c -o e2e.test ./internal/e2e/
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-test-${{ matrix.host.name }}
          path: e2e.test
          retention-days: 1
          if-no-files-found: error

  # WARM THE DRIVER CACHE (x86). The per-shard cost is dominated by self-host
  # DRIVERS, each a ~50-70s Go x86-64 emit of the ~35k-line front-end. With the
  # closure-keyed cache (hashSelfHostSources keys on a driver's import closure,
  # not its dir contents) a given stock driver hashes to ONE key across every
  # test, so it can be compiled once here and restored by the shards. Each warm
  # job compiles a SINGLE driver (~70s) in parallel — short jobs are never
  # reclaimed — and saves it under a per-(driver, SHA) cache key. Keyed by SHA so
  # the warm and its shards share one exact intra-run hand-off (a source change
  # is a new SHA → fresh warm, no staleness). `unified` is selfhost_x86_run.fern
  # (the argv-dispatched all-backends driver the probe tests share); asm_run and
  # asm_pathprobe_run are the two drivers the bulk of the `*IRX86_64` tests build.
  # The aarch64 lane skips the x86 driver tests, so warming is x86-only
  # (x86_64Tooling t.Skip()s elsewhere).
  warm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: unified,  drivers: "selfhost_x86_run.fern" }
          - { key: asm,      drivers: "asm_run.fern,asm_pathprobe_run.fern" }
          - { key: ir,       drivers: "asm_ir_run.fern,asm_load_run.fern" }
          - { key: modload,  drivers: "asm_modload_run.fern,checker_modload_run.fern,ssa_run.fern,ssa_emit_run.fern" }
    name: warm-selfhost-x86_64-${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-x86_64
      - name: warm ${{ matrix.key }} drivers (${{ matrix.drivers }})
        env:
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/selfhost-unicache"
          FERN_WARM_DRIVER: "${{ matrix.drivers }}"
        run: |
          set -euo pipefail
          mkdir -p "$FERN_SELFHOST_BUILD_CACHE"
          chmod +x e2e.test
          BIN="$PWD/e2e.test"
          cd internal/e2e
          "$BIN" -test.run '^TestSelfHostWarmStockDriver$' -test.v -test.timeout 13m
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/selfhost-unicache
          key: selfhost-unicache-x86_64-${{ matrix.key }}-${{ github.sha }}

  test:
    needs: [build, warm]
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: ubuntu-latest,    name: x86_64  }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
        # Six shards. See SHARDED / RUNNER PREEMPTION notes above.
        shard: [0, 1, 2, 3, 4, 5]
    name: test-e2e-selfhost-${{ matrix.host.name }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # for the ../../examples + ../../internal/stdlib data files the tests read
      - uses: ./.github/actions/setup-fern # wasmtime / qemu / cross-gcc + FERN_WASI_ADAPTER
      - uses: actions/download-artifact@v4
        with:
          name: e2e-test-${{ matrix.host.name }}
      # RESTORE the driver caches warmed by the `warm` jobs (x86 only). Each
      # restore drops one prebuilt driver (content-addressed, byte-identical to a
      # fresh compile) into FERN_SELFHOST_BUILD_CACHE, so a shard whose tests use
      # that driver serve it from disk (~1s) instead of the ~70s front-end emit.
      # Restore-only and per-(driver, SHA) keyed: the warm jobs own the entries,
      # so shards never race to save, and the SHA match means no staleness.
      # Drivers not warmed here still compile per-shard (now closure-cached, so a
      # given driver builds at most once per shard regardless of dir shape).
      # One restore per warm group into a SEPARATE dir: actions/cache/restore
      # only populates the first restore into a given path, so restoring all
      # groups into one shared dir would silently keep only the first. The shard
      # points FERN_SELFHOST_BUILD_CACHE at the whole ':'-list (read scans all).
      - uses: actions/cache/restore@v4
        if: matrix.host.name == 'x86_64'
        with:
          path: ${{ runner.temp }}/uc-unified
          key: selfhost-unicache-x86_64-unified-${{ github.sha }}
      - uses: actions/cache/restore@v4
        if: matrix.host.name == 'x86_64'
        with:
          path: ${{ runner.temp }}/uc-asm
          key: selfhost-unicache-x86_64-asm-${{ github.sha }}
      - uses: actions/cache/restore@v4
        if: matrix.host.name == 'x86_64'
        with:
          path: ${{ runner.temp }}/uc-ir
          key: selfhost-unicache-x86_64-ir-${{ github.sha }}
      - uses: actions/cache/restore@v4
        if: matrix.host.name == 'x86_64'
        with:
          path: ${{ runner.temp }}/uc-modload
          key: selfhost-unicache-x86_64-modload-${{ github.sha }}
      - name: run self-host shard ${{ matrix.shard }}/6 (prebuilt binary, streaming)
        env:
          SHARD: "${{ matrix.shard }}"
          NSHARD: "6"
          FERN_SELFHOST_BUILD_CACHE: "${{ runner.temp }}/uc-unified:${{ runner.temp }}/uc-asm:${{ runner.temp }}/uc-ir:${{ runner.temp }}/uc-modload"
        run: |
          set -euo pipefail
          chmod +x e2e.test
          BIN="$PWD/e2e.test"
          # Sorted list of every TestSelfHost* function, partitioned round-robin
          # by list index so each shard runs a disjoint ~1/N slice. Read from the
          # prebuilt binary (no recompile). Sorting makes the partition
          # deterministic and stable as tests are added.
          mapfile -t ALL < <("$BIN" -test.list '^TestSelfHost' | grep '^TestSelfHost' | sort)
          SEL=()
          for i in "${!ALL[@]}"; do
            if [ $(( i % NSHARD )) -eq "$SHARD" ]; then SEL+=("${ALL[$i]}"); fi
          done
          if [ ${#SEL[@]} -eq 0 ]; then
            echo "no TestSelfHost tests for shard $SHARD/$NSHARD"; exit 0
          fi
          # Anchored alternation: ^(A|B|C)$ matches each top-level test exactly
          # (and runs all of its subtests).
          PAT="^($(IFS='|'; echo "${SEL[*]}"))\$"
          echo "shard $SHARD/$NSHARD: ${#SEL[@]} tests: ${SEL[*]}"
          # Run from the package dir so the tests' ../../ relative paths
          # (examples/self_host, internal/stdlib) resolve. -test.v streams each
          # test's RUN/PASS/FAIL live. -test.timeout 18m sits under the 20-min
          # job budget so a genuine hang fails cleanly; a preemption reclaim is
          # distinct and out of our control (see RUNNER PREEMPTION above).
          cd internal/e2e
          "$BIN" -test.run "$PAT" -test.v -test.timeout 18m
