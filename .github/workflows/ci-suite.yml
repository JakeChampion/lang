name: Full suite

# Two full PR suites at a time, called by ci.yml. Keeping the queue here rather
# than in ci.yml leaves lint and lane selection outside it, so a waiting PR
# still gets those checks. Keep main/manual invocations outside this queue:
# main has its own outer latest-pending lock, and reacquiring that lock here
# would deadlock.
#
# TWO lanes, not one, and not three. The account's standard-runner ceiling is
# ~37 concurrent Ubuntu jobs; one suite is ~330 job-minutes over ~21 minutes,
# peaking at 36-38 jobs but averaging only ~20, so a single suite leaves half
# the pool idle across its ramp and tail while the next PR waits. Measurements,
# including the two-suite overlap that pinned the pool flat at 36-37, are in
# docs/CI-PERFORMANCE.md. Two suites fill that slack: the pair completes in
# ~25 minutes against ~41 serialized. A third lane adds no throughput once the
# ceiling is the binding constraint — it only stretches every suite's tail.
on:
  workflow_call:
    inputs:
      lanes:
        description: Exact changed-lane map computed by ci.yml
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# GitHub has no "at most N running per group", so the two lanes are two groups
# and a pull request picks one by the parity of its number. Expressions have no
# arithmetic — no `%` — hence the five `endsWith` terms rather than a modulo;
# `inputs` is deliberately not used here, because whether a called workflow's
# `concurrency` may read it is not something this repo can verify offline, and
# an expression that silently evaluates to empty would collapse both lanes back
# into one without saying so.
#
# Parity of the PR NUMBER, not of the run, so every run for one pull request
# picks the same lane: a re-push then queues behind the predecessor that
# reap-stale-runs.yml is cancelling, inheriting the slot it frees, instead of
# waiting on a stranger in the other lane.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request'
          && format('pr-ci-{0}',
               (endsWith(format('{0}', github.event.pull_request.number), '0')
                 || endsWith(format('{0}', github.event.pull_request.number), '2')
                 || endsWith(format('{0}', github.event.pull_request.number), '4')
                 || endsWith(format('{0}', github.event.pull_request.number), '6')
                 || endsWith(format('{0}', github.event.pull_request.number), '8'))
               && 'even' || 'odd'))
     || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:

  test-units:
    name: Test units
    if: fromJSON(inputs.lanes)['test-units']
    uses: ./.github/workflows/test-units.yml
    secrets: inherit

  test-coreutils:
    name: Test coreutils
    if: fromJSON(inputs.lanes)['test-coreutils']
    uses: ./.github/workflows/test-coreutils.yml
    secrets: inherit

  test-e2e-x86_64:
    name: Test e2e x86_64
    if: fromJSON(inputs.lanes)['test-e2e-x86_64']
    uses: ./.github/workflows/test-e2e-x86_64.yml
    secrets: inherit

  test-e2e-arm64:
    name: Test e2e arm64
    if: fromJSON(inputs.lanes)['test-e2e-arm64']
    uses: ./.github/workflows/test-e2e-arm64.yml
    secrets: inherit

  test-e2e-wasm:
    name: Test e2e wasm
    if: fromJSON(inputs.lanes)['test-e2e-wasm']
    uses: ./.github/workflows/test-e2e-wasm.yml
    secrets: inherit

  test-e2e-other:
    name: Test e2e other
    if: fromJSON(inputs.lanes)['test-e2e-other']
    uses: ./.github/workflows/test-e2e-other.yml
    secrets: inherit

  test-e2e-differential:
    name: Test e2e differential
    if: fromJSON(inputs.lanes)['test-e2e-differential']
    uses: ./.github/workflows/test-e2e-differential.yml
    secrets: inherit

  test-e2e-selfhost:
    name: Test e2e self-host
    if: fromJSON(inputs.lanes)['test-e2e-selfhost']
    uses: ./.github/workflows/test-e2e-selfhost.yml
    secrets: inherit

  test-fernsmith:
    name: Test fernsmith
    if: fromJSON(inputs.lanes)['test-fernsmith']
    uses: ./.github/workflows/test-fernsmith.yml
    secrets: inherit

  fuzz-diff:
    name: Fuzz
    if: fromJSON(inputs.lanes)['fuzz-diff']
    uses: ./.github/workflows/fuzz-diff.yml
    secrets: inherit

  examples:
    name: Examples
    if: fromJSON(inputs.lanes)['examples']
    uses: ./.github/workflows/examples.yml
    secrets: inherit

  perf:
    name: Perf
    if: fromJSON(inputs.lanes)['perf']
    uses: ./.github/workflows/perf.yml
    secrets: inherit
    # Its jobs push refs/notes/perf on main.
    permissions:
      contents: write

  bootstrap:
    name: Bootstrap
    if: fromJSON(inputs.lanes)['bootstrap']
    uses: ./.github/workflows/bootstrap.yml
    secrets: inherit
    # Its `release` job requests `contents: write` for the publish path, and
    # GitHub validates a nested job's permissions against the caller's grant
    # even for a job the event skips; the lane's own `contents: read` still
    # narrows its verify jobs.
    permissions:
      contents: write

  macos:
    name: macOS arm64
    if: fromJSON(inputs.lanes)['macos']
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  docs-build:
    name: Docs build
    if: fromJSON(inputs.lanes)['docs-build']
    uses: ./.github/workflows/docs-build.yml
    secrets: inherit

  playground-e2e:
    name: Playground E2E
    if: fromJSON(inputs.lanes)['playground-e2e']
    uses: ./.github/workflows/playground-e2e.yml
    secrets: inherit

  vscode-extension:
    name: VS Code Extension
    if: fromJSON(inputs.lanes)['vscode-extension']
    uses: ./.github/workflows/vscode-extension.yml
    secrets: inherit

  # One reaper per lane, so the run is cancelled the moment ANY lane concludes
  # failure rather than when all of them have. `!cancelled()` is load-bearing:
  # without a status function in the condition, `success()` is implied and a
  # job that waits on a failed one never runs. Pull requests only — a red main
  # runs to completion so the failing-job list is the whole set.
  # TestCancelOnFailureWatchesEveryPRLane pins one of these per lane.

  reap-test-units:
    needs: [test-units]
    if: ${{ !cancelled() && needs.test-units.result == 'failure' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/cancel-on-failure.yml
    with:
      lane: Test units
    permissions:
      actions: write
      contents: read
      pull-requests: read

  reap-test-coreutils:
    needs: [test-coreutils]
    if: ${{ !cancelled() && needs.test-coreutils.result == 'failure' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/cancel-on-failure.yml
    with:
      lane: Test coreutils
    permissions:
      actions: write
      contents: read
      pull-requests: read

  reap-test-e2e-x86_64:
