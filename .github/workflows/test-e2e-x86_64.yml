name: Test e2e x86_64

# `TestX86_64*` — the x86-64 Linux ELF backend's end-to-end suite.
# Mirror of test-e2e-arm64.yml on the x86 lane.
#
# Only scheduled on `ubuntu-latest` (x86_64). On the arm64 runner
# every test here would SKIP because `qemu-x86_64` isn't installed
# and we don't ship an x86 cross-gcc. Pinning to the native host
# keeps this lane exercising native execution. The main suite uses two
# isolated workers with one shared CPU budget; see docs/CI-X86-WORKERS.md.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

env:
  # gotestsum reads this as --jsonfile: the event stream the
  # failure-annotation step names the failed tests from.
  GOTESTSUM_JSONFILE: /tmp/gotestsum.jsonl

jobs:
  # Two shards of equal count (scripts/shard-tests with no weights file): one
  # job of the ^TestX86_64 set in two workers was 13.3 minutes, the longest
  # job outside the self-host lane once the driver cache landed. The fixture
  # corpus is not a seed sweep, so it runs once, on the first shard.
  test:
    name: test-e2e-x86_64-shard${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nshard: 2, shard: 0 }
          - { nshard: 2, shard: 1 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/selfhost-driver-cache
      - name: build the e2e test binary
        run: |
          go test -c -o "$RUNNER_TEMP/e2e-x86_64.test" ./internal/testing/e2e/
          go build -o "$RUNNER_TEMP/ci-test-workers" ./cmd/ci-test-workers
      - name: go test (x86_64 e2e, shard ${{ matrix.shard }}/${{ matrix.nshard }}, two workers)
        id: tests
        # `^TestX86_64` covers internal/testing/e2e/x86_64_test.go +
        # cross_module_variant_test.go's X86_64 subset. The
        # trailing underscore is in the test names themselves
        # (TestX86_64ExitCode, etc) so the regex is unambiguous
        # against TestX86 prefixes.
        #
        # -timeout is EXPLICIT because this suite had outgrown Go's 10m0s
        # default: three consecutive runs measured 9m51s, 10m19s and 8m29s, so
        # the run-to-run spread was an order of magnitude larger than the
        # headroom and a timeout was a coin flip. It does not fail like a
        # timeout, either — the panic names whichever test was in flight when
        # the alarm fired, which reads as that test hanging and sent one PR
        # chasing a TRMC deep-stack test that passes in 0.20s.
        run: |
          set -euo pipefail
          mapfile -t MINE < <(
            go test -list '^TestX86_64' ./internal/testing/e2e/ |
              grep -E '^Test' |
              sort |
              scripts/shard-tests "${{ matrix.shard }}" "${{ matrix.nshard }}" /dev/null
          )
          if [ ${#MINE[@]} -eq 0 ]; then
            echo "no tests for shard ${{ matrix.shard }}/${{ matrix.nshard }} — the list or the filter is wrong" >&2
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/${{ matrix.nshard }}: ${#MINE[@]} tests"
          PAT="^($(IFS='|'; echo "${MINE[*]}"))\$"
          cd internal/testing/e2e
          "$RUNNER_TEMP/ci-test-workers" \
            -binary "$RUNNER_TEMP/e2e-x86_64.test" \
            -output "$RUNNER_TEMP/x86_64-test-results" \
            -workers 2 -timeout 25m -run "$PAT"
      - name: retain native test outcomes
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: native-x86_64-test-outcomes-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/x86_64-test-results
          retention-days: 7
          if-no-files-found: error

      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$RUNNER_TEMP"/x86_64-test-results/worker-*.jsonl "$GOTESTSUM_JSONFILE"

  seccomp-corpus-x86_64:
    # #6071's over-tightness gate at corpus scale, and the precondition for
    # ever defaulting the sandbox on. Four hand-written programs cannot show
    # that a filter derived from one program's emitted syscalls is right for
    # every program; a syscall the filter forgot is a SIGSYS kill on whichever
    # path nobody exercised. Own lane because it builds every runnable fixture
    # twice — sandboxed and not — and compares behaviour.
    name: seccomp-corpus-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/selfhost-driver-cache
      - name: go test (fixture corpus under the seccomp filter)
        env:
          RUN_SECCOMP_CORPUS: "1"
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestSeccompFixtureCorpus$' ./internal/testing/e2e/ -timeout 30m
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$GOTESTSUM_JSONFILE"
