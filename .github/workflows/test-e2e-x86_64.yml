name: Test e2e x86_64

# `TestX86_64*` — the x86-64 Linux ELF backend's end-to-end suite.
# Mirror of test-e2e-arm64.yml on the x86 lane.
#
# Only scheduled on `ubuntu-latest` (x86_64). On the arm64 runner
# every test here would SKIP because `qemu-x86_64` isn't installed
# and we don't ship an x86 cross-gcc. Pinning to the native host
# keeps the lane finishing in ~90s instead of paying a no-op
# 30-second skip pass on the other arch.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds the PR-wide lock (one pull
# request's suite at a time), decides from the changed files whether this lane
# runs — the lane's path filter lives in its lane table — and cancels the rest
# of the run when a lane goes red. `workflow_dispatch` stays so the lane can
# be run on its own, outside that lock.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      buffer-benchmark:
        description: Compare the instruction buffer on one native x86 runner
        type: choice
        options: ["off", pilot, full]
        default: "off"
      generation:
        description: Compiler generation to measure
        type: choice
        options: [gen1, gen0]
        default: gen1

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buffer-benchmark == 'off' }}
    name: test-e2e-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: go test (x86_64 e2e)
        # `^TestX86_64` covers internal/e2e/x86_64_test.go +
        # cross_module_variant_test.go's X86_64 subset. The
        # trailing underscore is in the test names themselves
        # (TestX86_64ExitCode, etc) so the regex is unambiguous
        # against TestX86 prefixes.
        #
        # -timeout is EXPLICIT because this suite had outgrown Go's 10m0s
        # default: three consecutive runs measured 9m51s, 10m19s and 8m29s, so
        # the run-to-run spread was an order of magnitude larger than the
        # headroom and a timeout was a coin flip. It does not fail like a
        # timeout, either — the panic names whichever test was in flight when
        # the alarm fired, which reads as that test hanging and sent one PR
        # chasing a TRMC deep-stack test that passes in 0.20s.
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestX86_64' -timeout 25m ./internal/e2e/

      # The pure-Go in-process assembler+linker (internal/native/x86_64 +
      # internal/native/elf) is the DEFAULT assemble+link path for
      # `cmd/fern -target x86-64-linux` — and it falls back to gcc automatically on
      # any instruction it cannot encode, so a gap in it degrades silently rather
      # than failing. FERN_NATIVE_ASM=1 routes the whole fixture corpus through it
      # with no fallback (an encode error is a hard NATIVE-ASM-FAIL), which is the
      # only thing that actually exercises the production path.
      #
      # Nothing set the variable, so nothing ever ran this. The missing `ud2`
      # encoding (#6021) is what that cost: FERN_RC_FREE_DEBUG=1 — the
      # use-after-free detector — could not build at all on the default path, and
      # it is the tool that found the bug once it worked.
      #
      # It is ~60 SECONDS, which is why it is a step here rather than the job it
      # used to be: a job that short spends more on its checkout, its toolchain
      # and its wait for a runner than on the work. lint.yml measured that shape
      # at 165 job-minutes of queue for ~5 minutes of work (run 31819147972).
      - name: go test (fixture corpus through the in-process assembler)
        if: ${{ !cancelled() }}
        env:
          FERN_NATIVE_ASM: "1"
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestFernFixtures$' ./internal/e2e/

  seccomp-corpus-x86_64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.buffer-benchmark == 'off' }}
    # #6071's over-tightness gate at corpus scale, and the precondition for
    # ever defaulting the sandbox on. Four hand-written programs cannot show
    # that a filter derived from one program's emitted syscalls is right for
    # every program; a syscall the filter forgot is a SIGSYS kill on whichever
    # path nobody exercised. Own lane because it builds every runnable fixture
    # twice — sandboxed and not — and compares behaviour.
    name: seccomp-corpus-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: go test (fixture corpus under the seccomp filter)
        env:
          RUN_SECCOMP_CORPUS: "1"
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestSeccompFixtureCorpus$' ./internal/e2e/ -timeout 30m

  benchmark-instruction-buffer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buffer-benchmark != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE_REV: 78a457c36beeb0b5d01d5a1ecd59b27e8d2c5217
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Prepare fixed baseline and compiler bootstrap
        run: |
          CI_BUFFER_PROFILE_ROOT="$RUNNER_TEMP/buffer-profile"
          CI_BUFFER_BOOTSTRAP="$RUNNER_TEMP/buffer-bootstrap"
          printf 'CI_BUFFER_PROFILE_ROOT=%s\nCI_BUFFER_BOOTSTRAP=%s\n' "$CI_BUFFER_PROFILE_ROOT" "$CI_BUFFER_BOOTSTRAP" >> "$GITHUB_ENV"
          git fetch --no-tags origin "$BASELINE_REV"
          git worktree add --detach "$RUNNER_TEMP/buffer-baseline" "$BASELINE_REV"
          cp internal/e2eselfhost/ci_buffer_profile_test.go "$RUNNER_TEMP/buffer-baseline/internal/e2eselfhost/"
          mkdir "$CI_BUFFER_PROFILE_ROOT"
          go build -o "$CI_BUFFER_BOOTSTRAP" ./cmd/fern
          {
            uname -a
            lscpu
            free -b
            go version
            gcc --version
          } > "$CI_BUFFER_PROFILE_ROOT/environment.txt"
      - name: Build baseline generations
        working-directory: ${{ runner.temp }}/buffer-baseline
        env:
          CI_BUFFER_BUILD_ROOT: ${{ runner.temp }}/buffer-profile/baseline
        run: go test ./internal/e2eselfhost -run '^TestCIInstructionBufferBuild$' -count=1 -timeout 10m -v
      - name: Build candidate generations
        env:
          CI_BUFFER_BUILD_ROOT: ${{ runner.temp }}/buffer-profile/candidate
        run: go test ./internal/e2eselfhost -run '^TestCIInstructionBufferBuild$' -count=1 -timeout 10m -v
      - name: Compare native compilation and verify assembly
        env:
          CI_BUFFER_SCALE: ${{ inputs.buffer-benchmark }}
          CI_BUFFER_GENERATION: ${{ inputs.generation }}
        run: go test ./internal/e2eselfhost -run '^TestCIInstructionBufferMeasure$' -count=1 -timeout 10m -v
      - name: Retain measurements and identities
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-buffer-${{ inputs.buffer-benchmark }}-${{ inputs.generation }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buffer-profile/environment.txt
            ${{ runner.temp }}/buffer-profile/*/build.json
            ${{ runner.temp }}/buffer-profile/*/unit-names.json
            ${{ runner.temp }}/buffer-profile/results-*/*.json
          retention-days: 7
          if-no-files-found: error
