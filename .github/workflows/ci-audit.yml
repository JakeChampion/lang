name: CI audit

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-audit
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: write
      actions: write
      pull-requests: read
