name: Test units

# Fast unit tests — everything under internal/ except the two
# big-iron packages that get their own workflows:
#
#   internal/e2e + internal/e2eselfhost (+ their shared
#                        internal/e2eharness) — split into test-e2e-*
#                        (arm64 / x86_64 / wasm / selfhost / other) so
#                        the 5-minute sequential block fans out.
#   internal/fernsmith — its own workflow (fuzz corpus + generator
#                        machinery; ~60s).
#
# Matrix per host arch so backend-tagged unit tests (e.g.
# internal/codegen/wasmbin, internal/ir invariants) get exercised
# under both ABIs. Sub-60s on warm cache.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-CI sign-off gate. If this commit was signed off with
  # `gh signoff units` (see docs/CI-SIGNOFF.md), skip the lane below —
  # the author already ran the unit suite locally. Fork PRs can't post a
  # sign-off status, so they always run; the gate fails open on any error.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: units
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: test-units-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - name: go test (units)
        # Explicitly list packages instead of `./...` minus excludes —
        # `go test` has no built-in negation and a comm-style filter
        # makes the command harder to read than the enumerated set.
        # Add new packages here when they appear.
        #
        # NOTE the claimed forcing function ("the test-units check
        # failing on an unlisted new package") does NOT exist: an
        # unlisted package is simply never run, silently. Six packages
        # with real tests — caps, literate, manifest, mvs, pkgcache,
        # sourcelint — had accumulated off this list, and internal/caps
        # was RED on main for it (a builtin added to the checker +
        # interp without a capability classification) while CI stayed
        # green. All six are listed below now. If you add a package,
        # add it here; nothing will remind you.
        run: |
          gotestsum --format pkgname-and-test-fails -- \
            ./internal/ast/... \
            ./internal/caps/... \
            ./internal/checker/... \
            ./internal/closureconv/... \
            ./internal/codegen/... \
            ./internal/constfold/... \
            ./internal/diag/... \
            ./internal/interp/... \
            ./internal/ir/... \
            ./internal/fernstring/... \
            ./internal/lexer/... \
            ./internal/literate/... \
            ./internal/lsp/... \
            ./internal/manifest/... \
            ./internal/modload/... \
            ./internal/monomorph/... \
            ./internal/mvs/... \
            ./internal/parser/... \
            ./internal/pkgcache/... \
            ./internal/platforms/... \
            ./internal/printer/... \
            ./internal/shadowrename/... \
            ./internal/sourcelint/... \
            ./internal/ssa/... \
            ./internal/stdlib/... \
            ./internal/treeshake/... \
            ./internal/wasm/...
