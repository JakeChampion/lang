name: Test units

# Fast unit tests — everything under internal/ except the two
# big-iron packages that get their own workflows:
#
#   internal/e2e + internal/e2eselfhost — split into test-e2e-*
#                        (arm64 / x86_64 / wasm / selfhost / other) so
#                        the 5-minute sequential block fans out. Their
#                        shared harness, internal/e2eharness, runs HERE:
#                        its own 20 tests are sub-second (#8470).
#   internal/fernsmith — its own workflow (fuzz corpus + generator
#                        machinery; ~60s).
#
# Matrix per host arch so backend-tagged unit tests (e.g.
# internal/codegen/wasmbin, internal/ir invariants) get exercised
# under both ABIs.
#
# THE RUNTIMES ARE INSTALLED HERE, not assumed absent. Every wasm test in
# these packages opens with an `exec.LookPath("wasmtime")` and every arm64
# execution test with a `qemu-aarch64` one, and both t.Skip when the lookup
# fails — so a lane without the runtimes reports `ok` for a family it never
# ran, which is the state this lane was in (#8472). The preflight below turns
# a half-installed runtime back into a job failure.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: test-units-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    env:
      GNU_COREUTILS_VERSION: "9.12"
    steps:
      - uses: actions/checkout@v7
      # THE REPO'S ONE Go-BUILD-CACHE PRODUCER. Every other job in every
      # other workflow restores this cache and never writes one (see the
      # restore step in .github/actions/setup-fern). This lane is the
      # producer because it is the broadest compile in the repo — `go list
      # ./internal/... ./cmd/...` minus the three slow packages — and it
      # already runs on push to main, on both arches, which is exactly the
      # (arch, tree) product the cache key is cut on.
      - name: Cache day stamp
        id: day
        run: echo "stamp=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # wasmtime, because this lane owns the wasm UNIT packages and no other
      # lane runs them: internal/codegen/wasmbin,
      # internal/wasm/{component,componenttype,simd,playground} and cmd/fern's
      # component-runtime cases. 902 test sites across internal/ open with
      # `exec.LookPath("wasmtime")` and t.Skip() without it, and a skipped test
      # reports `ok` — so the lane was green while never executing a module
      # (#8472). CLAUDE.md: a SKIP is a missing dependency to fix, not a green
      # light.
      #
      # setup-fern's own comment reasons about the cost — the two install
      # profiles must not share a cache, and a shard measured without wasmtime
      # keeps its weight — but that argument is about the wasm E2E lanes, which
      # have their own workflow. It was never true of the wasm unit packages.
      #
      # Requesting it also arms setup-fern's preflight, which fails the JOB
      # when a requested tool is missing. That is what makes this real rather
      # than hopeful: without it a half-succeeded install returns the lane to
      # silently running nothing.
      - uses: ./.github/actions/setup-fern
        with:
          build-cache-key: ${{ steps.day.outputs.stamp }}
          wasmtime: true
      # qemu-aarch64 for the arm64 EXECUTION tests in the unit packages —
      # internal/codegen/arm64ssa's TestArmRun* family and internal/native/elf's
      # *RunsUnderQemu cases — plus the aarch64 binutils/gcc that
      # internal/native/arm64's gas oracle and internal/e2eharness's
      # native-linker parity gate assemble against. Same lookup-and-skip shape
      # as wasm: without these the tests report `ok` having executed nothing.
      #
      # `qemu-user` rather than the action's `qemu-user-static` default,
      # because these tests LookPath("qemu-aarch64"), which is the name that
      # package provides.
      #
      # The CROSS compiler only on the x86 leg. The aarch64 leg already has a
      # native gcc/as (Arm64Tooling takes that path), and the two tests that
      # name `aarch64-linux-gnu-as` outright — internal/native/arm64's gas
      # oracle and CFI profile — are covered by the x86 leg; asking an arm64
      # runner for a cross package it may not carry would trade a real skip for
      # an infrastructure red.
      - name: aarch64 runtime + assembler (arm64 execution tests)
        uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
          cross-gcc: ${{ matrix.host == 'x86_64' }}
      # A SKIP IS A MISSING DEPENDENCY, NOT A PASS. setup-fern asserts the wasm
      # half of this for `wasmtime: true`; this is the arm64 half. Without it a
      # dropped apt cache or a renamed package silently returns the lane to
      # green-by-skip, which is exactly how it spent its life.
      - name: Assert the aarch64 runtime is actually usable
        env:
          WANT_CROSS: ${{ matrix.host == 'x86_64' }}
        run: |
          set -euo pipefail
          tools=(qemu-aarch64)
          if [ "$WANT_CROSS" = "true" ]; then
            tools+=(aarch64-linux-gnu-gcc aarch64-linux-gnu-as)
          fi
          fail=0
          for tool in "${tools[@]}"; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH — the arm64 execution tests in the unit packages would t.Skip() and this lane would report a false green"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          qemu-aarch64 --version | head -1
      # llvm-mc second oracle for the assembler differential lanes
      # (internal/native/{x86_64,arm64} TestEncodingsAgainstLLVMMC, #7895):
      # the tests skip when llvm-mc is absent, so this install is what makes
      # that lane real. One leg only — llvm-mc cross-encodes both targets, so
      # the arm64 leg would repeat the same work. Same tolerable-failure
      # shape as setup-fern's lld step: a failed install merely skips the
      # lane, but a hung apt must not eat the job.
      - name: Ensure llvm-mc (assembler second oracle)
        if: ${{ matrix.host == 'x86_64' }}
        run: |
          if command -v llvm-mc >/dev/null 2>&1 || command -v llvm-mc-18 >/dev/null 2>&1; then
            echo "llvm-mc already present"
            exit 0
          fi
          if ! sudo timeout 120 apt-get update -qq; then
            echo "apt-get update failed or timed out; the llvm-mc oracle lane will skip" >&2
            exit 0
          fi
          if ! sudo timeout 120 apt-get install -y -qq llvm; then
            echo "llvm install failed or timed out; the llvm-mc oracle lane will skip" >&2
            exit 0
          fi
          if command -v llvm-mc >/dev/null 2>&1; then
            llvm-mc --version | head -2
          fi
      # The WHOLE GNU coreutils catalogue, built, because the runner image's
      # own is not the version the corpus is held to: ubuntu-24.04 ships 9.4
      # and docs/COREUTILS.md pins the oracle to 9.12. Installing only the
      # handful of binaries the image lacks leaves every other utility
      # answering from /usr/bin, which costs about two thousand cases across
      # sixty utilities, each reporting a version difference as Fern's bug.
      #
      # It also supplies what Debian and Ubuntu leave out. Their coreutils
      # package builds neither `uptime` nor `kill`, and the /usr/bin copies of
      # both belong to PROCPS -- different programs, with different options
      # and different output. `chroot` is a third: Debian builds it but
      # installs it to /usr/sbin, which is not a directory gnuCandidates()
      # searches. `arch` is a fourth, and needs naming in
      # --enable-install-program because coreutils lists it in
      # no_install__progs -- `make install` places every other program and
      # never it.
      #
      # `make` in full rather than the named targets: a named target skips
      # the gnulib header generation the build depends on and dies on a
      # missing stdckdint.h. FORCE_UNSAFE_CONFIGURE because coreutils'
      # configure refuses to run as a user it thinks might be root.
      #
      # Cached, because the build is the only slow part of this step: about
      # three minutes cold, seconds warm.
      - name: Cache the GNU coreutils oracle
        id: gnu-oracles
        uses: actions/cache@v6
        with:
          path: ~/gnu-coreutils
          key: gnu-coreutils-full-${{ env.GNU_COREUTILS_VERSION }}-${{ matrix.host }}
      - name: Build the GNU coreutils oracle
        if: steps.gnu-oracles.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="$GNU_COREUTILS_VERSION"
          work="$(mktemp -d)"
          cd "$work"
          curl -fsSLO "https://ftp.gnu.org/gnu/coreutils/coreutils-$ver.tar.xz"
          tar xf "coreutils-$ver.tar.xz"
          cd "coreutils-$ver"
          FORCE_UNSAFE_CONFIGURE=1 ./configure --quiet --disable-nls --without-selinux \
            --enable-install-program=arch,kill,uptime
          make -j"$(nproc)"
          make install prefix="$HOME/gnu-coreutils"
          rm -rf "$HOME/gnu-coreutils/share" "$HOME/gnu-coreutils/libexec"
          cd /
          rm -rf "$work"
      # A SKIP IS A MISSING DEPENDENCY, NOT A PASS. Without this a cache that
      # restored an empty or half-written directory would leave a corpus with
      # no reference, and the failure would name the utility rather than this
      # step -- the same missing oracle reported as a hundred unrelated bugs.
      #
      # The list is DERIVED from coreutils/*.fern rather than written out: a
      # utility added to the tree is one this check must cover, and an
      # enumerated list is a list that goes stale silently.
      #
      # `chcon` and `runcon` are the two exceptions and come from /usr/bin.
      # They need SELinux, the build above configures --without-selinux, and
      # from 9.9 configure omits both rather than building gnulib stubs, so
      # the tree holds neither. Ubuntu's are real ones against the same
      # library the corpus compared them with before this step widened.
      - name: Assert the oracle is GNU coreutils, and point the corpus at it
        run: |
          set -euo pipefail
          bindir="$HOME/gnu-coreutils/bin"
          missing=""
          checked=0
          for f in coreutils/*.fern; do
            util="$(basename "$f" .fern)"
            dir="$bindir"
            case "$util" in chcon|runcon) dir=/usr/bin ;; esac
            probe="$dir/$util"
            # test(1) answers no --version: POSIX reserves every argument for
            # the expression, so only `[` -- built from the same source, one
            # name over -- can vouch for it.
            if [ "$util" = "test" ]; then probe="$dir/["; fi
            if [ ! -x "$probe" ]; then
              missing="$missing $util"
              continue
            fi
            # `dd` is the one utility whose version line omits the word GNU:
            # it says `dd (coreutils) 9.12`. Both spellings are the package's.
            # Read into a variable rather than piping into grep: `head -1`
            # closes the pipe on a program that has more to write, and under
            # `set -o pipefail` that SIGPIPE is the pipeline's status, so a
            # present oracle would report as a missing one.
            line="$("$probe" --version 2>/dev/null | head -1 || true)"
            case "$line" in
              *"(GNU coreutils)"* | *"(coreutils)"*) checked=$((checked + 1)) ;;
              *) missing="$missing $util" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::no GNU coreutils oracle for:$missing"
            exit 1
          fi
          echo "$checked utilities have a GNU oracle"
          "$bindir/yes" --version | head -1
          # The built tree FIRST. /usr/bin is appended, not prepended: the
          # harness takes the first directory that holds the utility, so the
          # image's 9.4 ahead of this one would shadow the whole catalogue.
          echo "FERN_GNU_COREUTILS=$HOME/gnu-coreutils/bin:/usr/bin" >> "$GITHUB_ENV"
      - name: go test (units)
        # internal/e2eharness's arm64 native-link parity gate runs ONLY here, so
        # a t.Skip would cover nothing: Arm64Tooling turns it into a failure.
        # Both legs satisfy it — the aarch64 runner through its native gcc.
        #
        # Its x86-64 mirror is scoped to the x86_64 leg, where the compiler is
        # native. The aarch64 leg carries no x86 cross-compiler — the same
        # reason cross-gcc above installs on the x86 leg only — so it skips
        # those two gates by design and must not be asked to require them.
        env:
          FERN_REQUIRE_ARM64_TOOLING: "1"
          FERN_REQUIRE_X86_64_TOOLING: ${{ matrix.host == 'x86_64' && '1' || '' }}
        # The package set is DERIVED, not enumerated — see
        # scripts/unit-test-packages, which is also what the Netlify smoke
        # lane's `units` stage runs, so the two cannot cover different sets.
        #
        # This step used to carry a hand-written list of ./internal/<pkg>/...
        # patterns, along with a comment conceding that "an unlisted package
        # is simply never run, silently. If you add a package, add it here;
        # nothing will remind you." Nothing did. Three rounds of drift were
        # already recorded there:
        #   - internal/{caps,literate,manifest,mvs,pkgcache,sourcelint} had
        #     accumulated off the list, and internal/caps was RED on main for
        #     it (a builtin added to the checker + interp with no capability
        #     classification) while CI stayed green.
        #   - ./cmd/... was never listed AT ALL — 42 tests across cmd/fern +
        #     cmd/ferndoc, one of which (the -async-provider params bundling
        #     test) had gone red under the wasmtime v46 component-model-async
        #     port and nobody could see it (#5490).
        #   - ./internal/native/... likewise: the pure-Go assembler and
        #     ELF/Mach-O linkers every self-host driver build goes through.
        # A fourth was live when the list was replaced: internal/embed had a
        # test file and no lane ran it.
        #
        # `go list` cannot go stale, so the fifth round does not happen.
        #
        # -timeout is set EXPLICITLY because internal/coreutils is a
        # ten-minute test binary in a lane whose other packages are seconds:
        # it compiles all ~70 utilities twice — once with the native compiler,
        # once with the self-host one — and runs both corpora. go test's
        # default timeout is also ten minutes, and a binary that default kills
        # reports whichever cases were in flight as failures with no output
        # and an unknown elapsed, so the lane names tests that did not fail
        # and never names the wall it hit.
        run: |
          # shellcheck disable=SC2046 # the package list is deliberately word-split
          gotestsum --format pkgname-and-test-fails -- -timeout 25m \
            $(scripts/unit-test-packages)
      # PUBLISH the cache every other job restores. Main only: a save per PR
      # job would be ~85 multi-gigabyte writes per push against a 10 GB
      # repository budget, which is the failure mode that made the previous
      # key never save at all.
      #
      # Once a day, not once a merge: the key carries the date, and
      # actions/cache/save declines a key that already exists, so the first
      # main push of the day writes and the rest of the day's merges no-op.
      # That bounds the write rate without any extra bookkeeping. A day-old
      # cache is not stale in any way that matters — Go fingerprints entries
      # per file, so only what changed since recompiles.
      #
      # continue-on-error because this is pure optimisation: the declined-key
      # warning, a full budget, or a flaky upload must never redden main for a
      # lane whose job is to report test results.
      - name: Save Go build cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ steps.day.outputs.stamp }}
