name: Docs build

# Per-PR validation that the docs site builds + behaves. Two
# layers stacked on top of each other:
#
#   1. Build the playground wasm, stage it under site/public/,
#      regenerate the stdlib reference via cmd/ferndoc, then run
#      `npm run build` under site/. Failures here block the PR —
#      a docs change that breaks the build (broken MDX, missing
#      component import) shouldn't land.
#   2. Run the Playwright suite under site/test/playwright/
#      against the built site (served by `astro preview`).
#      Asserts navigation + sidebar + embedded playground +
#      stdlib pages + search dialog work — covers the dangling-
#      link case the lychee step would have caught, just via
#      page navigation rather than static HTML scan.
#
# A lychee-style link checker pass is a follow-up. Starlight
# emits every internal link as a `base`-prefixed absolute URL
# (`/lang/foo/`) which lychee's local-file resolver doesn't
# handle cleanly without per-runner-path config — punted until
# it's worth the harness work.
#
# Path-filtered so unrelated edits don't burn minutes; the same
# filter the Pages workflow uses, kept in sync manually for now.

on:
  pull_request:
    paths:
      - "cmd/fern-wasm/**"
      - "cmd/ferndoc/**"
      - "web/**"
      - "site/**"
      # The docs site loads this TextMate grammar for ```fern code
      # highlighting, so a grammar edit should rebuild the docs.
      - "editors/vscode/syntaxes/**"
      - "internal/ast/**"
      - "internal/checker/**"
      - "internal/constfold/**"
      - "internal/diag/**"
      - "internal/interp/**"
      - "internal/lexer/**"
      - "internal/modload/**"
      - "internal/monomorph/**"
      - "internal/parser/**"
      - "internal/prelude/**"
      - "internal/stdlib/**"
      - "internal/treeshake/**"
      - "go.mod"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 6 requires Node >=22.12. Bump together with the
          # `astro` pin in site/package.json.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package.json

      - name: Build playground wasm
        run: ./web/build.sh

      - name: Stage playground into site/public/playground/
        # Stage every runtime asset the playground loads, not just the
        # entry point: index.html statically imports ./wasi-shim.js and
        # ./wasi-http-shim.js, so a 404 on either aborts the whole
        # module and the playground hangs on "loading runtime…". Glob
        # *.html/*.js/*.wasm so newly-added local assets stage too.
        run: |
          rm -rf site/public/playground
          mkdir -p site/public/playground
          cp -L web/*.html web/*.js web/*.wasm site/public/playground/

      - name: Generate stdlib reference
        run: go run ./cmd/ferndoc -out site/src/content/docs/stdlib/

      - name: Install + build
        working-directory: site
        run: |
          npm install
          npm run build

      # The browser is a ~170 MB download; caching it keeps most runs off the
      # network for that half. The apt half of `--with-deps` below is NOT
      # cached and remains exposed to the mirror stalls in #6038 — it is the
      # font packages there that were seen crawling at 35 KB/s.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ hashFiles('site/test/playwright/package.json') }}

      - name: Install Playwright deps
        working-directory: site/test/playwright
        run: |
          npm install
          # --with-deps installs the apt packages Chromium needs
          # under Ubuntu sandbox restrictions.
          npx playwright install --with-deps chromium

      - name: Run docs Playwright suite
        # `astro preview` (started by playwright.config.ts's
        # webServer) serves site/dist/ at /lang/.
        working-directory: site/test/playwright
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: site/test/playwright/playwright-report/
          if-no-files-found: ignore

      - name: Upload built site (for review on failed deploys)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: site/dist/
          if-no-files-found: ignore
