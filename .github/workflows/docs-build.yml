name: Docs build

# Per-PR validation that the docs site still builds. Runs the
# same steps the Pages workflow does on push, minus the deploy:
# build the playground wasm, stage it under site/public/,
# regenerate the stdlib reference via cmd/langdoc, then run
# `npm run build` under site/. Failures here block the PR — a
# docs change that breaks the build (broken MDX, missing
# component import, dangling link) shouldn't land.
#
# Path-filtered so unrelated edits don't burn minutes; the same
# filter the Pages workflow uses, kept in sync manually for now.

on:
  pull_request:
    paths:
      - "cmd/lang-wasm/**"
      - "cmd/langdoc/**"
      - "web/**"
      - "site/**"
      - "internal/ast/**"
      - "internal/checker/**"
      - "internal/constfold/**"
      - "internal/diag/**"
      - "internal/interp/**"
      - "internal/lexer/**"
      - "internal/modload/**"
      - "internal/monomorph/**"
      - "internal/parser/**"
      - "internal/prelude/**"
      - "internal/stdlib/**"
      - "internal/treeshake/**"
      - "go.mod"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package.json

      - name: Build playground wasm
        run: ./web/build.sh

      - name: Stage playground into site/public/playground/
        run: |
          rm -rf site/public/playground
          mkdir -p site/public/playground
          cp -L web/index.html web/wasm_exec.js web/lang.wasm site/public/playground/

      - name: Generate stdlib reference
        run: go run ./cmd/langdoc -out site/src/content/docs/stdlib/

      - name: Install + build
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Upload built site (for review on failed deploys)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: site/dist/
          if-no-files-found: ignore
