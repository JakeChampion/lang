name: Docs build

# Per-PR validation that the docs site builds + behaves. Three
# layers stacked on top of each other:
#
#   1. Build the playground wasm, stage it under site/public/,
#      regenerate the stdlib reference via cmd/langdoc, then run
#      `npm run build` under site/. Failures here block the PR —
#      a docs change that breaks the build (broken MDX, missing
#      component import) shouldn't land.
#   2. Link-check the built site with lychee. Catches dangling
#      `/tutorial/foo/` references that survived the build but
#      point at nothing.
#   3. Run the Playwright suite under site/test/playwright/
#      against the built site (served by `astro preview`).
#      Asserts navigation + sidebar + embedded playground +
#      stdlib pages + search dialog work.
#
# Path-filtered so unrelated edits don't burn minutes; the same
# filter the Pages workflow uses, kept in sync manually for now.

on:
  pull_request:
    paths:
      - "cmd/lang-wasm/**"
      - "cmd/langdoc/**"
      - "web/**"
      - "site/**"
      - "internal/ast/**"
      - "internal/checker/**"
      - "internal/constfold/**"
      - "internal/diag/**"
      - "internal/interp/**"
      - "internal/lexer/**"
      - "internal/modload/**"
      - "internal/monomorph/**"
      - "internal/parser/**"
      - "internal/prelude/**"
      - "internal/stdlib/**"
      - "internal/treeshake/**"
      - "go.mod"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 6 requires Node >=22.12. Bump together with the
          # `astro` pin in site/package.json.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package.json

      - name: Build playground wasm
        run: ./web/build.sh

      - name: Stage playground into site/public/playground/
        run: |
          rm -rf site/public/playground
          mkdir -p site/public/playground
          cp -L web/index.html web/wasm_exec.js web/lang.wasm site/public/playground/

      - name: Generate stdlib reference
        run: go run ./cmd/langdoc -out site/src/content/docs/stdlib/

      - name: Install + build
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Link-check (lychee)
        # Crawls site/dist/ for dangling internal links + verifies
        # the small set of external links we hard-coded. Settings
        # live in .github/lychee.toml.
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .github/lychee.toml 'site/dist/**/*.html'
          fail: true

      - name: Install Playwright deps
        working-directory: site/test/playwright
        run: |
          npm install
          # --with-deps installs the apt packages Chromium needs
          # under Ubuntu sandbox restrictions.
          npx playwright install --with-deps chromium

      - name: Run docs Playwright suite
        # `astro preview` (started by playwright.config.ts's
        # webServer) serves site/dist/ at /lang/.
        working-directory: site/test/playwright
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: site/test/playwright/playwright-report/
          if-no-files-found: ignore

      - name: Upload built site (for review on failed deploys)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: site/dist/
          if-no-files-found: ignore
