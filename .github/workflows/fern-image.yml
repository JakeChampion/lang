      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_matrix_model_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-matrix-model.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_matrix_trc_eval_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-matrix-trc.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_matrix_solve_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-matrix-solve.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-deflate-reader.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fern-image/build/worker-qualification.json') != ''
        with:
          name: image-worker-qualification
          path: fern-image/build/worker-qualification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: image-png-corpus-native
