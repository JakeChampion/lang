name: Fern image

# Called from ci.yml, which decides from the changed files whether this lane
# runs (its path filter is the lane table's `fern-image` row) and cancels the
# rest of the run when it goes red. `workflow_dispatch` runs it on its own.
#
# One job. The native half and the wasm half each build the compiler, install
# the Python reference and run two to three minutes of tests. As two jobs
# they paid two builds, two setups and two slots of the runner pool.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - run: make build
      - run: ./fern-image/scripts/test.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Use cgroupfs for worker OOM events
        run: |
          docker info --format 'Before: {{.ServerVersion}} {{.CgroupDriver}} {{.CgroupVersion}}'
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          options = [value for value in config.get('exec-opts', []) if not value.startswith('native.cgroupdriver=')]
          config['exec-opts'] = options + ['native.cgroupdriver=cgroupfs']
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config) + '\n')
          PY
          sudo systemctl restart docker
          docker info --format 'After: {{.ServerVersion}} {{.CgroupDriver}} {{.CgroupVersion}}'
          test "$(docker info --format '{{.CgroupDriver}}')" = cgroupfs
      - run: ./fern-image/scripts/qualify-workers.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-wasm.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --require-hashes -r fern-image/tests/requirements-reference.txt
      - run: ./fern-image/scripts/test-png-corpus.sh native
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-png-corpus.sh wasm
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_coefficients_test.py
      - run: ./fern-image/scripts/test-jpeg-coefficients.sh native
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-jpeg-coefficients.sh wasm
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_idct_test.py
      - run: ./fern-image/scripts/test-jpeg-idct.sh native
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-jpeg-idct.sh wasm
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_grayscale_test.py
      - run: ./fern-image/scripts/test-jpeg-grayscale.sh native
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-jpeg-grayscale.sh wasm
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_ycbcr_test.py
      - run: ./fern-image/scripts/test-jpeg-ycbcr.sh native
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-jpeg-ycbcr.sh wasm
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-deflate-reader.sh native
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/test-deflate-reader.sh wasm
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fern-image/build/worker-qualification.json') != ''
        with:
          name: image-worker-qualification
          path: fern-image/build/worker-qualification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: image-png-corpus-native
          path: fern-image/build/png-corpus-native.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: image-png-corpus-wasm
          path: fern-image/build/png-corpus-wasm.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: image-deflate-reader
          path: fern-image/build/deflate-reader-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fern-image/build/jpeg-coefficients-*.json') != ''
        with:
          name: image-jpeg-coefficients
          path: fern-image/build/jpeg-coefficients-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fern-image/build/jpeg-idct-*.json') != ''
        with:
          name: image-jpeg-idct
          path: fern-image/build/jpeg-idct-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fern-image/build/jpeg-grayscale-*.json') != ''
        with:
          name: image-jpeg-grayscale
          path: fern-image/build/jpeg-grayscale-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('fern-image/build/jpeg-ycbcr-*.json') != ''
        with:
          name: image-jpeg-ycbcr
          path: fern-image/build/jpeg-ycbcr-*.json
          if-no-files-found: error
