      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_envelope_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-envelope.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_tag_data_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-tag-data.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_curv_eval_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-curv-eval.sh
        env:
