name: Fern image

# Called from ci.yml, which decides from the changed files whether this lane
# runs (its path filter is the lane table's `fern-image` row) and cancels the
# rest of the run when it goes red. `workflow_dispatch` runs it on its own.
#
# One job. The native half and the wasm half each build the compiler and
# install the Python reference. As two jobs they paid two builds, two setups
# and two slots of the runner pool. scripts/both-modes.sh runs the native and
# the wasm leg of each check at the same time on the runner's four CPUs.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - run: make build
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test.sh ./fern-image/scripts/test-wasm.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Use cgroupfs for worker OOM events
        run: |
          docker info --format 'Before: {{.ServerVersion}} {{.CgroupDriver}} {{.CgroupVersion}}'
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          options = [value for value in config.get('exec-opts', []) if not value.startswith('native.cgroupdriver=')]
          config['exec-opts'] = options + ['native.cgroupdriver=cgroupfs']
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config) + '\n')
          PY
          sudo systemctl restart docker
          docker info --format 'After: {{.ServerVersion}} {{.CgroupDriver}} {{.CgroupVersion}}'
          test "$(docker info --format '{{.CgroupDriver}}')" = cgroupfs
      - run: ./fern-image/scripts/qualify-workers.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --require-hashes -r fern-image/tests/requirements-reference.txt
      - uses: astral-sh/setup-uv@v7
      - name: Check independent grayscale PNG fixtures
        run: |
          uv run --no-project python fern-image/tests/fixtures/generate_png_grayscale.py --check
          uv run --no-project python fern-image/tests/fixtures/generate_png_packed.py --check
          uv run --no-project python fern-image/tests/fixtures/generate_png_indexed.py --check
          uv run --no-project python fern-image/tests/fixtures/generate_png_transparency.py --check
          uv run --no-project python fern-image/tests/fixtures/generate_png_adam7.py --check
          uv run --no-project python -m unittest discover -s fern-image/tests -p generate_png_adam7_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_png_adam7_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_boxes_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_bits_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_integers_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_headers_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_sample_depth_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_f16_test.py
          uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jxl_tone_test.py
      - name: Qualify Adam7 PNG input with offline references
        run: |
          results="$(mktemp -d "$RUNNER_TEMP/png-adam7.XXXXXX")"
          uv run --no-project python fern-image/tests/qualify_png_adam7.py \
            --fern "$GITHUB_WORKSPACE/bin/fern" --target x86-64-linux --output "$results/native"
          uv run --no-project python fern-image/tests/qualify_png_adam7.py \
            --fern "$GITHUB_WORKSPACE/bin/fern" --target wasm32-wasi --output "$results/wasm" \
            --runner wasmtime --runner run --runner=--dir=.
      - name: Qualify JPEG XL bit fields with the pinned offline reader
        run: bash fern-image/scripts/test-jxl-bits-reference.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Qualify JPEG XL integer fields with pinned offline coders
        run: bash fern-image/scripts/test-jxl-integers-reference.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Qualify JPEG XL headers with pinned offline classes
        run: bash fern-image/scripts/test-jxl-headers-reference.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Qualify JPEG XL sample precision with pinned offline classes
        run: bash fern-image/scripts/test-jxl-sample-depth-reference.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Qualify JPEG XL finite metadata with pinned offline coders
        run: bash fern-image/scripts/test-jxl-f16-reference.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Qualify JPEG XL tone metadata with pinned offline classes
        run: bash fern-image/scripts/test-jxl-tone-reference.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - name: Check sample transparency with offline libpng
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev pkg-config
          bash fern-image/scripts/test-png-transparency-reference.sh
      - name: Qualify QOI against the pinned reference codec
        # External codec code serves only as an offline test reference.
        run: |
          reference="$(mktemp -d "$RUNNER_TEMP/qoi-reference.XXXXXX")"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/phoboslab/qoi/ffb2d2cb74a1de60819b21b939f7209aa53e91c1/qoi.h \
            -o "$reference/qoi.h"
          uv run --no-project python fern-image/tests/qualify_qoi.py \
            --fern "$GITHUB_WORKSPACE/bin/fern" --reference-header "$reference/qoi.h" \
            --target x86-64-linux --output "$reference/native"
          uv run --no-project python fern-image/tests/qualify_qoi.py \
            --fern "$GITHUB_WORKSPACE/bin/fern" --reference-header "$reference/qoi.h" \
            --target wasm32-wasi --runner wasmtime --runner run --output "$reference/wasm"
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p benchmark_qoi_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-png-corpus.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_coefficients_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-coefficients.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_idct_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-idct.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-dct.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_quantization_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-quantization.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: sudo apt-get update && sudo apt-get install -y libjpeg-dev pkg-config
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_entropy_writer_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-entropy-writer.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-frame-writer.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-component-blocks.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_mcu_order_test.py
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_component_frames_test.py
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_component_planes_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-component-planes.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-component-frames.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_mcu_entropy_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-mcu-entropy.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: uv run --no-project python -m unittest discover -s fern-image/tests -p qualify_jpeg_padded_blocks_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-padded-blocks.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: bash ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-mcu-order.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-plane-coefficients.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_grayscale_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-grayscale.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_ycbcr_test.py
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_jpeg_rgb_ycbcr_test.py
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_sample_bytes_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-sample-bytes.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-ycbcr.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-jpeg-rgb-ycbcr.sh
        env:
