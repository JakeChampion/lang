      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_curv_inverse_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-curv-inverse.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_power_inverse_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-power-inverse.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_affine_inverse_test.py
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_quadratic_inverse_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-affine-inverse.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-quadratic-inverse.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_inverse_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-inverse.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_parametric_eval_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-parametric-eval.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_app2_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-app2.sh
        env:
          FERN: ${{ github.workspace }}/bin/fern
      - run: python3 -m unittest discover -s fern-image/tests -p qualify_icc_matrix_eval_test.py
      - run: ./fern-image/scripts/both-modes.sh ./fern-image/scripts/test-icc-matrix-eval.sh
        env:
