name: Playground E2E

# Tests for the Fern playground. Three suites with complementary
# roles:
#
#   shim       (unit)  — web/wasi-shim.js against real compiled
#                        modules, no browser. Failing here means the
#                        page's preview-1 host and the wasm backend
#                        disagree on a syscall.
#   playwright (gate)  — scripted golden-path tests; deterministic,
#                        fast, per-PR. Failing here means a feature
#                        the playground promises to support is
#                        broken.
#   bombadil   (fuzz)  — property-based exploration; randomised, can
#                        be flaky, per-PR + daily. Failing here means
#                        Bombadil found a counter-example to one of
#                        our always-true invariants.
#
# All three jobs share the same path filter so unrelated edits don't
# burn CI minutes. Daily schedule runs Bombadil with fresh random
# seeds to catch drift Playwright wouldn't.

on:
  pull_request:
    paths:
      - "cmd/fern-wasm/**"
      - "web/**"
      # EVERY internal package, not an enumeration of the ones somebody
      # thought mattered. The enumeration listed `internal/prelude/**`,
      # gone since the injector was removed, and covered 13 of the 50+
      # packages the wasm build actually links, so a change to any of the
      # rest landed with this lane never firing (#8627). A prefix cannot
      # go stale the way a list of leaves does.
      - "internal/**"
      # The lane installs its toolchain from the pins, so both change
      # what it actually executes.
      - "mise.toml"
      - "mise.lock"
      - "go.mod"
      - ".github/workflows/playground-e2e.yml"
  # Also on main: a rebase-merge replays commits onto a main their PR's CI never
  # saw, so a coupling between two individually-green PRs exists only in the
  # merge. Filter mirrors the pull_request one; pinned by TestGateLanesRunOnMain.
  push:
    branches: [main]
    paths:
      - "cmd/fern-wasm/**"
      - "web/**"
      - "internal/**"
      - "mise.toml"
      - "mise.lock"
      - "go.mod"
      - ".github/workflows/playground-e2e.yml"
  workflow_dispatch:
  schedule:
    # Daily at 06:17 UTC. Off-the-hour timing avoids the noisy
    # top-of-hour CI rush.
    - cron: "17 6 * * *"

env:
  BOMBADIL_VERSION: "v0.5.0"

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
#
# main is the one ref that never cancels: its run finishes and reports
# even when the next merge lands mid-run. It gets ONE group, not one per
# SHA. A SHA-keyed group supersedes nothing, so a burst of back-to-back
# rebase-merges held an uncancellable run each — six of them stacked ~90
# runs into the queue every open PR was waiting behind (#8124). With one
# group GitHub keeps at most one main run executing and one pending,
# cancelling the older pending, so a burst coalesces to its newest
# commit. The cost is attribution: a red main names a span of merges
# rather than one. check-sources.yml keeps the per-merge attribution —
# one ~1-minute job can afford a slot per merge; this lane cannot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shim is the page's half of running a compiled program, and the
  # browser suites reach it only through whatever the page happens to do.
  # This drives it directly against modules the real compiler emitted, so a
  # syscall the shim gets wrong fails here by name instead of surfacing as a
  # blank output pane two suites later. No browser, so it is the fast one.
  shim:
    name: shim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (pinned in mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          install_args: go

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No dependencies: node:test is built in, and the fixtures are compiled
      # by the fern the test builds from this checkout.
      - name: Run the shim suite
        run: node --test web/test/shim/*.test.mjs

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (pinned in mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          install_args: go

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/test/playwright/package.json

      # The browser is a ~170 MB download; caching it keeps most runs off the
      # network for that half. The apt half of `--with-deps` below is NOT
      # cached and remains exposed to the mirror stalls in #6038.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/test/playwright/package.json') }}

      - name: Install Playwright deps
        run: |
          cd web/test/playwright
          npm install
          # --with-deps installs the apt packages Chromium needs
          # under Ubuntu sandbox restrictions, so we don't have to
          # paper over them with --no-sandbox here.
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: |
          cd web/test/playwright
          npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test/playwright/playwright-report/
          if-no-files-found: ignore

  bombadil:
    name: bombadil
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (pinned in mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          install_args: go

      - name: Install Chromium
        # browser-actions/setup-chrome ships a pinned Chromium build
        # and writes its path to GITHUB_PATH so `chromium` is on PATH
        # for downstream steps. Pinning beats apt's distro-tracking
        # version, which has drifted past Bombadil's compat range
        # before.
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Cache Bombadil binary
        id: cache-bombadil
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/bombadil
          key: bombadil-${{ runner.os }}-${{ env.BOMBADIL_VERSION }}

      - name: Install Bombadil (cache miss)
        if: steps.cache-bombadil.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          # Pick the right binary for the runner's arch. Linux
          # ubuntu-latest is x86_64; the arm64 mapping is here so
          # this step keeps working when we add a matrix entry.
          case "$(uname -m)" in
            x86_64)  asset=bombadil-x86_64-linux ;;
            aarch64) asset=bombadil-aarch64-linux ;;
            *) echo "no Bombadil binary published for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fSL \
            -o "$HOME/.local/bin/bombadil" \
            "https://github.com/antithesishq/bombadil/releases/download/${BOMBADIL_VERSION}/${asset}"
          chmod +x "$HOME/.local/bin/bombadil"

      - name: Wire PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          uname -m
          go version
          bombadil --version || true
          chromium --version || google-chrome --version || true

      - name: Run Bombadil
        run: ./web/test/run.sh

      - name: Upload Bombadil results on failure
        # The results directory contains the reproducer trace + the
        # server log; both are gold for debugging a property
        # violation after the fact.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bombadil-results
          path: web/test/results/
          if-no-files-found: ignore
