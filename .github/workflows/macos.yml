name: macOS arm64

# Native Apple Silicon verification for the arm64-darwin target.
# Linux CI cross-compiles Mach-O via clang+lld and only checks
# the produced binary is well-formed — it can't catch ABI bugs
# (carry-flag normalisation, x16 vs x8, wrong syscall numbers,
# stack-alignment quirks). This job runs the same tests on the
# `macos-latest` runner, which tracks Apple's current macOS
# release (Sequoia / Tahoe / etc.) on Apple Silicon arm64.
#
# Policy: we support only the latest stable macOS release. The
# runner label is pinned to a specific version (currently
# `macos-15` = Sequoia, GA since Sept 2024) rather than the
# floating `macos-latest` because that label has occasionally
# pointed at beta or otherwise-broken images. We bump the pin
# in a deliberate PR after verifying the new version works.
# Pinning to an OLDER `macos-N` label is explicitly not
# supported.
#
# Gated, in ci.yml's lane table, on changes touching what the
# binary it executes is built from, so we don't burn macOS minutes
# on unrelated edits. Plus a workflow_dispatch trigger for manual
# reruns.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds the PR-wide lock (one pull
# request's suite at a time), decides from the changed files whether this lane
# runs — the lane's path filter lives in its lane table — and cancels the rest
# of the run when a lane goes red. `workflow_dispatch` stays so the lane can
# be run on its own, outside that lock.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-arm64-darwin:
    runs-on: macos-15
    # A hung step here holds the repository's single CI lock, because ci.yml
    # queues one PR at a time: without this the job runs to GitHub's 360-minute
    # default and every open PR waits behind it. Round five wedged inside the
    # corpus at 03:19 and was still "in progress" ninety minutes later.
    timeout-minutes: 110
    # Pinned to the SAME version test-units.yml pins, and that lane says why:
    # 9.4 is what the ubuntu-24.04 image's own coreutils is, "so every utility
    # here answers to one version". A second lane holding a second opinion
    # would show it first in `--help`, the most version-volatile output
    # coreutils has and one the corpus compares byte for byte.
    env:
      GNU_COREUTILS_VERSION: "9.4"
    steps:
      - uses: actions/checkout@v7

      # An Apple Silicon dev machine reproduces THIS lane's platform exactly, so
      # its two native-execution steps can be run locally and recorded against
      # the pushed commit. The gate covers exactly those two steps and nothing
      # else in the job — see docs/CI-SIGNOFF.md.
      - uses: ./.github/actions/signoff-gate
        id: gate
        with:
          lane: macos-arm64

      # Go, gotestsum and wasmtime, all from mise.toml. wasmtime matters here
      # because the arm64-darwin Mach-O family compiles its driver through the
      # self-host wasm emitter and runs the emitted module to get the binary,
      # and this is the only runner that can launch that output at all.
      - name: Install the pinned toolchain (mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          clang --version | head -1
          go version

      - name: go vet
        run: go vet ./internal/codegen/arm64/... ./internal/e2e/... ./internal/interp/...

      - name: go test (Darwin interpreter timestamps)
        if: steps.gate.outputs.signed != 'true'
        run: |
          gotestsum --format standard-verbose -- -run '^(TestSetFileTimesDarwin.*|TestInterpFsMetaPrimitives)$' ./internal/interp/ ./internal/e2e/

      # THE COREUTILS CORPUS HAD NO DARWIN ORACLE UNTIL THIS STEP (#9645).
      # Every utility in `coreutils/` is held to byte-for-byte GNU parity, and
      # that was checked on Linux only — both the thirteen explicit
      # `target_os() == "darwin"` branches (seven in `coreutils/lib/signals.fern`,
      # whose tables were written by reading Apple's published Libc rather
      # than by comparing against anything) and, more of the risk, the
      # hundred utilities with no Darwin branch at all, which reach a
      # different kernel through the same code.
      #
      # macOS has BSD userland, so unlike the Linux lane — which takes seventy
      # utilities from /usr/bin and builds only the two Debian omits — there is
      # no system GNU to fall back to and this installs the whole tree.
      # `hw.ncpu` because there is no nproc until the thing being built exists.
      - name: Cache the GNU coreutils oracle
        id: gnu-oracle
        uses: actions/cache@v6
        with:
          path: ~/gnu-coreutils
          key: gnu-coreutils-full-arch-${{ env.GNU_COREUTILS_VERSION }}-macos-15
      - name: Build the GNU coreutils oracle
        if: steps.gnu-oracle.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="$GNU_COREUTILS_VERSION"
          work="$(mktemp -d)"
          cd "$work"
          curl -fsSLO "https://ftp.gnu.org/gnu/coreutils/coreutils-$ver.tar.xz"
          tar xf "coreutils-$ver.tar.xz"
          cd "coreutils-$ver"
          # ac_cv_header_stdckdint_h=no is not a workaround for the build,
          # it is what makes this build match the Linux one. 9.4's
          # lib/posixtm.c calls `ckd_add (&t, t, leapsec)` with a `bool`
          # third argument, and C23's checked-integer builtins refuse a bool
          # operand: "operand argument to checked integer operation must be
          # an integer type other than plain 'char', 'bool', ...". glibc
          # ships no <stdckdint.h>, so the Linux lane silently substitutes
          # gnulib's own, whose `ckd_add` is `(bool) _GL_INT_ADD_WRAPV(...)`
          # and takes a bool happily. Xcode's clang DOES ship the header, so
          # without this the macOS build defers to it and stops on that one
          # line. Forcing the substitution gives both oracles the same
          # checked-arithmetic header rather than patching either one.
          FORCE_UNSAFE_CONFIGURE=1 ac_cv_header_stdckdint_h=no \
            ./configure --quiet --disable-nls \
            --without-selinux --prefix="$HOME/gnu-coreutils"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          # `arch` is in coreutils' no_install__progs list, which makes it an
          # automake EXTRA_PROGRAM: `make` does not build it and `make
          # install` does not place it, and no configure flag changes either.
          # Debian ships its own copy, which is the only reason the Linux
          # corpora find an oracle in /usr/bin; here /usr/bin/arch is Apple's
          # arch(1), a different program that runs a command under a named
          # architecture, and the harness's version probe rejects it. So name
          # the target and copy the result.
          #
          # Naming a target is what the Linux lane's comment warns against —
          # it skips the gnulib header generation and dies on a missing
          # stdckdint.h — but that is a warning about building a target in a
          # tree where `make` has not run. Here it has, two lines up.
          make src/arch
          cp src/arch "$HOME/gnu-coreutils/bin/arch"
          cd /
          rm -rf "$work"
      # A SKIP IS A MISSING DEPENDENCY, NOT A PASS. A cache that restored an
      # empty or half-written directory would otherwise leave a corpus with no
      # reference. The corpus itself fails rather than skips in that case, but
      # it fails naming the utility, so the same missing oracle reports as a
      # hundred unrelated bugs; checked here, one message names the cause.
      #
      # The list is DERIVED from coreutils/*.fern rather than written out: the
      # step below now runs the whole catalogue, so a utility added to the
      # tree is one this check must cover, and an enumerated list is a list
      # that goes stale silently.
      - name: Assert the oracle is GNU coreutils, and point the corpus at it
        run: |
          set -euo pipefail
          bindir="$HOME/gnu-coreutils/bin"
          missing=""
          checked=0
          for f in coreutils/*.fern; do
            util="$(basename "$f" .fern)"
            probe="$bindir/$util"
            # test(1) answers no --version: POSIX reserves every argument for
            # the expression, so only `[` — built from the same source, one
            # name over — can vouch for it.
            if [ "$util" = "test" ]; then probe="$bindir/["; fi
            if [ ! -x "$probe" ]; then
              missing="$missing $util"
              continue
            fi
            # `dd` is the one utility whose version line omits the word GNU:
            # it says `dd (coreutils) 9.4`. Both spellings are the package's.
            # Read into a variable rather than piping into grep: `head -1`
            # closes the pipe on a program that has more to write, and under
            # `set -o pipefail` that SIGPIPE is the pipeline's status, so a
            # present oracle would report as a missing one.
            line="$("$probe" --version 2>/dev/null | head -1 || true)"
            case "$line" in
              *"(GNU coreutils)"* | *"(coreutils)"*) checked=$((checked + 1)) ;;
              *) missing="$missing $util" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::no GNU coreutils oracle in $bindir for:$missing"
            exit 1
          fi
          echo "$checked utilities have a GNU oracle"
          "$bindir/yes" --version | head -1
          echo "FERN_GNU_COREUTILS=$bindir" >> "$GITHUB_ENV"
      # The WHOLE catalogue. The lane landed covering the five utilities with
      # `target_os() == "darwin"` branches — kill, env, timeout, uname, yes —
      # deliberately, so the first round read as a list of real platform
      # differences rather than a hundred corpora failing at once. This is the
      # widening, and what it gates is the larger half of the problem: the
      # other hundred utilities have NO Darwin branches at all, so what they
      # surface is not conditional code we wrote but the same code meeting a
      # different kernel and a different libc.
      #
      # Selected by SKIPPING, not by naming. `touch_test.go` and
      # `ls_linux_fixture_test.go` are `//go:build linux`, so `TestTouch` does
      # not EXIST on this runner: a `-run` list carrying its name would select
      # nothing for it, silently and with exit 0, and
      # `tools/testname_gate.sh` cannot refuse that because the gate runs on
      # Linux, where the name is real.
      #
      # `^TestSelfHost` — three functions — is what the skip drops. Those
      # build the self-host compiler and compile the catalogue a second time
      # through it, which is the bulk of this package's ten minutes, and the
      # Linux units lane runs them. The arm64-darwin self-host path is gated
      # two steps down instead.
      #
      # -timeout is set EXPLICITLY because go test's default is ten minutes:
      # a binary the default kills reports whichever cases were in flight as
      # failures with no output, so the lane names tests that did not fail and
      # never names the wall it hit.
      #
      # 45 minutes because this runner's speed varies about twofold. The whole
      # catalogue took 784s on one round and was still going at 1500s on the
      # next — the second hit the 25 minutes it used to get, and reported 1425
      # failures over 14881 tests where the completed round reported 1987 over
      # 19678. A cut-short round understates both numbers and says nothing
      # about which of the two it is, so the budget has to cover the slow end.
      #
      # Output goes to a FILE rather than to this step's stdout, because
      # writing it to the pipe wedged the lane: a parity failure quotes BOTH
      # streams in full, so one line here can be 8 KB, and once the pipe
      # stopped draining the test binary blocked on write — as did the
      # watchdog trying to report it. No progress and no diagnosis, for 85
      # minutes. A file blocks neither.
      #
      # The step's own limit exists for the same reason `-timeout` was not
      # enough: that watchdog lives inside the test binary and cannot report
      # when its own output is blocked, whereas a step limit is enforced by
      # the runner, which kills the process group.
      #
      # The cost is that the log arrives at the end of the step rather than
      # live. The artifact is uploaded first so that the 50-minute limit
      # killing the step mid-write cannot lose it, and the summary prints
      # after that.
      - name: go test (coreutils corpus on Darwin)
        if: steps.gate.outputs.signed != 'true'
        timeout-minutes: 50
        run: |
          set +e
          gotestsum --format standard-verbose -- -timeout 45m -skip '^TestSelfHost' ./internal/coreutils/ > corpus-darwin.log 2>&1
          echo "EXIT=$?"
          # Deliberately not the step's exit status. The catalogue does not
          # pass on Darwin yet, so a non-zero here is the expected state; what
          # decides the lane is the ratchet below, which cares about WHICH
          # utilities failed rather than that some did.

      # The artifact FIRST, and the summary after it. The whole log is the
      # thing worth keeping, so it must not be behind a step that prints.
      - name: Keep the corpus log
        if: always() && steps.gate.outputs.signed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coreutils-corpus-darwin
          path: corpus-darwin.log
          retention-days: 7
          if-no-files-found: ignore

      # NAMES ONLY, each cut to 200 columns, and capped. A parity failure
      # quotes both streams in full, so one line of this log can be several
      # kilobytes and forty of them can be a megabyte — which is how the
      # corpus wedged in the first place. Printing that back into the step's
      # stdout reproduces the stall it was moved off; the first version of
      # this step did exactly that and hung for 23 minutes. Read the artifact
      # for detail; this is only the shape of the round.
      - name: which cases failed
        if: always() && steps.gate.outputs.signed != 'true'
        timeout-minutes: 3
        run: |
          if [ ! -f corpus-darwin.log ]; then
            echo "no corpus-darwin.log: the step did not get as far as running it"
            exit 0
          fi
          grep -oE '^DONE .{0,120}' corpus-darwin.log | tail -1 || true
          # Per UTILITY, not per case. The first round of the whole catalogue
          # reported 1987 failures, and sixty names off the top of that is not
          # something anyone can plan against: it got as far as chown
          # alphabetically. A count against each test function says which
          # utilities diverge and how wide each one is, in about a hundred
          # bounded lines, and that is the list the Darwin work is drawn from.
          echo "### failing cases per utility:"
          grep -oE '^--- FAIL: Test[A-Za-z0-9]+' corpus-darwin.log \
            | sed 's/^--- FAIL: //' | sort | uniq -c | sort -rn || true

      # The ratchet. The catalogue runs in full and the set of test functions
      # that failed is compared against the checked-in list of utilities not
      # yet working on Darwin. A name that fails and is not on the list fails
      # the lane, so the Darwin result cannot drift while the divergences are
      # worked through; a name on the list that now passes is reported for its
      # line to be deleted.
      #
      # That second direction is a warning rather than an error, which is where
      # this parts from the complexity ratchet in internal/lint: TestPtxParity
      # failed on one round of the catalogue and passed on the next two, and an
      # error there would make one flaky utility hold the lane red whichever
      # way it landed. A name going quiet is good news either way, and the
      # worst case is a stale line that someone deletes later.
      - name: the Darwin ratchet
        if: always() && steps.gate.outputs.signed != 'true'
        timeout-minutes: 3
        run: |
          if [ ! -f corpus-darwin.log ]; then
            echo "::error::no corpus-darwin.log: the corpus step did not run"
            exit 1
          fi
          if ! grep -qE '^DONE ' corpus-darwin.log; then
            echo "::error::the corpus produced no DONE line, so it did not finish — read the coreutils-corpus-darwin artifact"
            tail -5 corpus-darwin.log || true
            exit 1
          fi
          grep -oE '^--- FAIL: Test[A-Za-z0-9]+' corpus-darwin.log \
            | sed 's/^--- FAIL: //' | sort -u > failed-now.txt
          grep -vE '^[[:space:]]*(#|$)' .github/darwin-corpus-known-failures.txt \
            | sort -u > failed-known.txt

          echo "### $(wc -l < failed-now.txt) utilities failing, $(wc -l < failed-known.txt) on the list"

          if comm -13 failed-now.txt failed-known.txt | grep -q .; then
            echo "### these are on the list but PASSED — delete their lines:"
            comm -13 failed-now.txt failed-known.txt | sed 's/^/  /'
            comm -13 failed-now.txt failed-known.txt \
              | while read -r u; do echo "::warning::$u passes on Darwin now; remove it from .github/darwin-corpus-known-failures.txt"; done
          fi

          if comm -23 failed-now.txt failed-known.txt | grep -q .; then
            echo "### these FAILED and are not on the list:"
            comm -23 failed-now.txt failed-known.txt | sed 's/^/  /'
            comm -23 failed-now.txt failed-known.txt \
              | while read -r u; do echo "::error::$u fails on Darwin and is not in .github/darwin-corpus-known-failures.txt — a regression, not a line to add"; done
            exit 1
          fi
          echo "no Darwin regressions"

      - name: go test (arm64-darwin native execution)
        if: steps.gate.outputs.signed != 'true'
        # TestArm64DarwinBuilds detects runtime.GOOS=="darwin"
        # && GOARCH=="arm64" and switches from "verify Mach-O
        # file format" to "build with native clang+ld64 and
        # actually run the binary, asserting exit codes". The
        # other arm64 tests in this file SKIP cleanly when
        # qemu-aarch64 + aarch64-linux-gnu-gcc aren't present
        # (which is always the case on macOS). `standard-verbose`
        # keeps the streamed RUN/PASS/FAIL of the old `-v` run.
        run: |
          gotestsum --format standard-verbose -- -run TestArm64Darwin ./internal/e2e/

      - name: go test (SELF-HOST arm64-darwin native execution)
        if: steps.gate.outputs.signed != 'true'
        # The sibling of the step above for the SELF-HOST arm64-darwin path,
        # which lives in a different package (internal/e2eselfhost) and so was
        # not selected by the `-run TestArm64Darwin ./internal/e2e/` filter —
        # nothing in CI ran it on hardware that can execute its output. That
        # gap is why #6042 (the arena mmap emitted with Linux MAP_ flags),
        # the static LC_UNIXTHREAD container, the entry-point offset and the
        # unmapped .bss tail all shipped: on the Linux shards this test only
        # parses the Mach-O it cannot run.
        run: |
          gotestsum --format standard-verbose -- -run '^(TestSelfHostArm64Darwin.*|TestSelfHostCheckerFallbackHint)$' ./internal/e2eselfhost/

      - name: Compile + run every example for arm64-darwin (native, default)
        # Build each examples/*.fern via the driver's DEFAULT path — the
        # in-process Mach-O backend, no clang/ld64 — then actually execute
        # the binary. This is the full-corpus execution check for the
        # native arm64-darwin path. Examples whose darwin codegen isn't
        # ported (read_file / now_unix_ms — Linux-only syscalls) error at
        # codegen the same as on the clang path; skip those.
        run: |
          go build -o bin/fern ./cmd/fern
          mkdir -p build
          for f in examples/*.fern; do
            name=$(basename "$f" .fern)
            if ! ./bin/fern -target arm64-darwin -o "build/$name" "$f" 2>"build/$name.err"; then
              if grep -q "not yet ported" "build/$name.err"; then
                echo "skip $name (unported darwin runtime helper)"; continue
              fi
              echo "build $name FAILED:"; cat "build/$name.err"; exit 1
            fi
            echo "::group::run $name"
            rc=0; scripts/ci-run-example "$name" "./build/$name" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::example $name failed (exit $rc)"; exit 1; fi
          done

      - name: clang fallback still works (-cc opt-out)
        # The external-toolchain path must remain available via -cc.
        run: |
          echo 'function main(): i32 { return 7; }' > /tmp/fb.fern
          ./bin/fern -target arm64-darwin -cc clang -o /tmp/fb /tmp/fb.fern
          # `if` disables errexit for the (intentionally non-zero) exit.
          if /tmp/fb; then code=0; else code=$?; fi
          test $code -eq 7 || { echo "clang fallback exit $code, want 7"; exit 1; }
