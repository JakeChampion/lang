name: macOS arm64

# Native Apple Silicon verification for the arm64-darwin target.
# Linux CI cross-compiles Mach-O via clang+lld and only checks
# the produced binary is well-formed — it can't catch ABI bugs
# (carry-flag normalisation, x16 vs x8, wrong syscall numbers,
# stack-alignment quirks). This job runs the same tests on the
# `macos-latest` runner, which tracks Apple's current macOS
# release (Sequoia / Tahoe / etc.) on Apple Silicon arm64.
#
# Policy: we support only the latest stable macOS release. The
# runner label is pinned to a specific version (currently
# `macos-15` = Sequoia, GA since Sept 2024) rather than the
# floating `macos-latest` because that label has occasionally
# pointed at beta or otherwise-broken images. We bump the pin
# in a deliberate PR after verifying the new version works.
# Pinning to an OLDER `macos-N` label is explicitly not
# supported.
#
# Gated on changes touching the arm64 codegen, prelude, or its
# tests so we don't burn macOS minutes on unrelated edits. Plus
# a workflow_dispatch trigger for manual reruns.

on:
  pull_request:
    paths:
      # arm64 codegen + arm64-specific tests are the direct
      # targets — any asm change here can break Darwin without
      # surfacing on the Linux arm64 CI lane (which SKIPs the
      # Darwin subtests because clang+lld aren't installed).
      - "internal/codegen/arm64/**"
      - "internal/e2e/arm64_test.go"
      # The prelude is shared by every backend; any change to
      # __map_keys / IoError / etc. flows into the Darwin asm.
      - "internal/prelude/**"
      # The IR layer is the language the codegen speaks. New
      # IR ops, changed payload layouts, or shifted operand-
      # stack semantics manifest as Darwin-specific runtime
      # behaviour even when the codegen file is untouched. PR
      # #383's `__map_keys/values` fix was a prelude-only +
      # IR-untouched change that nonetheless broke Darwin; if
      # the next prelude/IR PR doesn't also touch arm64 codegen
      # the macOS CI lane would silently skip.
      - "internal/ir/**"
      - "internal/ast/**"
      # The checker shapes the program before lowering; payload
      # type substitution, generic instantiation, and the auto-
      # main-from-handle synthesis all originate there.
      - "internal/checker/**"
      # Monomorpher emits per-instantiation FuncDecls that the
      # backend then turns into asm.
      - "internal/monomorph/**"
      # The closureconv pass rewrites local fn declarations to
      # hoisted top-level fns; capture-block layout decisions
      # have bitten Darwin before.
      - "internal/closureconv/**"
      # fernstring carries the inline-encoding bit patterns
      # both backends use.
      - "internal/fernstring/**"
      # Driver wiring + example surface.
      - "cmd/fern/**"
      - "examples/**"
      # This workflow itself + go module declarations.
      - ".github/workflows/macos.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

jobs:
  test-arm64-darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # Repo has go.mod but no external dependencies, so no
          # go.sum is generated. setup-go's default caching looks
          # for one and fails-fast on `macos-latest` runners (the
          # cache backend got stricter at some point between
          # macos-14 and macos-latest). Disable caching here —
          # there's nothing to cache anyway.
          cache: false

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          clang --version | head -1
          go version

      - name: go vet
        run: go vet ./internal/codegen/arm64/... ./internal/e2e/...

      - name: go test (arm64-darwin native execution)
        # TestArm64DarwinBuilds detects runtime.GOOS=="darwin"
        # && GOARCH=="arm64" and switches from "verify Mach-O
        # file format" to "build with native clang+ld64 and
        # actually run the binary, asserting exit codes". The
        # other arm64 tests in this file SKIP cleanly when
        # qemu-aarch64 + aarch64-linux-gnu-gcc aren't present
        # (which is always the case on macOS).
        run: go test -v -run TestArm64Darwin ./internal/e2e/

      - name: Compile + run every example for arm64-darwin
        # Build each examples/*.fern via the driver, then actually
        # execute the Mach-O. Catches codegen regressions across
        # the example surface that wouldn't surface from the
        # targeted go-test alone (new IR ops, new builtins,
        # prelude changes).
        run: |
          go build -o bin/fern ./cmd/fern
          mkdir -p build
          for f in examples/*.fern; do
            name=$(basename "$f" .fern)
            ./bin/fern -target arm64-darwin -cc clang -o "build/$name" "$f"
            echo "::group::run $name"
            ./build/$name || echo "(exited $?)"
            echo "::endgroup::"
          done
