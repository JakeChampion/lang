name: macOS arm64

# Native Apple Silicon verification for the arm64-darwin target.
# Linux CI cross-compiles Mach-O via clang+lld and only checks
# the produced binary is well-formed — it can't catch ABI bugs
# (carry-flag normalisation, x16 vs x8, wrong syscall numbers,
# stack-alignment quirks). This job runs the same tests on the
# `macos-latest` runner, which tracks Apple's current macOS
# release (Sequoia / Tahoe / etc.) on Apple Silicon arm64.
#
# Policy: we support only the latest stable macOS release. The
# runner label is pinned to a specific version (currently
# `macos-15` = Sequoia, GA since Sept 2024) rather than the
# floating `macos-latest` because that label has occasionally
# pointed at beta or otherwise-broken images. We bump the pin
# in a deliberate PR after verifying the new version works.
# Pinning to an OLDER `macos-N` label is explicitly not
# supported.
#
# Gated, in ci.yml's lane table, on changes touching what the
# binary it executes is built from, so we don't burn macOS minutes
# on unrelated edits. Plus a workflow_dispatch trigger for manual
# reruns.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds the PR-wide lock (one pull
# request's suite at a time), decides from the changed files whether this lane
# runs — the lane's path filter lives in its lane table — and cancels the rest
# of the run when a lane goes red. `workflow_dispatch` stays so the lane can
# be run on its own, outside that lock.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-arm64-darwin:
    runs-on: macos-15
    # Pinned to the SAME version test-units.yml pins, and that lane says why:
    # 9.4 is what the ubuntu-24.04 image's own coreutils is, "so every utility
    # here answers to one version". A second lane holding a second opinion
    # would show it first in `--help`, the most version-volatile output
    # coreutils has and one the corpus compares byte for byte.
    env:
      GNU_COREUTILS_VERSION: "9.4"
    steps:
      - uses: actions/checkout@v7

      # An Apple Silicon dev machine reproduces THIS lane's platform exactly, so
      # its two native-execution steps can be run locally and recorded against
      # the pushed commit. The gate covers exactly those two steps and nothing
      # else in the job — see docs/CI-SIGNOFF.md.
      - uses: ./.github/actions/signoff-gate
        id: gate
        with:
          lane: macos-arm64

      # Go, gotestsum and wasmtime, all from mise.toml. wasmtime matters here
      # because the arm64-darwin Mach-O family compiles its driver through the
      # self-host wasm emitter and runs the emitted module to get the binary,
      # and this is the only runner that can launch that output at all.
      - name: Install the pinned toolchain (mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          clang --version | head -1
          go version

      - name: go vet
        run: go vet ./internal/codegen/arm64/... ./internal/e2e/... ./internal/interp/...

      - name: go test (Darwin interpreter timestamps)
        if: steps.gate.outputs.signed != 'true'
        run: |
          gotestsum --format standard-verbose -- -run '^(TestSetFileTimesDarwin.*|TestInterpFsMetaPrimitives)$' ./internal/interp/ ./internal/e2e/

      # THE DARWIN BRANCHES HAD NO ORACLE UNTIL THIS STEP (#9645). Thirteen
      # `target_os() == "darwin"` branches across five files decide what the
      # utilities print on this platform — seven of them in
      # `coreutils/lib/signals.fern`, whose name, alternate and description
      # tables were written by reading Apple's published Libc rather than by
      # comparing against anything. Nothing ran the corpus here, so nothing
      # checked a single one of them.
      #
      # macOS has BSD userland, so unlike the Linux lane — which takes seventy
      # utilities from /usr/bin and builds only the two Debian omits — there is
      # no system GNU to fall back to and this installs the whole tree.
      # `hw.ncpu` because there is no nproc until the thing being built exists.
      - name: Cache the GNU coreutils oracle
        id: gnu-oracle
        uses: actions/cache@v6
        with:
          path: ~/gnu-coreutils
          key: gnu-coreutils-full-${{ env.GNU_COREUTILS_VERSION }}-macos-15
      - name: Build the GNU coreutils oracle
        if: steps.gnu-oracle.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="$GNU_COREUTILS_VERSION"
          work="$(mktemp -d)"
          cd "$work"
          curl -fsSLO "https://ftp.gnu.org/gnu/coreutils/coreutils-$ver.tar.xz"
          tar xf "coreutils-$ver.tar.xz"
          cd "coreutils-$ver"
          FORCE_UNSAFE_CONFIGURE=1 ./configure --quiet --disable-nls \
            --without-selinux --prefix="$HOME/gnu-coreutils"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          cd /
          rm -rf "$work"
      # A SKIP IS A MISSING DEPENDENCY, NOT A PASS. A cache that restored an
      # empty or half-written directory would otherwise leave the corpus with
      # no reference, and `internal/coreutils` reports that as `ok` having
      # compared nothing. Every utility the step below exercises is checked
      # here, so the failure names this step rather than one corpus.
      - name: Assert the oracle is GNU coreutils, and point the corpus at it
        run: |
          set -euo pipefail
          for util in kill env timeout uname yes; do
            bin="$HOME/gnu-coreutils/bin/$util"
            if ! "$bin" --version | head -1 | grep -q '(GNU coreutils)'; then
              echo "::error::$bin is not GNU coreutils; the corpus would have no oracle for $util(1)"
              exit 1
            fi
          done
          "$HOME/gnu-coreutils/bin/kill" --version | head -1
          echo "FERN_GNU_COREUTILS=$HOME/gnu-coreutils/bin" >> "$GITHUB_ENV"
      # The five utilities that HAVE Darwin branches, not the whole catalogue:
      # `kill`, `env` and `timeout` for signals.fern's seven, plus `uname` and
      # `yes`. Starting narrow so the first round is a readable list of real
      # platform differences rather than a hundred corpora failing at once;
      # widening to the rest is the follow-up, not this step's job.
      #
      # All ten function names in full rather than five prefixes, because the
      # corpus does not name its tests uniformly: `uname` and `yes` carry a
      # `Parity` suffix where the other three do not. A `^(…|TestUname)` would
      # match `TestUnameParity` today and select NOTHING the day it is
      # renamed, silently and with exit 0 — which is the whole failure
      # `tools/testname_gate.sh` exists to refuse, and it refused this.
      - name: go test (coreutils corpus on Darwin)
        if: steps.gate.outputs.signed != 'true'
        run: |
          gotestsum --format standard-verbose -- -run '^(TestKill|TestKillHelpVersion|TestEnv|TestEnvHelpVersion|TestTimeout|TestTimeoutHelpVersion|TestUnameParity|TestUnameHelpVersion|TestYesParity|TestYesHelpVersion)$' ./internal/coreutils/

      - name: go test (arm64-darwin native execution)
        if: steps.gate.outputs.signed != 'true'
        # TestArm64DarwinBuilds detects runtime.GOOS=="darwin"
        # && GOARCH=="arm64" and switches from "verify Mach-O
        # file format" to "build with native clang+ld64 and
        # actually run the binary, asserting exit codes". The
        # other arm64 tests in this file SKIP cleanly when
        # qemu-aarch64 + aarch64-linux-gnu-gcc aren't present
        # (which is always the case on macOS). `standard-verbose`
        # keeps the streamed RUN/PASS/FAIL of the old `-v` run.
        run: |
          gotestsum --format standard-verbose -- -run TestArm64Darwin ./internal/e2e/

      - name: go test (SELF-HOST arm64-darwin native execution)
        if: steps.gate.outputs.signed != 'true'
        # The sibling of the step above for the SELF-HOST arm64-darwin path,
        # which lives in a different package (internal/e2eselfhost) and so was
        # not selected by the `-run TestArm64Darwin ./internal/e2e/` filter —
        # nothing in CI ran it on hardware that can execute its output. That
        # gap is why #6042 (the arena mmap emitted with Linux MAP_ flags),
        # the static LC_UNIXTHREAD container, the entry-point offset and the
        # unmapped .bss tail all shipped: on the Linux shards this test only
        # parses the Mach-O it cannot run.
        run: |
          gotestsum --format standard-verbose -- -run '^(TestSelfHostArm64Darwin.*|TestSelfHostCheckerFallbackHint)$' ./internal/e2eselfhost/

      - name: Compile + run every example for arm64-darwin (native, default)
        # Build each examples/*.fern via the driver's DEFAULT path — the
        # in-process Mach-O backend, no clang/ld64 — then actually execute
        # the binary. This is the full-corpus execution check for the
        # native arm64-darwin path. Examples whose darwin codegen isn't
        # ported (read_file / now_unix_ms — Linux-only syscalls) error at
        # codegen the same as on the clang path; skip those.
        run: |
          go build -o bin/fern ./cmd/fern
          mkdir -p build
          for f in examples/*.fern; do
            name=$(basename "$f" .fern)
            if ! ./bin/fern -target arm64-darwin -o "build/$name" "$f" 2>"build/$name.err"; then
              if grep -q "not yet ported" "build/$name.err"; then
                echo "skip $name (unported darwin runtime helper)"; continue
              fi
              echo "build $name FAILED:"; cat "build/$name.err"; exit 1
            fi
            echo "::group::run $name"
            rc=0; scripts/ci-run-example "$name" "./build/$name" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "::error::example $name failed (exit $rc)"; exit 1; fi
          done

      - name: clang fallback still works (-cc opt-out)
        # The external-toolchain path must remain available via -cc.
        run: |
          echo 'function main(): i32 { return 7; }' > /tmp/fb.fern
          ./bin/fern -target arm64-darwin -cc clang -o /tmp/fb /tmp/fb.fern
          # `if` disables errexit for the (intentionally non-zero) exit.
          if /tmp/fb; then code=0; else code=$?; fi
          test $code -eq 7 || { echo "clang fallback exit $code, want 7"; exit 1; }
