name: macOS arm64

# Native Apple Silicon verification for the arm64-darwin target.
# Linux CI cross-compiles Mach-O via clang+lld and only checks
# the produced binary is well-formed — it can't catch ABI bugs
# (carry-flag normalisation, x16 vs x8, wrong syscall numbers,
# stack-alignment quirks). This job runs the same tests on the
# `macos-latest` runner, which tracks Apple's current macOS
# release (Sequoia / Tahoe / etc.) on Apple Silicon arm64.
#
# Policy: we support only the latest stable macOS release. The
# runner label is pinned to a specific version (currently
# `macos-15` = Sequoia, GA since Sept 2024) rather than the
# floating `macos-latest` because that label has occasionally
# pointed at beta or otherwise-broken images. We bump the pin
# in a deliberate PR after verifying the new version works.
# Pinning to an OLDER `macos-N` label is explicitly not
# supported.
#
# Gated on changes touching the arm64 codegen, prelude, or its
# tests so we don't burn macOS minutes on unrelated edits. Plus
# a workflow_dispatch trigger for manual reruns.

on:
  pull_request:
    paths:
      # arm64 codegen + arm64-specific tests are the direct
      # targets — any asm change here can break Darwin without
      # surfacing on the Linux arm64 CI lane (which SKIPs the
      # Darwin subtests because clang+lld aren't installed).
      - "internal/codegen/arm64/**"
      - "internal/e2e/arm64_test.go"
      # The Darwin-specific EXECUTION tests. Same argument as
      # internal/native below and stronger: these are the tests
      # this runner exists to run, and they are the only place a
      # Darwin runtime port (kqueue readiness, getentropy, the
      # AT_FDCWD sign) is executed rather than merely assembled.
      # Without this entry a PR that adds or fixes one of them and
      # touches nothing else would skip the only lane that can run
      # it — the same silent-skip this file's `internal/ir/**`
      # comment warns about.
      - "internal/e2e/arm64_darwin_*_test.go"
      # The prelude is shared by every backend; any change to
      # __map_keys / IoError / etc. flows into the Darwin asm.
      - "internal/prelude/**"
      # The IR layer is the language the codegen speaks. New
      # IR ops, changed payload layouts, or shifted operand-
      # stack semantics manifest as Darwin-specific runtime
      # behaviour even when the codegen file is untouched. PR
      # #383's `__map_keys/values` fix was a prelude-only +
      # IR-untouched change that nonetheless broke Darwin; if
      # the next prelude/IR PR doesn't also touch arm64 codegen
      # the macOS CI lane would silently skip.
      - "internal/ir/**"
      - "internal/ast/**"
      # The checker shapes the program before lowering; payload
      # type substitution, generic instantiation, and the auto-
      # main-from-handle synthesis all originate there.
      - "internal/checker/**"
      # Monomorpher emits per-instantiation FuncDecls that the
      # backend then turns into asm.
      - "internal/monomorph/**"
      # The closureconv pass rewrites local fn declarations to
      # hoisted top-level fns; capture-block layout decisions
      # have bitten Darwin before.
      - "internal/closureconv/**"
      # fernstring carries the inline-encoding bit patterns
      # both backends use.
      - "internal/fernstring/**"
      # Driver wiring + example surface.
      - "cmd/fern/**"
      - "examples/**"
      # The in-process Mach-O emitter (native arm64-darwin path):
      # only the macOS runner can confirm a binary it produces
      # actually launches and runs.
      - "internal/native/**"
      # The self-host arm64-darwin tests. Same argument as
      # internal/native above, for the self-host writer in
      # examples/self_host/arm64_native.fern: the Linux shards can
      # only parse the Mach-O it emits, never launch it.
      - "internal/e2eselfhost/**"
      # This workflow itself + go module declarations.
      - ".github/workflows/macos.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-arm64-darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # Repo has go.mod but no external dependencies, so no
          # go.sum is generated. setup-go's default caching looks
          # for one and fails-fast on `macos-latest` runners (the
          # cache backend got stricter at some point between
          # macos-14 and macos-latest). Disable caching here —
          # there's nothing to cache anyway.
          cache: false

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          clang --version | head -1
          go version

      - name: go vet
        run: go vet ./internal/codegen/arm64/... ./internal/e2e/...

      # This runner sets Go up directly (not via ./.github/actions/setup-fern,
      # which is Linux-only), so gotestsum is installed here rather than through
      # that action's `gotestsum` input. Pinned to the same v1.13.0 the action uses.
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: go test (arm64-darwin native execution)
        # TestArm64DarwinBuilds detects runtime.GOOS=="darwin"
        # && GOARCH=="arm64" and switches from "verify Mach-O
        # file format" to "build with native clang+ld64 and
        # actually run the binary, asserting exit codes". The
        # other arm64 tests in this file SKIP cleanly when
        # qemu-aarch64 + aarch64-linux-gnu-gcc aren't present
        # (which is always the case on macOS). `standard-verbose`
        # keeps the streamed RUN/PASS/FAIL of the old `-v` run.
        run: |
          "$(go env GOPATH)/bin/gotestsum" --format standard-verbose -- -run TestArm64Darwin ./internal/e2e/

      - name: go test (SELF-HOST arm64-darwin native execution)
        # The sibling of the step above for the SELF-HOST arm64-darwin path,
        # which lives in a different package (internal/e2eselfhost) and so was
        # not selected by the `-run TestArm64Darwin ./internal/e2e/` filter —
        # nothing in CI ran it on hardware that can execute its output. That
        # gap is why #6042 (the arena mmap emitted with Linux MAP_ flags),
        # the static LC_UNIXTHREAD container, the entry-point offset and the
        # unmapped .bss tail all shipped: on the Linux shards this test only
        # parses the Mach-O it cannot run.
        run: |
          "$(go env GOPATH)/bin/gotestsum" --format standard-verbose -- -run 'TestSelfHostArm64Darwin' ./internal/e2eselfhost/

      - name: Compile + run every example for arm64-darwin (native, default)
        # Build each examples/*.fern via the driver's DEFAULT path — the
        # in-process Mach-O backend, no clang/ld64 — then actually execute
        # the binary. This is the full-corpus execution check for the
        # native arm64-darwin path. Examples whose darwin codegen isn't
        # ported (read_file / now_unix_ms — Linux-only syscalls) error at
        # codegen the same as on the clang path; skip those.
        run: |
          go build -o bin/fern ./cmd/fern
          mkdir -p build
          for f in examples/*.fern; do
            name=$(basename "$f" .fern)
            if ! ./bin/fern -target arm64-darwin -o "build/$name" "$f" 2>build/$name.err; then
              if grep -q "not yet ported" "build/$name.err"; then
                echo "skip $name (unported darwin runtime helper)"; continue
              fi
              echo "build $name FAILED:"; cat "build/$name.err"; exit 1
            fi
            echo "::group::run $name"
            ./build/$name || echo "(exited $?)"
            echo "::endgroup::"
          done

      - name: clang fallback still works (-cc opt-out)
        # The external-toolchain path must remain available via -cc.
        run: |
          echo 'function main(): i32 { return 7; }' > /tmp/fb.fern
          ./bin/fern -target arm64-darwin -cc clang -o /tmp/fb /tmp/fb.fern
          # `if` disables errexit for the (intentionally non-zero) exit.
          if /tmp/fb; then code=0; else code=$?; fi
          test $code -eq 7 || { echo "clang fallback exit $code, want 7"; exit 1; }
