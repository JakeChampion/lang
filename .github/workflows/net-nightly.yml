name: Net nightly

# The HTTP throughput record of #9854 and #9857: once a night,
# scripts/net-bench loads the Fern hello server, Go's net/http hello,
# hyper's and h2o's, then the Fern and hyper two-fetch servers (a handler
# fetching an upstream twice per request, the Fern one a single loop
# built by the self-host compiler), with oha at 64 and 4,096 connections
# and appends throughput, p50 and p99 per server and count, plus the heap
# one held connection and one suspended handler cost the Fern loop, to
# the main commit's note under refs/notes/perf.
# `scripts/perf-history show net/fern/c64.rps` reads the trend back.
#
# RECORDED, NOT GATED, and nightly rather than per pull request: wall-clock
# throughput on a shared runner moves by tens of percent between runs, so a
# threshold loose enough not to false-alarm would miss a real regression
# (perf.yml counts instructions for that reason), and one run costs about a
# minute of load per server. A trend over nights is what this lane gives;
# a per-request instruction count for the hello path is perf.yml's to
# take.
#
# The `soak` job runs scripts/net-soak: three std/serve programs (a static
# body, a JSON echo, a bounded map of recent paths) built with the leak
# census on and held under load for five minutes each, failing on resident
# growth past a small allowance after warm-up or on a census that does not
# balance when the server stops (#11915). Its rows are recorded like the
# bench's.
#
# The `interop` job runs scripts/net-interop: the Fern client against Go's
# net/http, nginx and h2o, and the Fern server under curl (connection
# reuse, `Expect: 100-continue`, a chunked upload) and h2load (#9855). It
# passes or fails rather than recording, and installs every server it
# needs, so a missing one fails the job instead of skipping its cases.
#
# The `tls-interop` job runs scripts/net-tls-interop: the Fern TLS 1.3
# client against OpenSSL's s_server, Go's crypto/tls, rustls' tlsserver-mio
# example at a pinned tag and BoringSSL's bssl at a pinned commit, and the
# Fern server under Go's client, curl, openssl s_client, tlsclient-mio and
# bssl, with a client certificate each way and a resumed session each way
# (#9858). Its cases pass or fail, and its report (handshakes per second
# and bulk throughput, from openssl s_time, curl and the clients' own
# timing) is appended to the commit's note like the bench's. The two
# peers built from source are cached on the script's hash, which holds
# their pins.
#
# The `tls-fuzz` job runs scripts/net-tls-fuzz: tlsfuzzer's TLS 1.3
# scripts, at a pinned commit, against the Fern TLS server, with the set
# and every exclusion and its reason in scripts/net-tls-fuzz.d/cases
# (#9858). It passes or fails; tlsfuzzer and its venv are cached on the
# script's hash, which holds the pins.
#
# The `autobahn` job runs scripts/net-autobahn: the Autobahn WebSocket
# test suite's fuzzing client, from its Docker image pinned by digest in
# the script, against the Fern echo server with permessage-deflate on
# (#9859). Every case passes or the job fails.
#
# The `h2spec` job runs scripts/net-h2spec: h2spec's strict conformance
# cases (its generic set, HPACK, the valid connection preface and RFC 9113
# §4 to §8) over prior-knowledge h2c against scripts/net-h2spec.d/server.fern,
# std/serve with HTTP/2 on, h2spec at the release the script pins by hash
# (#9860). Every case passes or the job fails; the counts are recorded like
# the bench's.
#
# The `httplint` job runs scripts/net-httplint: one response of each shape
# std/http and its middleware produce (a routed text and JSON API, a
# redirect, a problem, a 405, an upload echoed, a compressed body, a static
# file with its validators, a conditional 304, a range, a cacheable
# response), fetched with curl and read by httplint, REDbot's checks as a
# library, at the version scripts/net-httplint.d/requirements.txt pins
# (#9859). A note it rates BAD fails the job; the count of BAD and WARN
# notes per case is recorded like the bench's, and every note is in the
# log.

on:
  schedule:
    # 04:23 UTC, off the hour like nightly-fuzz.yml, since scheduled runs
    # across GitHub queue at :00.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long each load runs, in seconds."
        required: false
        default: "10"
      soak_seconds:
        description: "How long each soak server is held under load after its warm-up, in seconds."
        required: false
        default: "300"

permissions:
  contents: write

# Two loads at once would share the runner and measure each other.
concurrency:
  group: net-nightly
  cancel-in-progress: false

jobs:
  bench:
    name: net-nightly-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Rust toolchain that builds the hyper server is pinned in
    # mise.net-nightly.toml, which this env selects on top of mise.toml.
    env:
      MISE_ENV: net-nightly
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      # The load generator mise.toml pins and the Rust toolchain
      # mise.net-nightly.toml pins, beside the base toolchain setup-fern
      # installs; h2o is the runner image's package, its version in the
      # report's header.
      - name: Install oha and rust (mise.toml, mise.net-nightly.toml)
        run: mise install oha rust
      - name: Install h2o
        run: sudo apt-get install -y --no-install-recommends h2o

      - name: Load the hello servers
        env:
          FERN_NET_BENCH_SECONDS: ${{ github.event.inputs.seconds || '10' }}
        run: scripts/net-bench "${{ runner.temp }}/net-report.txt"

      - name: Record the report in refs/notes/perf
        if: github.ref == 'refs/heads/main'
        run: scripts/perf-history record net-nightly "${{ runner.temp }}/net-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: net-report-x86_64
          path: ${{ runner.temp }}/net-report.txt
          if-no-files-found: warn

  # scripts/net-soak: the three std/serve programs under scripts/net-soak.d
  # held under load for five minutes each with the leak census on, failing
  # on resident growth past the allowance after warm-up, on a failed
  # request, or on an unbalanced census when the server stops (#11915).
  # The rows go to the commit's note like the bench's, so
  # `scripts/perf-history show soak/echo.rss_end_kb` is the trend.
  soak:
    name: net-soak-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Install oha (mise.toml)
        run: mise install oha
      - name: Hold the soak servers under load
        env:
          FERN_NET_SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || '300' }}
        run: scripts/net-soak "${{ runner.temp }}/soak-report.txt"
      - name: Record the report in refs/notes/perf
        if: github.ref == 'refs/heads/main'
        run: scripts/perf-history record net-soak "${{ runner.temp }}/soak-report.txt"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-report-x86_64
          path: ${{ runner.temp }}/soak-report.txt
          if-no-files-found: warn

  interop:
    name: net-interop-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Install nginx, h2o and h2load
        run: sudo apt-get install -y --no-install-recommends nginx h2o nghttp2-client
      - name: Run the client and server against them
        run: scripts/net-interop

  tls-interop:
    name: net-tls-interop-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MISE_ENV: net-nightly
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      # openssl, curl, cmake and Go are the runner image's; the Rust
      # toolchain that builds rustls' examples is mise.net-nightly.toml's,
      # and ninja builds bssl. The report names the versions.
      - name: Install rust (mise.net-nightly.toml) and ninja
        run: |
          mise install rust
          sudo apt-get install -y --no-install-recommends ninja-build
      - name: Restore the peers built from source
        uses: actions/cache@v6
        with:
          path: ~/.cache/fern-tls-interop
          key: tls-interop-peers-${{ runner.os }}-${{ hashFiles('scripts/net-tls-interop') }}
      - name: Run the client and server against OpenSSL, Go, rustls and BoringSSL
        run: scripts/net-tls-interop "${{ runner.temp }}/tls-report.txt"
      - name: Record the report in refs/notes/perf
        if: github.ref == 'refs/heads/main'
        run: scripts/perf-history record net-tls-interop "${{ runner.temp }}/tls-report.txt"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tls-report-x86_64
          path: ${{ runner.temp }}/tls-report.txt
          if-no-files-found: warn

  tls-fuzz:
    name: net-tls-fuzz-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Restore tlsfuzzer and its venv
        uses: actions/cache@v5
        with:
          path: ~/.cache/fern-tls-fuzz
          key: tls-fuzz-${{ runner.os }}-${{ hashFiles('scripts/net-tls-fuzz', 'scripts/net-tls-fuzz.d/requirements.txt') }}
      - name: Run tlsfuzzer's TLS 1.3 scripts against the server
        run: scripts/net-tls-fuzz

  autobahn:
    name: net-autobahn-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Run the Autobahn suite against the server
        run: scripts/net-autobahn "${{ runner.temp }}/autobahn-report.txt"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobahn-report-x86_64
          path: ${{ runner.temp }}/autobahn-report.txt
          if-no-files-found: warn

  httplint:
    name: net-httplint-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Restore httplint's venv
        uses: actions/cache@v5
        with:
          path: ~/.cache/fern-httplint
          key: httplint-${{ runner.os }}-${{ hashFiles('scripts/net-httplint.d/requirements.txt') }}
      - name: Lint the server's responses
        run: scripts/net-httplint "${{ runner.temp }}/httplint-report.txt"
      - name: Record the report in refs/notes/perf
        if: github.ref == 'refs/heads/main'
        run: scripts/perf-history record net-httplint "${{ runner.temp }}/httplint-report.txt"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: httplint-report-x86_64
          path: ${{ runner.temp }}/httplint-report.txt
          if-no-files-found: warn

  h2spec:
    name: net-h2spec-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Restore h2spec
        uses: actions/cache@v5
        with:
          path: ~/.cache/fern-h2spec
          key: h2spec-${{ runner.os }}-${{ hashFiles('scripts/net-h2spec') }}
      - name: Run h2spec against the server
        run: scripts/net-h2spec "${{ runner.temp }}/h2spec-report.txt"
      - name: Record the report in refs/notes/perf
        if: github.ref == 'refs/heads/main'
        run: scripts/perf-history record net-h2spec "${{ runner.temp }}/h2spec-report.txt"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h2spec-report-x86_64
          path: ${{ runner.temp }}/h2spec-report.txt
          if-no-files-found: warn
