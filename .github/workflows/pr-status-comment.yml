name: PR Status Comment

# Posts (and keeps updated) a single status comment on a pull request that
# reflects the aggregate state of *all other* checks plus the PR's mergeability:
#
#   ✅  every other check on the head commit finished green
#   ❌  one or more checks failed / errored / timed out / were cancelled
#   ⚠️  the PR has merge conflicts with its base branch
#   ⏳  a transient "checks still running" baseline
#
# A NEW comment is posted each time the status changes (it never edits an
# existing comment). A hidden status marker on each comment lets us skip
# posting when the status is unchanged, so the thread isn't spammed with
# identical comments as each watched workflow finishes.
#
# Triggers:
#   workflow_run: completed  — re-evaluate every time one of the PR's CI
#                              workflows finishes. This is the trigger that
#                              actually fires reliably: `check_suite`/`check_run`
#                              do NOT trigger workflows for suites created by
#                              GitHub Actions itself (recursion prevention), so
#                              they're useless for "react after CI finishes".
#   pull_request             — surface conflicts (and a "checks running"
#                              baseline) as soon as the PR opens / is pushed
#                              to / reopens.
#
# NOTE: the `workflows:` list below must name every workflow that runs on
# pull_request. When you add a new PR-triggered workflow, add its `name:` here
# too, otherwise this comment won't re-evaluate when that workflow finishes.
# (`workflow_run` has no wildcard.) This workflow deliberately does NOT list
# itself, so it can't trigger itself recursively.
#
# workflow_run runs in the context of the base repo, so the GITHUB_TOKEN has
# write scope even for pull requests opened from forks.

on:
  workflow_run:
    workflows:
      - Lint
      - Examples
      - Docs build
      - macOS arm64
      - Playground E2E
      - Fuzz differential execution
      - Fuzz parse round-trip
      - Test units
      - Test fernsmith
      - VS Code Extension
      - Test e2e arm64
      - Test e2e differential
      - Test e2e other
      - Test e2e self-host
      - Test e2e wasm
      - Test e2e x86_64
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true

permissions:
  contents: read
  pull-requests: write
  checks: read

# Only one evaluation per PR at a time; cancel an in-flight run when a newer
# event for the same head arrives so we never race two comment upserts.
concurrency:
  group: >-
    pr-status-comment-${{
      github.event.pull_request.number
      || github.event.workflow_run.head_sha
      || github.event.inputs.pr_number
    }}
  cancel-in-progress: true

jobs:
  # A cancelled upstream workflow tells us nothing new: it was superseded by a
  # newer push, whose own run will re-trigger this. Evaluating it anyway costs a
  # queued job per cancelled workflow, and with 16 watched workflows that is the
  # bulk of the churn (measured: 58 runs of this workflow against a single SHA,
  # 51 of them cancelled before they posted anything).
  status-comment:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Each status comment is tagged with its status so we can tell when
            // the state actually changed. We post a NEW comment on every change
            // (never edit an existing one), but skip when the most recent status
            // comment already reflects the same status — otherwise every watched
            // workflow finishing while others are still pending would spam an
            // identical "checks running" comment.
            const MARKER_PREFIX = '<!-- pr-status-comment:';
            // The check-run name this workflow contributes to a PR (== the job
            // name below). Excluded from the tally so we never wait on / report
            // ourselves. Compared against check_run.name, which is the *job*
            // name — NOT context.workflow.
            const SELF_CHECK = 'status-comment';

            // --- Resolve the target PR(s) for this event ----------------------
            // pull_request:      the PR is on the payload.
            // workflow_run:      map head SHA -> open PR(s) (payload list first).
            // workflow_dispatch: explicit pr_number input.
            let prNumbers = [];
            if (context.eventName === 'pull_request') {
              prNumbers = [context.payload.pull_request.number];
            } else if (context.eventName === 'workflow_dispatch') {
              prNumbers = [Number(context.payload.inputs.pr_number)];
            } else if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const fromPayload = (run.pull_requests || []).map(p => p.number);
              if (fromPayload.length) {
                prNumbers = fromPayload;
              } else {
                // Forks: workflow_run.pull_requests is empty — look up by SHA.
                const assoc = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: run.head_sha,
                });
                prNumbers = assoc.data
                  .filter(p => p.state === 'open')
                  .map(p => p.number);
              }
            }
            prNumbers = [...new Set(prNumbers)].filter(Boolean);
            if (!prNumbers.length) {
              core.info('No open PR associated with this event; nothing to do.');
              return;
            }

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            for (const prNumber of prNumbers) {
              await evaluatePR(prNumber);
            }

            async function evaluatePR(prNumber) {
              // GitHub computes mergeable_state asynchronously; it can come back
              // as "unknown" right after a push. Poll a few times before giving up.
              let pr;
              for (let i = 0; i < 5; i++) {
                pr = (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                })).data;
                if (pr.mergeable_state && pr.mergeable_state !== 'unknown') break;
                await sleep(2000);
              }
              if (pr.state !== 'open') {
                core.info(`PR #${prNumber} is ${pr.state}; skipping.`);
                return;
              }

              const headSha = pr.head.sha;

              // --- Gather all check runs + commit statuses on the head SHA -----
              const checkRuns = await github.paginate(
                github.rest.checks.listForRef,
                { owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100 },
              );
              // Exclude this workflow's own check run from the tally.
              const tracked = checkRuns.filter(r => r.name !== SELF_CHECK);

              // Legacy commit statuses (e.g. some external CI) count too.
              const combined = (await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: headSha,
              })).data;

              const FAIL = new Set(['failure', 'timed_out', 'cancelled', 'action_required', 'stale']);
              const failedChecks = tracked.filter(r => r.status === 'completed' && FAIL.has(r.conclusion));
              const pendingChecks = tracked.filter(r => r.status !== 'completed');
              const failedStatuses = combined.statuses.filter(s => s.state === 'failure' || s.state === 'error');
              const pendingStatuses = combined.statuses.filter(s => s.state === 'pending');

              const hasConflicts = pr.mergeable === false || pr.mergeable_state === 'dirty';
              const anyFailed = failedChecks.length > 0 || failedStatuses.length > 0;
              const anyPending = pendingChecks.length > 0 || pendingStatuses.length > 0;

              // --- Compose the comment body ------------------------------------
              let body, status;
              if (hasConflicts) {
                status = 'conflict';
                body = `### ⚠️ Merge conflicts\n\n`
                  + `This pull request has conflicts with its base branch (\`${pr.base.ref}\`) `
                  + `and can't be merged as-is. Please rebase or merge \`${pr.base.ref}\` and resolve the conflicts.`;
              } else if (anyFailed) {
                status = 'failed';
                const names = [
                  ...failedChecks.map(r => `\`${r.name}\` (${r.conclusion})`),
                  ...failedStatuses.map(s => `\`${s.context}\` (${s.state})`),
                ];
                body = `### ❌ Checks failing\n\n`
                  + `The following check(s) did not pass:\n\n`
                  + names.map(n => `- ${n}`).join('\n')
                  + `\n\nPush a fix and they'll re-run automatically.`;
              } else if (anyPending) {
                status = 'running';
                const n = pendingChecks.length + pendingStatuses.length;
                body = `### ⏳ Checks running\n\n`
                  + `${n} check${n === 1 ? ' is' : 's are'} still in progress. `
                  + `I'll post an update once everything settles.`;
              } else if (tracked.length === 0 && combined.statuses.length === 0) {
                core.info(`PR #${prNumber}: no other checks reported yet; skipping.`);
                return;
              } else {
                status = 'passed';
                body = `### ✅ All checks passed\n\n`
                  + `Every check on this pull request is green and there are no merge conflicts. `
                  + `This PR is ready to go. 🚀`;
              }
              const marker = `${MARKER_PREFIX}${status} -->`;
              body += `\n\n${marker}`;

              // --- Post a new comment, but only when the status changed --------
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100,
              });
              const prior = comments.filter(c => c.body && c.body.includes(MARKER_PREFIX));
              const last = prior[prior.length - 1];
              if (last && last.body.includes(marker)) {
                core.info(`PR #${prNumber}: status unchanged (${status}); not posting a duplicate.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
              core.info(`PR #${prNumber}: posted ${status} status comment.`);
            }
