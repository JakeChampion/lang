name: Fuzz parse round-trip

# Wasm-smith-style structured fuzzer over the parser + checker.
# Every program emitted by fernsmith parses + type-checks by
# construction, so any failure here is a real parser / checker
# bug. Caught bugs in #588 and #614 that the seed-based sweeps in
# `go test` didn't surface.
#
# 60-second budget — short enough to fit per-PR latency, long enough
# to exercise the fuzzer beyond its first few thousand inputs.
#
# ONE ARCH, deliberately. The target generates a program and runs it
# through modload + parser + checker (fuzz_test.go: GenBytes then
# checkGenerated); no backend, no codegen, nothing that reads the host.
# So a second leg re-runs an arch-independent property for a second
# runner slot, which under a saturated pool is a slot the self-host
# lane does not get. The sibling fuzz-diff lane DOES keep both arches
# and should: FuzzGenerate_ExecutionAgrees runs the compiled binaries
# natively, so the host is the thing under test there.
#
# Depth comes from nightly-fuzz.yml, which runs this same target on a
# much longer budget against a persisted corpus. This lane is a smoke
# test.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz-parse-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - run: gotestsum --format testname -- -fuzz=FuzzGenerate_ParseRoundTrips -fuzztime=60s -run=^$ ./internal/fernsmith
