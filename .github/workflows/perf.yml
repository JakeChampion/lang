name: Perf

# Four gates, one comparator (scripts/ci-check-perf):
#
#   bench   instruction counts over examples/bench, vs .github/perf-baseline.txt
#   cliff   how much the self-host compiler copies crossing the rc==1 append
#           cliff, vs .github/cliff-baseline.txt
#   selfhost-size  what the self-host compiler EMITS, all three targets from
#           one build, vs .github/perf-baseline-selfhost.txt
#   alloc   how much the self-host compiler ALLOCATES compiling one real
#           module, vs .github/alloc-baseline.txt
#
# WHY INSTRUCTION COUNTS AND NOT WALL TIME. A shared CI runner's wall time
# varies by tens of percent between runs, so a threshold loose enough to avoid
# false alarms is too loose to catch a real regression. An instruction count on
# a static binary is identical to the digit across runs and hosts, so a 1%
# change is signal. The one exception — the string-keyed map's per-process hash
# seed — is documented and given its own tolerance in the baseline.
#
# ADVISORY, EXCEPT THE ALLOCATION COMPARISON. Every check here warns and
# annotates without failing the job — flip FERN_CI_PERF_GATE_STRICT=1 on one
# once its numbers have been stable for a while and the corpus is trusted, the
# route the size gate took (#6826). The self-host allocation step is the
# exception and does fail: it carries FERN_CI_PERF_GATE_MAX_DRIFT, a CEILING
# rather than a strict tolerance, for the reasons written above that step
# (#9963).
#
# HISTORY. On main, every job also appends its report to the commit's note
# under refs/notes/perf (scripts/perf-history). The baseline files are the
# gate; the notes are the trend — `scripts/perf-history show METRIC` reads a
# metric back across the last 50 main commits, with nothing hosted and nothing
# that expires the way the report artifacts do. `contents: write` on each job
# is what lets it push that ref; branch protection does not apply to notes.
#
# Cost: `bench` is ~8 seconds of measurement on top of a Go build. `cliff`,
# `selfhost-size` and `alloc` all build the self-hosted compiler first, so they
# run in minutes — `selfhost-size` measures for ~30 seconds once it has a
# binary, and `alloc` runs end to end in ~40 s on a 4-core box, nearly all of it
# that build.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: perf-${{ matrix.host }}
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      # valgrind carries the dynamic half. If it cannot be installed the run
      # still reports the static half and says which half is missing, rather
      # than reporting a green it did not earn.
      - uses: ./.github/actions/disable-chrome-apt
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Benchmark
        run: scripts/perf-bench "${{ runner.temp }}/perf-report.txt"

      - name: Compare against the baseline
        run: scripts/ci-check-perf .github/perf-baseline.txt "${{ runner.temp }}/perf-report.txt"

      - name: Record the report in refs/notes/perf
        if: github.event_name == 'push'
        run: scripts/perf-history record perf-${{ matrix.host }} "${{ runner.temp }}/perf-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report-${{ matrix.host }}
          path: ${{ runner.temp }}/perf-report.txt
          if-no-files-found: warn

  # THREE MEASUREMENTS, ONE JOB. Each of these builds the whole self-hosted
  # compiler and then measures for well under a minute, so as separate jobs they
  # paid three checkouts, three toolchain setups, three queue admissions and two
  # redundant self-host builds to do about two minutes of work. lint.yml made
  # this same trade first and recorded the number: eight sub-minute jobs spent
  # 165 job-minutes in the queue (run 31819147972). Fewer, fuller jobs beat
  # more, emptier ones whenever the pool is the constraint, and it is.
  #
  # The scripts already share by construction — cliff-bench and
  # perf-bench-selfhost both skip the build when bin/fern-selfhost is present
  # and current — so one job builds it once and the other two measurements find
  # it there.
  #
  # It also removes a contention this lane created for itself: three concurrent
  # jobs pushing refs/notes/perf for the same commit raced, and scripts/perf-
  # history retried the loser. In one job they append in sequence.
  #
  # `if: ${{ !cancelled() }}` on every step is what keeps the collapse honest:
  # a red cliff gate must not hide the size and allocation numbers, which is the
  # "which gates are red" signal three separate check runs gave for free. The
  # perf-history LANE LABELS are unchanged — they key the note blocks that
  # `scripts/perf-history show` reads back across main, so renaming one would
  # orphan its history.
  #
  # x86_64 only, all three: the aarch64 lane does not build a self-host
  # compiler. That costs nothing, because these metrics are keyed by TARGET
  # rather than host — one binary cross-emits x86-64, arm64 and wasm.
  selfhost-perf:
    name: selfhost-perf-x86_64
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      # How much the SELF-HOST COMPILER copies crossing the rc==1 append cliff.
      #
      # It exists because nothing measured this. docs/LOCAL-DEV-LOOP.md recorded
      # the workload at 188 crossings / 812 bytes on 2026-08-04; by 2026-08-16 it
      # copied 21.4 GB, and twelve days of PRs went green over it (#6911).
      - name: Measure the append cliff
        if: ${{ !cancelled() }}
        run: scripts/cliff-bench "${{ runner.temp }}/cliff-report.txt"

      - name: Compare the append cliff against the baseline
        if: ${{ !cancelled() }}
        env:
          FERN_PERF_GATE_LABEL: self-host append cliff
        run: scripts/ci-check-perf .github/cliff-baseline.txt "${{ runner.temp }}/cliff-report.txt"

      # What the SELF-HOST compiler EMITS, for all three targets from one build.
      #
      # `bench` above measures the native compiler, so the self-host compiler's
      # own output was never measured and moved unobserved: the roadmap's
      # 353-line figure was stale and unreproducible, and arm64 shipped a
      # ~400-instruction f64 transcendental bundle in every program — pure-integer
      # ones included — until #2649 gated it.
      - name: Measure the self-host compiler's emitted size
        if: ${{ !cancelled() }}
        run: scripts/perf-bench-selfhost "${{ runner.temp }}/selfhost-size-report.txt"

      - name: Compare the emitted size against the baseline
        if: ${{ !cancelled() }}
        env:
          FERN_PERF_GATE_LABEL: self-host emitted size
        run: scripts/ci-check-perf .github/perf-baseline-selfhost.txt "${{ runner.temp }}/selfhost-size-report.txt"

      # How much the SELF-HOST COMPILER ALLOCATES compiling one real module.
      #
      # docs/IR-SELFCOMPILE-OOM-FINDINGS.md pins the self-compile's binding
      # constraint on allocation PERFORMED, and it is a number the others cannot
      # see: `cliff` counts only what the append cliff copies, so a quadratic
      # `.with` moves neither of its metrics, and the two size lanes measure
      # emitted text and never run a compile at all.
      #
      # FERN_ALLOC_PEAK_RSS=0 drops the script's optional peak-RSS row: it is not
      # comparable across hosts, so it cannot be baselined here, and skipping it
      # also drops a second full self-host build.
      - name: Measure the self-host compiler's allocation
        if: ${{ !cancelled() }}
        env:
          FERN_ALLOC_PEAK_RSS: "0"
        run: scripts/selfhost-alloc-bench "${{ runner.temp }}/alloc-report.txt"

      # THE ONE PERF LANE WITH A CEILING. #9963: the baseline sat 82% behind
      # main for six days, the comparator warning correctly on every run into a
      # channel nobody was required to read — so a 1% tolerance was measured
      # against a figure 82% away and could not report anything smaller. A lane
      # whose whole value is catching allocation growth, that cannot go red,
      # does not catch it.
      #
      # NOT plain FERN_CI_PERF_GATE_STRICT, and the difference is measured.
      # Strict makes the 1% TOLERANCE fatal, and this pair drifted +0.32% in two
      # hours of unrelated merges while #9972 sat in CI: fatal at 1% red-lights
      # roughly every sixth PR and hands its author a re-bank for drift they did
      # not cause, which is the complaint 9217a114 already wrote down. The
      # tolerance stays a significance threshold; the CEILING is what cannot be
      # ignored. An order of magnitude above the tolerance is wide enough that
      # only a real move reaches it and narrow enough that 82% never happens
      # again.
      #
      # A ceiling is affordable on this job for the reason the driver-size gate
      # gives (#7519): it is a leaf. Nothing `needs:` the Perf jobs, so a red
      # alloc gate blocks the merge and holds no other job — and every step here
      # is `!cancelled()` with `always()` on the upload, so a finding still
      # leaves the report recorded and uploaded rather than hiding the numbers
      # it is complaining about.
      #
      # These two metrics can carry a ceiling where the instruction-count lanes
      # cannot: they count heap events the compiler performed rather than time
      # it took, so they repeat to the digit on one checkout and spread five
      # counts end to end across paths.
      - name: Compare the allocation against the baseline
        if: ${{ !cancelled() }}
        env:
          FERN_PERF_GATE_LABEL: self-host allocation
          FERN_CI_PERF_GATE_MAX_DRIFT: "10"
        run: scripts/ci-check-perf .github/alloc-baseline.txt "${{ runner.temp }}/alloc-report.txt"

      # One lane label per metric, unchanged: the note blocks are keyed by them.
      - name: Record the reports in refs/notes/perf
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          scripts/perf-history record append-cliff-x86_64 "${{ runner.temp }}/cliff-report.txt"
          scripts/perf-history record selfhost-size-x86_64 "${{ runner.temp }}/selfhost-size-report.txt"
          scripts/perf-history record selfhost-alloc-x86_64 "${{ runner.temp }}/alloc-report.txt"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-perf-reports-x86_64
          path: |
            ${{ runner.temp }}/cliff-report.txt
            ${{ runner.temp }}/selfhost-size-report.txt
            ${{ runner.temp }}/alloc-report.txt
          if-no-files-found: warn
