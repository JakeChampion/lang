name: Perf

# Four gates, one comparator (scripts/ci-check-perf):
#
#   bench   instruction counts over examples/bench, vs .github/perf-baseline.txt
#   cliff   how much the self-host compiler copies crossing the rc==1 append
#           cliff, vs .github/cliff-baseline.txt
#   selfhost-size  what the self-host compiler EMITS, all three targets from
#           one build, vs .github/perf-baseline-selfhost.txt
#   alloc   how much the self-host compiler ALLOCATES compiling one real
#           module, vs .github/alloc-baseline.txt
#
# WHY INSTRUCTION COUNTS AND NOT WALL TIME. A shared CI runner's wall time
# varies by tens of percent between runs, so a threshold loose enough to avoid
# false alarms is too loose to catch a real regression. An instruction count on
# a static binary is identical to the digit across runs and hosts, so a 1%
# change is signal. The one exception — the string-keyed map's per-process hash
# seed — is documented and given its own tolerance in the baseline.
#
# ADVISORY. The check warns and annotates; it does not fail the job. Flip
# FERN_CI_PERF_GATE_STRICT=1 below once the numbers have been stable for a
# while and the corpus is trusted. This mirrors the size gate (#6826), which
# took the same route.
#
# HISTORY. On main, every job also appends its report to the commit's note
# under refs/notes/perf (scripts/perf-history). The baseline files are the
# gate; the notes are the trend — `scripts/perf-history show METRIC` reads a
# metric back across the last 50 main commits, with nothing hosted and nothing
# that expires the way the report artifacts do. `contents: write` on each job
# is what lets it push that ref; branch protection does not apply to notes.
#
# Cost: `bench` is ~8 seconds of measurement on top of a Go build. `cliff`,
# `selfhost-size` and `alloc` all build the self-hosted compiler first, so they
# run in minutes — `selfhost-size` measures for ~30 seconds once it has a
# binary, and `alloc` runs end to end in ~40 s on a 4-core box, nearly all of it
# that build.

on:
  pull_request:
    # DOC-ONLY CHANGES DO NOT NEED THE COMPILER SUITE. This project opens a PR
    # for every push including doc fixes and comment corrections, and each one
    # was launching ~85 jobs into a queue that is the binding constraint on
    # every other PR in flight.
    #
    # Deliberately narrow. `*.md` does not cross a `/` in a GitHub path filter,
    # so it is root-level prose only (README, CLAUDE.md) and the literate
    # sources under examples/literate/*.fern.md — which ARE compiled — still
    # trigger everything. docs/ holds no .fern.md and no test fixture; the two
    # e2e tests that name a docs/ path only cite it in a comment or a failure
    # message.
    #
    # lint.yml deliberately has NO filter, so a doc-only PR still runs one real
    # gate rather than reporting no checks at all.
    #
    # The identical block on every lane is pinned by
    # TestPRWorkflowsShareOneDocOnlyFilter (internal/sourcelint).
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # Also on main: a rebase-merge replays commits onto a main their PR's CI never
  # saw, so a coupling between two individually-green PRs exists only in the
  # merge. Filter mirrors the pull_request one; pinned by TestGateLanesRunOnMain.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# main never cancels its own in-flight run, and gets one concurrency group
# rather than one per SHA: a SHA-keyed group supersedes nothing, so a burst of
# back-to-back rebase-merges holds an uncancellable run each and buries every
# open PR's checks behind it (#8124). One group coalesces the burst to its
# newest commit, at the cost of a red main naming a span of merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: perf-${{ matrix.host }}
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      # valgrind carries the dynamic half. If it cannot be installed the run
      # still reports the static half and says which half is missing, rather
      # than reporting a green it did not earn.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Benchmark
        run: scripts/perf-bench "${{ runner.temp }}/perf-report.txt"

      - name: Compare against the baseline
        run: scripts/ci-check-perf .github/perf-baseline.txt "${{ runner.temp }}/perf-report.txt"

      - name: Record the report in refs/notes/perf
        if: github.event_name == 'push'
        run: scripts/perf-history record perf-${{ matrix.host }} "${{ runner.temp }}/perf-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report-${{ matrix.host }}
          path: ${{ runner.temp }}/perf-report.txt
          if-no-files-found: warn

  # How much the SELF-HOST COMPILER copies crossing the rc==1 append cliff.
  # Separate job because it is a different subject and a different cost: `bench`
  # measures small programs the native compiler built, this builds the whole
  # self-hosted compiler and runs it over a real module, so it takes minutes
  # rather than seconds.
  #
  # It exists because nothing measured this. docs/LOCAL-DEV-LOOP.md recorded the
  # workload at 188 crossings / 812 bytes on 2026-08-04; by 2026-08-16 it copied
  # 21.4 GB, and twelve days of PRs went green over it (#6911). x86_64 only for
  # now — the aarch64 lane does not build a self-host compiler.
  cliff:
    name: append-cliff-x86_64
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: Measure the append cliff
        run: scripts/cliff-bench "${{ runner.temp }}/cliff-report.txt"

      - name: Compare against the baseline
        env:
          FERN_PERF_GATE_LABEL: self-host append cliff
        run: scripts/ci-check-perf .github/cliff-baseline.txt "${{ runner.temp }}/cliff-report.txt"

      - name: Record the report in refs/notes/perf
        if: github.event_name == 'push'
        run: scripts/perf-history record append-cliff-x86_64 "${{ runner.temp }}/cliff-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cliff-report-x86_64
          path: ${{ runner.temp }}/cliff-report.txt
          if-no-files-found: warn

  # What the SELF-HOST compiler EMITS, for all three targets from one build.
  #
  # `bench` above measures the native compiler, so the self-host compiler's own
  # output was never measured and moved unobserved: the roadmap's 353-line
  # figure was stale and unreproducible, and arm64 shipped a ~400-instruction
  # f64 transcendental bundle in every program — pure-integer ones included —
  # until #2649 gated it. A size lane exists to catch precisely that, and
  # neither showed up in the native numbers.
  #
  # x86_64 only, like `cliff`: the aarch64 lane does not build a self-host
  # compiler. That costs nothing here, because these metrics are keyed by
  # TARGET rather than host — one binary cross-emits x86-64, arm64 and wasm, so
  # a single host covers the whole namespace.
  selfhost-size:
    name: selfhost-size-x86_64
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: Measure the self-host compiler's emitted size
        run: scripts/perf-bench-selfhost "${{ runner.temp }}/selfhost-size-report.txt"

      - name: Compare against the baseline
        env:
          FERN_PERF_GATE_LABEL: self-host emitted size
        run: scripts/ci-check-perf .github/perf-baseline-selfhost.txt "${{ runner.temp }}/selfhost-size-report.txt"

      - name: Record the report in refs/notes/perf
        if: github.event_name == 'push'
        run: scripts/perf-history record selfhost-size-x86_64 "${{ runner.temp }}/selfhost-size-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-size-report-x86_64
          path: ${{ runner.temp }}/selfhost-size-report.txt
          if-no-files-found: warn

  # How much the SELF-HOST COMPILER ALLOCATES compiling one real module.
  #
  # docs/IR-SELFCOMPILE-OOM-FINDINGS.md pins the self-compile's binding
  # constraint on allocation PERFORMED, and it is a number the other three lanes
  # cannot see: `cliff` counts only what the append cliff copies, so a quadratic
  # `.with` or a per-occurrence substring moves neither of its metrics, and the
  # two size lanes measure emitted text and never run a compile at all. The
  # harness has existed since #4394 was measured and retired; nothing ran it
  # outside a human typing the command, which is the shape that let the cliff
  # workload go from 812 bytes to 21.4 GB over twelve green days (#6911).
  #
  # x86_64 only, like `cliff` — the aarch64 lane does not build a self-host
  # compiler. FERN_ALLOC_PEAK_RSS=0 drops the script's optional peak-RSS row:
  # it is not comparable across hosts, so it cannot be baselined here, and
  # skipping it also drops a second full self-host build from the lane.
  alloc:
    name: selfhost-alloc-x86_64
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: Measure the self-host compiler's allocation
        env:
          FERN_ALLOC_PEAK_RSS: "0"
        run: scripts/selfhost-alloc-bench "${{ runner.temp }}/alloc-report.txt"

      - name: Compare against the baseline
        env:
          FERN_PERF_GATE_LABEL: self-host allocation
        run: scripts/ci-check-perf .github/alloc-baseline.txt "${{ runner.temp }}/alloc-report.txt"

      - name: Record the report in refs/notes/perf
        if: github.event_name == 'push'
        run: scripts/perf-history record selfhost-alloc-x86_64 "${{ runner.temp }}/alloc-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alloc-report-x86_64
          path: ${{ runner.temp }}/alloc-report.txt
          if-no-files-found: warn
