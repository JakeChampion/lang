name: Refresh bundled data

# The standard library bundles tables taken from upstream sources: the
# public suffix list (std/publicsuffix), Mozilla's root store
# (std/tls/mozilla), and the IANA zones and Unicode tables that follow the
# pinned Go toolchain (std/tz, std/unicode); and the toolchain itself is
# pinned in mise.toml. Each goes stale between bumps by hand. This runs
# scripts/refresh-data for every source once a week and, where the output
# changed, opens a pull request on a branch of the source's name, updating
# that pull request on later weeks until it merges. The pull request then runs the ordinary CI, where a change
# upstream that breaks a test shows up as a red lane rather than landing
# unseen; auto-merge is asked for, so one the repository allows to merge
# itself lands once its checks pass.
#
# The branch is pushed with the AUTO_REBASE_TOKEN secret where the
# repository has one that GitHub still accepts, for the reason
# auto-rebase-prs.yml gives: a push made with the default GITHUB_TOKEN
# triggers no workflow run, so a pull request opened under it would get no
# CI. Where the secret is missing or refused (an expired token), the push
# and the pull request fall back to GITHUB_TOKEN, the log says so, and the
# first push by hand starts the checks. The checkout never uses the secret:
# a refused token there fails the job before anything is refreshed.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: Which source to refresh
        type: choice
        default: all
        options:
          - all
          - publicsuffix
          - roots
          - toolchain-tables
          - toolchain

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    strategy:
      fail-fast: false
      matrix:
        # Every source on the schedule and on an `all` dispatch, the one
        # named otherwise. Both arms of the ternary are non-empty strings,
        # which is what makes the `&& ||` form safe here.
        source: ${{ fromJSON((github.event_name == 'schedule' || inputs.source == 'all') && '["publicsuffix", "roots", "toolchain-tables", "toolchain"]' || format('["{0}"]', inputs.source)) }}
    name: refresh-${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: Refresh ${{ matrix.source }}
        run: scripts/refresh-data "${{ matrix.source }}" | tee "${{ runner.temp }}/refresh.log"

      - name: Open or update the pull request
        env:
          AUTO_REBASE_TOKEN: ${{ secrets.AUTO_REBASE_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "$SOURCE is up to date"
            exit 0
          fi
          branch="refresh/$SOURCE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -q -F - <<EOF
          Refresh the bundled $SOURCE data

          Generated by scripts/refresh-data $SOURCE in the refresh-data workflow:
          the upstream source fetched, the generator re-run and its tests passed.
          EOF
          # The secret first, for a push that starts CI; the default token
          # when there is none or GitHub refuses it.
          GH_TOKEN=""
          if [ -n "$AUTO_REBASE_TOKEN" ] && git push --force "https://x-access-token:$AUTO_REBASE_TOKEN@github.com/$GITHUB_REPOSITORY" "$branch"; then
            GH_TOKEN="$AUTO_REBASE_TOKEN"
          else
            echo "AUTO_REBASE_TOKEN is missing or refused; pushing with GITHUB_TOKEN, which starts no checks"
            git push --force "https://x-access-token:$DEFAULT_TOKEN@github.com/$GITHUB_REPOSITORY" "$branch"
            GH_TOKEN="$DEFAULT_TOKEN"
          fi
          export GH_TOKEN
          title="Refresh the bundled $SOURCE data"
          {
            echo "Weekly refresh of the \`$SOURCE\` tables by \`scripts/refresh-data\` (.github/workflows/refresh-data.yml). The generator's own tests passed; the stdlib suites run here as on any pull request."
            echo
            echo '```'
            cat "${{ runner.temp }}/refresh.log"
            echo '```'
          } > "${{ runner.temp }}/body.md"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --title "$title" --body-file "${{ runner.temp }}/body.md"
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "${{ runner.temp }}/body.md"
          fi
          # Auto-merge needs the repository's permission; one that does not
          # grant it leaves the pull request for a person to merge.
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --rebase || echo "auto-merge is not available; the pull request waits for a merge by hand"
