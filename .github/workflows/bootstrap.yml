name: Bootstrap

# The Go-free path to a Fern compiler, and the pin it starts from.
#
# `make bootstrap` (bootstrap/bootstrap.sh) takes a pinned earlier self-host
# compiler — stage0, named by bootstrap/stage0.lock — and compiles the current
# examples/self_host/fern.fern with it. The result must compile and run a
# program before it is installed as bin/fern-selfhost. Nothing here builds or
# runs bin/fern: this is the demonstration that a checkout reaches a Fern
# binary without the Go toolchain or the native backends
# (docs/NATIVE-CONVERGENCE.md §3a precondition 1).
#
# `make distcheck` — the compiler stage1 built recompiling the compiler, and
# the result doing it once more, byte-identical (stage2 == stage3) — runs on
# all three hosts. It is the whole-compiler fixpoint, the configuration no
# per-module fixpoint reaches, and docs/NATIVE-CONVERGENCE.md's criterion
# for the native freeze: tools/freeze_gate.sh reads this file to see it wired.
#
# Two jobs, two triggers:
#
#   verify   pull request / push to main, via ci.yml — `make bootstrap` and
#            `make distcheck` against the CURRENT pin, on all three hosts.
#            No Go setup, on purpose: a step that quietly needed
#            it would defeat what the job proves. Runs when the compiler's
#            source, the stdlib it compiles against, or the bootstrap itself
#            changes. Red means either the current source uses something the
#            pinned stage0 does not know — the failure says so, and the fix
#            is a refresh — or the compiler it built does not work, or the
#            compiler does not reproduce itself.
#
#   publish  workflow_dispatch with publish=true — builds a NEW stage0 for
#            all three hosts and releases it. Each host builds a candidate
#            with the current pin (`make selfhost-cli`) and proves the
#            candidate compiles the current compiler and that the result runs
#            (STAGE0=candidate make bootstrap). Every host goes on to
#            `make distcheck` and uploads STAGE2 — the self-built fixed point,
#            whose bytes any correct compiler of this source reproduces — so
#            the pin a refresh leaves behind is a self-built binary.
#            The release job tags an immutable `stage0-<date>-<sha7>` release
#            with the three gzipped binaries and a ready-to-commit
#            stage0.lock; committing that lock is the refresh
#            (docs/BOOTSTRAP.md). Runs on the branch you dispatch it from,
#            and can only pin source the current pin compiles.
#
# The pin is a release asset rather than a file in the tree so that a refresh
# is a one-line diff: each host's compiler is 3-4 MB compressed, three hosts
# per refresh, and every refresh would otherwise stay in the history of every
# clone forever. The lock's sha256 is of the UNCOMPRESSED binary, so what is
# verified is the thing that runs, not the container.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      publish:
        description: "Build a fresh stage0 on all three hosts and publish it as a stage0-<date>-<sha7> release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || !inputs.publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86-64-linux }
          - { runner: ubuntu-24.04-arm, host: arm64-linux }
          # arm64-darwin ran without the fixed point until 2026-09-29: its
          # stage2 exhausted the 16 GiB arena compiling the compiler (#8479).
          # The measured round that showed it holding (stage3 in 56 s at
          # 3.8 GB RSS, stage2 == stage3) is in docs/LOCAL-DEV-LOOP.md, "The
          # stage-1 / stage-2 self-compile on Apple Silicon". Peak footprint
          # 5.7 GB on a 7 GB runner: a regression in the compiler's own memory
          # shows up on this host first. Like the other two hosts, this
          # measures the chain from the PIN; only candidate-arm64 below also
          # runs it from a candidate built from the current source, and only on
          # arm64-linux (docs/TEST-GATES.md, the `make bootstrap` row).
          - { runner: macos-15,         host: arm64-darwin }
    name: verify-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    # Three whole-compiler compiles: 307 s + 209 s + 137 s at up to 6.1 GB on a
    # 4-core 16 GB x86-64 host (measured 2026-09-28, docs/BOOTSTRAP.md), plus
    # the download and the smoke test. About a minute per stage on macos-15.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: make bootstrap (pinned stage0 -> stage1, smoke-tested, installed)
        run: make bootstrap
      - name: make distcheck (stage1 -> stage2 -> stage3, stage2 == stage3)
        run: make distcheck

  # The freshly built arm64 candidate compiling the whole compiler. `verify`
  # above runs the PINNED stage0, and stage2-fixpoint-arm64 drives
  # asm_load_run.fern rather than fern.fern, so without this the publish job is
  # the first thing to run this shape — which is how #8430 sat undetected.
  candidate-arm64:
    if: github.event_name == 'pull_request' || !inputs.publish
    name: candidate-arm64-linux
    runs-on: ubuntu-24.04-arm
    # 24 s to build the candidate, 47 s for it to compile the compiler, on this
    # runner (measured 2026-09-05 from the publish job's own steps), then two
    # more whole-compiler compiles for the fixed point.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: the current pin builds the candidate (make selfhost-cli)
        run: |
          make selfhost-cli SELFHOST_TARGET=arm64-linux
          mkdir -p build
          cp bin/fern-selfhost build/candidate

      - name: the candidate compiles the current compiler, and that compiler works
        run: STAGE0=build/candidate make bootstrap

      # The same steps the publish job runs on this host, so a PR sees them.
      - name: the compiler it built reproduces itself (stage2 == stage3)
        run: STAGE0=build/candidate make distcheck

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    # A later publish supersedes an earlier one — both would tag the same
    # release. Job-level, per host: a workflow-level group is not this lane's
    # to hold (ci.yml owns it when this lane is called), and one group across
    # the matrix would make the three hosts cancel each other. A called run
    # skips this job but still enters its group, so only a publish dispatch
    # gets the shared name: otherwise every CI run's bootstrap lane cancels
    # the publish in flight.
    concurrency:
      group: ${{ inputs.publish && format('bootstrap-dispatch-publish-{0}', matrix.host) || format('bootstrap-called-{0}-{1}', github.run_id, matrix.host) }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86-64-linux }
          - { runner: ubuntu-24.04-arm, host: arm64-linux }
          - { runner: macos-15,         host: arm64-darwin }
    name: publish-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: the current pin builds the candidate (make selfhost-cli)
        run: |
          make selfhost-cli SELFHOST_TARGET=${{ matrix.host }}
          mkdir -p build
          cp bin/fern-selfhost build/candidate

      - name: the candidate compiles the current compiler, and that compiler works
        run: STAGE0=build/candidate make bootstrap

      # Every host pins the self-built fixed point rather than the candidate.
      - name: the compiler it built reproduces itself (stage2 == stage3); stage2 becomes the pin
        run: |
          STAGE0=build/candidate make distcheck
          cp build/bootstrap/stage2 build/candidate

      - name: package this host's stage0 (its stage2)
        run: |
          mkdir -p dist
          gzip -n -9 -c build/candidate > "dist/fern-selfhost-${{ matrix.host }}.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum build/candidate | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 build/candidate | cut -d' ' -f1)
          fi
          echo "${{ matrix.host }} $sum" > "dist/${{ matrix.host }}.pin"
          ls -la dist
          cat "dist/${{ matrix.host }}.pin"

      - uses: actions/upload-artifact@v7
        with:
          name: stage0-${{ matrix.host }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: publish
    concurrency:
      group: ${{ inputs.publish && 'bootstrap-dispatch-release' || format('bootstrap-called-release-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: write stage0.lock
        run: |
          tag="stage0-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_ENV"
          {
            echo "# stage0 pin for \`make bootstrap\` — docs/BOOTSTRAP.md. Refresh: dispatch"
            echo "# .github/workflows/bootstrap.yml with publish=true and commit the lock it releases."
            echo "source $GITHUB_SHA"
            echo "url https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
            cat dist/x86-64-linux.pin dist/arm64-linux.pin dist/arm64-darwin.pin
          } > dist/stage0.lock
          rm dist/*.pin
          cat dist/stage0.lock

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "stage0 $tag" \
            --notes "Self-host compiler snapshot for \`make bootstrap\`, built from $GITHUB_SHA: on every host the self-built fixed point (stage2 == stage3 of \`make distcheck\`), checked on its host to compile the compiler at that commit. Pin it by committing \`stage0.lock\` to \`bootstrap/stage0.lock\` — see docs/BOOTSTRAP.md." \
            dist/fern-selfhost-x86-64-linux.gz dist/fern-selfhost-arm64-linux.gz dist/fern-selfhost-arm64-darwin.gz dist/stage0.lock
          {
            echo "## stage0 published: \`$tag\`"
            echo
            echo "Commit this as \`bootstrap/stage0.lock\`:"
            echo
            echo '```'
            cat dist/stage0.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
