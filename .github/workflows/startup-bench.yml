name: Startup bench

# Times a hello-world program from process start to exit in Fern and in other
# languages (scripts/startup-bench), on a GitHub-hosted Linux x86-64 runner.
# The log goes to docs/startup-log/, and the home page of the docs site shows
# the newest one. The run opens a pull request with the log, or refreshes the
# open one.

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: startup-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern

      - name: Build fern
        run: make build

      - name: Install hyperfine and Zig
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q hyperfine
          curl -fsSL -o "${{ runner.temp }}/zig.tar.xz" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          mkdir -p "${{ runner.temp }}/zig"
          tar -xJf "${{ runner.temp }}/zig.tar.xz" -C "${{ runner.temp }}/zig" --strip-components=1
          echo "${{ runner.temp }}/zig" >> "$GITHUB_PATH"

      - name: Run the bench
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          mkdir -p docs/startup-log
          FERN=bin/fern python3 scripts/startup-bench -o "${{ runner.temp }}/table.md"
          header="$(head -1 "${{ runner.temp }}/table.md")"
          case "$header" in
            *"Not measured: none."*) ;;
            *) echo "::error::the bench skipped a language: $header"; exit 1 ;;
          esac
          {
            echo "# Startup bench, $day, Linux x86-64"
            echo
            echo "Generated by .github/workflows/startup-bench.yml on a GitHub-hosted ubuntu-24.04 runner."
            echo "Each program prints \"hello, world\" and exits. The time is from process start to exit."
            echo
            cat "${{ runner.temp }}/table.md"
          } > "docs/startup-log/$day-bench.md"
          {
            echo "The weekly run of \`scripts/startup-bench\` (.github/workflows/startup-bench.yml)."
            echo "Merging it updates the startup table on the home page of the docs site."
            echo
            echo "$header"
          } > "${{ runner.temp }}/body.md"

      - name: Open or update the pull request
        uses: ./.github/actions/open-refresh-pr
        with:
          branch: refresh/startup-bench
          title: Add the weekly startup bench log
          commit-body: |-
            Generated by scripts/startup-bench in the startup-bench workflow.
          body-file: ${{ runner.temp }}/body.md
          auto-rebase-token: ${{ secrets.AUTO_REBASE_TOKEN }}
          default-token: ${{ secrets.GITHUB_TOKEN }}
