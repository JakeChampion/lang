name: Pages

# Builds the docs site + playground as a single GitHub Pages
# bundle. Layout:
#
#   /              — docs (Astro + Starlight, built from site/)
#   /playground/   — interactive playground (web/, fern.wasm)
#   /stdlib/...    — auto-generated reference (cmd/ferndoc → MDX)
#
# Build order:
#   1. Build the playground wasm via ./web/build.sh.
#   2. Stage web/ under site/public/playground/ so Astro serves it
#      at /playground/ in the final bundle.
#   3. Run cmd/ferndoc to emit site/src/content/docs/stdlib/*.md
#      from internal/stdlib/std/*.fern.
#   4. `npm install && npm run build` under site/ → site/dist/.
#   5. Upload site/dist/ as the Pages artefact.
#
# Repo-side prerequisites (one-time):
#   1. Repository Settings → Pages → Source: "GitHub Actions"
#   2. The default GITHUB_TOKEN permissions cover Pages writes;
#      no PAT or secrets needed.
#
# Gated on changes that affect the playground build, the docs
# source, or the stdlib (since langdoc consumes it). Plus a
# workflow_dispatch trigger for manual reruns.

on:
  push:
    branches: [main]
    paths:
      - "cmd/fern-wasm/**"
      - "cmd/ferndoc/**"
      - "web/**"
      - "site/**"
      # Docs site loads this grammar for ```fern highlighting.
      - "editors/vscode/syntaxes/**"
      # EVERY internal package, not an enumeration of the ones somebody
      # thought mattered. The enumeration listed `internal/prelude/**`,
      # gone since the injector was removed, and covered 13 of the 50+
      # packages the wasm build actually links, so a change to any of the
      # rest landed with this lane never firing (#8627). A prefix cannot
      # go stale the way a list of leaves does.
      - "internal/**"
      # The lane installs its toolchain from the pins, so both change
      # what it actually executes.
      - "mise.toml"
      - "mise.lock"
      - "go.mod"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time — Pages rejects concurrent ones — but never cancel
# the one in flight. A cancelled deploy is a deploy that does not happen: main
# runs have no successor to inherit the result, and when merges land faster than
# the ~10 minute build, cancelling means the site simply stops updating. Five
# consecutive deploys were lost that way between 18:47 and 20:32 on 2026-09-05.
# Waiting costs nothing instead: GitHub keeps one pending run per group, so a
# burst of merges collapses into a single follow-up deploy of the newest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (pinned in mise.toml)
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
          github_token: ${{ github.token }}
          install_args: go

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Astro 6 requires Node >=22.12. Bump together with the
          # `astro` pin in site/package.json.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package.json

      - name: Build playground wasm
        run: ./web/build.sh

      - name: Stage playground into site/public/playground/
        # Astro copies everything under site/public/ verbatim to
        # the bundle root, so playground/ ends up at /playground/.
        # Stage every runtime asset, not just the entry point:
        # index.html statically imports ./wasi-shim.js and
        # ./wasi-http-shim.js, so if either 404s the whole ES module
        # fails to load and the playground hangs on "loading runtime…".
        # Glob *.html/*.js/*.wasm so newly-added local assets stage
        # too. Use cp -L to dereference the wasm binary (in case it's
        # ever a symlink) — Pages rejects symlinks in artefacts.
        run: |
          rm -rf site/public/playground
          mkdir -p site/public/playground
          cp -L web/*.html web/*.js web/*.wasm site/public/playground/

      - name: Generate stdlib reference
        run: go run ./cmd/ferndoc -out site/src/content/docs/stdlib/

      - name: Install site deps + build
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
