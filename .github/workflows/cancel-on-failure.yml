name: Cancel siblings on failure

# Called from ci.yml, once per lane, when that lane concludes `failure` on a
# pull request: cancel the rest of the run. The PR is already not merging, and
# every lane still running holds the PR-wide lock (ci.yml) that the next pull
# request in the queue is waiting on — so the saving is the lock, and the pool
# behind it, not the minutes; the red signal itself arrives no sooner.
#
# The cost is that you see the FIRST failing lane, not all of them. That is
# the opposite of the `fail-fast: false` every matrix here carries
# deliberately, so the two are scoped differently on purpose: within a lane the
# whole matrix still runs, and only the sibling LANES are reaped. When a round
# genuinely needs the full picture, label the PR `ci-full` and nothing is
# cancelled. Re-running just the failed jobs afterwards re-runs the cancelled
# ones with them.
#
# A lane is one `uses:` job in ci.yml, so it concludes when its last job does:
# a lane that fails in its first minute but fans out to 30 shards reaps nothing
# until its last shard lands. The lanes that fail first are the short ones
# (lint, units), which is exactly where this pays.
#
# Main never comes here — a red main runs to completion so the failing-job
# list main-red.yml files is the whole set — and neither does a dispatch,
# which is someone's deliberate run. ci.yml keeps both out with its `if:`.

on:
  workflow_call:
    inputs:
      lane:
        description: The lane that concluded failure, for the notice.
        type: string
        required: true

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        env:
          LANE: ${{ inputs.lane }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const lane = process.env.LANE;
            // github.event.pull_request.head.sha, not github.sha: on a
            // pull_request event github.sha is the ephemeral merge commit.
            const sha = context.payload.pull_request?.head?.sha || context.sha;

            // Opt out for a round that needs every failure at once. Read from
            // the commit rather than the event payload so a label added after
            // the run started still counts, and so a fork PR — whose
            // `pull_requests` comes back empty elsewhere — is found too.
            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha, per_page: 100 },
            );
            const optedOut = prs.filter((pr) =>
              pr.labels.some((l) => l.name === "ci-full"));
            if (optedOut.length > 0) {
              core.notice(
                `ci-full on #${optedOut.map((pr) => pr.number).join(", #")} — ` +
                `leaving the remaining lanes to finish`,
              );
              return;
            }

            // Cancel the run this job is part of. Every job still running or
            // queued in it — the sibling lanes — goes with it; this job's own
            // cancellation lands after the call returns, which is fine.
            try {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: context.runId });
            } catch (e) {
              // 409: the run reached a terminal state on its own. Routine.
              if (e.status === 409) return;
              // A pull request from a fork gets a read-only GITHUB_TOKEN, so the
              // remaining lanes run to completion there. Not a failure of the
              // lane that was red.
              if (e.status === 403) {
                core.warning("the token may not cancel runs — the remaining lanes will finish");
                return;
              }
              throw e;
            }
            core.notice(`${lane} failed at ${sha.slice(0, 8)} — cancelling the rest of this run`);
            await core.summary
              .addHeading(`${lane} failed`, 3)
              .addRaw(`Commit \`${sha.slice(0, 8)}\`. The rest of this run was cancelled ` +
                      `to hand the PR lock to the next pull request; label the PR ` +
                      `\`ci-full\` to keep every lane running.\n`)
              .write();
