name: Test e2e differential

# The seeded differential sweeps whose names start `TestDifferential`:
# `TestDifferential_PrintableStdout` compares each fernsmith-generated
# program's stdout from the interpreter against the self-host compiler's
# x86-64, arm64 and wasm32-wasi builds.
# `TestDifferential_TranslationValidationStrength` proves the compiler's
# strength reductions on those programs equivalent with z3
# (docs/TRANSLATION-VALIDATION.md). The self-host exit-byte legs
# (`TestDifferential_SelfHost*`) run in test-e2e-selfhost.yml's
# diff-selfhost job instead, behind FERN_SELFHOST_DIFF.
#
# Split via the `DIFF_ORACLE_SHARD=I/N` env var the tests honour: each
# shard claims `seed % N == I`, so at N=1 one job sweeps the whole
# corpus.
#
# ONE SHARD. Splitting a fixed corpus costs no coverage at any N:
# every seed is claimed by exactly one bucket, and at N=1 that bucket is
# the sweep. So the count trades wall-clock for runner slots and nothing
# else. The sweep was about 6 minutes of tests per host after setup. Two
# shards each ran about 3 minutes after the same setup, while the pool queued
# jobs for 20 minutes or more (docs/ci-log/2026-10-25-pr-ci-queue.md).
# Raise it if the sweep grows toward the suite's longest jobs; nshard rides
# the matrix, so the denominator moves with the job count.
#
# Needs wasmtime for the wasm32-wasi legs and the aarch64 cross toolchain
# plus qemu for the arm64 legs, which run under qemu on the x86_64 runner.
# FERN_REQUIRE_ARM64_TOOLING=1 turns a missing toolchain into a failure,
# not a skip. An aarch64 job used to run the sweep natively for its own
# target, five runner-minutes a run, while the arm64 legs skipped here.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

env:
  # gotestsum reads this as --jsonfile: the event stream the
  # failure-annotation step names the failed tests from.
  GOTESTSUM_JSONFILE: /tmp/gotestsum.jsonl

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # One shard, the whole 2048-seed sweep over every target. See the
        # shard-count note above before changing this; nshard rides along so
        # the partition denominator cannot drift from the number of jobs
        # scheduled, which is pinned by TestShardDenominatorMatchesMatrix.
        shard:
          - { index: 0, nshard: 1 }
    name: test-e2e-differential-x86_64-shard${{ matrix.shard.index }}
    runs-on: ubuntu-24.04
    # About 6 minutes of sweep for the native and wasm targets in the one
    # shard, plus the arm64 target under qemu; 35 leaves room for a slow
    # runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - uses: ./.github/actions/selfhost-driver-cache
      - name: aarch64 cross toolchain + qemu (the arm64 legs)
        uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
      - name: go test (differential shard ${{ matrix.shard.index }}/${{ matrix.shard.nshard }})
        env:
          DIFF_ORACLE_SHARD: "${{ matrix.shard.index }}/${{ matrix.shard.nshard }}"
          FERN_REQUIRE_ARM64_TOOLING: "1"
          # TestDifferential_TranslationValidationStrength proves with z3,
          # which setup-fern installs from mise.toml.
          FERN_REQUIRE_Z3: "1"
        # -timeout is EXPLICIT because Go's default is 10 minutes, which
        # sits inside this lane's own headroom: the sweep is ~9.5 min at
        # one shard before the arm64 legs under qemu, against a 35-minute
        # job budget, so a slightly slow runner panics at Go's default long
        # before the budget is spent.
        # That does not read as a timeout — the panic dumps every in-flight
        # subtest as a failure with no reason, so one slow run reported 391
        # phantom seed failures next to 638 genuine passes at exactly
        # 600.035s. 30m keeps the timeout inside timeout-minutes, so the
        # lane fails as a timeout rather than as a wall of miscompiles.
        run: gotestsum --format pkgname-and-test-fails -- -timeout 30m -run '^TestDifferential' ./internal/testing/e2e/
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$GOTESTSUM_JSONFILE"
