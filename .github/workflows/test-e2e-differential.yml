name: Test e2e differential

# `TestDifferential_LangsmithMain` — the static (non-fuzz)
# differential oracle. Iterates 2048 fernsmith seeds; for each
# one, compares the interpreter's result against arm64, x86_64,
# and wasmbin backends. Asserts byte-for-byte agreement.
#
# This is the heaviest single e2e test on the suite (~5+ min for
# the full 2048-seed sweep). Sharded four ways via the
# `DIFF_ORACLE_SHARD=I/N` env var the test honours: each shard
# claims `seed % N == I`, so the 2048 seeds split as 512 per
# shard. Crossed with the per-arch matrix that gives 8 parallel
# jobs. (History: 4 shards → 2 to cut run-queue pressure → back to
# 4 once this workflow became one of the slowest per-PR lanes
# (~6.4 min wall) while the self-host workflow's aarch64 fan-out
# was trimmed by 12 jobs, freeing more queue slots than this
# re-adds.)
#
# Needs wasmtime because the wasmbin sub-test invokes
# `wasmtime run --invoke main`. arm64 sub-tests skip on x86 (no
# qemu / cross-gcc); x86 sub-tests skip on arm64 (no qemu-x86_64).
# Matrix per arch so each runner natively exercises its backend +
# wasm, instead of paying skip overhead on one and toolchain
# overhead on the other.

on:
  # Same-repo PRs reach this lane through the CI queue (ci-queue.yml), which
  # dispatches it once the PR is at the front. The `pull_request` trigger is
  # kept for FORK PRs only — a fork's branch can't be dispatched onto a
  # base-repo ref — and the gate job below skips everything else. See
  # docs/CI-QUEUE.md.
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-CI sign-off gate. `gh signoff e2e-differential` on this commit skips
  # every shard below (see docs/CI-SIGNOFF.md). Fork PRs can't sign off; gate
  # fails open on any error.
  gate:
    # Queue admission: on `pull_request` this lane runs for fork PRs only.
    # Same-repo PRs are dispatched by ci-queue.yml when they reach the front
    # of the queue; skipping the gate skips every job that needs it.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./.github/actions/signoff-gate
        with:
          step: e2e-differential
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        host:
          - { runner: ubuntu-latest,    name: x86_64  }
          - { runner: ubuntu-24.04-arm, name: aarch64 }
        # Four shards = 512 seeds each; bump this if per-shard
        # wall-clock creeps toward the slower workflows as the
        # corpus grows (keep DIFF_ORACLE_SHARD's /N in sync).
        shard: [0, 1, 2, 3]
    name: test-e2e-differential-${{ matrix.host.name }}-shard${{ matrix.shard }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
          gotestsum: "true"
      - name: go test (differential shard ${{ matrix.shard }}/4)
        env:
          DIFF_ORACLE_SHARD: "${{ matrix.shard }}/4"
          # Per-shard artifact dir so multiple shards on the
          # same runner don't clobber each other's failed-
          # program asm. `diffOracleArtifactDir()` reads this.
          DIFF_ORACLE_ARTIFACT_DIR: "${{ runner.temp }}/fern-diff-failures"
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestDifferential' ./internal/e2e/

      - name: Upload failing-seed artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Disambiguate per matrix cell so the upload doesn't
          # collide across the 4-job matrix on the same PR.
          name: diff-oracle-failures-${{ matrix.host.name }}-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/fern-diff-failures
          if-no-files-found: ignore
          retention-days: 7
