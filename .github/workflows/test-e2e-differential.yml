name: Test e2e differential

# `TestDifferential_LangsmithMain` — the static (non-fuzz)
# differential oracle. Iterates 2048 fernsmith seeds; for each
# one, compares the interpreter's result against arm64, x86_64,
# and wasmbin backends. Asserts byte-for-byte agreement.
#
# This is the heaviest single e2e test on the suite (~5+ min for
# the full 2048-seed sweep). Split via the `DIFF_ORACLE_SHARD=I/N`
# env var the test honours: each shard claims `seed % N == I`, so at
# N=1 one job sweeps all 2048 seeds. Crossed with the per-arch matrix
# that gives 2 parallel jobs.
#
# The shard count is set by queue pressure, not by the work, and it has
# come down twice for that reason: four per arch (run 31819148034, 18.5
# min of work across 8 jobs), then two. On run 33675174529 the four
# jobs ran 4.6-5.0 min each after waiting 30-40 min for a runner — six
# to eight times more queueing than working, which is a slot spent on
# job setup. ONE shard per arch sweeps the whole corpus in ~9.5 min.
#
# Splitting a fixed corpus costs no coverage at any N: every seed is
# claimed by exactly one bucket, and at N=1 that bucket is the sweep.
# So this trades wall-clock for slots and nothing else. Raise it again
# if per-shard wall-clock creeps toward the slow lanes as the corpus
# grows; nshard rides the matrix, so the denominator moves with the
# job count rather than being restated by hand.
#
# Needs wasmtime because the wasmbin sub-test invokes
# `wasmtime run --invoke main`. arm64 sub-tests skip on x86 (no
# qemu / cross-gcc); x86 sub-tests skip on arm64 (no qemu-x86_64).
# Matrix per arch so each runner natively exercises its backend +
# wasm, instead of paying skip overhead on one and toolchain
# overhead on the other.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds the PR-wide lock (one pull
# request's suite at a time), decides from the changed files whether this lane
# runs — the lane's path filter lives in its lane table — and cancels the rest
# of the run when a lane goes red. `workflow_dispatch` stays so the lane can
# be run on its own, outside that lock.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `require` is the set of oracle legs this runner is meant to
        # exercise, passed to the test as FERN_REQUIRE_DIFF_BACKENDS so a
        # lost toolchain FAILS here instead of skipping. Per-arch by
        # design: each runner has its own register backend plus wasm, and
        # skips the other one (see the header note). Before #7310 a runner
        # that lost a toolchain reported its seeds green having executed
        # no compiled code at all.
        host:
          - { runner: ubuntu-latest,    name: x86_64,  require: "x86_64,wasmbin"      }
          - { runner: ubuntu-24.04-arm, name: aarch64, require: "arm64-linux,wasmbin" }
        # One shard = the whole 2048-seed sweep. See the shard-count note
        # above before changing this; nshard rides along so the partition
        # denominator cannot drift from the number of jobs scheduled, which
        # is pinned by TestShardDenominatorMatchesMatrix.
        shard:
          - { index: 0, nshard: 1 }
    name: test-e2e-differential-${{ matrix.host.name }}-shard${{ matrix.shard.index }}
    runs-on: ${{ matrix.host.runner }}
    # ~9.5 min of sweep at one shard; 25 keeps the ~2x headroom the lane had
    # at 15 minutes against a 4.8-min shard.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - name: go test (differential shard ${{ matrix.shard.index }}/${{ matrix.shard.nshard }})
        env:
          DIFF_ORACLE_SHARD: "${{ matrix.shard.index }}/${{ matrix.shard.nshard }}"
          FERN_REQUIRE_DIFF_BACKENDS: "${{ matrix.host.require }}"
          # Per-shard artifact dir so multiple shards on the
          # same runner don't clobber each other's failed-
          # program asm. `diffOracleArtifactDir()` reads this.
          DIFF_ORACLE_ARTIFACT_DIR: "${{ runner.temp }}/fern-diff-failures"
        # -timeout is EXPLICIT because Go's default is 10 minutes, which
        # sits inside this lane's own headroom: the sweep is ~9.5 min at
        # one shard against a 25-minute job budget, so a slightly slow
        # runner panics at Go's default long before the budget is spent.
        # That does not read as a timeout — the panic dumps every in-flight
        # subtest as a failure with no reason, so one slow run reported 391
        # phantom seed failures next to 638 genuine passes at exactly
        # 600.035s. 20m keeps the timeout inside timeout-minutes, so the
        # lane fails as a timeout rather than as a wall of miscompiles.
        run: gotestsum --format pkgname-and-test-fails -- -timeout 20m -run '^TestDifferential' ./internal/e2e/

      - name: Upload failing-seed artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Disambiguate per matrix cell so the upload doesn't
          # collide across the 2-job matrix on the same PR.
          name: diff-oracle-failures-${{ matrix.host.name }}-shard${{ matrix.shard.index }}
          path: ${{ runner.temp }}/fern-diff-failures
          if-no-files-found: ignore
          retention-days: 7
