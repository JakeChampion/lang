name: CI

# Lint and lane selection run outside the full-suite queue, so a queued PR
# gets useful feedback without waiting for earlier compiler suites. The
# existing Lint / lint check remains unconditional and keeps its name.
# ci-suite.yml owns the PR FIFO; ci-main.yml still coalesces pending main tips.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A main caller must grant the union of nested write permissions, but ordinary
# test jobs retain a read-only token. Only the existing release/reaper jobs
# below opt into writes.
permissions:
  contents: read
  actions: read
  pull-requests: read

# One live run per pull request. A push supersedes the previous run the moment
# it lands, server-side, so its jobs stop holding runner slots while a reaper
# waits for one of its own. Only a pull request run cancels: a main validation
# (ci-main.yml calling this) or a dispatch gets a group of its own and runs to
# completion. The suite FIFO stays on ci-suite.yml, whose `queue: max` rules
# out cancel-in-progress there. The fallback's prefix differs from
# ci-suite.yml's on purpose: inside one run the `github` context is the
# caller's, so an identical fallback would have the suite request the group
# its own run holds, and GitHub cancels that as a deadlock.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-root-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which lanes this change reaches. One API listing, no checkout; ~10 s.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.filter.outputs.lanes }}
    steps:
      - id: filter
        uses: actions/github-script@v9
        env:
          # The lane table: the filter each lane ran under when it triggered
          # itself. `paths` runs the lane when a changed file matches;
          # `paths-ignore` runs it when a changed file matches nothing in the
          # list. GitHub's filter grammar, evaluated in `filter`: `*` does not
          # cross `/`, `**` does, `?` and `+` quantify the character before
          # them, `[…]` is a character class, and a `!` entry negates the
          # entries before it.
          #
          # The doc-only exclusion is deliberately narrow: `*.md` is root-level
          # prose (README, CLAUDE.md), and the literate sources under
          # examples/literate/*.fern.md — which ARE compiled — still trigger
          # everything. docs/ holds no .fern.md and no test fixture.
          #
          # Every allowlist names this file, as each lane's used to name its
          # own: an edit here changes what the lane runs under. `internal/**`
          # rather than an enumeration of packages, because the enumerations
          # drifted — listing a deleted package and missing 40+ live ones
          # (#8474, #8627); TestWorkflowPathFiltersCoverEveryDependency holds
          # each allowlist to the packages its lane is built from.
          #
          # Five lanes also skip a change that touches only the self-host
          # compiler (examples/self_host, internal/e2eselfhost): their tests
          # never read those trees, and each of their jobs deletes both right
          # after checkout (.github/actions/drop-selfhost-sources) so that
          # stays true. A lane whose tests do read them keeps the doc-only block.
          #
          # internal/sourcelint reads this table (TestPRLanesShareOneDocOnlyFilter,
          # TestWorkflowPathFiltersHaveNoDeadEntries, ...).
          LANES: |
            {
              "test-units":            { "paths-ignore": ["docs/**", "*.md"] },
              "test-coreutils":        { "paths-ignore": ["docs/**", "*.md"] },
              "test-e2e-x86_64":       { "paths-ignore": ["docs/**", "*.md", "examples/self_host/**", "internal/e2eselfhost/**"] },
              "test-e2e-arm64":        { "paths-ignore": ["docs/**", "*.md"] },
              "test-e2e-wasm":         { "paths-ignore": ["docs/**", "*.md"] },
              "test-e2e-other":        { "paths-ignore": ["docs/**", "*.md"] },
              "test-e2e-differential": { "paths-ignore": ["docs/**", "*.md", "examples/self_host/**", "internal/e2eselfhost/**"] },
              "test-e2e-selfhost":     { "paths-ignore": ["docs/**", "*.md"] },
              "test-fernsmith":        { "paths-ignore": ["docs/**", "*.md", "examples/self_host/**", "internal/e2eselfhost/**"] },
              "fuzz-diff":             { "paths-ignore": ["docs/**", "*.md", "examples/self_host/**", "internal/e2eselfhost/**"] },
              "examples":              { "paths-ignore": ["docs/**", "*.md", "examples/self_host/**", "internal/e2eselfhost/**"] },
              "perf":                  { "paths-ignore": ["docs/**", "*.md"] },
              "bootstrap": { "paths": [
                "bootstrap/**",
                "examples/self_host/**",
                "internal/stdlib/**",
                "Makefile",
                ".github/workflows/bootstrap.yml",
                ".github/workflows/ci-suite.yml",
                ".github/workflows/ci-main.yml",
                ".github/workflows/ci.yml"
              ] },
              "macos": { "paths": [
                "internal/**",
                "cmd/fern/**",
                "examples/**",
                "coreutils/**",
                ".github/workflows/macos.yml",
                ".github/workflows/ci-suite.yml",
                ".github/workflows/ci-main.yml",
                ".github/workflows/ci.yml",
                ".github/actions/**",
                "mise.toml",
                "mise.lock",
                "go.mod"
              ] },
              "docs-build": { "paths": [
                "cmd/fern-wasm/**",
                "cmd/ferndoc/**",
                "web/**",
                "site/**",
                "editors/vscode/syntaxes/**",
                "internal/**",
                "mise.toml",
                "mise.lock",
                "go.mod",
                ".github/workflows/docs-build.yml",
                ".github/workflows/ci-suite.yml",
                ".github/workflows/ci-main.yml",
                ".github/workflows/ci.yml"
              ] },
              "playground-e2e": { "paths": [
                "cmd/fern-wasm/**",
                "web/**",
                "internal/**",
                "mise.toml",
                "mise.lock",
                "go.mod",
                ".github/workflows/playground-e2e.yml",
                ".github/workflows/ci-suite.yml",
                ".github/workflows/ci-main.yml",
                ".github/workflows/ci.yml"
              ] },
              "vscode-extension": { "paths": [
                "editors/vscode/**",
                ".github/workflows/vscode-extension.yml",
                ".github/workflows/ci-suite.yml",
                ".github/workflows/ci-main.yml",
                ".github/workflows/ci.yml"
              ] }
            }
        with:
          script: |
            // Without a parsable table the lane names are unknown, so this one
            // failure cannot run everything: it fails loudly, and every filtered
            // lane skips until the table is fixed. laneTable in
            // internal/sourcelint rejects the same edit locally.
            let lanes;
            try {
              lanes = JSON.parse(process.env.LANES);
            } catch (e) {
              core.setFailed(`the lane table is not valid JSON: ${e.message}`);
              return;
            }
            const everything = Object.fromEntries(Object.keys(lanes).map((l) => [l, true]));
            const { owner, repo } = context.repo;
            try {

              // PRs use their whole diff. Main runs every lane, less the ones
              // proven below: ci-main.yml coalesces pending pushes, so
              // before..after can omit code from an earlier pending push
              // followed by a docs-only push.
              // An untrusted PR listing also runs everything.
              let files = null;
              let why = "";
              try {
                if (context.eventName === "pull_request") {
                  const list = await github.paginate(github.rest.pulls.listFiles, {
                    owner, repo, pull_number: context.payload.pull_request.number, per_page: 100,
                  });
                  if (list.length >= 3000) why = "the diff is past the 3000-file listing cap";
                  else files = list;
                } else {
                  why = `a ${context.eventName} runs every lane`;
                }
              } catch (e) {
                why = `listing the changed files failed: ${e.message}`;
              }

              // GitHub's filter globs: `*` stops at `/` and `**` does not; `?`
              // and `+` are quantifiers on the character or class before them,
              // not wildcards of their own. One with nothing to quantify is
              // taken literally, which is what GitHub does with it too.
              const compile = (glob) => {
                let re = "^";
                let atom = false;
                for (let i = 0; i < glob.length; i++) {
                  const c = glob[i];
                  if (c === "*") {
                    if (glob[i + 1] === "*") { re += ".*"; i++; } else re += "[^/]*";
                    atom = false;
                  } else if ((c === "?" || c === "+") && atom) {
                    re += c;
                    atom = false;
                  } else if (c === "[" && glob.indexOf("]", i) > i) {
                    const j = glob.indexOf("]", i);
                    re += glob.slice(i, j + 1);
                    i = j;
                    atom = true;
                  } else {
                    re += c.replace(/[.+?^${}()|\\]/g, "\\$&");
                    atom = true;
                  }
                }
                return new RegExp(re + "$");
              };
              // Later entries win, so `!` re-excludes what an earlier entry let in.
              const selects = (patterns, path) => {
                let hit = false;
                for (const p of patterns) {
                  const neg = p.startsWith("!");
                  if (compile(neg ? p.slice(1) : p).test(path)) hit = !neg;
                }
                return hit;
              };
              const paths = files === null ? [] : files.flatMap((f) =>
                f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
              const runsOn = (filter, ps) => {
                let ok = true;
                if (filter.paths) ok = ps.some((p) => selects(filter.paths, p));
                if (ok && filter["paths-ignore"]) ok = ps.some((p) => !selects(filter["paths-ignore"], p));
                return ok;
              };
              const runs = (filter) => files === null || runsOn(filter, paths);

              const out = {};
              for (const [lane, filter] of Object.entries(lanes)) out[lane] = runs(filter);

              // A main push whose tree is byte-identical to the head of the
              // pull request it merged re-tests what that PR's run already
              // passed. Each lane whose every job succeeded on a successful
              // PR run at that head is skipped here. A lane the PR run did
              // not run still runs, so main stays the backstop for the
              // filters; perf always runs, because its main run records the
              // history. Any error proves nothing and skips nothing.
              const alwaysOnMain = ["perf"];
              // Lane id to the name its jobs carry under "Full suite / ".
              let display = null;
              const laneNames = async () => {
                if (display) return display;
                const suite = Buffer.from((await github.rest.repos.getContent({
                  owner, repo, path: ".github/workflows/ci-suite.yml", ref: context.sha,
                })).data.content, "base64").toString();
                display = {};
                for (const m of suite.matchAll(/^  ([a-z0-9_-]+):\n    name: (.+)$/gm)) display[m[1]] = m[2].trim();
                return display;
              };
              const provenOnIdenticalTree = async () => {
                const sha = context.sha;
                const tree = (await github.rest.git.getCommit({ owner, repo, commit_sha: sha })).data.tree.sha;
                const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha }))
                  .data.filter((p) => p.merged_at && p.base.ref === "main");
                if (prs.length === 0) return { reason: "no merged pull request is associated with this commit" };
                const display = await laneNames();
                let reason = `the pushed tree differs from the head of #${prs.map((p) => p.number).join(", #")}`;
                for (const pr of prs) {
                  const head = (await github.rest.git.getCommit({ owner, repo, commit_sha: pr.head.sha })).data.tree.sha;
                  if (head !== tree) continue;
                  reason = `#${pr.number}'s head has no successful CI run`;
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: "ci.yml", event: "pull_request", head_sha: pr.head.sha, status: "success",
                  });
                  for (const run of data.workflow_runs) {
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                      owner, repo, run_id: run.id, filter: "latest", per_page: 100,
                    });
                    const passed = Object.keys(lanes).filter((l) => {
                      const mine = display[l] ? jobs.filter((j) => j.name.startsWith(`Full suite / ${display[l]} / `)) : [];
                      return mine.length > 0 && mine.every((j) => j.conclusion === "success");
                    });
                    return { pr: pr.number, run: run.id, lanes: passed };
                  }
                }
                return { reason };
              };
              // A lane whose inputs have not changed since main last passed it
              // has nothing new to check on main. Its base is the newest main
              // run that ran it: passed there, the lane is filtered on the
              // diff from that commit, which also covers pushes ci-main.yml
              // coalesced away; failed or cancelled there, it runs, so a red
              // lane is always re-checked. Only a straight line forward from
              // the base with a complete file list proves anything, and any
              // error proves nothing.
              const unchangedSinceLastPass = async (candidates) => {
                const display = await laneNames();
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: "ci-main.yml", branch: "main", status: "completed", per_page: 30,
                });
                const base = {};
                for (const run of data.workflow_runs) {
                  if (run.head_sha === context.sha) continue;
                  const todo = candidates.filter((l) => !(l in base));
                  if (todo.length === 0) break;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner, repo, run_id: run.id, filter: "latest", per_page: 100,
                  });
                  for (const l of todo) {
                    const mine = display[l] ? jobs.filter((j) => j.name.startsWith(`Validate / Full suite / ${display[l]} / `)) : [];
                    // A lane a later push cancelled proves nothing either way; look further back.
                    if (mine.some((j) => j.conclusion === "failure" || j.conclusion === "timed_out")) base[l] = null;
                    else if (mine.length && mine.every((j) => j.conclusion === "success")) base[l] = run.head_sha;
                  }
                }
                const unproven = candidates.filter((l) => !base[l]);
                if (unproven.length) core.info(`no passing main run to diff from: ${unproven.join(", ")}`);
                const changed = {};
                for (const b of new Set(Object.values(base).filter(Boolean))) {
                  const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${b}...${context.sha}` });
                  const at = candidates.filter((l) => base[l] === b).join(", ");
                  const n = (cmp.files || []).length;
                  if (cmp.status !== "ahead" || n >= 300) {
                    core.info(`last passed at ${b.slice(0, 7)} (${at}): compare is ${cmp.status} with ${n} file(s), so they run`);
                    continue;
                  }
                  core.info(`last passed at ${b.slice(0, 7)} (${at}): ${n} file(s) changed since`);
                  changed[b] = cmp.files.flatMap((f) => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
                }
                return candidates.filter((l) => base[l] && changed[base[l]] && !runsOn(lanes[l], changed[base[l]]));
              };
              let proven = null;
              let unchanged = [];
              if (context.eventName === "push" && files === null) {
                try {
                  proven = await provenOnIdenticalTree();
                } catch (e) {
                  core.warning(`every lane runs: could not check the merged PR's run (${e.message})`);
                }
              }
              if (proven && proven.reason) why = `a push runs every lane: ${proven.reason}`;
              const provenOff = proven && proven.lanes ? proven.lanes.filter((l) => l in out && !alwaysOnMain.includes(l)) : [];
              for (const l of provenOff) out[l] = false;
              if (context.eventName === "push" && files === null) {
                try {
                  unchanged = await unchangedSinceLastPass(Object.keys(out).filter((l) => out[l] && !alwaysOnMain.includes(l)));
                } catch (e) {
                  core.warning(`lanes run regardless of their last pass on main: could not read main's earlier runs (${e.message})`);
                }
              }
              for (const l of unchanged) out[l] = false;
              core.setOutput("lanes", JSON.stringify(out));

              const on = Object.keys(out).filter((l) => out[l]);
              const off = Object.keys(out).filter((l) => !out[l]);
              core.info(files === null
                ? (off.length ? `${on.length} lane(s) run, ${off.length} skipped (${why})` : `every lane runs: ${why}`)
                : `${paths.length} changed path(s): ${on.length} lane(s) run, ${off.length} skipped`);
              if (provenOff.length) {
                core.info(`${provenOff.length} lane(s) skipped: they passed on #${proven.pr}'s run ${proven.run} at this exact tree`);
              }
              if (unchanged.length) {
                core.info(`${unchanged.length} lane(s) skipped: nothing they read changed since main last passed them (${unchanged.join(", ")})`);
              }
              await core.summary
                .addHeading("Lanes", 3)
                .addRaw(files === null
                  ? (provenOff.length
                    ? `The tree is identical to #${proven.pr}'s head, and ${provenOff.length} lane(s) passed on its run ${proven.run}.\n`
                    : `${why}.\n`) + (unchanged.length
                    ? `${unchanged.length} lane(s) unchanged since main last passed them: ${unchanged.join(", ")}.\n`
                    : "")
                  : `${files.length} changed file(s).\n`)
                .addTable([
                  [{ data: "Lane", header: true }, { data: "Runs", header: true }],
                  ...Object.keys(out).map((l) => [l, out[l] ? "yes" : "skipped"]),
                ])
                .write();
            } catch (e) {
              // A gate that cannot decide runs everything: a bad table entry or
              // an API shape change must skip no lane, and a failed job here
              // would skip all of them (a `needs` on a failed job never runs).
              // Only a table that does not parse, above, is loud instead.
              core.setOutput("lanes", JSON.stringify(everything));
              core.warning(`every lane runs: the filter failed (${e.message})`);
            }

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  suite:
    name: Full suite
    # Preserve independent lanes on main and live ci-full opt-outs. The lint
    # reaper reads current labels and cancels this run when appropriate.
    needs: [changes]
    uses: ./.github/workflows/ci-suite.yml
    with:
      lanes: ${{ needs.changes.outputs.lanes }}
    secrets: inherit
    permissions:
      contents: write
      actions: write
      pull-requests: read

  reap-lint:
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'failure' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/cancel-on-failure.yml
    with:
      lane: Lint
    permissions:
      actions: write
      contents: read
      pull-requests: read
