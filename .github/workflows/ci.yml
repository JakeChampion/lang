name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install aarch64 cross-toolchain and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Install wasmtime (for the WASM e2e tests)
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Install wasm-tools + preview1-component-adapter (for WASI Preview 2 e2e)
        # `wasm-tools component new --adapt` wraps our preview-1 core
        # module in a Component Model component. The adapter binary
        # comes from the same release stream as wasmtime; we pin a
        # known-good version here and cache the path the test reads.
        env:
          WASM_TOOLS_VERSION: "1.225.0"
          ADAPTER_VERSION: "v34.0.1"
        run: |
          curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
          mkdir -p "$HOME/wasi-adapter"
          curl -sSfL -o "$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${ADAPTER_VERSION}/wasi_snapshot_preview1.command.wasm"
          echo "LANG_WASI_ADAPTER=$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" >> "$GITHUB_ENV"

      - name: Install clang + lld (for cross-compiling arm64-darwin Mach-O)
        run: |
          sudo apt-get install -y clang lld

      - name: Install gotestsum (compact test output)
        # `gotestsum --format pkgname-and-test-fails` collapses each
        # package to a single line and only spills full output for
        # failed tests, then ends with a "Failed tests" recap. Way
        # easier to scan a CI log than `go test -v ./...`.
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Show toolchain versions
        run: |
          go version
          aarch64-linux-gnu-gcc --version | head -1
          qemu-aarch64 --version | head -1
          clang --version | head -1
          wasmtime --version
          wasm-tools --version
          gotestsum --version

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (includes arm64 end-to-end tests under qemu)
        run: gotestsum --format pkgname-and-test-fails -- ./...

      - name: Check examples are formatted
        # Runs `lang -fmt -d` on every examples/*.lang and fails if
        # any file would change. Prevents drift between the
        # formatter's idea of canonical source and what's checked in.
        run: make fmt-check

      - name: Compile every example (arm64 Linux)
        run: |
          go build -o bin/lang ./cmd/lang
          mkdir -p build
          for f in examples/*.lang; do
            name=$(basename "$f" .lang)
            ./bin/lang -target arm64 "$f" > "build/$name.s"
            # `-nostdlib`: the emitted assembly provides its own
            # `_start`, syscall wrappers, and bump allocator, so we
            # must NOT link glibc + crt1.o (would clash on _start).
            aarch64-linux-gnu-gcc -static -nostdlib "build/$name.s" -o "build/$name"
            echo "::group::run $name"
            qemu-aarch64 "build/$name" || echo "(exited $?)"
            echo "::endgroup::"
          done
