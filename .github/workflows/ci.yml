name: CI

# Two parallel jobs by host arch:
#
#   test-x86_64  — runs x86-64 e2e tests natively; arm64 tests
#                  SKIP (no cross-toolchain installed); wasm
#                  tests run via the x86-64 wasmtime binary.
#   test-arm64   — runs arm64 e2e tests natively (no qemu); x86
#                  tests SKIP; wasm tests run via the arm64
#                  wasmtime binary.
#
# Each job touches its native target only, so neither path
# pays the qemu overhead. Wasm runs on both because wasmtime +
# wasm-tools ship binaries per host arch and the tests are
# platform-agnostic (= covers the bit-for-bit identical wat
# emission on each host).
#
# Wasmtime + wasm-tools downloads are cached on (host arch,
# version) so the second-and-onward CI run skips the ~50 MB
# fetch.
#
# `clang + lld` are deliberately NOT installed. They were
# previously used by `TestArm64DarwinBuilds` to cross-compile
# arm64-darwin Mach-O on Linux and verify the file is well-
# formed; that test SKIPs cleanly when they're absent. The
# arm64-darwin native verification happens in `macos.yml`,
# which runs on `macos-latest` and exercises the same code
# path more thoroughly (links + actually runs the binary).
# Dropping clang+lld here saved a ~10–15 minute apt install
# on the x86 runner.

on:
  pull_request:

env:
  WASM_TOOLS_VERSION: "1.225.0"
  ADAPTER_VERSION: "v34.0.1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64,   wasm_arch: x86_64-linux }
          - { runner: ubuntu-24.04-arm, host: aarch64,  wasm_arch: aarch64-linux }
    name: test-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          # No go.sum (no external deps) → setup-go's
          # default cache attempt complains. Disable.
          cache: false

      - name: Cache wasmtime + wasm-tools + adapter
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            ~/.wasmtime
            ~/wasm-tools-${{ env.WASM_TOOLS_VERSION }}-${{ matrix.wasm_arch }}
            ~/wasi-adapter
          key: wasm-${{ matrix.host }}-${{ env.WASM_TOOLS_VERSION }}-${{ env.ADAPTER_VERSION }}

      - name: Install wasmtime + wasm-tools + adapter (cache miss)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          curl -sSfL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-${{ matrix.wasm_arch }}.tar.gz" \
            | tar -xz -C "$HOME"
          mkdir -p "$HOME/wasi-adapter"
          curl -sSfL -o "$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${ADAPTER_VERSION}/wasi_snapshot_preview1.command.wasm"

      - name: Wire PATH + adapter env
        run: |
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
          echo "$HOME/wasm-tools-${WASM_TOOLS_VERSION}-${{ matrix.wasm_arch }}" >> "$GITHUB_PATH"
          echo "LANG_WASI_ADAPTER=$HOME/wasi-adapter/wasi_snapshot_preview1.command.wasm" >> "$GITHUB_ENV"

      - name: Install gotestsum (compact test output)
        # `gotestsum --format pkgname-and-test-fails` collapses
        # each package to a single line and only spills full
        # output for failed tests, then ends with a "Failed
        # tests" recap.
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Show toolchain
        run: |
          uname -m
          go version
          gcc --version | head -1
          wasmtime --version
          wasm-tools --version
          gotestsum --version

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # Native arch tests run; cross-arch tests SKIP cleanly
        # via the per-test toolchain detection in arm64Tooling /
        # x86_64Tooling.
        run: gotestsum --format pkgname-and-test-fails -- ./...

      - name: Check examples are formatted
        # Runs `lang -fmt -d` on every examples/*.lang and fails
        # if any file would change.
        run: make fmt-check

      - name: Compile every example (arm64 target)
        # The arm64-Linux ELF target is the default. On the
        # arm64 runner we build + actually run each example;
        # on the x86_64 runner we only verify the asm-emit step
        # (no cross-toolchain installed since we want CI fast).
        run: |
          go build -o bin/lang ./cmd/lang
          mkdir -p build
          for f in examples/*.lang; do
            name=$(basename "$f" .lang)
            ./bin/lang -target arm64 "$f" > "build/$name.s"
            if [ "${{ matrix.host }}" = "aarch64" ]; then
              gcc -static -nostdlib "build/$name.s" -o "build/$name"
              echo "::group::run $name"
              ./build/$name || echo "(exited $?)"
              echo "::endgroup::"
            fi
          done
