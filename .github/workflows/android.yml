name: Android

# Builds the Android example apps with fern -apk and runs them on an
# emulator. The emulator job installs the stopwatch on an x86-64 emulator
# with KVM, and examples/android/stopwatch/emulator_check.py drives it: the
# dial on the screen, a tap to start, a long tap to reset, the menu and the
# settings screen, and no crash in logcat. It is the one gate that loads a
# Fern library with Android's loader. examples/android/native is the
# smallest app with no Java code, and examples/android/native/emulator_check.py
# drives it on the same emulator, once with stored libraries and once with
# the deflated libraries of -apk-compress.
# tests/android/dex is an app with @jni classes in the classes.dex that fern
# -apk writes, and its check requires that ART loads, constructs and binds
# them. tests/android/audio checks std/android/audio and a JNI call from
# the loop thread, so the emulator runs with its audio on.
# tests/android/tz/zone.fern requires that tz.local_zone follows the zone
# that the emulator keeps in the property persist.sys.timezone.
# examples/android/walkie is the LAN walkie-talkie: its check runs two
# copies of it against each other, with the cached-app freezer disabled and
# its effective state checked before either copy starts.
# The seccomp job checks the syscalls of the fixture corpus against
# Android's app filter.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It decides from the changed files
# whether this lane runs (its path filter is the lane table's `android`
# row) and cancels the rest of the run when a lane goes red.
# `workflow_dispatch` stays so the lane can be run on its own.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  # gotestsum reads this as --jsonfile: the event stream the
  # failure-annotation step names the failed tests from.
  GOTESTSUM_JSONFILE: /tmp/gotestsum.jsonl
jobs:
  apk:
    name: android-stopwatch-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - name: Build the stopwatch APK and the logcat report program
        run: |
          make bin/fern
          mkdir -p build/android-stopwatch
          ./bin/fern -apk build/android-stopwatch/fern-stopwatch.apk -apk-package dev.fern.stopwatch -apk-label "Fern Stopwatch" -apk-icon examples/android/stopwatch/icon.png -apk-min-sdk 28 examples/android/stopwatch/app.fern
          ./bin/fern -target x86-64-android -o build/android-stopwatch/report tests/android/report.fern
          ./bin/fern -target x86-64-android -o build/android-stopwatch/zone tests/android/tz/zone.fern
          ./bin/fern -apk build/android-stopwatch/fern-native.apk -apk-package dev.fern.native -apk-label "Fern Native" examples/android/native/app.fern
          ./bin/fern -apk build/android-stopwatch/fern-native-compressed.apk -apk-compress -apk-package dev.fern.nativez -apk-label "Fern Native Z" examples/android/native/app.fern
          ./bin/fern -apk build/android-stopwatch/fern-dextest.apk -apk-package dev.fern.dextest tests/android/dex/app.fern
          ./bin/fern -apk build/android-stopwatch/fern-audiotest.apk -apk-package dev.fern.audiotest -apk-min-sdk 28 -apk-permission RECORD_AUDIO tests/android/audio/app.fern
          ./bin/fern -apk build/android-stopwatch/fern-dnstest.apk -apk-package dev.fern.dnstest -apk-permission INTERNET tests/android/dns/app.fern
          ./bin/fern -apk build/android-stopwatch/fern-walkie.apk -apk-package dev.fern.walkie -apk-label "Fern Walkie" -apk-min-sdk 28 -apk-permission RECORD_AUDIO,INTERNET,ACCESS_WIFI_STATE,ACCESS_NETWORK_STATE,FOREGROUND_SERVICE,FOREGROUND_SERVICE_MICROPHONE,POST_NOTIFICATIONS,CHANGE_WIFI_STATE,NEARBY_WIFI_DEVICES,ACCESS_FINE_LOCATION,WAKE_LOCK examples/android/walkie/app.fern
          ./bin/fern -apk build/android-stopwatch/fern-walkie2.apk -apk-package dev.fern.walkie2 -apk-label "Fern Walkie 2" -apk-min-sdk 28 -apk-permission RECORD_AUDIO,INTERNET,ACCESS_WIFI_STATE,ACCESS_NETWORK_STATE,FOREGROUND_SERVICE,FOREGROUND_SERVICE_MICROPHONE,POST_NOTIFICATIONS,CHANGE_WIFI_STATE,NEARBY_WIFI_DEVICES,ACCESS_FINE_LOCATION,WAKE_LOCK examples/android/walkie/app.fern
      - uses: actions/upload-artifact@v7
        with:
          name: fern-stopwatch-apk
          path: |
            build/android-stopwatch/fern-stopwatch.apk
            build/android-stopwatch/report
            build/android-stopwatch/zone
            build/android-stopwatch/fern-native.apk
            build/android-stopwatch/fern-native-compressed.apk
            build/android-stopwatch/fern-dextest.apk
            build/android-stopwatch/fern-audiotest.apk
            build/android-stopwatch/fern-dnstest.apk
            build/android-stopwatch/fern-walkie.apk
            build/android-stopwatch/fern-walkie2.apk
          if-no-files-found: error

  emulator:
    name: android-stopwatch-emulator
    needs: [apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fern-stopwatch-apk
          path: build/android-stopwatch
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            python3 examples/android/stopwatch/emulator_check.py build/android-stopwatch/fern-stopwatch.apk build/android-stopwatch/emulator build/android-stopwatch/report
            python3 examples/android/native/emulator_check.py build/android-stopwatch/fern-native.apk dev.fern.native build/android-stopwatch/emulator/native mapped
            python3 examples/android/native/emulator_check.py build/android-stopwatch/fern-native-compressed.apk dev.fern.nativez build/android-stopwatch/emulator/native-compressed extracted
            python3 tests/android/dex/emulator_check.py build/android-stopwatch/fern-dextest.apk build/android-stopwatch/emulator/dex
            python3 tests/android/audio/emulator_check.py build/android-stopwatch/fern-audiotest.apk build/android-stopwatch/emulator/audio
            python3 tests/android/dns/emulator_check.py build/android-stopwatch/fern-dnstest.apk build/android-stopwatch/emulator/dns
            python3 tests/android/tz/emulator_check.py build/android-stopwatch/zone build/android-stopwatch/emulator/tz
            python3 examples/android/walkie/emulator_check.py build/android-stopwatch/fern-walkie.apk build/android-stopwatch/fern-walkie2.apk build/android-stopwatch/emulator/walkie
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: fern-stopwatch-emulator
          path: build/android-stopwatch/emulator

  # Each syscall that an Android image of a fixture can make, against the app
  # seccomp filter that bionic generates at the AOSP tag in
  # scripts/android-app-syscalls.py. A syscall outside it kills an app with
  # SIGSYS on a phone, and nothing else would see it.
  seccomp:
    name: android-seccomp-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      - uses: ./.github/actions/selfhost-driver-cache
      # The filter depends only on the AOSP tag in the script, so a cache hit
      # does not reach googlesource at all.
      - name: Restore the Android app filter
        id: filter
        uses: actions/cache@v6
        with:
          path: build/android-app-syscalls.json
          key: android-app-syscalls-${{ hashFiles('scripts/android-app-syscalls.py') }}
      - name: Read the Android app filter from AOSP
        run: |
          python3 -B -m unittest discover -s scripts -p test_android_app_syscalls.py
          mkdir -p build
          if [ "${{ steps.filter.outputs.cache-hit }}" != "true" ]; then
            python3 scripts/android-app-syscalls.py build/android-app-syscalls.json
          fi
      - name: go test (the corpus against the Android app filter)
        env:
          ANDROID_APP_SYSCALLS: ${{ github.workspace }}/build/android-app-syscalls.json
        run: gotestsum --format pkgname-and-test-fails -- -run '^TestAndroidSeccompCorpus$' ./internal/testing/e2e/ -timeout 40m
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$GOTESTSUM_JSONFILE"
