name: Test fernsmith

# `internal/fernsmith` carries the wasm-smith-style generator + its
# scratch tests. Locally it's a ~56s run, plus ~6 minutes for the
# full shrink-monotonicity sweep this lane opts into — long enough
# that folding it into test-units would dominate that workflow's
# wall clock. Its own workflow keeps the fan-out balanced.
#
# Matrix per arch because the generator emits programs that the
# diff oracle (the related fuzz workflow) runs through every
# backend on the host; arm64-only quirks have surfaced here before.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds the PR-wide lock (one pull
# request's suite at a time), decides from the changed files whether this lane
# runs — the lane's path filter lives in its lane table — and cancels the rest
# of the run when a lane goes red. `workflow_dispatch` stays so the lane can
# be run on its own, outside that lock.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: test-fernsmith-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
      # RUN_SHRINK_PROPERTY widens TestGenBytesShrinkIsMonotonicAndValid
      # from its 3-seed default to the full 24-seed sweep: one type-check
      # per truncation point per seed, ~6 minutes. It belongs here rather
      # than in test-units because this lane already owns the generator
      # and runs its two hosts in parallel.
      #
      # -timeout=20m: the sweep alone sits at ~8 minutes on a 4-core box,
      # so go test's default 10m package timeout left under two minutes of
      # headroom and a slow runner blew it (twice on one PR, measured
      # byte-identical to main — the diff was not the cause). Weight
      # pessimistically, per TEST-GATES rule 8.
      - run: gotestsum --format pkgname-and-test-fails -- -timeout=20m ./internal/fernsmith/...
        env:
          RUN_SHRINK_PROPERTY: "1"
