name: Test fernsmith

# `internal/fernsmith` carries the wasm-smith-style generator + its
# scratch tests. Locally it's a ~56s run, plus ~6 minutes for the
# full shrink-monotonicity sweep this lane opts into — long enough
# that folding it into test-units would dominate that workflow's
# wall clock. Its own workflow keeps the fan-out balanced.
#
# Matrix per arch because the generator emits programs that the
# diff oracle (the related fuzz workflow) runs through every
# backend on the host; arm64-only quirks have surfaced here before.

# Called from ci.yml rather than triggered: that is the one workflow a pull
# request or a push to main launches. It holds one of the PR queue's two slots
# (two pull requests' suites run at once), decides from the changed files
# whether this lane runs — the lane's path filter lives in its lane table —
# and cancels the rest of the run when a lane goes red. `workflow_dispatch`
# stays so the lane can be run on its own, outside that queue.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The x86_64 sweep is split across two jobs by seed: at ~9.5 minutes it
        # was one of the suite's longest jobs, and the aarch64 one runs in ~6.
        # nshard rides the matrix so FERNSMITH_SHRINK_SHARD's denominator
        # cannot drift from the jobs scheduled (TestShardDenominatorMatchesMatrix).
        include:
          - { runner: ubuntu-latest,    host: x86_64,  shard: 0, nshard: 2 }
          - { runner: ubuntu-latest,    host: x86_64,  shard: 1, nshard: 2 }
          - { runner: ubuntu-24.04-arm, host: aarch64, shard: 0, nshard: 1 }
    name: test-fernsmith-${{ matrix.host }}${{ matrix.shard != 0 && format('-shard{0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/drop-selfhost-sources
      - uses: ./.github/actions/setup-fern
      # RUN_SHRINK_PROPERTY widens TestGenBytesShrinkIsMonotonicAndValid
      # from its 2-seed default to the full 24-seed sweep: one type-check
      # per truncation point per seed, ~6 minutes. It belongs here rather
      # than in test-units because this lane already owns the generator
      # and runs its two hosts in parallel.
      #
      # -timeout=20m: the sweep alone sits at ~6.5 minutes on a 4-core box
      # (three entry points times 24 seeds as parallel subtests), so go
      # test's default 10m package timeout left little headroom and a slow
      # runner blew it (twice on one PR, measured byte-identical to main —
      # the diff was not the cause). Weight pessimistically, per TEST-GATES
      # rule 8.
      #
      # Shard 0 runs the whole package with its slice of the sweep; every other
      # shard runs only its slice.
      - name: go test (fernsmith, sweep shard ${{ matrix.shard }}/${{ matrix.nshard }})
        env:
          RUN_SHRINK_PROPERTY: "1"
          FERNSMITH_SHRINK_SHARD: "${{ matrix.shard }}/${{ matrix.nshard }}"
        run: |
          set -euo pipefail
          sel=()
          if [ "${{ matrix.shard }}" != 0 ]; then
            sel=(-run '^TestGenBytesShrinkIsMonotonicAndValid$')
          fi
          gotestsum --format pkgname-and-test-fails -- -timeout=20m "${sel[@]}" ./internal/fernsmith/...
