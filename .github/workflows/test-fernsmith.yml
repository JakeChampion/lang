name: Test fernsmith

# `internal/fernsmith` carries the wasm-smith-style generator + its
# scratch tests. Locally it's a ~56s run — long enough that
# folding it into test-units would dominate that workflow's wall
# clock. Its own workflow keeps the fan-out balanced.
#
# Matrix per arch because the generator emits programs that the
# diff oracle (the related fuzz workflow) runs through every
# backend on the host; arm64-only quirks have surfaced here before.

on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run for the same ref: a new push to the
# branch / PR (or a new dispatch) cancels the older run instead of
# letting both sit in the queue. Keyed per-workflow + per-ref so
# distinct PRs and the main branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    host: x86_64  }
          - { runner: ubuntu-24.04-arm, host: aarch64 }
    name: test-fernsmith-${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fern
        with:
          gotestsum: "true"
      - run: gotestsum --format pkgname-and-test-fails -- ./internal/fernsmith/...
