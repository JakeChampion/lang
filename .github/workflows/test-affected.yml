name: Test affected consumers

on:
  workflow_call:
    inputs:
      selection:
        description: Dependency plan with the exact consumer test names
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: affected-${{ matrix.host }}
    runs-on: ${{ matrix.host == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        host: [x86_64, aarch64]
    env:
      FERN_SELFHOST_FIXTURES: "1"
      FERN_REQUIRE_WASMTIME: "1"
      FERN_REQUIRE_ARM64_TOOLING: "1"
      FERN_REQUIRE_X86_64_TOOLING: ${{ matrix.host == 'x86_64' && '1' || '' }}
      FERN_CI_SELECTION: ${{ inputs.selection }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-fern
        with:
          wasmtime: "true"
      - uses: ./.github/actions/selfhost-driver-cache
      - uses: ./.github/actions/oracle-verdict-cache
        with:
          slot: affected-${{ matrix.host }}
      - uses: ./.github/actions/apt-cross-toolchain
        with:
          qemu-package: qemu-user
          cross-gcc: ${{ matrix.host == 'x86_64' }}
      - uses: ./.github/actions/gnu-coreutils
        if: fromJSON(inputs.selection).needsGNU
        with:
          host: ${{ matrix.host }}
          version: "9.12"
      - uses: ./.github/actions/gnu-diffutils
        if: fromJSON(inputs.selection).needsGNU
        with:
          host: ${{ matrix.host }}
      - uses: ./.github/actions/gnu-sed
        if: fromJSON(inputs.selection).needsGNU
        with:
          host: ${{ matrix.host }}
      - name: Run the affected tests
        run: node scripts/ci-run-affected.mjs
      - name: name the failed tests as annotations
        if: failure()
        run: scripts/ci-annotate-failures "$RUNNER_TEMP"/affected-*.jsonl
